<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — لوحة مدير القسم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0825;color:#e5e7eb;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-wrap h1{color:#a855f7;font-size:24px;margin-bottom:8px}
.login-wrap input{width:100%;max-width:340px;padding:14px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#fff;margin:6px 0;font-size:15px;font-family:inherit}
.login-wrap button{width:100%;max-width:340px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;font-family:inherit}
#login-err{color:#ef4444;font-size:13px;margin-top:12px;text-align:center;min-height:20px}
header{background:rgba(10,8,37,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(155,77,255,.2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header .cat-name{font-size:17px;font-weight:800;color:#fff}
header .user{font-size:11px;color:#a78bfa;margin-top:2px}
#logout-btn{background:rgba(155,77,255,.15);color:#a78bfa;border:1px solid rgba(155,77,255,.35);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
main{padding:16px}
.welcome-card{background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:22px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 36px rgba(124,58,237,0.35);margin-bottom:20px}
.welcome-card::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,255,255,0.1);border-radius:50%;filter:blur(30px)}
.welcome-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;position:relative;z-index:1}
.welcome-title{font-size:18px;font-weight:900}
.welcome-sub{font-size:12px;opacity:0.85;margin-top:2px}
.welcome-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.welcome-stat{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:12px 8px;text-align:center;backdrop-filter:blur(10px)}
.welcome-stat .v{font-size:20px;font-weight:900}
.welcome-stat .l{font-size:10px;opacity:0.85;margin-top:2px;font-weight:700}
.welcome-stat.urgent .v{color:#fbbf24}
.section-title{font-size:15px;font-weight:900;color:#c4b5fd;margin:20px 0 12px;display:flex;align-items:center;gap:6px}
.actions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.action-tile{background:rgba(155,77,255,0.06);border:1px solid rgba(155,77,255,0.2);border-radius:18px;padding:24px 14px;text-align:center;cursor:pointer;transition:transform 0.15s;position:relative}
.action-tile:active{transform:scale(0.97)}
.action-tile .icon{font-size:36px;margin-bottom:8px}
.action-tile .label{font-size:14px;font-weight:800;color:#fff}
.action-tile .badge{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border-radius:50%;min-width:22px;height:22px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;animation:pulse-badge 2s infinite}
@keyframes pulse-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid rgba(155,77,255,0.3);background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;font-size:13px}
.search-bar input:focus{outline:none;border-color:#a855f7}
.filter-chips{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:rgba(155,77,255,0.1);border:1px solid rgba(155,77,255,0.25);color:#c4b5fd;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.chip.active{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(168,85,247,0.3)}
.order-card{background:rgba(255,255,255,0.04);border:1px solid rgba(155,77,255,0.2);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;transition:transform 0.15s}
.order-card.urgent{border-color:rgba(239,68,68,0.6);background:linear-gradient(135deg,rgba(239,68,68,0.06),rgba(239,68,68,0.02))}
.order-card.selected{border-color:#22c55e;background:rgba(34,197,94,0.05)}
.order-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px dashed rgba(255,255,255,0.1);margin-bottom:10px;gap:8px}
.order-head-left{flex:1;min-width:0;cursor:pointer}
.order-head b{color:#a855f7;font-size:14px}
.order-meta{font-size:11px;color:#9ca3af;margin-top:2px}
.order-time-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;margin-top:4px}
.time-fresh{background:rgba(34,197,94,0.2);color:#6ee7b7}
.time-warn{background:rgba(245,158,11,0.2);color:#fcd34d}
.time-urgent{background:rgba(239,68,68,0.2);color:#fca5a5;animation:pulse-badge 2s infinite}
.order-total{font-size:15px;font-weight:900;color:#fcd34d;white-space:nowrap}
.order-select{width:22px;height:22px;accent-color:#22c55e;cursor:pointer;margin-left:8px;flex-shrink:0}
.order-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.order-item:last-child{border-bottom:none}
.order-item input[type=checkbox]{width:22px;height:22px;accent-color:#22c55e;flex-shrink:0;cursor:pointer}
.order-item .item-info{flex:1;min-width:0}
.order-item .item-info b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-item .item-info span{font-size:11px;color:#9ca3af}
.order-item .item-price{font-size:13px;font-weight:700;color:#a855f7}
.order-actions{display:flex;gap:8px;margin-top:10px}
.order-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.btn-ok{background:#22c55e;color:#fff}
.btn-ok:disabled{opacity:0.35;cursor:not-allowed}
.btn-warn{background:#ef4444;color:#fff;flex:0 0 auto;padding:12px 16px}
.btn-wa{background:#25D366;color:#fff;flex:0 0 auto;padding:12px 16px;text-decoration:none;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;font-weight:900}
.btn-pdf{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;flex:1}
.btn-view{background:rgba(168,85,247,0.15);color:#c4b5fd;border:1px solid rgba(168,85,247,0.3);flex:0 0 auto;padding:12px 16px}
.bulk-bar{position:fixed;bottom:20px;left:16px;right:16px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(124,58,237,0.6);z-index:100}
.bulk-bar span{color:#fff;font-weight:900;font-size:14px}
.bulk-bar button{background:#fff;color:#7c3aed;border:none;padding:10px 20px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.product-card{background:rgba(255,255,255,0.04);border:1px solid rgba(155,77,255,0.2);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.product-card.low-stock{border-color:rgba(245,158,11,0.5);background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(245,158,11,0.02))}
.product-card.out-stock{border-color:rgba(239,68,68,0.5);background:linear-gradient(135deg,rgba(239,68,68,0.06),rgba(239,68,68,0.02))}
.product-card img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#1f2937;flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-info b{font-size:14px;display:block;margin-bottom:3px}
.product-info span{font-size:12px;color:#9ca3af}
.product-stock{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:900;white-space:nowrap}
.stock-ok{background:rgba(34,197,94,0.2);color:#6ee7b7}
.stock-low{background:rgba(245,158,11,0.25);color:#fcd34d}
.stock-out{background:rgba(239,68,68,0.25);color:#fca5a5}
.add-product-btn{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(16,185,129,0.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:flex-end;justify-content:center;z-index:1000;padding:0}
.modal{background:#1a1a3e;border-radius:24px 24px 0 0;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUpModal 0.3s ease}
@keyframes slideUpModal{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(155,77,255,0.2)}
.modal-head h3{color:#fff;font-size:17px;font-weight:900}
.modal-close{background:rgba(239,68,68,0.2);color:#fca5a5;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit}
.modal-info{display:grid;gap:10px;margin-bottom:16px}
.modal-info-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;background:rgba(0,0,0,0.2);border-radius:8px;gap:10px}
.modal-info-row .lbl{color:#9ca3af;flex-shrink:0}
.modal-info-row .val{color:#fff;font-weight:800;text-align:left;word-break:break-word}
.modal-items-title{color:#c4b5fd;font-weight:900;font-size:13px;margin-bottom:10px;margin-top:16px}
.modal-items .order-item{background:rgba(0,0,0,0.15);border-radius:8px;padding:10px;margin-bottom:6px;border:none}
.modal input,.modal textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(155,77,255,0.3);background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;font-size:14px;margin-bottom:10px}
.modal input:focus,.modal textarea:focus{outline:none;border-color:#a855f7}
.modal label{display:block;font-size:12px;color:#c4b5fd;font-weight:800;margin-bottom:6px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:14px;border-radius:10px;border:none;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.modal-cancel{background:#374151;color:#9ca3af}
.modal-confirm{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.empty{text-align:center;padding:50px 20px;color:#6b7280;font-size:14px}
.empty-icon{font-size:56px;margin-bottom:12px;opacity:0.5}
#toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:12px 22px;border-radius:30px;font-weight:800;font-size:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.5);animation:slideUp 0.3s ease;white-space:nowrap}
.toast.ok{background:#22c55e}.toast.err{background:#ef4444}.toast.info{background:#3b82f6}.toast.warn{background:#f59e0b}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.view{display:none}.view.active{display:block}
.back-btn{background:rgba(155,77,255,.15);border:none;color:#a78bfa;padding:8px 14px;border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="login-screen" class="login-wrap hidden">
  <h1>📦 CHIZEN</h1>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="login-btn">🔐 دخول</button>
  <div id="login-err"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div>
      <div class="cat-name" id="cat-name">—</div>
      <div class="user" id="user-name">—</div>
    </div>
    <button id="logout-btn">خروج</button>
  </header>
  
  <!-- Home -->
  <div id="view-home" class="view active" style="padding:16px">
    <div class="welcome-card">
      <div class="welcome-head">
        <div>
          <div class="welcome-title" id="greeting-title">☀️ صباح الخير</div>
          <div class="welcome-sub" id="greet-name">—</div>
        </div>
      </div>
      <div class="welcome-stats">
        <div class="welcome-stat"><div class="v" id="kpi-orders">0</div><div class="l">طلبات</div></div>
        <div class="welcome-stat"><div class="v" id="kpi-products">0</div><div class="l">منتجات</div></div>
        <div class="welcome-stat urgent"><div class="v" id="kpi-urgent">0</div><div class="l">عاجلة</div></div>
      </div>
    </div>
    <div class="section-title">⚡ إجراءات سريعة</div>
    <div class="actions-grid">
      <div class="action-tile" onclick="showView('pending')">
        <div class="badge hidden" id="pending-badge">0</div>
        <div class="icon">📦</div>
        <div class="label">مراجعة الطلبات</div>
      </div>
      <div class="action-tile" onclick="showView('products')"><div class="icon">🛍️</div><div class="label">منتجاتي</div></div>
      <div class="action-tile" onclick="showView('confirmed')"><div class="icon">✅</div><div class="label">المؤكدة</div></div>
      <div class="action-tile" onclick="logout()"><div class="icon">🚪</div><div class="label">خروج</div></div>
    </div>
  </div>
  
  <!-- Pending -->
  <div id="view-pending" class="view" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:16px;color:#fff">📦 قيد المراجعة</h2>
      <button class="back-btn" onclick="showView('home')">← رجوع</button>
    </div>
    <div class="search-bar"><input id="pending-search" placeholder="🔍 ابحث بالاسم، الهاتف، رقم الطلب..." oninput="filterPending()"></div>
    <div class="filter-chips" id="pending-chips">
      <button class="chip active" data-filter="all" onclick="setPendingFilter('all')">📊 الكل (<span id="count-all">0</span>)</button>
      <button class="chip" data-filter="today" onclick="setPendingFilter('today')">📅 اليوم (<span id="count-today">0</span>)</button>
      <button class="chip" data-filter="urgent" onclick="setPendingFilter('urgent')">⚠️ عاجل (<span id="count-urgent">0</span>)</button>
    </div>
    <div id="pending-list"></div>
  </div>
  
  <!-- Confirmed -->
  <div id="view-confirmed" class="view" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:16px;color:#fff">✅ الطلبات المؤكدة</h2>
      <button class="back-btn" onclick="showView('home')">← رجوع</button>
    </div>
    <div class="search-bar"><input id="confirmed-search" placeholder="🔍 بحث..." oninput="filterConfirmed()"></div>
    <div id="confirmed-list"></div>
  </div>
  
  <!-- Products -->
  <div id="view-products" class="view" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:16px;color:#fff">🛍️ منتجاتي</h2>
      <button class="back-btn" onclick="showView('home')">← رجوع</button>
    </div>
    <div class="search-bar"><input id="products-search" placeholder="🔍 ابحث في منتجاتك..." oninput="filterProducts()"></div>
    <div class="filter-chips">
      <button class="chip active" data-pfilter="all" onclick="setProductFilter('all')">📦 الكل</button>
      <button class="chip" data-pfilter="low" onclick="setProductFilter('low')">⚠️ مخزون منخفض</button>
      <button class="chip" data-pfilter="out" onclick="setProductFilter('out')">❌ نفد</button>
    </div>
    <div id="products-list"></div>
  </div>
</div>

<!-- Bulk bar -->
<div id="bulk-bar" class="bulk-bar hidden">
  <span><span id="bulk-count">0</span> محدد</span>
  <button onclick="bulkConfirm()">✅ تأكيد المحدد</button>
</div>

<!-- Order details modal -->
<div id="order-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeOrderModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">تفاصيل الطلب</h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Add product modal -->
<div id="product-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeProductModal()">
  <div class="modal">
    <div class="modal-head">
      <h3>➕ إضافة منتج</h3>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>
    <label>اسم المنتج</label>
    <input id="p-name" placeholder="مثال: تيشيرت قطن">
    <label>السعر (ر.ي)</label>
    <input id="p-price" type="number" placeholder="0">
    <label>المخزون</label>
    <input id="p-stock" type="number" placeholder="0">
    <label>صورة (رابط)</label>
    <input id="p-img" placeholder="https://...">
    <label>العلامة التجارية</label>
    <input id="p-brand" placeholder="مثال: Nike">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeProductModal()">إلغاء</button>
      <button class="modal-confirm" onclick="addProduct()">حفظ المنتج</button>
    </div>
  </div>
</div>

<!-- FAB add product -->
<button id="fab-add" class="add-product-btn hidden" onclick="openProductModal()">＋</button>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
'use strict';
var db, auth;
var state = {
  user: null, userData: null, cat: '',
  pending: [], confirmed: [], products: [],
  pendingFilter: 'all', pendingSearch: '',
  confirmedSearch: '',
  productFilter: 'all', productSearch: '',
  selectedOrders: {},
  unsubPending: null, unsubConfirmed: null,
  lastPendingCount: 0
};
var CAT_LABELS = {electronics:'إلكترونيات',fashion:'أزياء وموضة',clothing:'ملابس',shoes_bags:'أحذية وحقائب',beauty:'جمال وعطور',kids_sports:'أطفال ورياضة',home:'منزل وأثاث',supermarket:'سوبرماركت',sports:'رياضة',kids:'أطفال',tools:'أدوات منزلية'};

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catLabel(c){return CAT_LABELS[c]||c||'—';}
function toast(m,t){t=t||'info';var c=document.getElementById('toast-container');var el=document.createElement('div');el.className='toast '+t;el.textContent=m;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);}
function fmtDate(ts){if(!ts)return '—';var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);return d.toLocaleString('ar-YE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function timeAgo(ts){
  if(!ts) return {label:'—',cls:'time-fresh',hours:0};
  var ms = ts.seconds ? ts.seconds*1000 : new Date(ts).getTime();
  var diff = Math.floor((Date.now() - ms) / 60000);
  if(diff < 60) return {label:'منذ '+diff+' د',cls:'time-fresh',hours:0};
  var h = Math.floor(diff/60);
  if(h < 6) return {label:'منذ '+h+' ساعة',cls:'time-warn',hours:h};
  return {label:'⚠️ منذ '+h+' ساعة',cls:'time-urgent',hours:h};
}
function isToday(ts){
  if(!ts) return false;
  var d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  var now = new Date();
  return d.toDateString() === now.toDateString();
}

if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
db=firebase.firestore();auth=firebase.auth();

document.getElementById('login-btn').onclick=async function(){
  var em=document.getElementById('email').value.trim();var pw=document.getElementById('password').value;
  if(!em||!pw){document.getElementById('login-err').textContent='❌ أدخل البريد وكلمة المرور';return;}
  this.disabled=true;this.textContent='جارٍ...';document.getElementById('login-err').textContent='';
  try{await auth.signInWithEmailAndPassword(em,pw);}catch(e){document.getElementById('login-err').textContent='❌ '+e.code;this.disabled=false;this.textContent='🔐 دخول';}
};
document.getElementById('logout-btn').onclick=logout;
function logout(){
  if(!confirm('تسجيل الخروج؟'))return;
  if(state.unsubPending)state.unsubPending();
  if(state.unsubConfirmed)state.unsubConfirmed();
  auth.signOut().then(()=>location.href='cat-login.html');
}

auth.onAuthStateChanged(async function(u){
  if(!u){document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return;}
  try{
    var udoc=await db.collection('users').doc(u.uid).get();
    var role=udoc.exists?(udoc.data().role||''):'';
    var cat=udoc.exists?(udoc.data().assignedCategory||''):'';
    var adoc=await db.collection('admins').doc(u.uid).get();
    if(adoc.exists&&adoc.data().role==='cat_manager'){role='cat_manager';cat=cat||adoc.data().assignedCategory||'';}
    if(role!=='cat_manager'||!cat){document.getElementById('login-err').textContent='⛔ لست مدير قسم أو لا يوجد قسم';await auth.signOut();return;}
    state.user=u;state.userData=udoc.exists?udoc.data():{};state.cat=cat;
    document.getElementById('cat-name').textContent=catLabel(cat);
    document.getElementById('user-name').textContent=state.userData.name||u.email;
    document.getElementById('greet-name').textContent=state.userData.name||'';
    var hr = new Date().getHours();
    document.getElementById('greeting-title').textContent = hr<12?'☀️ صباح الخير':hr<17?'🌤️ مساء الخير':'🌙 مساء الخير';
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('fab-add').classList.remove('hidden');
    startListeners();
    loadProducts();
  }catch(e){document.getElementById('login-err').textContent='❌ '+e.message;await auth.signOut();}
});

window.showView=function(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('fab-add').classList.toggle('hidden', v!=='products');
};

function startListeners(){
  if(state.unsubPending)state.unsubPending();
  if(state.unsubConfirmed)state.unsubConfirmed();
  state.unsubPending=db.collection('orders').where('workflowStatus','==','awaiting_categories').onSnapshot(snap=>{
    var arr=[];
    snap.forEach(d=>{var o=d.data();o.id=d.id;var c=o.categories&&o.categories[state.cat];if(c&&c.status==='pending')arr.push(o);});
    var newCount = arr.length;
    if(state.lastPendingCount > 0 && newCount > state.lastPendingCount){
      toast('🔔 طلب جديد وصل!','info');
      try{ var ctx = new (window.AudioContext||window.webkitAudioContext)(); var osc=ctx.createOscillator(); var g=ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.frequency.value=880; g.gain.setValueAtTime(0.15,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3); }catch(e){}
    }
    state.lastPendingCount = newCount;
    state.pending=arr;
    updateKPIs();renderPending();
  },err=>console.warn('pending snap:',err.message));
  
  state.unsubConfirmed=db.collection('orders').where('fulfillmentStage','in',['preparing','ready_for_pickup','picked_up','on_the_way','delivered','completed']).onSnapshot(snap=>{
    var arr=[];
    snap.forEach(d=>{var o=d.data();o.id=d.id;var c=o.categories&&o.categories[state.cat];if(c&&c.status==='confirmed')arr.push(o);});
    state.confirmed=arr;
    renderConfirmed();
  },err=>console.warn('confirmed snap:',err.message));
}

async function loadProducts(){
  try{
    var snap=await db.collection('products').where('category','==',state.cat).get();
    state.products=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    document.getElementById('kpi-products').textContent=state.products.length;
    renderProducts();
  }catch(e){console.warn('loadProducts:',e.message);}
}

function updateKPIs(){
  var pending = state.pending;
  var urgent = pending.filter(o=>{
    if(!o.createdAt) return false;
    var ms = o.createdAt.seconds*1000;
    return (Date.now() - ms) > 6*3600*1000;
  }).length;
  document.getElementById('kpi-orders').textContent=pending.length;
  document.getElementById('kpi-urgent').textContent=urgent;
  var badge=document.getElementById('pending-badge');
  if(pending.length>0){badge.textContent=pending.length;badge.classList.remove('hidden');}else badge.classList.add('hidden');
  var today = pending.filter(o=>isToday(o.createdAt)).length;
  document.getElementById('count-all').textContent = pending.length;
  document.getElementById('count-today').textContent = today;
  document.getElementById('count-urgent').textContent = urgent;
}

window.filterConfirmed=function(){

function applyPendingFilters(arr){
  var out = arr;
  if(state.pendingFilter === 'today') out = out.filter(o=>isToday(o.createdAt));
  else if(state.pendingFilter === 'urgent') out = out.filter(o=>{
    if(!o.createdAt) return false;
    return (Date.now() - o.createdAt.seconds*1000) > 6*3600*1000;
  });
  if(state.pendingSearch){
    var q = state.pendingSearch;
    out = out.filter(o=>{
      var name = (o.name||o.customerName||'').toLowerCase();
      var phone = (o.phone||o.customerPhone||'').toLowerCase();
      var id = o.id.toLowerCase();
      return name.includes(q) || phone.includes(q) || id.includes(q);
    });
  }
  return out;
}

function renderPending(){
  var el=document.getElementById('pending-list');
  var arr = applyPendingFilters(state.pending);
  if(!arr.length){
    var msg = state.pendingSearch ? 'لا توجد نتائج للبحث'
            : state.pendingFilter==='today' ? 'لا توجد طلبات اليوم'
            : state.pendingFilter==='urgent' ? 'لا توجد طلبات عاجلة — ممتاز! 🎉'
            : 'لا توجد طلبات بانتظار المراجعة';
    el.innerHTML='<div class="empty"><div class="empty-icon">✨</div>'+msg+'</div>';
    updateBulkBar();
    return;
  }
  el.innerHTML=arr.map(o=>{
    var c=o.categories[state.cat];
    var items=c.items||[];
    var allChecked=items.every(i=>i._catStatus!==false);
    var ta = timeAgo(o.createdAt);
    var isUrgent = ta.hours >= 6;
    var isSelected = !!state.selectedOrders[o.id];
    var phone = o.phone || o.customerPhone || '';
    var itemsHtml=items.map((it,idx)=>'<label class="order-item"><input type="checkbox" data-oid="'+o.id+'" data-idx="'+idx+'" '+(it._catStatus!==false?'checked':'')+'><div class="item-info"><b>'+esc(it.name||'—')+'</b><span>الكمية: '+(it.qty||1)+'</span></div><div class="item-price">'+(Number(it.price)||0)+' ر</div></label>').join('');
    return '<div class="order-card '+(isUrgent?'urgent':'')+' '+(isSelected?'selected':'')+'" data-order-card="'+o.id+'"><div class="order-head"><input type="checkbox" class="order-select" data-select-oid="'+o.id+'" '+(isSelected?'checked':'')+'><div class="order-head-left" onclick="openOrderModal(\''+o.id+'\',\'pending\')"><b>#'+esc(o.id.slice(-6).toUpperCase())+'</b><div class="order-meta">'+esc(o.name||o.customerName||'عميل')+(phone?' · '+esc(phone):'')+'</div><span class="order-time-badge '+ta.cls+'">'+ta.label+'</span></div><div class="order-total">'+(Number(o.total)||0).toFixed(0)+' ر</div></div>'+itemsHtml+'<div class="order-actions"><button class="btn-ok" '+(allChecked?'':'disabled')+' data-confirm="'+o.id+'">✓ تأكيد</button>'+(phone?'<a class="btn-wa" href="https://wa.me/'+phone.replace(/\D/g,'')+'" target="_blank" onclick="event.stopPropagation()">💬</a>':'')+'<button class="btn-warn" data-reject="'+o.id+'">✗</button></div></div>';
  }).join('');
  bindPendingActions();
  updateBulkBar();
}

function bindPendingActions(){
  var el=document.getElementById('pending-list');
  el.querySelectorAll('input[data-oid]').forEach(cb=>{
    cb.onchange=function(){
      var oid=cb.dataset.oid;var idx=parseInt(cb.dataset.idx,10);
      var o=state.pending.find(x=>x.id===oid);if(!o)return;
      var items=o.categories[state.cat].items;
      items[idx]._catStatus=cb.checked;
      var btn=cb.closest('.order-card').querySelector('.btn-ok');
      if(btn)btn.disabled=!items.every(i=>i._catStatus!==false);
    };
  });
  el.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>confirmOrder(b.dataset.confirm));
  el.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectOrder(b.dataset.reject));
  el.querySelectorAll('[data-select-oid]').forEach(cb=>{
    cb.onchange=function(){
      var oid = cb.dataset.selectOid;
      if(cb.checked) state.selectedOrders[oid]=true; else delete state.selectedOrders[oid];
      cb.closest('.order-card').classList.toggle('selected', cb.checked);
      updateBulkBar();
    };
  });
}

function updateBulkBar(){
  var count = Object.keys(state.selectedOrders).length;
  var bar = document.getElementById('bulk-bar');
  if(count > 0){document.getElementById('bulk-count').textContent=count;bar.classList.remove('hidden');}else bar.classList.add('hidden');
}

window.bulkConfirm = async function(){
  var ids = Object.keys(state.selectedOrders);
  if(!ids.length) return;
  if(!confirm('تأكيد '+ids.length+' طلب دفعة واحدة؟')) return;
  var ok=0, fail=0;
  for(var i=0;i<ids.length;i++){
    try{ await _doConfirm(ids[i]); ok++; }catch(e){ fail++; }
  }
  state.selectedOrders={};
  updateBulkBar();
  toast('✅ تم تأكيد '+ok+(fail?' (فشل: '+fail+')':''), ok?'ok':'err');
};

async function confirmOrder(oid){
  if(!confirm('تأكيد توفر جميع منتجات هذا الطلب؟')) return;
  try{ await _doConfirm(oid); toast('✅ تم التأكيد','ok'); }
  catch(e){ toast('❌ '+e.message,'err'); }
}

async function _doConfirm(oid){
  var o=state.pending.find(x=>x.id===oid);
  if(!o) throw new Error('الطلب غير موجود في القائمة');
  var catObj=JSON.parse(JSON.stringify(o.categories[state.cat]));
  catObj.items=(catObj.items||[]).map(i=>Object.assign({},i,{_catStatus:i._catStatus!==false}));
  catObj.status='confirmed';
  catObj.confirmedBy=state.user.uid;
  catObj.confirmedByName=state.userData.name||state.user.email;
  catObj.confirmedAt=firebase.firestore.FieldValue.serverTimestamp();
  var ref=db.collection('orders').doc(oid);
  var doc=await ref.get();
  if(!doc.exists) throw new Error('الطلب محذوف');
  var data=doc.data();
  var merged=Object.assign({},data.categories||{});
  merged[state.cat]=catObj;
  var updates={};updates['categories.'+state.cat]=catObj;
  var allResolved=Object.keys(merged).every(k=>{var s=merged[k]&&merged[k].status;return s==='confirmed'||s==='rejected';});
  var anyRejected=Object.keys(merged).some(k=>merged[k]&&merged[k].status==='rejected');
  if(allResolved){updates.workflowStatus=anyRejected?'payment_rejected':'ready_to_send';updates.fulfillmentStage=anyRejected?'awaiting_customer_decision':'preparing';}
  await ref.update(updates);
  try{await db.collection('notifications').add({userId:o.customerId||o.userId||'',title:'✅ تم تأكيد توفر منتجاتك',body:'طلبك #'+oid.slice(-6)+' من قسم '+catLabel(state.cat)+' جاهز',type:'order',event:'cat_confirmed',icon:'✅',read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
}

async function rejectOrder(oid){
  var o=state.pending.find(x=>x.id===oid);if(!o)return;
  var reason=prompt('اذكر سبب الرفض:');if(!reason||!reason.trim())return;
  try{
    var catObj=JSON.parse(JSON.stringify(o.categories[state.cat]));
    catObj.status='rejected';catObj.rejectReason=reason.trim();catObj.rejectedBy=state.user.uid;catObj.rejectedByName=state.userData.name||state.user.email;catObj.rejectedAt=firebase.firestore.FieldValue.serverTimestamp();
    var updates={};updates['categories.'+state.cat]=catObj;updates.workflowStatus='payment_rejected';updates.fulfillmentStage='awaiting_customer_decision';
    await db.collection('orders').doc(oid).update(updates);
    try{await db.collection('notifications').add({userId:o.customerId||o.userId||'',title:'⚠️ تحديث بخصوص طلبك',body:'قسم '+catLabel(state.cat)+': '+reason.trim(),type:'warning',event:'cat_rejected',icon:'⚠️',read:false,important:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
    toast('❌ تم الرفض','warn');
  }catch(e){toast('❌ '+e.message,'err');}
}

function renderConfirmed(){
  var el=document.getElementById('confirmed-list');
  var arr = state.confirmed;
  if(state.confirmedSearch){
    var q=state.confirmedSearch;
    arr = arr.filter(o=>(o.name||o.customerName||'').toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
  }
  if(!arr.length){el.innerHTML='<div class="empty"><div class="empty-icon">📭</div>لا توجد طلبات مؤكدة</div>';return;}
  el.innerHTML=arr.map(o=>{
    var c=o.categories[state.cat]||{};
    var items=c.items||[];
    var itemsHtml=items.map(it=>'<div class="order-item"><div class="item-info"><b>'+esc(it.name||'—')+'</b><span>الكمية: '+(it.qty||1)+'</span></div><div class="item-price">'+(Number(it.price)||0)+' ر</div></div>').join('');
    return '<div class="order-card"><div class="order-head"><div class="order-head-left" onclick="openOrderModal(\''+o.id+'\',\'confirmed\')"><b>#'+esc(o.id.slice(-6).toUpperCase())+'</b><div class="order-meta">'+esc(o.name||o.customerName||'عميل')+' · '+fmtDate(o.createdAt)+'</div></div><div class="order-total">'+(Number(o.total)||0).toFixed(0)+' ر</div></div>'+itemsHtml+'<div class="order-actions"><button class="btn-view" onclick="openOrderModal(\''+o.id+'\',\'confirmed\')">👁</button><button class="btn-pdf" data-pdf="'+o.id+'">📄 PDF</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>downloadCatPDF(b.dataset.pdf));
}

function renderProducts(){
  var el=document.getElementById('products-list');
  var arr = state.products;
  if(state.productFilter === 'low') arr = arr.filter(p=>(p.stock||0) > 0 && (p.stock||0) < 5);
  else if(state.productFilter === 'out') arr = arr.filter(p=>(p.stock||0) <= 0);
  if(state.productSearch){
    var q = state.productSearch;
    arr = arr.filter(p=>(p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q));
  }
  if(!arr.length){el.innerHTML='<div class="empty"><div class="empty-icon">📦</div>لا توجد منتجات</div>';return;}
  el.innerHTML=arr.map(p=>{
    var stock = p.stock||0;
    var cls = stock<=0?'out-stock':stock<5?'low-stock':'';
    var stockCls = stock<=0?'stock-out':stock<5?'stock-low':'stock-ok';
    return '<div class="product-card '+cls+'"><img src="'+esc(p.img||p.image||'')+'" alt="" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22><rect fill=%22%23333%22 width=%2256%22 height=%2256%22/><text x=%2228%22 y=%2232%22 font-size=%2220%22 fill=%22%23666%22 text-anchor=%22middle%22>📦</text></svg>\'"><div class="product-info"><b>'+esc(p.name||'—')+'</b><span>'+(Number(p.price)||0)+' ر · '+esc(p.brand||'—')+'</span></div><div class="product-stock '+stockCls+'">'+stock+'</div></div>';
  }).join('');
}

window.addProduct = async function(){
  var name = document.getElementById('p-name').value.trim();
  var price = Number(document.getElementById('p-price').value)||0;
  var stock = Number(document.getElementById('p-stock').value)||0;
  var img = document.getElementById('p-img').value.trim();
  var brand = document.getElementById('p-brand').value.trim();
  if(!name || price<=0){toast('❌ أدخل الاسم والسعر','err');return;}
  try{
    var user = state.user;
    await db.collection('products').add({
      name:name, price:price, stock:stock, img:img, brand:brand,
      category:state.cat, categories:[state.cat],
      active:true, status:'pending_review',
      submittedBy:{uid:user.uid, name:state.userData.name||user.email, at:firebase.firestore.FieldValue.serverTimestamp()},
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ تم إرسال المنتج للمراجعة','ok');
    document.getElementById('p-name').value='';
    document.getElementById('p-price').value='';
    document.getElementById('p-stock').value='';
    document.getElementById('p-img').value='';
    document.getElementById('p-brand').value='';
    closeProductModal();
    loadProducts();
  }catch(e){toast('❌ '+e.message,'err');}
};

  var o=state.confirmed.find(x=>x.id===oid);if(!o)return;

  var dateStr=new Date().toLocaleString('ar');
  var total=items.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0);
  var htmlStr='<div style="padding:20px;font-family:Arial,Tahoma,sans-serif;direction:rtl;max-width:800px;color:#333;background:#fff">' +
    '<div style="text-align:center;border-bottom:3px solid #a855f7;padding-bottom:15px;margin-bottom:20px">' +

    '<table style="width:100%;margin-bottom:20px;border-collapse:collapse;font-size:14px">' +
      '<tr><td style="padding:8px;background:#f9fafb;width:35%;font-weight:600">👤 العميل:</td><td style="padding:8px;font-weight:bold">'+esc(o.name||o.customerName||'—')+'</td></tr>' +
      '<tr><td style="padding:8px;background:#f9fafb;font-weight:600">📱 الهاتف:</td><td style="padding:8px">'+esc(o.phone||o.customerPhone||'—')+'</td></tr>' +
      '<tr><td style="padding:8px;background:#f9fafb;font-weight:600">📍 العنوان:</td><td style="padding:8px">'+esc(o.deliveryAddress||o.address||o.pickup||'—')+'</td></tr>' +
      '<tr><td style="padding:8px;background:#f9fafb;font-weight:600">📅 التاريخ:</td><td style="padding:8px">'+dateStr+'</td></tr>' +
    '</table>' +
    '<h3 style="color:#a855f7;border-top:2px solid #e5e7eb;padding-top:15px">🛒 المنتجات</h3>' +
    '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#a855f7;color:#fff"><th style="padding:10px;text-align:right;border:1px solid #7c3aed">المنتج</th><th style="padding:10px;text-align:center;border:1px solid #7c3aed">الكمية</th><th style="padding:10px;text-align:center;border:1px solid #7c3aed">السعر</th><th style="padding:10px;text-align:center;border:1px solid #7c3aed">المجموع</th></tr></thead><tbody>' +
    items.map(it=>'<tr><td style="padding:8px;border:1px solid #ddd">'+esc(it.name||'—')+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+(it.qty||1)+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+(it.price||0)+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+((Number(it.price)||0)*(Number(it.qty)||1))+'</td></tr>').join('') +
    '</tbody></table>' +
    '<div style="margin-top:20px;padding:15px;background:#f3e8ff;border-radius:10px;text-align:left;font-size:18px;font-weight:bold;border:2px solid #a855f7">إجمالي القسم: '+total.toFixed(0)+' ر.ي</div>' +
    '<div style="text-align:center;margin-top:40px;color:#999;font-size:12px;border-top:1px solid #eee;padding-top:20px"><p>CHIZEN — كشف استلام للمندوب</p><p style="font-size:10px">'+dateStr+'</p></div></div>';
  var el=document.createElement('div');el.innerHTML=htmlStr;
  html2pdf().from(el).set({margin:10,filename:'CHIZEN-CAT-'+oid.slice(-6).toUpperCase()+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'p'}}).save().then(()=>toast('✅ تم تحميل PDF','ok')).catch(e=>toast('❌ '+e.message,'err'));
}
})();
