<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — لوحة مدير القسم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0825;--s:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);--b:rgba(168,85,247,0.15);--bs:rgba(168,85,247,0.3);--p:#a855f7;--p2:#7c3aed;--ac:#ec4899;--ok:#10b981;--wr:#f59e0b;--er:#ef4444;--wa:#25D366;--tx:#e5e7eb;--mu:#9ca3af;--dm:#6b7280}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px;line-height:1.5;overflow-x:hidden}
.hidden{display:none!important}

/* BOOT OVERLAY */
#boot{position:fixed;inset:0;z-index:9999;background:#0a0825;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity 0.3s}
#boot.fade{opacity:0;pointer-events:none}
.boot-logo{font-size:56px;margin-bottom:16px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.boot-brand{font-size:24px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.boot-sub{color:var(--mu);font-size:13px;margin-bottom:24px}
.boot-status{color:var(--tx);font-size:13px;text-align:center;padding:12px 20px;background:rgba(255,255,255,0.03);border-radius:12px;max-width:340px;line-height:1.6;min-height:44px;display:flex;align-items:center;justify-content:center}
.boot-status.err{color:#fca5a5;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);text-align:right;justify-content:flex-start;font-family:monospace;font-size:11px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.boot-status.ok{color:#6ee7b7;background:rgba(16,185,129,0.1)}
.boot-spinner{width:40px;height:40px;border:3px solid rgba(168,85,247,0.2);border-top-color:var(--p);border-radius:50%;animation:spin 0.8s linear infinite;margin-top:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-btns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.boot-btns button{padding:10px 16px;border-radius:10px;border:none;background:var(--p);color:#fff;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.boot-btns button.sec{background:#374151;color:var(--mu)}

/* HEADER */
.app-header{background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(236,72,153,0.08));border-bottom:1px solid var(--b);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px)}
.app-header .left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--ac));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0}
.h-cat{font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-user{font-size:11px;color:#c4b5fd;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logout-btn{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;flex-shrink:0}

/* VIEWS */
.view{display:none;animation:fadeIn 0.25s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.home-wrap{padding:16px}
.welcome{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 50%,#f59e0b 100%);border-radius:24px;padding:24px 20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(236,72,153,0.4);margin-bottom:20px}
.welcome::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:rgba(255,255,255,0.15);border-radius:50%;filter:blur(40px)}
.w-greet{font-size:20px;font-weight:900;margin-bottom:4px;position:relative;z-index:1}
.w-sub{font-size:13px;opacity:0.9;position:relative;z-index:1}
.w-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.w-stat{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.25);border-radius:16px;padding:14px 8px;text-align:center;backdrop-filter:blur(10px)}
.w-stat .v{font-size:24px;font-weight:900;line-height:1}
.w-stat .l{font-size:10px;opacity:0.9;margin-top:4px;font-weight:700}
.w-stat.urgent .v{color:#fef3c7}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:15px;font-weight:900;color:#fff}
.section-link{background:none;border:none;color:var(--p);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.quick-card{background:linear-gradient(135deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;position:relative}
.quick-card:active{transform:scale(0.97)}
.quick-card .ic{font-size:32px;margin-bottom:8px}
.quick-card .lb{font-size:13px;font-weight:800;color:#fff}
.quick-card .badge{position:absolute;top:10px;left:10px;background:var(--er);color:#fff;border-radius:50%;min-width:22px;height:22px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
.recent-order{background:linear-gradient(135deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.rec-info{flex:1;min-width:0}
.rec-id{font-size:12px;font-weight:900;color:var(--p)}
.rec-name{font-size:12px;color:#fff;margin-top:2px}
.rec-time{font-size:10px;color:var(--dm);margin-top:2px}
.rec-amt{font-size:14px;font-weight:900;color:var(--wr);white-space:nowrap}

/* SEARCH */
.search-wrap{padding:0 16px 12px}
.search-wrap.pad-top{padding-top:16px}
.search-input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--b);background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;font-size:13px}
.search-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px rgba(168,85,247,0.15)}
.chips{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:rgba(168,85,247,0.08);border:1px solid var(--b);color:#c4b5fd;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(168,85,247,0.4)}

/* ORDER CARDS */
.list-wrap{padding:0 16px}
.order-card{background:linear-gradient(135deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px}
.order-card.urgent{border-color:rgba(239,68,68,0.5)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(255,255,255,0.08)}
.order-top-left{flex:1;min-width:0;cursor:pointer}
.order-num{font-size:13px;font-weight:900;color:var(--p);display:inline-block}
.order-cust{font-size:13px;color:#fff;font-weight:700;margin-top:3px}
.order-meta{font-size:11px;color:var(--mu);margin-top:2px}
.order-amt{font-size:16px;font-weight:900;color:var(--wr);white-space:nowrap;text-align:left}
.order-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.order-item{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(0,0,0,0.2);border-radius:10px}
.order-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex-shrink:0;cursor:pointer}
.oi-info{flex:1;min-width:0}
.oi-name{font-size:12px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oi-qty{font-size:10px;color:var(--mu);margin-top:1px}
.oi-price{font-size:12px;font-weight:900;color:var(--p);white-space:nowrap}
.order-actions{display:flex;gap:8px}
.order-actions button,.order-actions a{flex:1;padding:11px;border-radius:10px;border:none;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
.btn-ok{background:linear-gradient(135deg,var(--ok),#059669);color:#fff}
.btn-ok:disabled{opacity:0.3;cursor:not-allowed}
.btn-rej{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);flex:0 0 auto;padding:11px 14px}
.btn-wa{background:var(--wa);color:#fff;flex:0 0 auto;padding:11px 14px}
.btn-pdf{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;flex:0 0 auto;padding:11px 14px}
.btn-wa-full{background:linear-gradient(135deg,var(--wa),#128C7E);color:#fff}

/* PRODUCTS GRID */
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.p-card{background:var(--s);border:1px solid var(--b);border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.p-card:active{transform:scale(0.97)}
.p-img-wrap{position:relative;aspect-ratio:1;background:linear-gradient(135deg,#1a1a3e,#0f0a2e);overflow:hidden}
.p-img{width:100%;height:100%;object-fit:cover;display:block}
.p-img-empty{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;opacity:0.3}
.p-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900}
.pb-live{background:rgba(16,185,129,0.9);color:#fff}
.pb-pending{background:rgba(245,158,11,0.9);color:#fff}
.p-stock-badge{position:absolute;bottom:8px;right:8px;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900;background:rgba(0,0,0,0.7);color:#fff}
.p-body{padding:10px}
.p-brand{font-size:9px;color:var(--mu);font-weight:700;margin-bottom:2px}
.p-name{font-size:12px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:6px;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-prices{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-price{font-size:14px;font-weight:900;color:var(--wr)}
.p-old-price{font-size:10px;color:var(--dm);text-decoration:line-through;font-weight:600}
.p-discount{background:rgba(239,68,68,0.15);color:#fca5a5;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:900}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,8,37,0.98);backdrop-filter:blur(20px);border-top:1px solid var(--b);padding:8px 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:100}
.nav-btn{background:none;border:none;color:var(--dm);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav-btn .ic{font-size:22px;filter:grayscale(1)}
.nav-btn.active{color:var(--p)}
.nav-btn.active .ic{filter:grayscale(0);transform:scale(1.1)}
.nav-badge{position:absolute;top:0;right:8px;background:var(--er);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* FAB */
.fab{position:fixed;bottom:100px;left:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ok),#059669);color:#fff;border:none;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(16,185,129,0.5);z-index:60;display:flex;align-items:center;justify-content:center}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:flex-end}
.modal-box{background:linear-gradient(180deg,#1a0f3d,#0a0825);width:100%;max-width:500px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--b)}
.modal-head h3{font-size:17px;font-weight:900;color:#fff}
.modal-close{background:rgba(239,68,68,0.15);color:#fca5a5;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit}
.info-row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,0.2);border-radius:10px;margin-bottom:6px;gap:10px;font-size:13px}
.info-row .l{color:var(--mu);font-weight:700;flex-shrink:0}
.info-row .v{color:#fff;font-weight:800;text-align:left;word-break:break-word}
.modal-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--b);background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;font-size:14px;margin-bottom:12px}
.modal-input:focus{outline:none;border-color:var(--p)}
.wa-preview{background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:#e5e7eb;white-space:pre-wrap;max-height:300px;overflow-y:auto;margin-bottom:14px;border:1px solid rgba(37,211,102,0.3);text-align:right;direction:rtl}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions button{flex:1;padding:13px;border-radius:10px;border:none;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.m-ok{background:linear-gradient(135deg,var(--ok),#059669);color:#fff}
.m-cancel{background:#374151;color:var(--mu)}
.m-wa{background:linear-gradient(135deg,var(--wa),#128C7E);color:#fff}

/* PRODUCT FORM */
.form-screen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column}
.form-header{background:linear-gradient(135deg,#1a0f3d,#0a0825);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
.form-header h2{font-size:16px;color:#fff}
.form-header .close-btn{background:rgba(239,68,68,0.15);color:#fca5a5;border:none;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit}
.form-header .save-btn{background:linear-gradient(135deg,var(--ok),#059669);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.form-scroll{flex:1;overflow-y:auto;padding:16px;padding-bottom:40px}
.form-section{background:rgba(255,255,255,0.03);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.form-section-title{font-size:13px;font-weight:900;color:var(--p);margin-bottom:12px}
.form-field{margin-bottom:12px}
.form-field:last-child{margin-bottom:0}
.form-field label{display:block;font-size:11px;font-weight:800;color:var(--mu);margin-bottom:6px}
.form-field input,.form-field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--b);background:rgba(0,0,0,0.3);color:#fff;font-size:13px;font-family:inherit}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--p)}
.form-field textarea{min-height:70px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size-chips{display:flex;flex-wrap:wrap;gap:6px}
.size-chip{padding:8px 16px;border-radius:10px;background:rgba(168,85,247,0.08);border:1.5px solid var(--b);color:var(--mu);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.size-chip.selected{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}
.color-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.color-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid var(--b);font-size:12px;font-weight:700}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.3)}
.color-remove{background:rgba(239,68,68,0.2);color:#f87171;border:none;width:20px;height:20px;border-radius:50%;font-size:11px;cursor:pointer;font-family:inherit}
.image-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.image-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(0,0,0,0.3);border:1px solid var(--b)}
.image-item img{width:100%;height:100%;object-fit:cover}
.image-remove{position:absolute;top:4px;right:4px;background:rgba(239,68,68,0.9);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;font-family:inherit}
.image-add{aspect-ratio:1;border-radius:10px;background:rgba(168,85,247,0.08);border:2px dashed var(--b);color:var(--p);font-size:24px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}

/* TOASTS */
#toasts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:400px}
.toast{padding:12px 22px;border-radius:30px;font-weight:800;font-size:13px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.5);text-align:center;width:100%}
.toast.ok{background:var(--ok)}.toast.err{background:var(--er)}.toast.info{background:#3b82f6}.toast.warn{background:var(--wr)}

.empty{text-align:center;padding:60px 20px;color:var(--dm);font-size:14px}
.empty .ic{font-size:56px;margin-bottom:14px;opacity:0.4;display:block}
</style>
</head>
<body>

<!-- BOOT OVERLAY -->
<div id="boot">
  <div class="boot-logo">📦</div>
  <div class="boot-brand">CHIZEN</div>
  <div class="boot-sub">لوحة إدارة القسم</div>
  <div class="boot-status" id="boot-status">⏳ جاري التحميل...</div>
  <div class="boot-spinner" id="boot-spinner"></div>
  <div class="boot-btns hidden" id="boot-btns">
    <button onclick="location.reload()">🔄 إعادة محاولة</button>
    <button class="sec" onclick="location.href='cat-login.html'">🔐 تسجيل خروج</button>
  </div>
</div>

<!-- APP (visible, boot overlay covers it) -->
<div id="app">
  <header class="app-header">
    <div class="left">
      <div class="avatar" id="user-avatar">?</div>
      <div style="min-width:0;flex:1">
        <div class="h-cat" id="cat-name">—</div>
        <div class="h-user" id="user-name">—</div>
      </div>
    </div>
    <button id="logout-btn" onclick="doLogout()">🚪</button>
  </header>

  <!-- HOME -->
  <div id="view-home" class="view active">
    <div class="home-wrap">
      <div class="welcome">
        <div class="w-greet" id="greeting">👋 مرحباً</div>
        <div class="w-sub" id="greeting-sub">—</div>
        <div class="w-stats">
          <div class="w-stat"><div class="v" id="kpi-pending">0</div><div class="l">طلبات جديدة</div></div>
          <div class="w-stat"><div class="v" id="kpi-products">0</div><div class="l">منتجات</div></div>
          <div class="w-stat urgent"><div class="v" id="kpi-urgent">0</div><div class="l">عاجلة</div></div>
        </div>
      </div>
      <div class="section-head"><div class="section-title">⚡ إجراءات سريعة</div></div>
      <div class="quick-grid">
        <div class="quick-card" onclick="showView('orders')">
          <div class="badge hidden" id="quick-badge">0</div>
          <div class="ic">📦</div><div class="lb">مراجعة الطلبات</div>
        </div>
        <div class="quick-card" onclick="showView('products')"><div class="ic">🛍️</div><div class="lb">منتجاتي</div></div>
        <div class="quick-card" onclick="showView('confirmed')"><div class="ic">✅</div><div class="lb">المؤكدة</div></div>
        <div class="quick-card" onclick="openProductForm()"><div class="ic">➕</div><div class="lb">إضافة منتج</div></div>
      </div>
      <div class="section-head"><div class="section-title">🕐 أحدث الطلبات</div><button class="section-link" onclick="showView('orders')">عرض الكل ←</button></div>
      <div id="recent-orders"></div>
    </div>
  </div>

  <!-- ORDERS -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__cdnErr='app'"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="window.__cdnErr='auth'"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="window.__cdnErr='firestore'"></script>
<script src="firebase-config.js" onerror="window.__cfgErr=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
'use strict';

// ═══ GLOBAL STATE ═══
var db, auth;
var CAT_LABELS = {electronics:'إلكترونيات',fashion:'أزياء وموضة',clothing:'ملابس',shoes_bags:'أحذية وحقائب',beauty:'جمال وعطور',kids_sports:'أطفال ورياضة',home:'منزل وأثاث',supermarket:'سوبرماركت',sports:'رياضة',kids:'أطفال',tools:'أدوات منزلية'};
var ALL_SIZES = ['XS','S','M','L','XL','XXL','3XL','36','38','40','42','44'];

var state = {
  user:null, userData:null, cat:'',
  pending:[], confirmed:[], products:[],
  ordersFilter:'all',
  unsubPending:null, unsubConfirmed:null,
  editingProductId:null,
  formSizes:[], formColors:[], formImages:[]
};

// ═══ BOOT DISPLAY ═══
var bootEl = document.getElementById('boot');
var bootStatus = document.getElementById('boot-status');
var bootSpinner = document.getElementById('boot-spinner');
var bootBtns = document.getElementById('boot-btns');

function bootSet(msg, type){
  bootStatus.className = 'boot-status' + (type ? ' ' + type : '');
  bootStatus.textContent = msg;
  if(type === 'err'){
    bootSpinner.style.display = 'none';
    bootBtns.classList.remove('hidden');
  }
  console.log('[BOOT]', msg);
}

function bootDone(){
  bootEl.classList.add('fade');
  setTimeout(function(){ bootEl.style.display = 'none'; }, 400);
}

// ═══ HELPERS ═══
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catLabel(c){return CAT_LABELS[c]||c||'—';}
function toast(m,t){
  t = t||'info';
  var c = document.getElementById('toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + t;
  el.textContent = m;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); },300); },3500);
}
function fmtDate(ts){if(!ts)return '—';var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);return d.toLocaleString('ar-YE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function isToday(ts){if(!ts)return false;var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);return d.toDateString()===new Date().toDateString();}
function timeAgo(ts){if(!ts)return '—';var ms=ts.seconds?ts.seconds*1000:new Date(ts).getTime();var diff=Math.floor((Date.now()-ms)/60000);if(diff<60)return 'منذ '+diff+' د';var h=Math.floor(diff/60);if(h<24)return 'منذ '+h+' ساعة';return 'منذ '+Math.floor(h/24)+' يوم';}
function isUrgent(ts){if(!ts)return false;return (Date.now()-ts.seconds*1000)>6*3600*1000;}

// ═══ INIT FLOW (with 30s total timeout) ═══
var initTimedOut = false;
var initTimer = setTimeout(function(){
  if(!initTimedOut && !state.user){
    initTimedOut = true;
    bootSet('⏱️ انتهت المهلة (30 ثانية)\n\nالإنترنت ضعيف أو Firebase بطيء.\n\nاضغط "إعادة محاولة"', 'err');
  }
}, 30000);

async function init(){
  try {
    // Step 1: Check CDN
    if(window.__cdnErr){
      bootSet('❌ فشل تحميل Firebase (' + window.__cdnErr + ')\n\nتحقق من الإنترنت', 'err');
      clearTimeout(initTimer);
      return;
    }
    if(typeof firebase === 'undefined'){
      bootSet('❌ Firebase غير محمّل\n\nتحقق من الإنترنت', 'err');
      clearTimeout(initTimer);
      return;
    }
    bootSet('✅ Firebase جاهز');
    
    // Step 2: Check config
    if(window.__cfgErr || typeof window.FIREBASE_CONFIG === 'undefined'){
      bootSet('❌ firebase-config.js لم يُحمّل', 'err');
      clearTimeout(initTimer);
      return;
    }
    bootSet('✅ إعدادات جاهزة');
    
    // Step 3: Init Firebase
    if(!firebase.apps.length){
      firebase.initializeApp(window.FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    auth = firebase.auth();
    bootSet('✅ تم الاتصال بقاعدة البيانات');
    
    // Step 4: Auth state
    auth.onAuthStateChanged(handleAuthChange);
    
  } catch(err){
    console.error('[INIT ERROR]', err);
    bootSet('❌ خطأ: ' + err.message, 'err');
    clearTimeout(initTimer);
  }
}

async function handleAuthChange(u){
  if(initTimedOut) return;
  
  if(!u){
    // Not logged in → redirect
    bootSet('⚠️ غير مسجل — جاري التحويل...');
    setTimeout(function(){ location.href = 'cat-login.html'; }, 500);
    clearTimeout(initTimer);
    return;
  }
  
  state.user = u;
  bootSet('👤 ' + u.email);
  
  try {
    // Step 5: Fetch role
    bootSet('⏳ التحقق من الصلاحيات...');
    var udoc = await db.collection('users').doc(u.uid).get();
    var role = udoc.exists ? (udoc.data().role || '') : '';
    var cat = udoc.exists ? (udoc.data().assignedCategory || '') : '';
    var adoc = await db.collection('admins').doc(u.uid).get();
    if(adoc.exists && adoc.data().role === 'cat_manager'){
      role = 'cat_manager';
      cat = cat || adoc.data().assignedCategory || '';
    }
    
    if(role !== 'cat_manager'){
      bootSet('⛔ دورك: ' + role + '\nهذه اللوحة لمديري الأقسام فقط', 'err');
      clearTimeout(initTimer);
      try{ await auth.signOut(); }catch(e){}
      return;
    }
    if(!cat){
      bootSet('⚠️ لم يُعيَّن لك قسم\nتواصل مع الإدارة', 'err');
      clearTimeout(initTimer);
      return;
    }
    
    state.userData = udoc.exists ? udoc.data() : {};
    state.cat = cat;
    
    // Step 6: Update UI
    bootSet('✅ مرحباً ' + (state.userData.name || u.email));
    document.getElementById('cat-name').textContent = catLabel(cat);
    document.getElementById('user-name').textContent = state.userData.name || u.email;
    document.getElementById('user-avatar').textContent = (state.userData.name || u.email || 'م').charAt(0).toUpperCase();
    var hr = new Date().getHours();
    document.getElementById('greeting').textContent = hr<12?'☀️ صباح الخير':hr<17?'🌤️ مساء الخير':'🌙 مساء الخير';
    document.getElementById('greeting-sub').textContent = 'مرحباً ' + ((state.userData.name||'').split(' ')[0] || 'بك');
    
    clearTimeout(initTimer);
    bootDone();
    
    // Step 7: Start listeners + load data (background)
    startListeners();
    loadProducts();
    
  } catch(err){
    console.error('[AUTH ERROR]', err);
    bootSet('❌ خطأ: ' + err.message, 'err');
    clearTimeout(initTimer);
  }
}

// ═══ DATA LISTENERS ═══
function startListeners(){
  // Pending
  state.unsubPending = db.collection('orders')
    .where('workflowStatus', '==', 'awaiting_categories')
    .onSnapshot(function(snap){
      var arr = [];
      snap.forEach(function(d){
        var o = d.data(); o.id = d.id;
        var c = o.categories && o.categories[state.cat];
        if(c && c.status === 'pending') arr.push(o);
      });
      state.pending = arr;
      updateKPIs();
      if(document.getElementById('view-home').classList.contains('active')) renderHome();
      if(document.getElementById('view-orders').classList.contains('active')) renderOrders();
    }, function(err){ console.warn('[pending]', err.message); });
  
  // Confirmed
  state.unsubConfirmed = db.collection('orders')
    .where('fulfillmentStage', 'in', ['preparing','ready_for_pickup','picked_up','on_the_way','delivered','completed'])
    .onSnapshot(function(snap){
      var arr = [];
      snap.forEach(function(d){
        var o = d.data(); o.id = d.id;
        var c = o.categories && o.categories[state.cat];
        if(c && c.status === 'confirmed') arr.push(o);
      });
      state.confirmed = arr;
      if(document.getElementById('view-confirmed').classList.contains('active')) renderConfirmed();
    }, function(err){ console.warn('[confirmed]', err.message); });
}

async function loadProducts(){
  try {
    var snap = await db.collection('products').where('category', '==', state.cat).get();
    state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    document.getElementById('kpi-products').textContent = state.products.length;
    if(document.getElementById('view-products').classList.contains('active')) renderProducts();
  } catch(e){ console.warn('[products]', e.message); }
}

// ═══ KPIs ═══
function updateKPIs(){
  var pending = state.pending;
  var urgent = pending.filter(function(o){ return isUrgent(o.createdAt); }).length;
  document.getElementById('kpi-pending').textContent = pending.length;
  document.getElementById('kpi-urgent').textContent = urgent;
  var badge = document.getElementById('quick-badge');
  var navBadge = document.getElementById('nav-orders-badge');
  if(pending.length > 0){
    badge.textContent = pending.length; badge.classList.remove('hidden');
    navBadge.textContent = pending.length; navBadge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden'); navBadge.classList.add('hidden');
  }
}

// ═══ NAVIGATION ═══
window.showView = function(v){
  document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('active'); });
  var el = document.getElementById('view-' + v);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.v === v); });
  document.getElementById('fab-add').classList.toggle('hidden', v !== 'products');
  if(v === 'home') renderHome();
  if(v === 'orders') renderOrders();
  if(v === 'confirmed') renderConfirmed();
  if(v === 'products') renderProducts();
};

// ═══ HOME ═══
function renderHome(){
  var recent = state.pending.slice(0, 3);
  var el = document.getElementById('recent-orders');
  if(!recent.length){ el.innerHTML = '<div class="empty"><span class="ic">✨</span>لا توجد طلبات جديدة</div>'; return; }
  el.innerHTML = recent.map(function(o){
    return '<div class="recent-order" onclick="openOrderModal(\''+o.id+'\',\'pending\')">'+
      '<div class="rec-info"><div class="rec-id">#'+o.id.slice(-6).toUpperCase()+'</div><div class="rec-name">'+esc(o.name||o.customerName||'عميل')+'</div><div class="rec-time">'+timeAgo(o.createdAt)+'</div></div>'+
      '<div class="rec-amt">'+(Number(o.total)||0).toFixed(0)+' ر</div>'+
    '</div>';
  }).join('');
}

// ═══ ORDERS ═══
window.setOrdersFilter = function(f){
  state.ordersFilter = f;
  document.querySelectorAll('#orders-chips .chip').forEach(function(c){ c.classList.toggle('active', c.dataset.f === f); });
  renderOrders();
};

function renderOrders(){
  var search = (document.getElementById('orders-search').value || '').toLowerCase().trim();
  var arr = state.pending;
  if(state.ordersFilter === 'today') arr = arr.filter(function(o){ return isToday(o.createdAt); });
  else if(state.ordersFilter === 'urgent') arr = arr.filter(function(o){ return isUrgent(o.createdAt); });
  if(search){
    arr = arr.filter(function(o){
      var n = (o.name||o.customerName||'').toLowerCase();
      var p = (o.phone||o.customerPhone||'').toLowerCase();
      return n.includes(search) || p.includes(search) || o.id.toLowerCase().includes(search);
    });
  }
  var el = document.getElementById('orders-list');
  if(!arr.length){ el.innerHTML = '<div class="empty"><span class="ic">📭</span>لا توجد طلبات</div>'; return; }
  el.innerHTML = arr.map(function(o){
    var c = (o.categories[state.cat]) || {};
    var items = c.items || [];
    var allChecked = items.every(function(i){ return i._catStatus !== false; });
    var urgent = isUrgent(o.createdAt);
    var phone = o.phone || o.customerPhone || '';
    var itemsHtml = items.map(function(it, idx){
      return '<label class="order-item"><input type="checkbox" data-oid="'+o.id+'" data-idx="'+idx+'" '+(it._catStatus!==false?'checked':'')+'><div class="oi-info"><div class="oi-name">'+esc(it.name||'—')+'</div><div class="oi-qty">الكمية: '+(it.qty||1)+'</div></div><div class="oi-price">'+(Number(it.price)||0)+' ر</div></label>';
    }).join('');
    return '<div class="order-card '+(urgent?'urgent':'')+'">'+
      '<div class="order-top"><div class="order-top-left" onclick="openOrderModal(\''+o.id+'\',\'pending\')">'+
        '<span class="order-num">#'+o.id.slice(-6).toUpperCase()+'</span>'+
        '<div class="order-cust">'+esc(o.name||o.customerName||'عميل')+'</div>'+
        (phone?'<div class="order-meta">📱 '+esc(phone)+'</div>':'')+
        '<div class="order-meta">'+timeAgo(o.createdAt)+'</div>'+
      '</div><div class="order-amt">'+(Number(o.total)||0).toFixed(0)+' ر</div></div>'+
      '<div class="order-items">'+itemsHtml+'</div>'+
      '<div class="order-actions">'+
        '<button class="btn-ok" '+(allChecked?'':'disabled')+' onclick="confirmOrder(\''+o.id+'\')">✓ تأكيد</button>'+
        (phone?'<a class="btn-wa" href="https://wa.me/'+phone.replace(/\D/g,'')+'" target="_blank">💬</a>':'')+
        '<button class="btn-rej" onclick="rejectOrder(\''+o.id+'\')">✗</button>'+
      '</div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('input[data-oid]').forEach(function(cb){
    cb.onchange = function(){
      var oid = cb.dataset.oid;
      var idx = parseInt(cb.dataset.idx, 10);
      var o = state.pending.find(function(x){ return x.id === oid; });
      if(!o) return;
      var items = o.categories[state.cat].items;
      items[idx]._catStatus = cb.checked;
      var btn = cb.closest('.order-card').querySelector('.btn-ok');
      if(btn) btn.disabled = !items.every(function(i){ return i._catStatus !== false; });
    };
  });
}

async function confirmOrder(oid){
  if(!confirm('تأكيد توفر جميع منتجات هذا الطلب؟')) return;
  try {
    var o = state.pending.find(function(x){ return x.id === oid; });
    if(!o) throw new Error('الطلب غير موجود');
    var catObj = JSON.parse(JSON.stringify(o.categories[state.cat]));
    catObj.items = (catObj.items||[]).map(function(i){ return Object.assign({}, i, {_catStatus: i._catStatus !== false}); });
    catObj.status = 'confirmed';
    catObj.confirmedBy = state.user.uid;
    catObj.confirmedByName = state.userData.name || state.user.email;
    catObj.confirmedAt = firebase.firestore.FieldValue.serverTimestamp();
    var ref = db.collection('orders').doc(oid);
    var doc = await ref.get();
    if(!doc.exists) throw new Error('الطلب محذوف');
    var merged = Object.assign({}, doc.data().categories || {});
    merged[state.cat] = catObj;
    var updates = {};
    updates['categories.' + state.cat] = catObj;
    var allResolved = Object.keys(merged).every(function(k){ var s = merged[k] && merged[k].status; return s === 'confirmed' || s === 'rejected'; });
    var anyRejected = Object.keys(merged).some(function(k){ return merged[k] && merged[k].status === 'rejected'; });
    if(allResolved){
      updates.workflowStatus = anyRejected ? 'payment_rejected' : 'ready_to_send';
      updates.fulfillmentStage = anyRejected ? 'awaiting_customer_decision' : 'preparing';
    }
    await ref.update(updates);
    try {
      await db.collection('notifications').add({
        userId: o.customerId || o.userId || '',
        title: '✅ تم تأكيد توفر منتجاتك',
        body: 'طلبك #' + oid.slice(-6) + ' جاهز',
        type: 'order', event: 'cat_confirmed', icon: '✅', read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e){}
    toast('✅ تم التأكيد', 'ok');
  } catch(e){
    toast('❌ ' + e.message, 'err');
    console.error(e);
  }
}

async function rejectOrder(oid){
  var reason = prompt('سبب الرفض:');
  if(!reason || !reason.trim()) return;
  try {
    var o = state.pending.find(function(x){ return x.id === oid; });
    if(!o) throw new Error('الطلب غير موجود');
    var catObj = JSON.parse(JSON.stringify(o.categories[state.cat]));
    catObj.status = 'rejected';
    catObj.rejectReason = reason.trim();
    catObj.rejectedBy = state.user.uid;
    catObj.rejectedByName = state.userData.name || state.user.email;
    catObj.rejectedAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('orders').doc(oid).update({
      ['categories.' + state.cat]: catObj,
      workflowStatus: 'payment_rejected',
      fulfillmentStage: 'awaiting_customer_decision'
    });
    toast('❌ تم الرفض', 'warn');
  } catch(e){
    toast('❌ ' + e.message, 'err');
  }
}

// ═══ CONFIRMED ═══
function renderConfirmed(){
  var search = (document.getElementById('confirmed-search').value || '').toLowerCase().trim();
  var arr = state.confirmed;
  if(search){
    arr = arr.filter(function(o){
      return (o.name||o.customerName||'').toLowerCase().includes(search) || o.id.toLowerCase().includes(search);
    });
  }
  var el = document.getElementById('confirmed-list');
  if(!arr.length){ el.innerHTML = '<div class="empty"><span class="ic">📭</span>لا توجد طلبات مؤكدة</div>'; return; }
  el.innerHTML = arr.map(function(o){
    var c = (o.categories[state.cat]) || {};
    var items = c.items || [];
    var itemsHtml = items.map(function(it){
      return '<div class="order-item" style="background:transparent;padding:4px 8px"><div class="oi-info"><div class="oi-name">'+esc(it.name||'—')+'</div><div class="oi-qty">الكمية: '+(it.qty||1)+'</div></div><div class="oi-price">'+(Number(it.price)||0)+' ر</div></div>';

        '<div class="order-cust">'+esc(o.name||o.customerName||'عميل')+'</div>'+
        '<div class="order-meta">'+fmtDate(o.createdAt)+'</div>'+
      '</div><div class="order-amt">'+(Number(o.total)||0).toFixed(0)+' ر</div></div>'+
      '<div class="order-items">'+itemsHtml+'</div>'+
      '<div class="order-actions">'+
        '<button class="btn-wa-full" onclick="openWAModal([\''+o.id+'\'])">📱 واتساب المورد</button>'+
        '<button class="btn-pdf" onclick="downloadPDF(\''+o.id+'\')">📄</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ═══ PRODUCTS ═══
function renderProducts(){
  var search = (document.getElementById('products-search').value || '').toLowerCase().trim();
  var arr = state.products;
  if(search){
    arr = arr.filter(function(p){
      return (p.name||'').toLowerCase().includes(search) || (p.brand||'').toLowerCase().includes(search);
    });
  }
  var el = document.getElementById('products-grid');
  if(!arr.length){ el.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="ic">📦</span>لا منتجات</div>'; return; }
  el.innerHTML = arr.map(function(p){
    var img = p.img || (p.images && p.images[0]) || '';
    var stock = p.stock || 0;
    var isLive = p.status === 'live' || p.status === 'active' || (!p.status && p.active);
    var statusBadge = isLive ? '<div class="p-badge pb-live">✅</div>' : '<div class="p-badge pb-pending">⏳</div>';
    var stockColor = stock <= 0 ? 'rgba(239,68,68,0.9)' : stock < 5 ? 'rgba(245,158,11,0.9)' : 'rgba(16,185,129,0.9)';
    var imgHtml = img ? '<img class="p-img" src="'+esc(img)+'" onerror="this.parentElement.innerHTML=\'<div class=p-img-empty>📦</div>\'">' : '<div class="p-img-empty">📦</div>';
    var hasDisc = p.oldPrice && Number(p.oldPrice) > Number(p.price);
    var discPct = hasDisc ? Math.round((1 - Number(p.price)/Number(p.oldPrice)) * 100) : 0;
    return '<div class="p-card" onclick="openProductForm(\''+p.id+'\')">'+
      '<div class="p-img-wrap">'+imgHtml+statusBadge+'<div class="p-stock-badge" style="background:'+stockColor+'">'+stock+'</div></div>'+
      '<div class="p-body">'+
        (p.brand?'<div class="p-brand">'+esc(p.brand)+'</div>':'')+
        '<div class="p-name">'+esc(p.name||'—')+'</div>'+
        '<div class="p-prices"><span class="p-price">'+(Number(p.price)||0).toFixed(0)+' ر</span>'+
        (hasDisc?'<span class="p-old-price">'+(Number(p.oldPrice)).toFixed(0)+'</span><span class="p-discount">-'+discPct+'%</span>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ═══ PRODUCT FORM ═══
window.openProductForm = function(pid){
  state.editingProductId = pid || null;
  var p = pid ? state.products.find(function(x){ return x.id === pid; }) : null;
  document.getElementById('pf-title').textContent = p ? 'تعديل المنتج' : 'إضافة منتج';
  document.getElementById('pf-name').value = p ? (p.name||'') : '';
  document.getElementById('pf-brand').value = p ? (p.brand||'') : '';
  document.getElementById('pf-sku').value = p ? (p.sku||'') : '';
  document.getElementById('pf-desc').value = p ? (p.description||'') : '';
  document.getElementById('pf-price').value = p ? (p.price||'') : '';
  document.getElementById('pf-oldprice').value = p ? (p.oldPrice||'') : '';
  document.getElementById('pf-cost').value = p ? (p.cost||'') : '';
  document.getElementById('pf-stock').value = p ? (p.stock||'') : '';
  document.getElementById('pf-threshold').value = p ? (p.lowStockThreshold||5) : 5;
  state.formSizes = p && Array.isArray(p.sizes) ? p.sizes.slice() : [];
  state.formColors = p && Array.isArray(p.colors) ? p.colors.map(function(c){ return Object.assign({}, c); }) : [];
  state.formImages = p && Array.isArray(p.images) ? p.images.slice() : (p && p.img ? [p.img] : []);
  renderSizeChips();
  renderColors();
  renderImages();
  document.getElementById('product-form').classList.remove('hidden');
  document.getElementById('product-form').scrollTop = 0;
};

window.closeProductForm = function(){ document.getElementById('product-form').classList.add('hidden'); };

function renderSizeChips(){
  var el = document.getElementById('pf-sizes');
  el.innerHTML = ALL_SIZES.map(function(s){
    return '<button class="size-chip '+(state.formSizes.includes(s)?'selected':'')+'" onclick="toggleSize(\''+s+'\')">'+s+'</button>';
  }).join('');
}

window.toggleSize = function(s){
  var i = state.formSizes.indexOf(s);
  if(i > -1) state.formSizes.splice(i, 1);
  else state.formSizes.push(s);
  renderSizeChips();
};

function renderColors(){
  var el = document.getElementById('pf-colors');
  if(!state.formColors.length){
    el.innerHTML = '<div style="font-size:11px;color:var(--mu);text-align:center;padding:10px">لا ألوان بعد</div>';
    return;
  }
  el.innerHTML = state.formColors.map(function(c, i){
    return '<div class="color-item"><span class="color-dot" style="background:'+esc(c.hex||'#000')+'"></span><span>'+esc(c.name||'—')+'</span><button class="color-remove" onclick="removeColor('+i+')">✕</button></div>';
  }).join('');
}

window.addColor = function(){
  var name = document.getElementById('pf-new-color').value.trim();
  var hex = document.getElementById('pf-new-color-hex').value;
  if(!name){ toast('❌ أدخل اسم اللون', 'err'); return; }
  state.formColors.push({name:name, hex:hex});
  document.getElementById('pf-new-color').value = '';
  renderColors();
};

window.removeColor = function(i){ state.formColors.splice(i, 1); renderColors(); };

function renderImages(){
  var el = document.getElementById('pf-images');
  var imgs = state.formImages.map(function(url, i){
    return '<div class="image-item"><img src="'+esc(url)+'" onerror="this.style.display=\'none\'"><button class="image-remove" onclick="removeImage('+i+')">✕</button></div>';
  }).join('');
  el.innerHTML = imgs + '<button class="image-add" onclick="addImageUrl()">+</button>';
}

window.addImageUrl = function(){
  var url = prompt('أدخل رابط الصورة:');
  if(!url || !url.trim()) return;
  state.formImages.push(url.trim());
  renderImages();
};

window.removeImage = function(i){ state.formImages.splice(i, 1); renderImages(); };

window.saveProduct = async function(){
  var name = document.getElementById('pf-name').value.trim();
  var price = Number(document.getElementById('pf-price').value);
  if(!name || price <= 0){ toast('❌ أدخل الاسم والسعر', 'err'); return; }
  var data = {
    name: name,
    brand: document.getElementById('pf-brand').value.trim(),
    sku: document.getElementById('pf-sku').value.trim(),
    description: document.getElementById('pf-desc').value.trim(),
    price: price,
    oldPrice: Number(document.getElementById('pf-oldprice').value)||0,
    cost: Number(document.getElementById('pf-cost').value)||0,
    stock: Number(document.getElementById('pf-stock').value)||0,
    lowStockThreshold: Number(document.getElementById('pf-threshold').value)||5,
    category: state.cat,
    categories: [state.cat],
    sizes: state.formSizes,
    colors: state.formColors,
    images: state.formImages,
    img: state.formImages[0] || '',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if(state.editingProductId){
      await db.collection('products').doc(state.editingProductId).update(data);
      toast('✅ تم تحديث المنتج', 'ok');
    } else {
      data.status = 'pending_review';
      data.active = false;
      data.submittedBy = {uid: state.user.uid, name: state.userData.name || state.user.email, at: firebase.firestore.FieldValue.serverTimestamp()};
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('products').add(data);
      toast('✅ تم إرسال المنتج للمراجعة', 'ok');
    }
    closeProductForm();
    loadProducts();
  } catch(e){
    toast('❌ ' + e.message, 'err');
  }
};

// ═══ WHATSAPP ═══
async function getSupplierPhone(){
  try {
    var doc = await db.collection('config').doc('suppliers').get();
    if(doc.exists){
      var data = doc.data();
      if(data.list && Array.isArray(data.list)){
        var f = data.list.find(function(s){
          return s.category === state.cat || (Array.isArray(s.categories) && s.categories.includes(state.cat));
        });
        if(f && f.phone) return f.phone;
      }
      if(data[state.cat] && data[state.cat].phone) return data[state.cat].phone;
    }
  } catch(e){}
  return '';
}

function buildWAMessage(orders){
  var lines = ['🛍️ *طلبات جديدة من CHIZEN*','━━━━━━━━━━━━━━━━','','🏷️ *القسم:* '+catLabel(state.cat),'📅 *التاريخ:* '+new Date().toLocaleDateString('ar-YE'),'📦 *عدد الطلبات:* '+orders.length,''];
  orders.forEach(function(o, idx){
    var c = (o.categories[state.cat]) || {};
    var items = c.items || [];
    var total = items.reduce(function(s, i){ return s + (Number(i.price)||0) * (Number(i.qty)||1); }, 0);
    lines.push('━━━━━━━━━━━━━━━━');
    lines.push('📋 *طلب '+(idx+1)+'* — #'+o.id.slice(-6).toUpperCase());
    lines.push('👤 *العميل:* '+(o.name||o.customerName||'عميل'));
    if(o.phone||o.customerPhone) lines.push('📱 *هاتف:* '+(o.phone||o.customerPhone));
    lines.push('');
    lines.push('🛒 *المنتجات:*');
    items.forEach(function(it){ lines.push('  • '+(it.name||'—')+' × '+(it.qty||1)); });
    lines.push('💰 *الإجمالي:* '+total.toLocaleString('en')+' ر.ي');
    lines.push('');
  });
  lines.push('━━━━━━━━━━━━━━━━');
  lines.push('🚚 *تنبيه مهم:*');
  lines.push('سيزورك *المندوب* لاستلام هذه الطلبات.');
  lines.push('الرجاء *تجهيز الطلبات* في أقرب وقت.');
  lines.push('');
  lines.push('━━━━━━━━━━━━━━━━');
  lines.push('شكراً لتعاونك 🤝');
  lines.push('_CHIZEN — متجرك الموثوق_');
  return lines.join('\n');
}

var _waOrders = null, _waMessage = '';

window.openWAModal = async function(ids){
  var orders;
  if(ids && ids.length) orders = ids.map(function(i){ return state.confirmed.find(function(x){ return x.id === i; }); }).filter(Boolean);
  else orders = state.confirmed.slice();
  if(!orders.length){ toast('❌ لا طلبات', 'err'); return; }
  _waOrders = orders;
  _waMessage = buildWAMessage(orders);
  document.getElementById('wa-preview').textContent = _waMessage;
  var phone = await getSupplierPhone();
  document.getElementById('wa-phone').value = phone || '';
  document.getElementById('wa-modal').classList.remove('hidden');
};

window.doSendWA = async function(){
  var phone = document.getElementById('wa-phone').value.replace(/\D/g,'');
  if(!phone){ toast('❌ أدخل رقم المورد', 'err'); return; }
  var url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(_waMessage);
  try {
    await db.collection('activity_log').add({
      type: 'supplier_notified', category: state.cat, supplierPhone: phone,
      orderIds: _waOrders.map(function(o){ return o.id; }), orderCount: _waOrders.length,
      by: state.user.uid, byName: state.userData.name || state.user.email,
      at: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e){}
  window.open(url, '_blank');
  closeModal('wa-modal');
  toast('📱 واتساب جاهز', 'ok');
};

window.closeModal = function(id){ document.getElementById(id).classList.add('hidden'); };

window.openOrderModal = function(oid, type){
  var arr = type === 'pending' ? state.pending : state.confirmed;
  var o = arr.find(function(x){ return x.id === oid; });

  var items = (o.categories[state.cat] || {}).items || [];

    '<div class="info-row"><span class="l">📍 العنوان</span><span class="v">'+esc(o.deliveryAddress||o.address||o.pickup||'—')+'</span></div>'+
    '<div class="info-row"><span class="l">💰 الإجمالي</span><span class="v" style="color:var(--wr)">'+(Number(o.total)||0).toFixed(0)+' ر</span></div>'+
    '<div style="margin-top:14px;color:var(--p);font-weight:900;font-size:13px;margin-bottom:8px">🛒 المنتجات ('+items.length+')</div>';
