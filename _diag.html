<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN Diag</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;padding:14px;max-width:760px;margin:0 auto;line-height:1.5}
h1{color:#FF8A00;font-size:17px;margin:0 0 8px}
button{background:#10b981;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:800;font-size:14px;font-family:inherit;margin:4px 4px 4px 0;cursor:pointer}
button:disabled{background:#374151}
.card{background:#111827;border:2px solid #1f2937;border-radius:10px;padding:10px;margin:6px 0;font-size:13px}
.card.ok{border-color:#10b981}
.card.err{border-color:#ef4444}
.hd{font-weight:800;display:flex;justify-content:space-between}
.n{color:#8b5cf6;font-weight:900}
.d{font-size:11px;opacity:.8;margin-top:4px;font-family:monospace;word-break:break-all}
.s{background:#0f172a;padding:5px;border-radius:6px;margin:3px 0;font-size:10px;font-family:monospace;word-break:break-all}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff;margin:4px 0;font-family:inherit;box-sizing:border-box}
#status{padding:8px;background:#1f2937;border-radius:8px;margin:8px 0;font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>🔍 CHIZEN — تشخيص Firestore</h1>
<div id="status">جارٍ التهيئة...</div>
<div id="login" class="hidden">
<input id="em" type="email" placeholder="hazimchat@gmail.com" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="lbtn">🔐 تسجيل الدخول</button>
</div>
<div id="act" class="hidden">
<button id="rbtn">▶ تشغيل التشخيص</button>
</div>
<div id="out"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var st=document.getElementById('status'),out=document.getElementById('out'),lg=document.getElementById('login'),ac=document.getElementById('act');
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
var db=firebase.firestore(),auth=firebase.auth();
var COLS=['orders','payments','commissions','notifications','activity_log','suppliers','sups','listings','push_queue','admins','users','bookings','chats'];
function log(m){st.textContent=m}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function card(name,ok,count,detail,samples){
var h='<div class="card '+(ok?'ok':'err')+'"><div class="hd"><span>'+(ok?'✅':'❌')+' '+esc(name)+'</span><span class="n">'+count+'</span></div>';
if(detail)h+='<div class="d">'+esc(detail)+'</div>';
if(samples&&samples.length){samples.forEach(function(s){h+='<div class="s">'+esc(s)+'</div>'})}
return h+'</div>';
}
async function run(){
document.getElementById('rbtn').disabled=true;
var html='';
for(var i=0;i<COLS.length;i++){
var c=COLS[i];
try{
var snap=await db.collection(c).limit(3).get();
var samples=[];
snap.forEach(function(d){var x=d.data();var p={id:d.id.slice(0,8),stage:x.fulfillmentStage,ws:x.workflowStatus,st:x.status,pay:x.payment?x.payment.status:(x.paymentStatus||null),role:x.role,email:x.email};samples.push(JSON.stringify(p))});
html+=card(c,true,snap.size,'',samples);
}catch(e){html+=card(c,false,0,e.code+' — '+e.message.slice(0,140))}
log('فحص '+(i+1)+'/'+COLS.length+'...');
await new Promise(function(r){setTimeout(r,120)});
}
out.innerHTML=html;
log('✅ انتهى — راجع النتائج أدناه ثم أرسل صورة');
document.getElementById('rbtn').disabled=false;
}
auth.onAuthStateChanged(function(u){
if(u){
log('✅ مسجل: '+u.email);
lg.classList.add('hidden');
ac.classList.remove('hidden');
db.collection('admins').doc(u.uid).get().then(function(d){
if(d.exists){log('✅ مسجل: '+u.email+' | role: '+(d.data().role||'—'))}
else{log('⚠️ مسجل: '+u.email+' | غير موجود في admins')}
}).catch(function(e){log('⚠️ مسجل: '+u.email+' | تعذر قراءة admins: '+e.code)});
}else{
log('⚠️ غير مسجل دخول');
lg.classList.remove('hidden');
ac.classList.add('hidden');
}
});
document.getElementById('lbtn').onclick=async function(){
var em=document.getElementById('em').value.trim();
var pw=document.getElementById('pw').value;
if(!em||!pw){log('❌ املأ البريد وكلمة المرور');return}
log('جارٍ الدخول...');
try{await auth.signInWithEmailAndPassword(em,pw)}
catch(e){log('❌ فشل: '+e.code+' — '+e.message.slice(0,80))}
};
document.getElementById('rbtn').onclick=run;
})();
</script>
</body>
</html>
