<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص السندات</title>
<style>
body{font-family:system-ui;background:#0a0825;color:#fff;padding:20px;max-width:600px;margin:0 auto}
button{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:15px;cursor:pointer;margin:10px 0;font-family:inherit}
#log{background:#000;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:70vh;overflow:auto;margin-top:10px}
</style></head>
<body><h1>🔍 فحص السندات (receipts)</h1>
<button onclick="check()">▶ فحص الآن</button>
<pre id="log">[السجل]</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
var auth = firebase.auth(), db = firebase.firestore();
function log(m){var l=document.getElementById('log');l.textContent+='\n'+m;l.scrollTop=l.scrollHeight;}
async function check(){
  log('═══════════════════');
  log('▶ فحص في ' + new Date().toLocaleTimeString('ar'));
  
  if(!auth.currentUser){
    log('⚠️ سجّل دخول أولاً — افتح admin-login.html');
    return;
  }
  log('👤 ' + auth.currentUser.email);
  
  // 1. فحص receipts
  log('');
  log('📄 collection: receipts');
  try {
    var snap = await db.collection('receipts').get();
    log('  عدد السندات: ' + snap.size);
    if(snap.size === 0){
      log('  ⚠️ لا توجد سندات — لم يضغط أي مندوب "📤 للمحاسب" بعد');
    } else {
      snap.forEach(function(d){
        var x = d.data();
        log('  ─────');
        log('  ID: ' + d.id.slice(-8));
        log('  Order: #' + (x.orderNumber || ''));
        log('  Mgr: ' + (x.deliveryMgrName || '—'));
        log('  Status: ' + (x.status || '—'));
        log('  Total: ' + (x.total || 0) + ' ر');
      });
    }
  } catch(e){ log('  ⚠️ ' + e.code + ' — ' + e.message); }
  
  // 2. فحص الطلبات في on_the_way أو delivered (قابلة لإرسال سند)
  log('');
  log('📦 طلبات جاهزة لإرسال سند (delivered):');
  try {
    var osnap = await db.collection('orders').where('fulfillmentStage', '==', 'delivered').get();
    log('  عدد: ' + osnap.size);
    osnap.forEach(function(d){
      var x = d.data();
      log('  • #' + d.id.slice(-6).toUpperCase() + ' — ' + (x.name || 'عميل') + ' — ' + (x.total || 0) + ' ر');
    });
  } catch(e){ log('  ⚠️ ' + e.message); }
  
  // 3. فحص on_the_way
  log('');
  log('🚚 طلبات في الطريق (on_the_way):');
  try {
    var onsnap = await db.collection('orders').where('fulfillmentStage', '==', 'on_the_way').get();
    log('  عدد: ' + onsnap.size);
  } catch(e){ log('  ⚠️ ' + e.message); }
  
  log('');
  log('═══════════════════');
  log('✅ اكتمل الفحص');
}
</script></body></html>
