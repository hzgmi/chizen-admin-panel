<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — دخول مدير القسم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0b1220 0%,#1e1b4b 50%,#0b1220 100%);color:#e5e7eb;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(168,85,247,0.08) 0%,transparent 60%);animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(168,85,247,0.25);border-radius:24px;padding:40px 30px;max-width:420px;width:100%;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.6);position:relative;z-index:1}
.logo{text-align:center;margin-bottom:8px;font-size:44px;filter:drop-shadow(0 0 20px rgba(168,85,247,0.4))}
.brand{text-align:center;font-size:32px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{text-align:center;color:#9ca3af;font-size:13px;margin-bottom:32px;letter-spacing:1px}
.subtitle b{color:#c4b5fd}
.input-group{margin-bottom:14px}
.input-group label{display:block;color:#9ca3af;font-size:11px;font-weight:800;margin-bottom:6px}
.input-group input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #374151;background:#0f172a;color:#fff;font-size:15px;font-family:inherit;transition:all 0.2s}
.input-group input:focus{outline:none;border-color:#a855f7;box-shadow:0 0 0 4px rgba(168,85,247,0.15)}
.btn{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit;margin-top:8px;box-shadow:0 8px 24px rgba(168,85,247,0.35);transition:transform 0.15s;letter-spacing:0.5px}
.btn:active{transform:scale(0.97)}.btn:disabled{opacity:0.5;cursor:not-allowed}
#err{text-align:center;color:#f87171;font-size:13px;margin-top:14px;min-height:20px;font-weight:700}
.foot{text-align:center;margin-top:24px;color:#6b7280;font-size:11px;padding-top:20px;border-top:1px solid rgba(168,85,247,0.1)}
.foot a{color:#c4b5fd;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📦</div>
  <div class="brand">CHIZEN</div>
  <div class="subtitle">بوابة <b>مدير القسم</b></div>
  <div class="input-group"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="cat@chizen.com" autocomplete="username"></div>
  <div class="input-group"><label>كلمة المرور</label><input id="password" type="password" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn" id="login-btn">🔐 دخول آمن</button>
  <div id="err"></div>
  <div class="foot">هذه البوابة مخصصة لمدراء الأقسام فقط<br><a href="index.html">🔙 العودة للرئيسية</a></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
var auth=firebase.auth(),db=firebase.firestore();
var btn=document.getElementById('login-btn'),errEl=document.getElementById('err');
btn.onclick=async function(){
var em=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;
if(!em||!pw){errEl.textContent='❌ أدخل البريد وكلمة المرور';return}
btn.disabled=true;btn.textContent='جارٍ التحقق...';errEl.textContent='';
try{
var cred=await auth.signInWithEmailAndPassword(em,pw);
var u=cred.user;
var udoc=await db.collection('users').doc(u.uid).get();
var role=udoc.exists?(udoc.data().role||''):'';
var adoc=await db.collection('admins').doc(u.uid).get();
if(adoc.exists && adoc.data().role==='cat_manager') role='cat_manager';
if(role!=='cat_manager'){
await auth.signOut();
errEl.textContent='⛔ هذا الحساب ليس مدير قسم (دورك: '+role+')';
btn.disabled=false;btn.textContent='🔐 دخول آمن';return;
}
btn.textContent='✅ مرحباً — جاري التحويل...';
setTimeout(function(){location.href='cat-manager.html';},500);
}catch(e){errEl.textContent='❌ '+(e.code||e.message);btn.disabled=false;btn.textContent='🔐 دخول آمن';}
};
document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();});
auth.onAuthStateChanged(async function(u){
if(!u)return;
try{
var udoc=await db.collection('users').doc(u.uid).get();
if(udoc.exists && udoc.data().role==='cat_manager') location.href='cat-manager.html';
}catch(e){}
});
})();
</script>
</body>
</html>
