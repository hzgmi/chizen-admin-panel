<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — دخول مدير القسم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0a0825 0%,#1e1b4b 50%,#0a0825 100%);color:#e5e7eb;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(168,85,247,0.25);border-radius:24px;padding:40px 30px;max-width:420px;width:100%;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.logo{text-align:center;margin-bottom:8px;font-size:44px}
.brand{text-align:center;font-size:32px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{text-align:center;color:#9ca3af;font-size:13px;margin-bottom:32px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #374151;background:#0f172a;color:#fff;font-size:15px;margin-bottom:14px;font-family:inherit}
input:focus{outline:none;border-color:#a855f7;box-shadow:0 0 0 4px rgba(168,85,247,0.15)}
button{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 24px rgba(168,85,247,0.35)}
button:disabled{opacity:0.5}
#err{color:#ef4444;font-size:13px;text-align:center;margin-top:14px;min-height:20px;font-weight:700}
</style>
</head>
<body>
<form class="card" id="login-form" onsubmit="event.preventDefault(); window.doLogin();">
  <div class="logo">📦</div>
  <div class="brand">CHIZEN</div>
  <div class="subtitle">لوحة إدارة القسم</div>
  <input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="username">
  <input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
  <button type="submit" id="login-btn">🔐 دخول</button>
  <div id="err"></div>
</form>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();

window.doLogin = async function(){
  var em = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  var errEl = document.getElementById('err');
  var btn = document.getElementById('login-btn');
  if(!em || !pw) { errEl.textContent = '❌ أدخل البريد وكلمة المرور'; return; }
  btn.disabled = true;
  btn.textContent = '⏳ جارٍ التحقق...';
  errEl.textContent = '';
  try {
    var cred = await auth.signInWithEmailAndPassword(em, pw);
    var u = cred.user;
    var udoc = await db.collection('users').doc(u.uid).get();
    var role = udoc.exists ? (udoc.data().role || 'customer') : 'customer';
    var adoc = await db.collection('admins').doc(u.uid).get();
    if(adoc.exists && adoc.data().role === 'cat_manager') role = 'cat_manager';
    if(role !== 'cat_manager'){
      await auth.signOut();
      errEl.textContent = '⛔ هذا الحساب ليس مدير قسم (دورك: ' + role + ')';
      btn.disabled = false;
      btn.textContent = '🔐 دخول';
      return;
    }
    btn.textContent = '✅ مرحباً — جاري التحويل...';
    setTimeout(function(){ location.href = 'cat-manager.html'; }, 500);
  } catch(e) {
    errEl.textContent = '❌ ' + (e.code || e.message);
    btn.disabled = false;
    btn.textContent = '🔐 دخول';
  }
};

auth.onAuthStateChanged(async function(u){
  if(!u) return;
  try {
    var udoc = await db.collection('users').doc(u.uid).get();
    if(udoc.exists && udoc.data().role === 'cat_manager'){
      location.href = 'cat-manager.html';
    }
  } catch(e){}
});
</script>
</body>
</html>
