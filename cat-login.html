<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — دخول</title>
<style>
body{font-family:system-ui;background:#0a0825;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.box{background:rgba(255,255,255,0.05);border:1px solid rgba(168,85,247,0.3);padding:30px;border-radius:20px;width:100%;max-width:400px;text-align:center}
h1{color:#a855f7;margin-bottom:5px;font-size:24px}
p{color:#9ca3af;font-size:13px;margin-bottom:20px}
input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;box-sizing:border-box;font-family:inherit;font-size:15px}
input:focus{outline:none;border-color:#a855f7}
button{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit}
button:disabled{opacity:0.6;cursor:not-allowed}
#err{color:#ef4444;font-size:13px;margin-top:12px;min-height:20px;line-height:1.4}
#status{color:#6ee7b7;font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <h1>📦 CHIZEN</h1>
  <p>بوابة مدير القسم</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" value="mna783130578@gmail.com">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="btn" onclick="doLogin()">🔐 دخول</button>
  <div id="err"></div>
  <div id="status"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
var auth = firebase.auth();

// فحص أولي: إذا كان المستخدم مسجل بالفعل، حوّل مباشرة
auth.onAuthStateChanged(function(u){
  if(u && !window.__loggingIn){
    document.getElementById('status').textContent = '✅ أنت مسجل: ' + u.email + ' — جاري التحويل...';
    setTimeout(function(){ location.href = 'cat-manager.html'; }, 500);
  }
});

window.doLogin = async function(){
  window.__loggingIn = true;
  var em = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  var err = document.getElementById('err');
  var status = document.getElementById('status');
  var btn = document.getElementById('btn');
  
  err.textContent = '';
  status.textContent = '';
  
  if(!em || !pw){ err.textContent = '❌ املأ الحقول'; window.__loggingIn = false; return; }
  
  btn.disabled = true;
  btn.textContent = '⏳ جاري التحقق...';
  status.textContent = '📡 إرسال الطلب...';
  
  // timeout احتياطي (15 ثانية)
  var timeout = setTimeout(function(){
    if(btn.disabled){
      err.textContent = '⏱️ انتهت المهلة — تحقق من الإنترنت';
      btn.disabled = false;
      btn.textContent = '🔐 دخول';
      window.__loggingIn = false;
    }
  }, 15000);
  
  try {
    status.textContent = '🔐 التحقق من البيانات...';
    var cred = await auth.signInWithEmailAndPassword(em, pw);
    clearTimeout(timeout);
    
    status.textContent = '✅ تم الدخول: ' + cred.user.email + ' — جاري التحويل...';
    btn.textContent = '✅ جاري التحويل...';
    
    // تحويل فوري — بدون أي فحص إضافي
    setTimeout(function(){
      location.href = 'cat-manager.html';
    }, 300);
    
  } catch(e) {
    clearTimeout(timeout);
    err.textContent = '❌ ' + (e.code || e.message);
    status.textContent = '';
    btn.disabled = false;
    btn.textContent = '🔐 دخول';
    window.__loggingIn = false;
    console.error('[LOGIN ERROR]', e.code, e.message);
  }
};

// enter key
document.getElementById('password').addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
