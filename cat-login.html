<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN — دخول</title>
<style>
body{font-family:system-ui;background:#0a0825;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.box{background:rgba(255,255,255,0.05);border:1px solid rgba(168,85,247,0.3);padding:30px;border-radius:20px;width:100%;max-width:400px;text-align:center}
h1{color:#a855f7;margin-bottom:5px;font-size:24px}
p{color:#9ca3af;font-size:13px;margin-bottom:20px}
input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;box-sizing:border-box;font-family:inherit;font-size:15px}
button{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit}
#err{color:#ef4444;font-size:13px;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="box">
  <h1>📦 CHIZEN</h1>
  <p>بوابة مدير القسم</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" value="mna783130578@gmail.com">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="btn" onclick="window.doLogin()">🔐 دخول</button>
  <div id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
window.doLogin = function() {
  var em = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  if(!em || !pw) { err.textContent = '❌ املأ الحقول'; return; }
  btn.disabled = true; btn.textContent = '⏳ جاري التحقق...'; err.textContent = '';
  firebase.auth().signInWithEmailAndPassword(em, pw).then(function(cred) {
    firebase.firestore().collection('users').doc(cred.user.uid).get().then(function(doc) {
      var role = doc.exists ? doc.data().role : 'customer';
      if(role === 'cat_manager') {
        window.location.href = 'cat-manager.html';
      } else {
        err.textContent = '⛔ لست مدير قسم (دورك: ' + role + ')';
        firebase.auth().signOut();
        btn.disabled = false; btn.textContent = '🔐 دخول';
      }
    });
  }).catch(function(e) {
    err.textContent = '❌ ' + e.message;
    btn.disabled = false; btn.textContent = '🔐 دخول';
  });
};
firebase.auth().onAuthStateChanged(function(u) {
  if(u) window.location.href = 'cat-manager.html';
});
</script>
</body>
</html>
