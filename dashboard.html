<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>CHIZEN — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0825;color:#fff;font-family:'Tajawal',system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,0.18) 0%,transparent 60%),#0a0825;min-height:100vh;padding-bottom:30px}

.vh{position:sticky;top:0;z-index:100;background:rgba(10,8,37,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(155,77,255,0.2);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.vh-logo{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vh-sub{font-size:9px;color:#a78bfa;letter-spacing:3px;margin-top:-2px;font-weight:700}
.vh-actions{display:flex;gap:8px}
.vh-btn{background:rgba(155,77,255,0.15);border:1px solid rgba(155,77,255,0.3);color:#a78bfa;width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-family:inherit;padding:0}
.vh-btn:hover{background:rgba(155,77,255,0.25)}

.vtabs{position:sticky;top:70px;z-index:99;background:rgba(10,8,37,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(155,77,255,0.15);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtab{flex-shrink:0;background:rgba(155,77,255,0.08);border:1px solid rgba(155,77,255,0.2);color:#a78bfa;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;white-space:nowrap;transition:all 0.2s;position:relative}
.vtab.active{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(168,85,247,0.4)}
.vtab-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.vc{padding:20px 16px;max-width:1200px;margin:0 auto}

.vwelcome{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);border-radius:22px;padding:24px 22px;margin-bottom:22px;box-shadow:0 15px 40px rgba(168,85,247,0.35);position:relative;overflow:hidden}
.vwelcome::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:rgba(255,255,255,0.1);border-radius:50%;filter:blur(40px)}
.vw-greet{font-size:13px;opacity:0.9;margin-bottom:4px;font-weight:600}
.vw-name{font-size:22px;font-weight:900;margin-bottom:6px}
.vw-sub{font-size:12px;opacity:0.85}

.vst{font-size:15px;font-weight:900;color:#fff;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.vst::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,#7c3aed,#ec4899);border-radius:2px}

.vkg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:768px){.vkg{grid-template-columns:repeat(4,1fr)}}
.vk{background:linear-gradient(135deg,#1a1230 0%,#121028 100%);border:1px solid rgba(155,77,255,0.25);border-radius:18px;padding:18px 14px;position:relative;overflow:hidden;transition:transform 0.2s}
.vk:hover{transform:translateY(-3px)}
.vk::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1,#7c3aed),var(--c2,#ec4899))}
.vk.sales{--c1:#ec4899;--c2:#f43f5e}
.vk.orders{--c1:#7c3aed;--c2:#a855f7}
.vk.products{--c1:#a855f7;--c2:#d946ef}
.vk.users{--c1:#06b6d4;--c2:#3b82f6}
.vk-icon{font-size:28px;margin-bottom:10px;line-height:1}
.vk-num{font-size:24px;font-weight:900;color:#fff;line-height:1;margin-bottom:6px}
.vk-lbl{font-size:11px;color:#a78bfa;font-weight:700}
.vk-trend{font-size:10px;color:#22c55e;margin-top:6px;font-weight:700}

.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{background:linear-gradient(135deg,#1a1230 0%,#121028 100%);border:1px solid rgba(155,77,255,0.2);border-radius:14px;padding:14px 16px;transition:all 0.2s;cursor:pointer}
.vcard:hover{border-color:rgba(155,77,255,0.4)}
.vrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.vid{font-size:13px;font-weight:900;color:#a78bfa;min-width:80px}
.vtitle{flex:1;min-width:0;font-size:13px;color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtotal{font-size:14px;font-weight:900;color:#ec4899}
.vmeta{font-size:11px;color:#a78bfa;opacity:0.8;display:flex;gap:12px;flex-wrap:wrap}
.vbadge{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700;white-space:nowrap}
.vbadge.pending{background:rgba(251,191,36,0.2);color:#fbbf24}
.vbadge.done{background:rgba(34,197,94,0.2);color:#4ade80}
.vbadge.rejected{background:rgba(239,68,68,0.2);color:#f87171}
.vbadge.shipped{background:rgba(59,130,246,0.2);color:#60a5fa}

.vchips{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.vchips::-webkit-scrollbar{display:none}
.vchip{background:rgba(155,77,255,0.08);border:1px solid rgba(155,77,255,0.2);color:#a78bfa;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.vchip.active{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-color:transparent}

.vteam-group{margin-bottom:20px}
.vteam-title{font-size:13px;font-weight:800;color:#a78bfa;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.vteam-member{background:rgba(155,77,255,0.05);border:1px solid rgba(155,77,255,0.15);border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.vteam-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.vteam-info{flex:1;min-width:0}
.vteam-name{font-size:13px;font-weight:800;color:#fff;margin-bottom:2px}
.vteam-email{font-size:11px;color:#a78bfa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vteam-cat{font-size:10px;background:rgba(168,85,247,0.2);color:#c4b5fd;padding:2px 8px;border-radius:8px;font-weight:700}

.vreview{background:linear-gradient(135deg,#1a1230,#121028);border:1px solid rgba(155,77,255,0.25);border-radius:16px;padding:16px;margin-bottom:14px}
.vreview-head{display:flex;gap:12px;margin-bottom:12px}
.vreview-img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#333;flex-shrink:0}
.vreview-meta{flex:1;min-width:0}
.vreview-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:4px}
.vreview-sub{font-size:11px;color:#a78bfa}
.vreview-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.vreview-stat{background:rgba(10,8,37,0.7);border-radius:10px;padding:8px;text-align:center}
.vreview-stat-lbl{font-size:10px;color:#a78bfa;margin-bottom:2px}
.vreview-stat-val{font-size:13px;font-weight:800;color:#fff}
.vreview-reason{width:100%;padding:10px;background:rgba(10,8,37,0.7);border:1px solid rgba(155,77,255,0.3);border-radius:10px;color:#fff;font-family:inherit;font-size:12px;margin-bottom:10px;box-sizing:border-box}
.vreview-actions{display:flex;gap:8px}
.vreview-btn{flex:1;padding:12px;border:none;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;color:#fff}
.vreview-btn.approve{background:linear-gradient(135deg,#22c55e,#16a34a)}
.vreview-btn.reject{background:linear-gradient(135deg,#ef4444,#dc2626)}

.vmore-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:768px){.vmore-grid{grid-template-columns:repeat(3,1fr)}}
.vmore-btn{background:linear-gradient(135deg,#1a1230,#121028);border:1px solid rgba(155,77,255,0.25);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;color:#fff;font-family:inherit;transition:all 0.2s}
.vmore-btn:hover{border-color:rgba(155,77,255,0.5);transform:translateY(-2px)}
.vmore-icon{font-size:32px;margin-bottom:8px;display:block}
.vmore-lbl{font-size:13px;font-weight:800}

.vempty{text-align:center;padding:50px 20px;color:#a78bfa}
.vempty-icon{font-size:48px;margin-bottom:12px}
.vempty-txt{font-size:14px;font-weight:700}

.vloading{position:fixed;inset:0;background:#0a0825;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px}
.vspin{width:50px;height:50px;border:3px solid rgba(155,77,255,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vload-txt{color:#a78bfa;font-size:13px;font-weight:700}

.verror{position:fixed;inset:0;background:#0a0825;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.verror-box{background:rgba(20,15,45,0.8);border:1px solid rgba(239,68,68,0.4);border-radius:20px;padding:30px 24px;max-width:400px;text-align:center}
.verror-icon{font-size:64px;margin-bottom:16px}
.verror-title{font-size:20px;font-weight:900;color:#fff;margin-bottom:12px}
.verror-msg{font-size:13px;color:#a78bfa;margin-bottom:20px;line-height:1.6}
.verror-btn{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;padding:14px 28px;border-radius:12px;text-decoration:none;font-weight:900;display:inline-block;font-size:14px;border:none;cursor:pointer;font-family:inherit}

.vtoast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-150%);background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.4);transition:transform 0.4s,opacity 0.3s;opacity:0}
.vtoast.show{transform:translateX(-50%) translateY(0);opacity:1}
.vtoast.success{background:linear-gradient(135deg,#22c55e,#16a34a)}
.vtoast.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
</style>
</head>
<body>

<div class="vloading" id="loading"><div class="vspin"></div><div class="vload-txt">جاري التحميل...</div></div>
<div class="verror" id="error" style="display:none"><div class="verror-box"><div class="verror-icon" id="errIcon">⚠️</div><div class="verror-title" id="errTitle">خطأ</div><div class="verror-msg" id="errMsg"></div><a href="index.html" class="verror-btn" id="errBtn">العودة</a></div></div>

<div id="main" style="display:none">
  <div class="vh">
    <div>
      <div class="vh-logo">CHIZEN</div>
      <div class="vh-sub">ADMIN DASHBOARD</div>
    </div>
    <div class="vh-actions">
      <button class="vh-btn" onclick="reloadData()" title="تحديث">🔄</button>
      <button class="vh-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>
  
  <div class="vtabs" id="tabs">
    <button class="vtab active" data-tab="home">🏠 الرئيسية</button>
    <button class="vtab" data-tab="payments">💳 الدفع<span class="vtab-badge" id="paymentsBadge" style="display:none">0</span></button>
    <button class="vtab" data-tab="orders">📦 الطلبات</button>
    <button class="vtab" data-tab="team">👥 الفريق</button>
    <button class="vtab" data-tab="review">📋 المراجعة<span class="vtab-badge" id="reviewBadge" style="display:none">0</span></button>
    <button class="vtab" data-tab="accountant">💼 المحاسب</button>
    <button class="vtab" data-tab="more">➕ المزيد</button>
  </div>
  
  <div class="vc" id="content"></div>
</div>

<div class="vtoast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var auth, db;
try {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
} catch(e){ console.error('init', e); }

var state = {
  user: null,
  orders: [],
  products: [],
  users: [],
  notifications: [],
  activeTab: 'home',
  ordersFilter: 'all'
};

function toast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'vtoast ' + (type || '');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function showError(title, msg, btn){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errTitle').textContent = title;
  document.getElementById('errMsg').innerHTML = msg;
  if (btn) document.getElementById('errBtn').textContent = btn;
}

function showMain(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}

function logout(){
  if (confirm('تسجيل الخروج؟')) {
    auth.signOut().then(function(){ location.href = 'index.html'; });
  }
}

auth.onAuthStateChanged(async function(user){
  if (!user) {
    showError('غير مسجل الدخول', 'يجب تسجيل الدخول أولاً للوصول إلى لوحة التحكم', '🚪 تسجيل الدخول');
    return;
  }
  
  try {
    var isSuper = false;
    var legacyDoc = await db.collection('admins').doc(user.uid).get();
    if (legacyDoc.exists) isSuper = true;
    else {
      var udoc = await db.collection('users').doc(user.uid).get();
      if (udoc.exists && udoc.data().role === 'super_admin') isSuper = true;
    }
    
    if (!isSuper) {
      showError('غير مصرح', 'هذه اللوحة مخصصة للإدارة العامة فقط. عد للصفحة الرئيسية.', '🏠 العودة');
      return;
    }
    
    state.user = user;
    await loadAll();
    showMain();
    renderTab('home');
    updateReviewBadge();
    updatePaymentsBadge();
  } catch(e){
    showError('خطأ', e.message || 'فشل تحميل البيانات', '🔄 إعادة المحاولة');
  }
});

async function loadAll(){
  var results = await Promise.all([
    db.collection('orders').orderBy('createdAt', 'desc').get().catch(function(){ return {docs: []}; }),
    db.collection('products').get(),
    db.collection('users').get(),
    db.collection('notifications').orderBy('createdAt', 'desc').limit(30).get().catch(function(){ return {docs: []}; })
  ]);
  
  state.orders = results[0].docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
  state.products = results[1].docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
  state.users = results[2].docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
  state.notifications = results[3].docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
}

async function reloadData(){
  try {
    await loadAll();
    renderTab(state.activeTab);
    updateReviewBadge();
    updatePaymentsBadge();
    toast('✅ تم التحديث', 'success');
  } catch(e){ toast('❌ فشل', 'error'); }
}

function updateReviewBadge(){
  var pending = state.products.filter(function(p){ return p.status === 'pending_review'; });
  var badge = document.getElementById('reviewBadge');
  if (pending.length > 0) {
    badge.textContent = pending.length;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

document.querySelectorAll('.vtab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.vtab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    renderTab(t.dataset.tab);
  };
});

function renderTab(tab){
  state.activeTab = tab;
  var c = document.getElementById('content');
  if (tab === 'home') c.innerHTML = renderHome();
  else if (tab === 'payments'){ c.innerHTML = renderPayments(); bindPaymentActions(); }
  else if (tab === 'orders'){ c.innerHTML = renderOrders(); bindOrderChips(); }
  else if (tab === 'team') c.innerHTML = renderTeam();
  else if (tab === 'review'){ c.innerHTML = renderReview(); bindReviewActions(); }
  else if (tab === 'accountant') c.innerHTML = renderAccountant();
  else if (tab === 'more') c.innerHTML = renderMore();
}

function normName(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'object') return v.name || v.ar || v.title || '';
  return String(v);
}

function fmtDate(ts){
  try {
    var d = ts && ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('ar-YE', {month:'short', day:'numeric'});
  } catch(e){ return '—'; }
}

function renderHome(){
  var user = state.user;
  var hour = new Date().getHours();
  var greet = hour < 12 ? 'صباح الخير' : (hour < 18 ? 'مساء النور' : 'مساء الخير');
  var emoji = hour < 12 ? '☀️' : (hour < 18 ? '🌤️' : '🌙');
  
  var totalSales = 0, completed = 0, pending = 0;
  state.orders.forEach(function(o){
    if (o.status === 'completed'){ totalSales += Number(o.total) || 0; completed++; }
    else if (o.status === 'pending') pending++;
  });
  
  var recentOrders = state.orders.slice(0, 5);
  var recentHtml = recentOrders.map(function(o){
    var cls = o.status === 'completed' ? 'done' : (o.status === 'cancelled' ? 'rejected' : (o.status === 'shipped' ? 'shipped' : 'pending'));
    var lbl = o.status === 'completed' ? 'مكتمل' : (o.status === 'cancelled' ? 'ملغى' : (o.status === 'shipped' ? 'مشحون' : 'معلق'));
    return '<div class="vcard" onclick="showOrderDetail(\'' + o.id + '\')">'
      + '<div class="vrow">'
      +   '<div class="vid">#' + o.id.slice(-6) + '</div>'
      +   '<div class="vtitle">' + (o.customerName || o.customer || 'عميل') + '</div>'
      +   '<div class="vtotal">' + (Number(o.total)||0).toFixed(0) + ' ر</div>'
      + '</div>'
      + '<div class="vmeta">'
      +   '<span>' + fmtDate(o.createdAt) + '</span>'
      +   '<span class="vbadge ' + cls + '">' + lbl + '</span>'
      + '</div>'
      + '</div>';
  }).join('');
  
  return ''
    + '<div class="vwelcome">'
    +   '<div class="vw-greet">' + emoji + ' ' + greet + '</div>'
    +   '<div class="vw-name">' + (user.displayName || (user.email||'').split('@')[0]) + '</div>'
    +   '<div class="vw-sub">لوحة الإدارة العامة — نظرة سريعة على اليوم</div>'
    + '</div>'
    + '<div class="vst">📊 الإحصائيات</div>'
    + '<div class="vkg">'
    +   '<div class="vk sales"><div class="vk-icon">💰</div><div class="vk-num">' + Math.round(totalSales).toLocaleString('ar-EG') + '</div><div class="vk-lbl">إجمالي المبيعات</div><div class="vk-trend">' + completed + ' مكتمل</div></div>'
    +   '<div class="vk orders"><div class="vk-icon">📦</div><div class="vk-num">' + state.orders.length + '</div><div class="vk-lbl">الطلبات</div><div class="vk-trend">' + pending + ' معلق</div></div>'
    +   '<div class="vk products"><div class="vk-icon">🛍️</div><div class="vk-num">' + state.products.length + '</div><div class="vk-lbl">المنتجات</div><div class="vk-trend">' + state.products.filter(function(p){return p.status==='live'}).length + ' منشور</div></div>'
    +   '<div class="vk users"><div class="vk-icon">👥</div><div class="vk-num">' + state.users.length + '</div><div class="vk-lbl">المستخدمين</div><div class="vk-trend">مسجل</div></div>'
    + '</div>'
    + '<div class="vst">🕐 آخر الطلبات</div>'
    + '<div class="vlist">' + (recentHtml || '<div class="vempty"><div class="vempty-icon">✨</div><div class="vempty-txt">لا توجد طلبات بعد</div></div>') + '</div>';
}

function renderOrders(){
  var filter = state.ordersFilter;
  var filtered = state.orders.filter(function(o){
    if (filter === 'all') return true;
    return o.status === filter;
  });
  
  var counts = { all: state.orders.length, pending: 0, shipped: 0, completed: 0, cancelled: 0 };
  state.orders.forEach(function(o){ if (counts[o.status] !== undefined) counts[o.status]++; });
  
  var chips = [
    {key:'all', lbl:'الكل'},
    {key:'pending', lbl:'معلق'},
    {key:'shipped', lbl:'مشحون'},
    {key:'completed', lbl:'مكتمل'},
    {key:'cancelled', lbl:'ملغى'}
  ].map(function(ch){
    return '<button class="vchip' + (filter===ch.key?' active':'') + '" data-filter="' + ch.key + '">' + ch.lbl + ' (' + (counts[ch.key]||0) + ')</button>';
  }).join('');
  
  var listHtml = filtered.map(function(o){
    var cls = o.status === 'completed' ? 'done' : (o.status === 'cancelled' ? 'rejected' : (o.status === 'shipped' ? 'shipped' : 'pending'));
    var lbl = o.status === 'completed' ? 'مكتمل' : (o.status === 'cancelled' ? 'ملغى' : (o.status === 'shipped' ? 'مشحون' : 'معلق'));
    return '<div class="vcard" onclick="showOrderDetail(\'' + o.id + '\')">'
      + '<div class="vrow"><div class="vid">#' + o.id.slice(-6) + '</div><div class="vtitle">' + (o.customerName||'عميل') + '</div><div class="vtotal">' + (Number(o.total)||0).toFixed(0) + ' ر</div></div>'
      + '<div class="vmeta"><span>' + fmtDate(o.createdAt) + '</span><span class="vbadge ' + cls + '">' + lbl + '</span><span>' + (o.phone || '') + '</span></div>'
      + '</div>';
  }).join('');
  
  return ''
    + '<div class="vst">📦 الطلبات (' + filtered.length + ')</div>'
    + '<div class="vchips">' + chips + '</div>'
    + '<div class="vlist">' + (listHtml || '<div class="vempty"><div class="vempty-icon">📭</div><div class="vempty-txt">لا توجد طلبات في هذه الفئة</div></div>') + '</div>';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderTeam(){
  var groups = {};
  state.users.forEach(function(u){
    var role = u.role || 'customer';
    if (!groups[role]) groups[role] = [];
    groups[role].push(u);
  });
  
  var roleLabels = {
    super_admin: '👑 الإدارة العامة',
    cat_manager: '🏷️ مدراء الأقسام',
    delivery_mgr: '🚚 مندوب التوصيل',
    accountant: '💼 المحاسب',
    bookings_mgr: '📅 مدير الحجوزات',
    customer: '👥 العملاء'
  };
  
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px">'
    + '<div class="vst" style="margin:0">👥 الفريق (' + state.users.length + ')</div>'
    + '<button onclick="__addEmployee()" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">➕ إضافة موظف</button>'
    + '</div>';
  
  var order = ['super_admin','cat_manager','delivery_mgr','accountant','bookings_mgr','customer'];
  
  order.forEach(function(role){
    var list = groups[role];
    if (!list || !list.length) return;
    
    var members = list.map(function(u){
      var name = u.name || u.email || '—';
      var initial = (name || '?').charAt(0).toUpperCase();
      var cat = u.assignedCategory ? '<span class="vteam-cat">' + esc(u.assignedCategory) + '</span>' : '';
      var isSelf = u.id === state.user.uid;
      var actions = isSelf 
        ? '<span style="font-size:10px;color:#a78bfa;margin-left:6px;padding:4px 8px;background:rgba(168,85,247,0.15);border-radius:6px">أنت</span>'
        : '<button onclick="__editEmployee(\'' + u.id + '\')" style="background:rgba(155,77,255,0.15);border:1px solid rgba(155,77,255,0.3);color:#a78bfa;padding:6px 10px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;margin-left:4px">✏️</button>'
          + '<button onclick="__deleteEmployee(\'' + u.id + '\')" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:6px 10px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer">🗑️</button>';
      return '<div class="vteam-member">'
        + '<div class="vteam-avatar">' + esc(initial) + '</div>'
        + '<div class="vteam-info"><div class="vteam-name">' + esc(name) + ' ' + cat + '</div><div class="vteam-email">' + esc(u.email||'') + '</div></div>'
        + actions
        + '</div>';
    }).join('');
    
    html += '<div class="vteam-group"><div class="vteam-title">' + (roleLabels[role] || role) + ' (' + list.length + ')</div>' + members + '</div>';
  });
  
  return html;
}

function showEmployeeForm(existing){
  var isEdit = !!(existing && existing.id);
  var u = existing || {};
  
  var roleOpts = [
    {v:'super_admin', l:'👑 سوبر أدمن'},
    {v:'cat_manager', l:'🏷️ مدير قسم'},
    {v:'delivery_mgr', l:'🚚 مندوب توصيل'},
    {v:'accountant', l:'💼 محاسب'},
    {v:'bookings_mgr', l:'📅 مدير حجوزات'}
  ];
  var catLabels = {electronics:'إلكترونيات والهواتف',fashion:'الأزياء والموضة',clothing:'الملابس والإكسسوارات',shoes_bags:'أحذية والشنط',beauty:'جمال وعطور',kids_sports:'أطفال ورياضية',home:'منزل وأثاث',supermarket:'السوبر ماركت'};;
  var catOpts = Object.keys(catLabels);
  
  var iS = 'width:100%;padding:12px 14px;background:rgba(10,8,37,0.7);border:1px solid rgba(155,77,255,0.3);border-radius:12px;color:#fff;font-family:inherit;font-size:14px;margin-bottom:12px;box-sizing:border-box';
  var lS = 'display:block;font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:6px';
  
  var html = '<div style="padding:4px 0">'
    + '<label style="' + lS + '">الاسم *</label>'
    + '<input id="ef-name" type="text" value="' + esc(u.name||'') + '" placeholder="اسم الموظف" style="' + iS + '">'
    + (isEdit 
        ? '<div style="font-size:11px;color:#a78bfa;margin-bottom:12px">📧 ' + esc(u.email||'') + ' <span style="opacity:.6">(البريد ثابت)</span></div>'
        : '<label style="' + lS + '">البريد الإلكتروني *</label>'
          + '<input id="ef-email" type="email" placeholder="employee@chizen.test" style="' + iS + '">'
          + '<label style="' + lS + '">كلمة السر * (6 أحرف+)</label>'
          + '<input id="ef-pass" type="text" placeholder="••••••" style="' + iS + '">')
    + '<label style="' + lS + '">الدور *</label>'
    + '<select id="ef-role" style="' + iS + '">'
    + roleOpts.map(function(r){ return '<option value="' + r.v + '" ' + (u.role === r.v ? 'selected' : '') + '>' + r.l + '</option>'; }).join('')
    + '</select>'
    + '<label style="' + lS + '">القسم (لمدير القسم فقط)</label>'
    + '<select id="ef-cat" style="' + iS + '">'
    + '<option value="">— لا يوجد —</option>'
    + catOpts.map(function(c){ return '<option value="' + c + '" ' + (u.assignedCategory === c ? 'selected' : '') + '>' + catLabels[c] + '</option>'; }).join('')
    + '</select>'
    + '<label style="' + lS + '">الهاتف</label>'
    + '<input id="ef-phone" type="tel" value="' + esc(u.phone||'') + '" placeholder="77xxxxxxx" style="' + iS + 'margin-bottom:16px">'
    + '<button id="ef-save" style="width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:14px;border-radius:12px;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;border:none">💾 ' + (isEdit ? 'حفظ التعديلات' : 'إضافة الموظف') + '</button>'
    + '</div>';
  
  showModal(isEdit ? '✏️ تعديل موظف' : '➕ إضافة موظف', html);
  
  document.getElementById('ef-save').onclick = async function(){
    var btn = this;
    var name = document.getElementById('ef-name').value.trim();
    var role = document.getElementById('ef-role').value;
    var cat = document.getElementById('ef-cat').value;
    var phone = document.getElementById('ef-phone').value.trim();
    
    if (!name) { toast('⚠️ الاسم مطلوب', 'error'); return; }
    
    if (isEdit && u.id === state.user.uid && role !== 'super_admin') {
      if (!confirm('⚠️ تغيير دورك من سوبر أدمن سيُخرجك من اللوحة. متابعة؟')) {
        return;
      }
    }
    
    btn.disabled = true;
    btn.textContent = '⏳...';
    
    try {
      if (isEdit) {
        await db.collection('users').doc(u.id).update({
          name: name, role: role, assignedCategory: cat || null, phone: phone,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('✅ تم التحديث', 'success');
      } else {
        var email = document.getElementById('ef-email').value.trim();
        var pass = document.getElementById('ef-pass').value;
        if (!email) { toast('⚠️ البريد مطلوب', 'error'); btn.disabled=false; btn.textContent='إضافة الموظف'; return; }
        if (!pass || pass.length < 6) { toast('⚠️ كلمة السر 6+', 'error'); btn.disabled=false; btn.textContent='إضافة الموظف'; return; }
        
        var apiKey = firebase.app().options.apiKey;
        var r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + apiKey, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: email, password: pass, returnSecureToken: false})
        });
        var d = await r.json();
        if (d.error) {
          var em = d.error.message;
          if (em === 'EMAIL_EXISTS') throw new Error('البريد مستخدم بالفعل');
          if (em.indexOf('WEAK_PASSWORD') !== -1) throw new Error('كلمة السر قصيرة (6+)');
          if (em === 'INVALID_EMAIL') throw new Error('بريد غير صحيح');
          throw new Error(em);
        }
        var uid = d.localId;
        await db.collection('users').doc(uid).set({
          name: name, email: email, role: role,
          assignedCategory: cat || null, phone: phone,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: state.user.uid,
          isTemporary: false
        });
        toast('✅ تمت إضافة الموظف — يمكنه الدخول الآن', 'success');
      }
      
      var closeBtn = document.querySelector('#modal-close');
      if (closeBtn) closeBtn.click();
      await loadAll();
      renderTab('team');
    } catch(e) {
      btn.disabled = false;
      btn.textContent = isEdit ? '💾 حفظ التعديلات' : 'إضافة الموظف';
      toast('❌ ' + (e.message || 'فشل'), 'error');
    }
  };
}

function renderReview(){
  var pending = state.products.filter(function(p){ return p.status === 'pending_review'; });
  
  if (!pending.length) {
    return '<div class="vst">📋 مراجعة المنتجات</div><div class="vempty"><div class="vempty-icon">✨</div><div class="vempty-txt">لا توجد منتجات بانتظار المراجعة</div></div>';
  }
  
  var html = pending.map(function(p){
    var imgs = (Array.isArray(p.imgs) && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
    var mainImg = imgs[0] || '';
    var profit = (Number(p.price)||0) - (Number(p.costPrice)||0);
    var margin = p.price > 0 ? Math.round((profit / p.price) * 100) : 0;
    var manager = (p.submittedBy && p.submittedBy.name) || p.createdByName || '—';
    
    return '<div class="vreview" data-pid="' + p.id + '">'
      + '<div class="vreview-head">'
      +   '<img src="' + mainImg + '" class="vreview-img" onerror="this.style.opacity=0.3">'
      +   '<div class="vreview-meta">'
      +     '<div class="vreview-name">' + (p.name || '—') + '</div>'
      +     '<div class="vreview-sub">🏷️ ' + normName(p.brand) + ' · 📂 ' + (p.category||'') + '</div>'
      +     '<div class="vreview-sub">📤 ' + manager + '</div>'
      +   '</div>'
      + '</div>'
      + '<div class="vreview-stats">'
      +   '<div class="vreview-stat"><div class="vreview-stat-lbl">جملة</div><div class="vreview-stat-val">' + (Number(p.costPrice)||0).toFixed(0) + '</div></div>'
      +   '<div class="vreview-stat"><div class="vreview-stat-lbl">بيع</div><div class="vreview-stat-val" style="color:#ec4899">' + (Number(p.price)||0).toFixed(0) + '</div></div>'
      +   '<div class="vreview-stat"><div class="vreview-stat-lbl">ربح ' + margin + '%</div><div class="vreview-stat-val" style="color:#22c55e">' + profit.toFixed(0) + '</div></div>'
      + '</div>'
      + '<div style="font-size:12px;color:#a78bfa;margin-bottom:8px">🏭 ' + (p.supplierName || normName(p.supplier) || '—') + '</div>'
      + '<input class="vreview-reason" data-reason-for="' + p.id + '" placeholder="سبب الرفض (عند الرفض فقط)">'
      + '<div class="vreview-actions">'
      +   '<button class="vreview-btn approve" data-approve="' + p.id + '">✓ اعتماد</button>'
      +   '<button class="vreview-btn reject" data-reject="' + p.id + '">✗ رفض</button>'
      + '</div>'
      + '</div>';
  }).join('');
  
  return '<div class="vst">📋 مراجعة المنتجات (' + pending.length + ')</div>' + html;
}

function bindReviewActions(){
  document.querySelectorAll('[data-approve]').forEach(function(btn){
    btn.onclick = function(){
      var id = this.dataset.approve;
      approveProduct(id);
    };
  });
  document.querySelectorAll('[data-reject]').forEach(function(btn){
    btn.onclick = function(){
      var id = this.dataset.reject;
      var reasonInput = document.querySelector('[data-reason-for="' + id + '"]');
      var reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason){ toast('⚠️ أدخل سبب الرفض أولاً', 'error'); return; }
      rejectProduct(id, reason);
    };
  });
}

async function approveProduct(id){
  try {
    await db.collection('products').doc(id).update({
      status: 'live',
      active: true,
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: state.user.uid
    });
    toast('✅ تم اعتماد المنتج', 'success');
    await loadAll();
    updateReviewBadge();
    renderTab('review');
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function rejectProduct(id, reason){

      status: 'rejected',
      active: false,
      rejectionReason: reason,
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: state.user.uid
    });
    toast('تم رفض المنتج', 'error');
    await loadAll();
    updateReviewBadge();
    renderTab('review');
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

      + '</div>'
      + '</div>';
  }).join('');
  
  return '<div class="vst">💳 تأكيد الدفع (' + pending.length + ')</div>' + html;

async function verifyPayment(orderId){
  if (!confirm('تأكيد الدفع لهذا الطلب؟')) return;
  try {
    var order = state.orders.find(function(o){ return o.id === orderId; });
    if (!order) return;
    
    var updates = {
      workflowStatus: 'awaiting_categories',
      'payment.status': 'verified',
      'payment.verifiedBy': state.user.uid,
      'payment.verifiedAt': firebase.firestore.FieldValue.serverTimestamp()
    };
    
    if (order.categories) {
      Object.keys(order.categories).forEach(function(cat){
        updates['categories.' + cat + '.status'] = 'pending';
      });
    }
    
    await db.collection('orders').doc(orderId).update(updates);
    
    var custId = order.customerId || order.userId;
    if (custId) {
      db.collection('notifications').add({
        userId: custId,
        title: '✅ تم تأكيد دفعتك',
        body: 'طلبك #' + orderId.slice(-6) + ' قيد المعالجة',
        type: 'order', event: 'payment_verified', icon: '✅',
        read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(){});
    }
    
    if (order.categories) {
      var cats = Object.keys(order.categories);
      for (var i = 0; i < cats.length; i++) {
        try {
          var mgrs = await db.collection('users').where('role', '==', 'cat_manager').where('assignedCategory', '==', cats[i]).get();
          mgrs.forEach(function(mgr){
            db.collection('notifications').add({
              userId: mgr.id,
              title: '📦 طلب جديد في قسمك',
              body: 'طلب #' + orderId.slice(-6) + ' — تحقق من التوفر',
              type: 'order', event: 'cat_order_pending', icon: '📦',
              read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(function(){});
          });
        } catch(e){}
      }
    }
    
    toast('✅ تم تأكيد الدفع', 'success');
    await reloadData();
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function rejectPayment(orderId, reason){
  if (!confirm('رفض الدفع؟ السبب: ' + reason)) return;
  try {
    var order = state.orders.find(function(o){ return o.id === orderId; });
    if (!order) return;
    
    await db.collection('orders').doc(orderId).update({
      workflowStatus: 'payment_rejected',
      'payment.status': 'rejected',
      'payment.rejectedReason': reason,
      'payment.rejectedBy': state.user.uid,
      'payment.rejectedAt': firebase.firestore.FieldValue.serverTimestamp()
    });
    
    var custId = order.customerId || order.userId;
    if (custId) {
      db.collection('notifications').add({
        userId: custId,
        title: '❌ تم رفض دفعتك',
        body: 'طلب #' + orderId.slice(-6) + ' — السبب: ' + reason,
        type: 'warning', event: 'payment_rejected', icon: '❌', important: true,
        read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(){});
    }
    
    toast('تم رفض الدفع', 'error');
    await reloadData();
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function __dashUpload(file){
  var WORKER_URL = 'https://chizen-uploader.hazimchat.workers.dev';
  return new Promise(function(resolve, reject){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height, maxDim = 1600;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(function(blob){
        if(!blob){ reject(new Error('compress')); return; }
        fetch(WORKER_URL, { method: 'POST', headers: {'Content-Type': 'image/jpeg'}, body: blob })
          .then(function(r){ return r.ok ? r.json() : r.text().then(function(t){ throw new Error('فشل ' + r.status); }); })
          .then(function(d){ d.url ? resolve(d.url) : reject(new Error('لا رابط')); })
          .catch(reject);
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('تحميل فشل')); };
    img.src = url;
  });
}

async function __loadBanners(){
  try {
    var doc = await db.collection('config').doc('banners').get();
    if(!doc.exists) return {field:'list', items:[]};
    var d = doc.data();
    if(d.list && Array.isArray(d.list)) return {field:'list', items:d.list.slice()};
    if(d.items && Array.isArray(d.items)) return {field:'items', items:d.items.slice()};
    if(d.banners && Array.isArray(d.banners)) return {field:'banners', items:d.banners.slice()};
    return {field:'list', items: Object.keys(d).map(function(k){ return Object.assign({id:k}, d[k]); })};
  } catch(e){ return {field:'list', items:[]}; }
}

    +     '<button id="b276-close" style="background:rgba(155,77,255,0.15);border:1px solid rgba(155,77,255,0.3);color:#a78bfa;width:32px;height:32px;border-radius:50%;cursor:pointer;font-family:inherit;font-size:14px">✕</button>'
    +   '</div>'
    +   '<div id="b276-preview" style="position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 8px 24px rgba(0,0,0,0.4)">' + previewHtml + '</div>'
    +   '<div style="height:14px"></div>'
    + '</div>'
    // Toolbar
    + '<div style="padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0a0825;flex-shrink:0">'
    +   '<div style="font-size:13px;font-weight:900;color:#fff">🖼️ البانرات (' + data.items.length + ')</div>'
    +   '<button id="b276-add" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">➕ بانر جديد</button>'
    + '</div>'
    // List
    + '<div id="b276-list" style="flex:1;overflow-y:auto;padding:0 16px 16px">' + __renderBannerList(data.items) + '</div>';
  
  document.body.appendChild(ov);
  
  // Auto-play carousel
  var current = 0, count = items.length, interval;
  function goTo(idx){
    if (count === 0) return;
    current = ((idx % count) + count) % count;
    var slider = document.getElementById('b276-slider');
    if (slider) slider.style.transform = 'translateX(' + (current * 100) + '%)';
    document.querySelectorAll('#b276-dots [data-slide-to]').forEach(function(d, i){
      d.style.background = (i === current) ? '#fff' : 'rgba(255,255,255,0.4)';
    });
  }
  function startAuto(){
    if (count <= 1) return;
    clearInterval(interval);
    interval = setInterval(function(){ goTo(current + 1); }, 4000);
  }
  function resetAuto(){ clearInterval(interval); startAuto(); }
  
  document.querySelectorAll('#b276-dots [data-slide-to]').forEach(function(d){
    d.onclick = function(){ goTo(parseInt(this.dataset.slideTo, 10)); resetAuto(); };
  });
  
  // Swipe
  var preview = document.getElementById('b276-preview');
  if (preview && count > 1) {
    var startX = 0, isDragging = false;
    preview.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; isDragging = true; }, {passive:true});
    preview.addEventListener('touchend', function(e){
      if (!isDragging) return; isDragging = false;
      var diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) { goTo(diff > 0 ? current + 1 : current - 1); resetAuto(); }
    });
  }
  
  startAuto();
  
  // Bindings
  document.getElementById('b276-close').onclick = function(){ clearInterval(interval); ov.remove(); };
  document.getElementById('b276-add').onclick = function(){ clearInterval(interval); ov.remove(); showBannerEditor(null, -1); };
  
  document.querySelectorAll('[data-bedit]').forEach(function(btn){
    btn.onclick = function(){ clearInterval(interval); var i = parseInt(this.dataset.bedit, 10); ov.remove(); showBannerEditor(window.__currentBanners[i], i); };
  });
  document.querySelectorAll('[data-bdel]').forEach(function(btn){
    btn.onclick = function(){ var i = parseInt(this.dataset.bdel, 10); __deleteBanner(i, ov, interval); };
  });
}

function __renderBannerList(items){

  return items.map(function(b, i){
    var isActive = b.active !== false;
    var stStyle = isActive ? 'background:rgba(34,197,94,0.9);color:#fff' : 'background:rgba(107,114,128,0.9);color:#fff';
    return '<div style="border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#1a1230,#121028);border:1px solid rgba(155,77,255,0.2);margin-bottom:12px">'
      + '<div style="aspect-ratio:16/9;background:#111;position:relative">'
      +   (b.img ? (function(){var sc=(b.scale!=null)?Number(b.scale):1;var px=(b.posX!=null)?Number(b.posX):50;var py=(b.posY!=null)?Number(b.posY):50;return '<div style="position:absolute;inset:0;background-image:url(&quot;' + esc(b.img) + '&quot;);background-size:' + (sc*100) + '% auto;background-position:' + px + '% ' + py + '%;background-repeat:no-repeat;background-color:#111"></div>';})() : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:36px">🖼️</div>')
      +   '<div style="position:absolute;top:6px;right:6px;' + stStyle + ';padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700">' + (isActive ? '● نشط' : '○ مخفي') + '</div>'
      +   '<div style="position:absolute;top:6px;left:6px;background:rgba(10,8,37,0.9);color:#fff;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700">#' + (i+1) + '</div>'
      + '</div>'
      + '<div style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +   '<div style="min-width:0;flex:1">'
      +     (b.title ? '<div style="font-size:12px;color:#fff;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(b.title) + '</div>' : '<div style="font-size:12px;color:#a78bfa;opacity:0.6">بدون عنوان</div>')

      +   '</div>'
      +   '<div style="display:flex;gap:6px;flex-shrink:0">'
      +     '<button data-bedit="' + i + '" style="background:rgba(155,77,255,0.15);border:1px solid rgba(155,77,255,0.3);color:#a78bfa;padding:8px 10px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer">✏️</button>'
      +     '<button data-bdel="' + i + '" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:8px 10px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer">🗑️</button>'
      +   '</div>'
      + '</div></div>';
  }).join('');
}

async function __deleteBanner(index, ov, interval){
  var b = window.__currentBanners[index];
  if (!b) return;
  if (!confirm('حذف "' + (b.title || 'هذا البانر') + '" نهائياً؟')) return;
  var items = window.__currentBanners.slice();
  items.splice(index, 1);
  try {
    await __saveBanners(window.__currentBannerField, items);
    toast('✅ تم الحذف', 'success');
    if (interval) clearInterval(interval);
    if (ov) ov.remove();
    setTimeout(showBannerManager, 200);
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

  function getPosX(){ return parseFloat($('be-posx') ? $('be-posx').value : 50) || 0; }
  function getPosY(){ return parseFloat($('be-posy') ? $('be-posy').value : 50) || 0; }
  function updatePreview(){
    var img = $('be-img').value.trim() || currentImg;
    var title = $('be-title').value.trim();
    var scale = getScale();
    var posX = getPosX();
    var posY = getPosY();

    var pv = $('be-preview'); if(pv) pv.innerHTML = html;

    var isDrag = false, dragX = 0, dragY = 0, dragPX = 50, dragPY = 50;
    function onStart(e){
      var t = e.touches ? e.touches[0] : e;
      isDrag = true; dragX = t.clientX; dragY = t.clientY;
      dragPX = getPosX(); dragPY = getPosY();
    }
    function onMove(e){
      if(!isDrag) return;
      var t = e.touches ? e.touches[0] : e;
      var scale = getScale();
      if(scale <= 1.01) return;
      var rect = preview.getBoundingClientRect();
      var overflowX = rect.width * (scale - 1);
      var overflowY = rect.height * (scale - 1);
      var dx = t.clientX - dragX;
      var dy = t.clientY - dragY;
      var px = Math.max(0, Math.min(100, dragPX - (dx / overflowX) * 100));
      var py = Math.max(0, Math.min(100, dragPY - (dy / overflowY) * 100));
      if($('be-posx')) $('be-posx').value = px;
      if($('be-posy')) $('be-posy').value = py;
      updatePreview();
    }
    function onEnd(){ isDrag = false; }
    preview.style.cursor = 'grab';
    preview.style.touchAction = 'none';
    preview.addEventListener('mousedown', onStart);
    preview.addEventListener('mousemove', onMove);
    preview.addEventListener('mouseup', onEnd);
    preview.addEventListener('mouseleave', onEnd);
    preview.addEventListener('touchstart', onStart, {passive: true});
    preview.addEventListener('touchmove', onMove, {passive: true});
    preview.addEventListener('touchend', onEnd);
  })();
  
  $('be-upload').onclick = function(){ $('be-file').click(); };

    var files = Array.prototype.slice.call(e.target.files);

    $('be-prog').style.display = 'block';
    $('be-bar').style.width = '30%';

      var url = await __dashUpload(files[0]);
      currentImg = url; $('be-img').value = url; $('be-bar').style.width = '100%'; updatePreview();
      toast('✅ تم رفع الصورة', 'success');
    } catch(err){ toast('❌ ' + err.message, 'error'); }
    setTimeout(function(){ $('be-prog').style.display = 'none'; $('be-bar').style.width = '0%'; }, 600);
    e.target.value = '';
  };
  
  $('be-cancel').onclick = $('be-close').onclick = function(){ ov.remove(); setTimeout(showBannerManager, 100); };
  
  $('be-save').onclick = async function(){
    var img = $('be-img').value.trim() || currentImg;
    var title = $('be-title').value.trim();
    var link = $('be-link').value.trim();
    var order = Number($('be-order').value) || 0;
    var active = $('be-active').checked;
    if(!img){ toast('⚠️ الصورة مطلوبة', 'error'); return; }
    var newBanner = {img: img, title: title, link: link, order: order, active: active, scale: getScale(), posX: getPosX(), posY: getPosY()};
    var items = window.__currentBanners.slice();
    if(isEdit){ if(b.id) newBanner.id = b.id; items[index] = newBanner; }
    else { items.push(newBanner); }
    items.sort(function(a,b){ return (Number(a.order)||0) - (Number(b.order)||0); });
    this.disabled = true; this.textContent = '⏳...';
    try {
      await __saveBanners(window.__currentBannerField, items);
      toast('✅ تم الحفظ', 'success');
      ov.remove();
      setTimeout(showBannerManager, 200);
    } catch(e){ this.disabled = false; this.textContent = '💾 حفظ'; toast('❌ ' + e.message, 'error'); }
  };
}

async function __loadSuppliers(){
  var doc = await db.collection('config').doc('suppliers').get();
  if (!doc.exists) return [];
  var d = doc.data();
  return d.list || [];
}

async function __saveSuppliers(list){
  await db.collection('config').doc('suppliers').set({list: list, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge: true});
}

window.__v279State = { suppliers: [] };

async function deleteSupplier(idx){
  var s = window.__v279State.suppliers[idx];
  if (!s) return;
  var prodCount = Array.isArray(s.products) ? s.products.length : 0;
  var msg = 'حذف مورد "' + (s.name||'—') + '"؟';
  if (prodCount > 0) msg += '\n\n⚠️ له ' + prodCount + ' منتج مرتبط';
  if (!confirm(msg)) return;
  var list = window.__v279State.suppliers.slice();
  list.splice(idx, 1);
  try {
    await __saveSuppliers(list);
    toast('✅ تم الحذف', 'success');
    var cb = document.querySelector('#modal-close'); if(cb) cb.click();
    setTimeout(showSupplierManager, 200);
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

    document.getElementById('nc-user-wrap').style.display = this.value === 'specific' ? 'block' : 'none';
  };
  
  var searchInp = document.getElementById('nc-user-search');
  var userSel = document.getElementById('nc-user');
  searchInp.oninput = function(){
    var q = this.value.toLowerCase().trim();
    userSel.innerHTML = window.__v280Users
      .filter(function(u){
        return !q || (u.name||'').toLowerCase().indexOf(q) !== -1 || (u.email||'').toLowerCase().indexOf(q) !== -1;

      .map(function(u){ return '<option value="' + u.id + '">' + (u.name||'') + ' — ' + (u.email||'') + '</option>'; })
      .join('');

    var title = document.getElementById('nc-title').value.trim();
    var body = document.getElementById('nc-body').value.trim();
    var type = document.getElementById('nc-type').value;
    var important = document.getElementById('nc-important').checked;
    var link = document.getElementById('nc-link').value.trim();
    
    if (!title || !body) { toast('⚠️ العنوان والنص مطلوبان', 'error'); return; }
    
    var recipients = [];
    if (tType === 'all') {
      recipients = window.__v280Users.filter(function(u){ return u.role !== 'super_admin'; });
    } else if (tType === 'role') {
      var r = document.getElementById('nc-role').value;
      recipients = window.__v280Users.filter(function(u){ return u.role === r; });
    } else if (tType === 'category') {
      var cat = document.getElementById('nc-cat').value;
      try {
        var ordersSnap = await db.collection('orders').get();
        var custIds = {};
        ordersSnap.forEach(function(d){
          var o = d.data();
          if (o.categories && o.categories[cat] && o.customerId) custIds[o.customerId] = true;
        });
        recipients = window.__v280Users.filter(function(u){ return custIds[u.id]; });
      } catch(e){ toast('❌ فشل جلب العملاء', 'error'); return; }
    } else if (tType === 'specific') {
      var uid = userSel.value;
      if (uid) {
        var u = window.__v280Users.find(function(x){ return x.id === uid; });
        if (u) recipients = [u];
      }
    }
    
    if (recipients.length === 0) { toast('⚠️ لا يوجد مستقبلون', 'error'); return; }
    
    var btn = this; btn.disabled = true; btn.textContent = '⏳ إرسال...';
    
    try {
      var batchSize = 400;
      var sent = 0;
      for (var i = 0; i < recipients.length; i += batchSize) {
        var batch = db.batch();
        var chunk = recipients.slice(i, i + batchSize);
        chunk.forEach(function(u){
          var ref = db.collection('notifications').doc();
          batch.set(ref, {
            userId: u.id,
            title: title,
            body: body,
            type: type,
            event: 'admin_broadcast',
            icon: type === 'warning' ? '⚠️' : (type === 'success' ? '✅' : (type === 'promo' ? '🎉' : (type === 'order' ? '📦' : 'ℹ️'))),
            important: important,
            deepLink: link || null,
            read: false,
            broadcast: tType === 'all',
            broadcastType: tType,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit();
        sent += chunk.length;
      }
      
      toast('✅ تم إرسال ' + sent + ' إشعار', 'success');
      var cb = document.querySelector('#modal-close'); if(cb) cb.click();
      setTimeout(showNotificationManager, 300);
    } catch(e){
      btn.disabled = false; btn.textContent = '📤 إرسال';
      toast('❌ ' + e.message, 'error');
    }
  };
}

      +     '<div style="font-size:11px;color:#a78bfa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(n.body || '') + '</div>'
      +     '<div style="display:flex;gap:8px;margin-top:4px;font-size:10px;color:#6b5a8a;flex-wrap:wrap">'
      +       '<span>👤 ' + esc(recipient) + '</span>'
      +       '<span>📅 ' + date + '</span>'
      +       '<span style="color:' + (n.read ? '#22c55e' : typeColor) + '">' + (n.read ? '✓ مقروء' : '● جديد') + '</span>'
      +     '</div>'
      +   '</div>'
      +   '<button data-ndel2="' + idx + '" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:5px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0">🗑️</button>'
      + '</div></div>';
  }).join('');
}

function __rebindNotifsList(){
  document.querySelectorAll('[data-ndel2]').forEach(function(b){
    b.onclick = function(){
      var n = window.__v280Notifs[parseInt(this.dataset.ndel2,10)];
      if (!n) return;
      if (confirm('حذف "' + (n.title||'') + '"؟')) {
        db.collection('notifications').doc(n.id).delete().then(function(){
          toast('✅ تم الحذف', 'success');
          var cb = document.querySelector('#modal-close'); if(cb) cb.click();
          setTimeout(showNotificationManager, 200);
        }).catch(function(e){ toast('❌ ' + e.message, 'error'); });
      }
    };
  });
}

window.__v281Refresh = function(){
  var list = document.getElementById('nm-list');
  if (list) { list.innerHTML = __renderNotifsList(); __rebindNotifsList(); }
  var chips = document.querySelectorAll('[data-nfilter]');
  var notifs = window.__v280Notifs || [];
  var counts = {all: notifs.length, unread: 0, read: 0};
  notifs.forEach(function(n){ if (n.read) counts.read++; else counts.unread++; });
  chips.forEach(function(c){
    var f = c.dataset.nfilter;
    var isActive = f === window.__v281Filter;
    c.style.background = isActive ? 'linear-gradient(135deg,#7c3aed,#ec4899)' : 'rgba(155,77,255,0.1)';
    c.style.color = isActive ? '#fff' : '#a78bfa';
    c.style.borderColor = isActive ? 'transparent' : 'rgba(155,77,255,0.3)';
    var cnt = counts[f] || 0;
    if (!c.dataset.orig) c.dataset.orig = c.textContent;
    c.textContent = c.dataset.orig.replace(/\s*\(\d+\)$/, '') + ' (' + cnt + ')';
  });
};

// استبدال showNotificationManager
async function showNotificationManager(){
  try {
    var [notifsSnap, usersSnap] = await Promise.all([
      db.collection('notifications').orderBy('createdAt', 'desc').limit(100).get(),
      db.collection('users').get()
    ]);
    
    var notifs = notifsSnap.docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
    var users = usersSnap.docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); });
    var usersMap = {};
    users.forEach(function(u){ usersMap[u.id] = u.name || u.email || 'مستخدم'; });
    
    window.__v280Notifs = notifs;
    window.__v280Users = users;
    window.__v280UsersMap = usersMap;
    window.__v281Filter = 'all';
    
    var unread = notifs.filter(function(n){ return !n.read; }).length;
    var read = notifs.length - unread;
    
    // Stats
    var stats = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">'
      + '<div style="background:rgba(155,77,255,0.1);border:1px solid rgba(155,77,255,0.25);border-radius:12px;padding:10px;text-align:center">'
      +   '<div style="font-size:20px;font-weight:900;color:#fff">' + notifs.length + '</div>'
      +   '<div style="font-size:10px;color:#a78bfa;font-weight:700">الإجمالي</div>'
      + '</div>'
      + '<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:10px;text-align:center">'
      +   '<div style="font-size:20px;font-weight:900;color:#f87171">' + unread + '</div>'
      +   '<div style="font-size:10px;color:#f87171;font-weight:700">غير مقروء</div>'
      + '</div>'
      + '<div style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:12px;padding:10px;text-align:center">'
      +   '<div style="font-size:20px;font-weight:900;color:#4ade80">' + read + '</div>'
      +   '<div style="font-size:10px;color:#4ade80;font-weight:700">مقروء</div>'
      + '</div>'
      + '</div>';
    
    // Filter chips
    var chips = '<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px">'
      + '<button data-nfilter="all" style="flex-shrink:0;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;border:1px solid transparent">الكل (' + notifs.length + ')</button>'
      + '<button data-nfilter="unread" style="flex-shrink:0;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(155,77,255,0.3);background:rgba(155,77,255,0.1);color:#a78bfa">غير مقروء (' + unread + ')</button>'
      + '<button data-nfilter="read" style="flex-shrink:0;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(155,77,255,0.3);background:rgba(155,77,255,0.1);color:#a78bfa">مقروء (' + read + ')</button>'
      + '</div>';
    
    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px">'
      + '<div style="font-size:14px;font-weight:900;color:#fff">🔔 الإشعارات</div>'
      + '<button id="nm-compose" style="background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap">➕ إرسال إشعار</button>'
      + '</div>'
      + stats + chips
      + '<div id="nm-list" style="max-height:50vh;overflow-y:auto">' + __renderNotifsList() + '</div>';
    
    showModal('🔔 الإدارة', html);
    window.__v281Refresh();
    __rebindNotifsList();
    
    document.getElementById('nm-compose').onclick = function(){ showNotificationComposer(); };
    document.querySelectorAll('[data-nfilter]').forEach(function(c){
      c.onclick = function(){ window.__v281Filter = this.dataset.nfilter; window.__v281Refresh(); };
    });
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

// Composer محسّن مع خيار push
function showNotificationComposer(){
  var users = window.__v280Users || [];
  var roles = {super_admin:'👑 سوبر أدمن', cat_manager:'🏷️ مدراء الأقسام', delivery_mgr:'🚚 مندوب توصيل', accountant:'💼 محاسب', bookings_mgr:'📅 مدير حجوزات', customer:'👥 العملاء'};
  var cats = [
    {k:'electronics',n:'إلكترونيات والهواتف'},{k:'fashion',n:'الأزياء والموضة'},{k:'clothing',n:'الملابس والإكسسوارات'},
    {k:'shoes_bags',n:'أحذية والشنط'},{k:'beauty',n:'جمال وعطور'},{k:'kids_sports',n:'أطفال ورياضية'},
    {k:'home',n:'منزل وأثاث'},{k:'supermarket',n:'السوبر ماركت'}
  ];
  
  var iS = 'width:100%;padding:12px 14px;background:rgba(10,8,37,0.7);border:1px solid rgba(155,77,255,0.3);border-radius:12px;color:#fff;font-family:inherit;font-size:14px;margin-bottom:12px;box-sizing:border-box';
  var lS = 'display:block;font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:6px';
  
  var html = '<div>'
    + '<label style="' + lS + '">🎯 المستهدفون *</label>'
    + '<select id="nc2-target" style="' + iS + '">'
    +   '<option value="all">📢 جميع المستخدمين (' + users.length + ')</option>'
    +   '<option value="role">👥 حسب الدور</option>'
    +   '<option value="category">🏷️ عملاء قسم معين</option>'
    +   '<option value="specific">👤 مستخدم محدد</option>'
    + '</select>'
    + '<div id="nc2-role-wrap" style="display:none"><label style="' + lS + '">الدور</label><select id="nc2-role" style="' + iS + '">' + Object.keys(roles).map(function(k){return '<option value="'+k+'">'+roles[k]+'</option>';}).join('') + '</select></div>'
    + '<div id="nc2-cat-wrap" style="display:none"><label style="' + lS + '">القسم</label><select id="nc2-cat" style="' + iS + '">' + cats.map(function(c){return '<option value="'+c.k+'">'+c.n+'</option>';}).join('') + '</select></div>'
    + '<div id="nc2-user-wrap" style="display:none">'
    +   '<label style="' + lS + '">بحث</label>'
    +   '<input id="nc2-search" type="text" placeholder="اسم أو بريد" style="' + iS + '">'
    +   '<select id="nc2-user" style="' + iS + '">' + users.map(function(u){return '<option value="'+u.id+'">'+(u.name||'')+' — '+(u.email||'')+'</option>';}).join('') + '</select>'
    + '</div>'
    + '<label style="' + lS + '">📤 طريقة الإرسال *</label>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px">'
    +   '<label data-sendmode="internal" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:rgba(155,77,255,0.1);border:2px solid rgba(155,77,255,0.3);border-radius:10px;cursor:pointer;text-align:center">'
    +     '<input type="radio" name="nc2-mode" value="internal" style="margin:0;accent-color:#7c3aed">'
    +     '<span style="font-size:16px">📱</span>'
    +     '<span style="font-size:10px;color:#a78bfa;font-weight:800">داخلي فقط</span>'
    +   '</label>'
    +   '<label data-sendmode="external" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:rgba(155,77,255,0.1);border:2px solid rgba(155,77,255,0.3);border-radius:10px;cursor:pointer;text-align:center">'
    +     '<input type="radio" name="nc2-mode" value="external" style="margin:0;accent-color:#7c3aed">'
    +     '<span style="font-size:16px">🔔</span>'
    +     '<span style="font-size:10px;color:#a78bfa;font-weight:800">Push خارجي</span>'
    +   '</label>'
    +   '<label data-sendmode="both" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:rgba(34,197,94,0.15);border:2px solid rgba(34,197,94,0.5);border-radius:10px;cursor:pointer;text-align:center">'
    +     '<input type="radio" name="nc2-mode" value="both" checked style="margin:0;accent-color:#22c55e">'
    +     '<span style="font-size:16px">🌐</span>'
    +     '<span style="font-size:10px;color:#4ade80;font-weight:800">كلاهما</span>'
    +   '</label>'
    + '</div>'
    + '<div style="font-size:10px;color:#a78bfa;opacity:0.7;margin-bottom:12px;padding:8px;background:rgba(155,77,255,0.05);border-radius:8px;line-height:1.5">💡 <b>داخلي:</b> يظهر عند فتح التطبيق فقط<br>🔔 <b>Push:</b> يظهر كإشعار على الهاتف (يحتاج push-listener)<br>🌐 <b>كلاهما:</b> يظهر في كل مكان</div>'
    + '<label style="' + lS + '">نوع الإشعار</label>'
    + '<select id="nc2-type" style="' + iS + '">'
    +   '<option value="info">ℹ️ معلومات</option><option value="success">✅ نجاح</option><option value="warning">⚠️ تحذير</option><option value="order">📦 طلب</option><option value="promo">🎉 عرض</option>'
    + '</select>'
    + '<label style="' + lS + '">العنوان *</label>'
    + '<input id="nc2-title" type="text" placeholder="..." style="' + iS + '">'
    + '<label style="' + lS + '">النص *</label>'
    + '<textarea id="nc2-body" rows="3" placeholder="..." style="' + iS + 'resize:vertical"></textarea>'
    + '<label style="display:flex;align-items:center;gap:10px;padding:12px;background:rgba(155,77,255,0.1);border-radius:10px;margin-bottom:12px;cursor:pointer">'
    +   '<input id="nc2-important" type="checkbox" style="width:20px;height:20px;accent-color:#ec4899">'
    +   '<span style="color:#fff;font-weight:700;font-size:12px">🔔 إشعار مهم (popup)</span>'
    + '</label>'
    + '<label style="' + lS + '">رابط اختياري</label>'
    + '<input id="nc2-link" type="text" placeholder="product/123 أو #offers" style="' + iS + '">'
    + '<button id="nc2-send" style="width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:14px;border-radius:12px;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;border:none;margin-top:8px">📤 إرسال</button>'
    + '</div>';
  
  showModal('➕ إرسال إشعار', html);
  
  // Update send mode styling
  document.querySelectorAll('[data-sendmode]').forEach(function(lbl){
    lbl.querySelector('input').onchange = function(){
      document.querySelectorAll('[data-sendmode]').forEach(function(l){
        l.style.background = 'rgba(155,77,255,0.1)';
        l.style.borderColor = 'rgba(155,77,255,0.3)';
      });
      if (this.checked) {
        lbl.style.background = this.value === 'both' ? 'rgba(34,197,94,0.15)' : 'rgba(155,77,255,0.2)';
        lbl.style.borderColor = this.value === 'both' ? 'rgba(34,197,94,0.5)' : 'rgba(155,77,255,0.5)';
      }
    };
  });
  
  document.getElementById('nc2-target').onchange = function(){
    document.getElementById('nc2-role-wrap').style.display = this.value === 'role' ? 'block' : 'none';
    document.getElementById('nc2-cat-wrap').style.display = this.value === 'category' ? 'block' : 'none';
    document.getElementById('nc2-user-wrap').style.display = this.value === 'specific' ? 'block' : 'none';
  };
  
  var searchInp = document.getElementById('nc2-search');
  var userSel = document.getElementById('nc2-user');
  searchInp.oninput = function(){
    var q = this.value.toLowerCase().trim();
    userSel.innerHTML = window.__v280Users.filter(function(u){
      return !q || (u.name||'').toLowerCase().indexOf(q) !== -1 || (u.email||'').toLowerCase().indexOf(q) !== -1;
    }).map(function(u){ return '<option value="' + u.id + '">' + (u.name||'') + ' — ' + (u.email||'') + '</option>'; }).join('');
  };
  
  document.getElementById('nc2-send').onclick = async function(){
    var tType = document.getElementById('nc2-target').value;
    var title = document.getElementById('nc2-title').value.trim();
    var body = document.getElementById('nc2-body').value.trim();
    var type = document.getElementById('nc2-type').value;
    var important = document.getElementById('nc2-important').checked;
    var link = document.getElementById('nc2-link').value.trim();
    var sendMode = (document.querySelector('input[name="nc2-mode"]:checked') || {}).value || 'both';
    
    if (!title || !body) { toast('⚠️ العنوان والنص مطلوبان', 'error'); return; }
    
    var recipients = [];
    if (tType === 'all') recipients = window.__v280Users.filter(function(u){ return u.role !== 'super_admin'; });
    else if (tType === 'role') { var r = document.getElementById('nc2-role').value; recipients = window.__v280Users.filter(function(u){ return u.role === r; }); }
    else if (tType === 'category') {
      var cat = document.getElementById('nc2-cat').value;
      try {
        var os = await db.collection('orders').get();
        var ids = {};
        os.forEach(function(d){ var o = d.data(); if (o.categories && o.categories[cat] && o.customerId) ids[o.customerId] = true; });
        recipients = window.__v280Users.filter(function(u){ return ids[u.id]; });
      } catch(e){ toast('❌ فشل', 'error'); return; }
    } else if (tType === 'specific') {
      var uid = userSel.value;
      if (uid) { var uu = window.__v280Users.find(function(x){ return x.id === uid; }); if (uu) recipients = [uu]; }
    }
    
    if (recipients.length === 0) { toast('⚠️ لا يوجد مستقبلون', 'error'); return; }
    
    var btn = this; btn.disabled = true; btn.textContent = '⏳ إرسال...';
    
    var pushEnabled = (sendMode === 'external' || sendMode === 'both');
    var internalEnabled = (sendMode === 'internal' || sendMode === 'both');
    var icon = type === 'warning' ? '⚠️' : (type === 'success' ? '✅' : (type === 'promo' ? '🎉' : (type === 'order' ? '📦' : 'ℹ️')));
    
    try {
      var opsPerUser = 1 + (pushEnabled ? 1 : 0);
      var batchSize = Math.floor(450 / opsPerUser);
      var sent = 0;
      var sentPush = 0;
      
      for (var i = 0; i < recipients.length; i += batchSize) {
        var batch = db.batch();
        var chunk = recipients.slice(i, i + batchSize);
        chunk.forEach(function(u){
          if (internalEnabled) {
            var nRef = db.collection('notifications').doc();
            batch.set(nRef, {
              userId: u.id, title: title, body: body, type: type,
              event: 'admin_broadcast', icon: icon, important: important,
              deepLink: link || null, read: false,
              broadcast: tType === 'all', broadcastType: tType,
              pushSent: pushEnabled,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          if (pushEnabled) {
            var pRef = db.collection('push_queue').doc();
            batch.set(pRef, {
              userId: u.id,
              title: title, body: body, type: type, icon: icon,
              deepLink: link || null, important: important,
              status: 'pending',
              sentAt: null,
              error: null,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            sentPush++;
          }
        });
        await batch.commit();
        sent += chunk.length;
      }
      
      var msg = '✅ أُرسل إلى ' + sent;
      if (pushEnabled) msg += ' (push: ' + sentPush + ')';
      toast(msg, 'success');
      
      var cb = document.querySelector('#modal-close'); if(cb) cb.click();
      setTimeout(showNotificationManager, 300);
    } catch(e){
      btn.disabled = false; btn.textContent = '📤 إرسال';
      toast('❌ ' + e.message, 'error');
    }
  };
}
