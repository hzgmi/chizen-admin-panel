<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>CHIZEN — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0825;color:#fff;font-family:'Tajawal',system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,0.18) 0%,rgba(236,72,153,0.05) 30%,transparent 60%),#0a0825;min-height:100vh;padding-bottom:30px}

/* Header */
.vh{position:sticky;top:0;z-index:100;background:rgba(10,8,37,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(155,77,255,0.2);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.vh-logo{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vh-sub{font-size:9px;color:#a78bfa;letter-spacing:3px;margin-top:-2px;font-weight:700}
.vh-actions{display:flex;gap:8px}
.vh-btn{background:rgba(155,77,255,0.15);border:1px solid rgba(155,77,255,0.3);color:#a78bfa;width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;position:relative;transition:all 0.2s}
.vh-btn:hover{background:rgba(155,77,255,0.25);transform:scale(1.05)}
.vh-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Container */
.vc{max-width:1200px;margin:0 auto;padding:20px 16px}

/* Welcome */
.vw{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);border-radius:22px;padding:24px 22px;margin-bottom:22px;box-shadow:0 15px 40px rgba(168,85,247,0.35);position:relative;overflow:hidden}
.vw::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:rgba(255,255,255,0.1);border-radius:50%;filter:blur(40px)}
.vw-h{font-size:13px;opacity:0.9;margin-bottom:4px;font-weight:600;position:relative;z-index:1}
.vw-name{font-size:22px;font-weight:900;margin-bottom:6px;position:relative;z-index:1}
.vw-sub{font-size:12px;opacity:0.85;position:relative;z-index:1}

/* Section Title */
.vst{font-size:15px;font-weight:900;color:#fff;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.vst::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,#7c3aed,#ec4899);border-radius:2px}

/* KPI Grid */
.vkg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:768px){.vkg{grid-template-columns:repeat(4,1fr)}}

.vk{background:linear-gradient(135deg,#1a1230 0%,#121028 100%);border:1px solid rgba(155,77,255,0.25);border-radius:18px;padding:18px 14px;position:relative;overflow:hidden;transition:transform 0.2s,box-shadow 0.2s}
.vk:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(168,85,247,0.25)}
.vk::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1,#7c3aed),var(--c2,#ec4899))}
.vk.sales{--c1:#ec4899;--c2:#f43f5e}
.vk.orders{--c1:#7c3aed;--c2:#a855f7}
.vk.products{--c1:#a855f7;--c2:#d946ef}
.vk.users{--c1:#06b6d4;--c2:#3b82f6}
.vk-icon{font-size:28px;margin-bottom:10px;line-height:1;display:flex;align-items:center;gap:8px}
.vk-num{font-size:24px;font-weight:900;color:#fff;line-height:1;margin-bottom:6px}
.vk-lbl{font-size:11px;color:#a78bfa;font-weight:700;letter-spacing:0.3px}
.vk-trend{font-size:10px;color:#22c55e;margin-top:6px;font-weight:700}
.vk-trend.down{color:#ef4444}

/* Quick Actions */
.vqa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:768px){.vqa{grid-template-columns:repeat(3,1fr)}}
.va{background:linear-gradient(135deg,#1a1230 0%,#121028 100%);border:1px solid rgba(155,77,255,0.2);border-radius:16px;padding:18px 14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:12px;color:#fff;font-family:inherit;font-size:13px;font-weight:700;text-align:right}
.va:hover{border-color:rgba(155,77,255,0.5);transform:translateY(-2px);box-shadow:0 10px 30px rgba(168,85,247,0.2)}
.va-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(236,72,153,0.2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.va-text{flex:1;min-width:0}
.va-label{font-weight:900;font-size:13px;margin-bottom:2px}
.va-desc{font-size:10px;color:#a78bfa;font-weight:500}

/* Recent Orders */
.vro{display:flex;flex-direction:column;gap:10px}
.vor{background:linear-gradient(135deg,#1a1230 0%,#121028 100%);border:1px solid rgba(155,77,255,0.15);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all 0.2s}
.vor:hover{border-color:rgba(155,77,255,0.35)}
.vor-id{font-size:13px;font-weight:900;color:#a78bfa;min-width:70px}
.vor-name{flex:1;min-width:0;font-size:12px;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vor-total{font-size:14px;font-weight:900;color:#ec4899}
.vor-status{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700;white-space:nowrap}
.vor-status.pending{background:rgba(251,191,36,0.2);color:#fbbf24}
.vor-status.done{background:rgba(34,197,94,0.2);color:#4ade80}
.vor-status.rejected{background:rgba(239,68,68,0.2);color:#f87171}

/* Empty */
.ve{text-align:center;padding:40px 20px;color:#a78bfa;background:rgba(155,77,255,0.05);border-radius:16px;border:1px dashed rgba(155,77,255,0.2)}
.ve-icon{font-size:48px;margin-bottom:10px}
.ve-text{font-size:13px;font-weight:700}

/* Loading */
.vl{position:fixed;inset:0;background:#0a0825;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px}
.vl-spin{width:50px;height:50px;border:3px solid rgba(155,77,255,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vl-txt{color:#a78bfa;font-size:13px;font-weight:700}

/* Toast */
.vt{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-150%);background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.4);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);opacity:0}
.vt.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- Loading -->
<div class="vl" id="vLoad"><div class="vl-spin"></div><div class="vl-txt">جاري التحقق...</div></div>

<!-- Header -->
<div class="vh">
  <div>
    <div class="vh-logo">CHIZEN</div>
    <div class="vh-sub">DASHBOARD</div>
  </div>
  <div class="vh-actions">
    <button class="vh-btn" onclick="loadAll()" title="تحديث">🔄</button>
    <button class="vh-btn" onclick="goOld()" title="اللوحة الكاملة">⚙️</button>
    <button class="vh-btn" onclick="logout()" title="خروج">🚪</button>
  </div>
</div>

<!-- Container -->
<div class="vc">
  <!-- Welcome -->
  <div class="vw">
    <div class="vw-h" id="vGreet">مرحباً بك</div>
    <div class="vw-name" id="vName">—</div>
    <div class="vw-sub">لوحة الإدارة — نظرة سريعة على أداء اليوم</div>
  </div>

  <!-- KPIs -->
  <div class="vst">📊 الإحصائيات</div>
  <div class="vkg">
    <div class="vk sales">
      <div class="vk-icon">💰</div>
      <div class="vk-num" id="vSales">0</div>
      <div class="vk-lbl">إجمالي المبيعات</div>
      <div class="vk-trend" id="vSalesT">—</div>
    </div>
    <div class="vk orders">
      <div class="vk-icon">📦</div>
      <div class="vk-num" id="vOrders">0</div>
      <div class="vk-lbl">الطلبات</div>
      <div class="vk-trend" id="vOrdersT">—</div>
    </div>
    <div class="vk products">
      <div class="vk-icon">🛍️</div>
      <div class="vk-num" id="vProducts">0</div>
      <div class="vk-lbl">المنتجات</div>
      <div class="vk-trend" id="vProductsT">—</div>
    </div>
    <div class="vk users">
      <div class="vk-icon">👥</div>
      <div class="vk-num" id="vUsers">0</div>
      <div class="vk-lbl">المستخدمين</div>
      <div class="vk-trend" id="vUsersT">—</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="vst">⚡ إجراءات سريعة</div>
  <div class="vqa">
    <button class="va" onclick="nav('orders')">
      <div class="va-icon">🛒</div>
      <div class="va-text"><div class="va-label">الطلبات</div><div class="va-desc">إدارة الطلبات</div></div>
    </button>
    <button class="va" onclick="nav('dash')">
      <div class="va-icon">🛍️</div>
      <div class="va-text"><div class="va-label">المنتجات</div><div class="va-desc">إدارة المخزون</div></div>
    </button>
    <button class="va" onclick="nav('team')">
      <div class="va-icon">👥</div>
      <div class="va-text"><div class="va-label">الفريق</div><div class="va-desc">مدراء وأعضاء</div></div>
    </button>
    <button class="va" onclick="nav('more')">
      <div class="va-icon">➕</div>
      <div class="va-text"><div class="va-label">المزيد</div><div class="va-desc">كل الأدوات</div></div>
    </button>
    <button class="va" onclick="goPage('review')">
      <div class="va-icon">📋</div>
      <div class="va-text"><div class="va-label">مراجعة المنتجات</div><div class="va-desc">قبول/رفض</div></div>
    </button>
    <button class="va" onclick="goPage('accountant')">
      <div class="va-icon">💼</div>
      <div class="va-text"><div class="va-label">المحاسب</div><div class="va-desc">الإيرادات</div></div>
    </button>
  </div>

  <!-- Recent Orders -->
  <div class="vst">🕐 آخر الطلبات</div>
  <div class="vro" id="vRecent">
    <div class="ve"><div class="ve-icon">⏳</div><div class="ve-text">جاري التحميل...</div></div>
  </div>
</div>

<div class="vt" id="vToast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
var auth, db;
try {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
} catch(e){ console.error('init', e); }

function toast(msg){
  var t = document.getElementById('vToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

function goOld(){ location.href = 'index.html'; }
function goPage(p){ location.href = 'index.html#' + p; }
function nav(tab){
  if (tab === 'review') { location.href = 'index.html#review'; return; }
  if (tab === 'accountant') { location.href = 'index.html#accountant'; return; }
  location.href = 'index.html#tab=' + tab;
}
function logout(){
  if (confirm('تسجيل الخروج؟')) {
    auth.signOut().then(function(){ location.href = 'index.html'; });
  }
}

auth.onAuthStateChanged(function(user){
  if (!user) {
    document.getElementById('vLoad').innerHTML = '<div class="vl-txt">انتهت الجلسة — جاري التحويل...</div>';
    setTimeout(function(){ location.href = 'index.html'; }, 1000);
    return;
  }
  loadAll(user);
});

async function loadAll(user){
  user = user || auth.currentUser;
  if (!user) return;
  document.getElementById('vLoad').style.display = 'flex';
  
  try {
    var udoc = await db.collection('users').doc(user.uid).get();
    var u = udoc.exists ? udoc.data() : {};
    var name = u.name || user.displayName || user.email.split('@')[0];
    var hour = new Date().getHours();
    var greet = hour < 12 ? 'صباح الخير' : (hour < 18 ? 'مساء النور' : 'مساء الخير');
    document.getElementById('vGreet').textContent = greet;
    document.getElementById('vName').textContent = name;
  } catch(e){ console.warn(e); }
  
  try {
    var [ordersSnap, productsSnap, usersSnap, recentSnap] = await Promise.all([
      db.collection('orders').get(),
      db.collection('products').get(),
      db.collection('users').get(),
      db.collection('orders').orderBy('createdAt','desc').limit(5).get()
    ]);
    
    var sales = 0, pending = 0, done = 0;
    ordersSnap.forEach(function(d){
      var o = d.data();
      if (o.status === 'completed') { sales += Number(o.total)||0; done++; }
      else if (o.status === 'pending') pending++;
    });
    
    document.getElementById('vSales').textContent = Math.round(sales).toLocaleString('ar-EG');
    document.getElementById('vOrders').textContent = ordersSnap.size;
    document.getElementById('vProducts').textContent = productsSnap.size;
    document.getElementById('vUsers').textContent = usersSnap.size;
    document.getElementById('vSalesT').textContent = done + ' طلب مكتمل';
    document.getElementById('vOrdersT').textContent = pending + ' معلق';
    document.getElementById('vProductsT').textContent = 'منتج مسجل';
    document.getElementById('vUsersT').textContent = 'مستخدم';
    
    // Recent orders
    var recent = document.getElementById('vRecent');
    if (recentSnap.empty) {
      recent.innerHTML = '<div class="ve"><div class="ve-icon">✨</div><div class="ve-text">لا توجد طلبات بعد</div></div>';
    } else {
      var html = '';
      recentSnap.forEach(function(d){
        var o = d.data();
        var cls = o.status === 'completed' ? 'done' : (o.status === 'cancelled' ? 'rejected' : 'pending');
        var lbl = o.status === 'completed' ? 'مكتمل' : (o.status === 'cancelled' ? 'ملغى' : 'معلق');
        html += '<div class="vor">'
          + '<div class="vor-id">#' + d.id.slice(-6) + '</div>'
          + '<div class="vor-name">' + (o.customerName || o.customer || 'عميل') + '</div>'
          + '<div class="vor-total">' + (Number(o.total)||0).toFixed(0) + ' ر</div>'
          + '<div class="vor-status ' + cls + '">' + lbl + '</div>'
          + '</div>';
      });
      recent.innerHTML = html;
    }
  } catch(e){
    console.error('load', e);
    toast('تعذر تحميل بعض البيانات');
  }
  
  document.getElementById('vLoad').style.display = 'none';
}
</script>
</body>
</html>
