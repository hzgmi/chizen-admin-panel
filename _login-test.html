<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Test</title>
<style>
body{font-family:system-ui;background:#0a0825;color:#fff;padding:20px;max-width:500px;margin:0 auto}
h1{color:#a855f7;font-size:18px;margin-bottom:16px}
.step{background:rgba(255,255,255,0.05);border:1px solid rgba(168,85,247,0.3);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px}
.ok{color:#10b981}.err{color:#ef4444}.warn{color:#f59e0b}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;margin:6px 0;box-sizing:border-box;font-size:14px;font-family:inherit}
button{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;font-family:inherit}
#log{background:#000;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;margin-top:14px;white-space:pre-wrap;max-height:50vh;overflow:auto;min-height:150px}
</style>
</head>
<body>
<h1>🔍 اختبار Firebase Auth</h1>

<div class="step" id="step1">⏳ تحميل Firebase CDN...</div>
<div class="step" id="step2">⏳ تحميل firebase-config.js...</div>
<div class="step" id="step3">⏳ تهيئة Firebase...</div>
<div class="step" id="step4">⏳ جاهز</div>

<input id="email" type="email" placeholder="البريد الإلكتروني" value="mgdi776035709@gmail.com">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="doTest()">🔐 اختبر الدخول</button>

<div id="log">[السجل]</div>

<!-- ═══ هذا ما نسيناه في النسخة السابقة ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="document.getElementById('step1').innerHTML='<span class=err>❌ فشل تحميل Firebase CDN</span>'"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="document.getElementById('step1').innerHTML='<span class=err>❌ فشل تحميل firebase-auth</span>'"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="document.getElementById('step1').innerHTML='<span class=err>❌ فشل تحميل firestore</span>'"></script>
<script src="firebase-config.js" onerror="document.getElementById('step2').innerHTML='<span class=err>❌ فشل تحميل firebase-config.js</span>'"></script>

<script>
document.getElementById('step1').innerHTML = (typeof firebase !== 'undefined') 
  ? '<span class="ok">✅ Firebase CDN محمّل — v' + firebase.SDK_VERSION + '</span>'
  : '<span class="err">❌ Firebase CDN لم يُحمّل</span>';

document.getElementById('step2').innerHTML = (typeof window.FIREBASE_CONFIG !== 'undefined')
  ? '<span class="ok">✅ firebase-config.js محمّل — Project: ' + window.FIREBASE_CONFIG.projectId + '</span>'
  : '<span class="err">❌ firebase-config.js لم يُحمّل</span>';

try {
  if(typeof firebase !== 'undefined' && typeof window.FIREBASE_CONFIG !== 'undefined'){
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    window.__testDb = firebase.firestore();
    window.__testAuth = firebase.auth();
    document.getElementById('step3').innerHTML = '<span class="ok">✅ Firebase تمت تهيئته بنجاح</span>';
    document.getElementById('step4').innerHTML = '<span class="ok">✅ جاهز للاختبار</span>';
  } else {
    document.getElementById('step3').innerHTML = '<span class="err">❌ لا يمكن التهيئة — تحقق من الخطوات أعلاه</span>';
    document.getElementById('step4').innerHTML = '<span class="warn">⚠️ متوقف</span>';
  }
} catch(e) {
  document.getElementById('step3').innerHTML = '<span class="err">❌ فشل التهيئة: ' + e.message + '</span>';
}

function log(msg){
  var l = document.getElementById('log');
  l.textContent += '\n' + msg;
  l.scrollTop = l.scrollHeight;
}

async function doTest(){
  log('━━━━━━━━━━━━━━━━━');
  log('▶ بدء الاختبار');
  
  if(typeof firebase === 'undefined'){ log('❌ Firebase غير محمّل'); return; }
  if(typeof window.__testAuth === 'undefined'){ log('❌ Firebase لم يُهيأ'); return; }
  
  var em = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  if(!em || !pw){ log('❌ أدخل البريد وكلمة المرور'); return; }
  
  log('📧 ' + em);
  log('⏳ محاولة الدخول...');
  
  try {
    var result = await window.__testAuth.signInWithEmailAndPassword(em, pw);
    log('✅ نجح الدخول');
    log('👤 UID: ' + result.user.uid);
    
    log('⏳ فحص users...');
    var udoc = await window.__testDb.collection('users').doc(result.user.uid).get();
    if(udoc.exists){
      var u = udoc.data();
      log('📋 role=' + (u.role||'?') + ', cat=' + (u.assignedCategory||'?'));
    }
    
    log('⏳ فحص admins...');
    var adoc = await window.__testDb.collection('admins').doc(result.user.uid).get();
    if(adoc.exists) log('📋 admins role=' + (adoc.data().role||'?'));
    
    log('✅ انتهى — يجب أن يظهر دور cat_manager');
  } catch(e) {
    log('❌ فشل: ' + (e.code||'?') + ' — ' + (e.message||'?'));
  }
}
</script>
</body>
</html>
