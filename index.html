      this.loadPickupAdminData();
    };
    
    // ═══ تبديل التبويب الداخلي ═══
    A.switchPickupAdminTab = function(tab) {
      this.currentPickupTab = tab;
      this.renderPickupAdmin();
    };
    
    // ═══ تحميل البيانات ═══
    A.loadPickupAdminData = async function() {
      try {
        if (!window.__pickupAdminData) {
          var doc = await FB.db.collection('config').doc('pickup_areas').get();
          if (doc.exists) {
            window.__pickupAdminData = doc.data() || { aden: [], yemen: [] };
          } else {
            window.__pickupAdminData = { aden: [], yemen: [] };
          }
        }
        this.renderPickupContent();
      } catch(e) {
        var c = document.getElementById('pickup-admin-content');
        if (c) c.innerHTML = '<div style="color:#f44;padding:20px;text-align:center;">❌ ' + e.message + '</div>';
      }
    };
    
    // ═══ رسم المحتوى ═══
    A.renderPickupContent = function() {
      var c = document.getElementById('pickup-admin-content');
      if (!c) return;
      c.style.opacity = '1';
      
      var tab = this.currentPickupTab || 'aden';
      var areas = (window.__pickupAdminData && window.__pickupAdminData[tab]) || [];
      
      var html = '';
      
      // نموذج الإضافة
      html += '<div style="background:rgba(168,85,247,0.1);padding:14px;border-radius:12px;margin-bottom:16px;border:1px solid rgba(168,85,247,0.3);">' +
        '<div style="font-weight:900;margin-bottom:10px;color:#a855f7;">➕ إضافة منطقة جديدة</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;">' +
          '<input class="fi" id="new-area-name" placeholder="اسم المنطقة" style="font-size:12px;">' +
          '<input class="fi" id="new-area-city" placeholder="المدينة" style="font-size:12px;">' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:60px 1fr 1fr;gap:6px;margin-bottom:8px;">' +
          '<input class="fi" id="new-area-icon" placeholder="📍" style="text-align:center;font-size:16px;">' +
          '<input class="fi" id="new-area-lat" type="number" step="0.0001" placeholder="Latitude" style="font-size:12px;">' +
          '<input class="fi" id="new-area-lng" type="number" step="0.0001" placeholder="Longitude" style="font-size:12px;">' +
        '</div>' +
        '<button class="btn bp" onclick="A.addPickupArea()" style="width:100%;font-size:12px;padding:10px;">➕ إضافة</button>' +
        '<div style="font-size:10px;color:#888;margin-top:6px;text-align:center;">💡 استخدم خرائط Google للحصول على الإحداثيات</div>' +
      '</div>';
      
      // قائمة المناطق
      if (areas.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:#888;background:rgba(255,255,255,0.02);border-radius:12px;">' +
          '<div style="font-size:48px;margin-bottom:12px;">📭</div>' +
          '<div style="font-size:14px;">لا توجد مناطق بعد</div>' +
          '<div style="font-size:11px;margin-top:6px;opacity:0.7;">أضف أول منطقة من النموذج أعلاه</div>' +
        '</div>';
      } else {
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
          '<div style="font-size:12px;color:#888;">إجمالي: <b style="color:#a855f7;">' + areas.length + '</b> منطقة</div>' +
          '<div style="font-size:12px;color:#888;"><b style="color:#10b981;">' + areas.reduce(function(s, a){ return s + (a.points || []).length; }, 0) + '</b> نقطة توصيل</div>' +
        '</div>';
        
        areas.forEach(function(a, i) {
          var pointsCount = (a.points || []).length;
          html += '<div style="background:rgba(255,255,255,0.04);padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid rgba(168,85,247,0.15);">' +
            // header
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
              '<div style="display:flex;align-items:center;gap:10px;flex:1;">' +
                '<div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(168,85,247,0.2));display:flex;align-items:center;justify-content:center;font-size:20px;">' + (a.icon || '📍') + '</div>' +
                '<div style="flex:1;min-width:0;">' +
                  '<div style="font-weight:900;color:#fff;font-size:13px;">' + a.name + '</div>' +
                  '<div style="font-size:10px;color:#888;">' + (a.city || '') + ' • ' + a.lat + ', ' + a.lng + '</div>' +
                '</div>' +
              '</div>' +
              '<button class="btn bd bsm" onclick="A.deletePickupArea(' + i + ')" style="padding:6px 10px;font-size:11px;">🗑️</button>' +
            '</div>' +
            // نقاط التوصيل
            '<div style="border-top:1px solid rgba(168,85,247,0.15);padding-top:10px;">' +
              '<div style="font-size:11px;color:#a855f7;font-weight:900;margin-bottom:6px;">📦 نقاط التوصيل (' + pointsCount + ')</div>' +
              ((a.points || []).map(function(p, pi) {
                return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(255,255,255,0.04);border-radius:6px;margin-bottom:4px;">' +
                  '<div style="font-size:11px;color:#fff;">' + (p.icon || '📦') + ' ' + p.name + '</div>' +
                  '<button onclick="A.deletePickupPoint(' + i + ',' + pi + ')" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;">×</button>' +
                '</div>';
              }).join('') || '<div style="font-size:10px;color:#666;text-align:center;padding:6px;">لا توجد نقاط بعد</div>') +
              // نموذج إضافة نقطة
              '<div style="display:grid;grid-template-columns:50px 1fr 1fr 1fr;gap:4px;margin-top:8px;">' +
                '<input class="fi" id="pt-icon-' + i + '" placeholder="📦" style="text-align:center;font-size:14px;padding:6px 4px;">' +
                '<input class="fi" id="pt-name-' + i + '" placeholder="اسم النقطة" style="font-size:11px;padding:6px 4px;">' +
                '<input class="fi" id="pt-lat-' + i + '" type="number" step="0.0001" placeholder="Lat" style="font-size:10px;padding:6px 4px;">' +
                '<input class="fi" id="pt-lng-' + i + '" type="number" step="0.0001" placeholder="Lng" style="font-size:10px;padding:6px 4px;">' +
              '</div>' +
              '<button class="btn bg2 bsm" onclick="A.addPickupPoint(' + i + ')" style="margin-top:6px;width:100%;font-size:11px;padding:8px;">➕ إضافة نقطة</button>' +

      // زر الحفظ
      html += '<div style="margin-top:20px;padding-top:16px;border-top:2px solid rgba(168,85,247,0.3);">' +
        '<button class="btn bp" onclick="A.savePickupAreas()" style="width:100%;padding:14px;font-size:14px;">💾 حفظ الكل في السيرفر</button>' +

    // ═══ CRUD ═══

      var name = (document.getElementById('new-area-name').value || '').trim();

      var icon = (document.getElementById('new-area-icon').value || '').trim() || '📍';

      var lng = parseFloat(document.getElementById('new-area-lng').value);
      
      if (!name) return this.toast('أدخل اسم المنطقة', 'err');

      var tab = this.currentPickupTab || 'aden';
      if (!window.__pickupAdminData[tab]) window.__pickupAdminData[tab] = [];
      window.__pickupAdminData[tab].push({ name: name, city: city, icon: icon, lat: lat, lng: lng, points: [] });
      
      await this.savePickupAreas();
    };
    
    A.deletePickupArea = async function(i) {
      var self = this;
      this.confirm('حذف المنطقة؟', 'سيتم حذف كل نقاط التوصيل داخلها', async function() {
        var tab = self.currentPickupTab || 'aden';
        window.__pickupAdminData[tab].splice(i, 1);
        await self.savePickupAreas();
      });
    };
    
    A.addPickupPoint = async function(areaIdx) {
      var name = (document.getElementById('pt-name-' + areaIdx).value || '').trim();
      var icon = (document.getElementById('pt-icon-' + areaIdx).value || '').trim() || '📦';
      var lat = parseFloat(document.getElementById('pt-lat-' + areaIdx).value);
      var lng = parseFloat(document.getElementById('pt-lng-' + areaIdx).value);
      
      if (!name) return this.toast('أدخل اسم النقطة', 'err');
      
      var tab = this.currentPickupTab || 'aden';
      var area = window.__pickupAdminData[tab][areaIdx];
      if (!area) return;
      
      // إذا لم تُدخل إحداثيات - استخدم إحداثيات المنطقة
      if (!lat || !lng) {
        lat = area.lat + (Math.random() - 0.5) * 0.001;
        lng = area.lng + (Math.random() - 0.5) * 0.001;
      }
      
      area.points = area.points || [];
      area.points.push({ name: name, icon: icon, lat: lat, lng: lng });
      
      await this.savePickupAreas();
    };
    
    A.deletePickupPoint = async function(areaIdx, ptIdx) {
      var tab = this.currentPickupTab || 'aden';
      var area = window.__pickupAdminData[tab][areaIdx];
      if (!area || !area.points) return;
      area.points.splice(ptIdx, 1);
      await this.savePickupAreas();
    };
    
    A.savePickupAreas = async function() {
      try {
        var statusEl = document.getElementById('pickup-save-status');
        if (statusEl) statusEl.innerHTML = '⏳ جاري الحفظ...';
        
        await FB.db.collection('config').doc('pickup_areas').set({
          aden: window.__pickupAdminData.aden || [],
          yemen: window.__pickupAdminData.yemen || [],
          updatedAt: new Date()
        });
        
        this.toast('✅ تم الحفظ', 'suc');
        this.renderPickupContent();
        
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#10b981;">✅ آخر حفظ: ' + new Date().toLocaleTimeString('ar') + '</span>';
        }
      } catch(e) {
        this.toast('فشل الحفظ: ' + e.message, 'err');
      }
    };
    
    console.log('[PICKUP-ADMIN] installed');
  }
  
  waitForA();
})();
</script>

<script id="chz-simple-logout">
(function(){
  console.log('[SIMPLE-LOGOUT] installing...');
  
  window.__simpleLogout = function() {
    if (!confirm('تسجيل الخروج من حسابك؟')) return;
    try { if (window.FB && FB.logout) FB.logout(); } catch(e) {}
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    setTimeout(function() {
      window.location.replace(window.location.pathname + '?logout=' + Date.now());
    }, 300);
  };
  
  // استبدال أزرار logout في لوحة القسم
  function patchCatMgrLogout() {
    var app = document.getElementById('cat-mgr-app');
    if (!app) return;
    var buttons = app.querySelectorAll('[onclick*="A.logout"], [onclick*="APP.logout"], [onclick*="logout"]');
    buttons.forEach(function(btn) {
      var oc = btn.getAttribute('onclick') || '';
      if (oc.indexOf('__simpleLogout') > -1) return;
      btn.setAttribute('onclick', 'window.__simpleLogout()');
      console.log('[SIMPLE-LOGOUT] patched:', (btn.textContent || '').trim().substring(0, 20));
    });
  }
  
  // تشغيل عند تغيير body (لا Observer على #cat-mgr-app لأنه يُنشأ ديناميكياً)
  setTimeout(patchCatMgrLogout, 1000);
  setTimeout(patchCatMgrLogout, 3000);
  setInterval(patchCatMgrLogout, 2000);
  
  console.log('[SIMPLE-LOGOUT] ready');
})();
</script>

          logoUrl: g('s-logo-url').trim(),
          welcomeMessage: g('s-slogan').trim(),
          defaultTheme: g('s-default-theme'),
          
          // 6) الإشعارات
          pushEnabled: gc('s-push-enabled'),
          waOrders: gc('s-wa-orders'),
          notifyNewOrder: gc('s-notify-new-order'),
          notifyPayment: gc('s-notify-payment'),
          notifyDelivery: gc('s-notify-delivery'),
          welcomeTitle: g('s-welcome-title').trim(),
          welcomeBody: g('s-welcome-body').trim(),

          supportMessage: g('s-support-msg').trim(),
          appVersion: g('s-version').trim() || '1.0.0',
          
          // metadata
          updatedAt: new Date(),
          updatedBy: FB.currentUser ? FB.currentUser.uid : ''
        };
        
        await FB.db.collection('config').doc('settings').set(settings, { merge: true });
        
        // حدّث الـ cache

<script id="chz-login-enhance">
(function(){
  'use strict';
  console.log('[LOGIN-ENHANCE] ready');
  
  // ═══ Ripple Effect ═══
  function addRipple(button, event) {
    var rect = button.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var x = (event.clientX || event.touches && event.touches[0].clientX || rect.left + rect.width/2) - rect.left - size/2;
    var y = (event.clientY || event.touches && event.touches[0].clientY || rect.top + rect.height/2) - rect.top - size/2;
    
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    button.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
  }
  
  // ربط ripple بكل الأزرار
  function attachRipple() {
    document.querySelectorAll('.gbtn').forEach(function(btn) {
      if (btn.__rippled) return;
      btn.__rippled = true;
      btn.addEventListener('click', function(e) { addRipple(this, e); });
    });
  }
  
  // ═══ Enter key في الحقول ═══
  function attachEnterKey() {
    var pass = document.getElementById('login-pass');
    var email = document.getElementById('login-email');
    if (pass && !pass.__entered) {
      pass.__entered = true;
      pass.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
      });
    }
    if (email && !email.__entered) {
      email.__entered = true;
      email.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { 
          e.preventDefault(); 
          if (pass) pass.focus();
        }
      });
    }
  }
  
  // ═══ تحسين دالة doLogin ═══
  function enhanceDoLogin() {
    if (!window.doLogin) { setTimeout(enhanceDoLogin, 200); return; }
    if (window.doLogin.__enhanced) return;
    
    var orig = window.doLogin;
    window.doLogin = async function() {
      var btn = document.getElementById('btn-do-login');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('loading');
        var span = btn.querySelector('span');
        if (span) span.textContent = 'جاري الدخول...';
      }
      
      try {
        var result = await orig.apply(this, arguments);
        // إذا فشل — إعادة الزر
        setTimeout(function() {
          if (btn && btn.disabled) {
            btn.disabled = false;
            btn.classList.remove('loading');
            var sp = btn.querySelector('span');
            if (sp) sp.textContent = '🔓 تسجيل الدخول';
          }
        }, 3000);
        return result;
      } catch(e) {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('loading');
          var sp = btn.querySelector('span');

        '<div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:10px;margin-bottom:14px;">' +

        '<div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:10px;margin-bottom:14px;">' +
          '<div style="font-size:10px;color:#888;margin-bottom:6px;">📦 الأقسام</div>' +
          (catKeys.length > 0 ? catKeys.map(function(k) {

    // ═══ فتح تعيين السائق (محسّن) ═══
    A.openAssignDriver = function(orderId) {
      var order = this.dispatch.orders.find(function(o) { return o.id === orderId; });
      if (!order) return this.toast('الطلب غير موجود', 'err');
      
      var D = this.dispatch;
      var last = D.lastDriver || {};
      
      var body = 
        '<div style="background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.3);border-radius:10px;padding:12px;margin-bottom:14px;">' +
          '<div style="font-size:12px;color:#a855f7;font-weight:900;">📦 #' + orderId.substring(0, 10) + '</div>' +
          '<div style="font-size:11px;color:#fff;margin-top:4px;">' + (order.name || '—') + ' • ' + (order.phone || '—') + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:2px;">📍 ' + (order.pickup || '—') + '</div>' +
        '</div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">اسم السائق *</label>' +
          '<input class="fi" id="disp-driver-name" value="' + (last.name || '') + '" placeholder="مثال: أحمد علي" style="width:100%;"></div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">رقم واتساب *</label>' +
          '<input class="fi" id="disp-driver-phone" type="tel" value="' + (last.phone || '') + '" placeholder="967771234567" style="width:100%;direction:ltr;"></div>' +
        
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">' +
          '<div><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">المنطقة</label><input class="fi" id="disp-region" placeholder="صنعاء" style="width:100%;"></div>' +
          '<div><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">رسوم التوصيل</label><input class="fi" id="disp-fee" type="number" value="0" placeholder="0" style="width:100%;"></div>' +
        '</div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">ملاحظة للسائق</label>' +
          '<textarea class="fi" id="disp-note" placeholder="اتصل قبل الوصول..." style="width:100%;height:60px;resize:none;"></textarea></div>';
      
      var actions = '<button class="btn bg2" onclick="A.cm()">إلغاء</button>' +
        '<button class="btn bp" onclick="A.assignDriverAndSend(\'' + orderId + '\')">📤 إرسال واتساب</button>';
      
      this.modal('🚚 تعيين سائق', body, actions);
    };

    // ═══ تنفيذ الإرسال ═══
    A.assignDriverAndSend = async function(orderId) {
      var driverName = (document.getElementById('disp-driver-name').value || '').trim();
      var driverPhone = (document.getElementById('disp-driver-phone').value || '').trim();
      var region = (document.getElementById('disp-region').value || '').trim();
      var fee = parseFloat(document.getElementById('disp-fee').value) || 0;
      var note = (document.getElementById('disp-note').value || '').trim();
      
      if (!driverName) return this.toast('أدخل اسم السائق', 'err');
      if (!driverPhone) return this.toast('أدخل رقم السائق', 'err');
      
      var cleanPhone = driverPhone.replace(/\D/g, '');
      if (cleanPhone.length === 9 && cleanPhone.startsWith('7')) cleanPhone = '967' + cleanPhone;
      if (cleanPhone.length === 10 && cleanPhone.startsWith('0')) cleanPhone = '967' + cleanPhone.slice(1);
      
      try {
        var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
        if (snap.empty) return this.toast('الطلب غير موجود', 'err');
        
        var order = snap.docs[0].data();
        await snap.docs[0].ref.update({
          sentToCustomer: true,
          workflowStatus: 'sent_to_customer',
          status: 'shipped',
          deliveryInfo: {
            driverName: driverName,
            driverPhone: cleanPhone,
            region: region,
            deliveryFee: fee,
            note: note,
            assignedAt: new Date(),
            assignedBy: FB.currentUser ? FB.currentUser.uid : ''
          }
        });
        
        // احفظ آخر سائق
        localStorage.setItem('chizen_last_driver', JSON.stringify({ name: driverName, phone: cleanPhone }));
        this.dispatch.lastDriver = { name: driverName, phone: cleanPhone };
        
        // رسالة WhatsApp
        var items = order.items || [];
        var itemsList = items.map(function(it) { return '• ' + (it.name || 'منتج') + ' × ' + (it.qty || 1); }).join('\n');
        
        var waMsg = '🚚 *طلب توصيل جديد*' + '\n\n' +
          '*رقم الطلب:* #' + orderId.substring(0, 10) + '\n' +
          '*العميل:* ' + (order.name || '') + '\n' +
          '*الهاتف:* ' + (order.phone || '') + '\n' +
          '*العنوان:* ' + (order.pickup || '') + '\n\n' +
          '📦 *المنتجات:*\n' + itemsList + '\n\n' +
          '💰 *المجموع:* ' + (order.total || 0) + ' ر.س';
        if (fee > 0) waMsg += '\n🚗 *رسوم التوصيل:* ' + fee + ' ر.س';
        waMsg += '\n💵 *المستلم:* ' + ((order.total || 0) + fee) + ' ر.س';
        if (note) waMsg += '\n\n📝 *ملاحظة:* ' + note;
        waMsg += '\n\nشكراً 🌟';
        
        // إشعار للعميل
        if (order.customerId && FB.addUserNotification) {
          await FB.addUserNotification(order.customerId, {
            title: '🚚 طلبك في الطريق!',
            body: 'السائق ' + driverName + ' سيصل قريباً',
            type: 'order'
          });
        }
        
        this.cm();
        this.toast('✅ تم الإرسال', 'suc');
        window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(waMsg), '_blank');
        await this.loadData();
        this.dispatch.orders = this.orders || [];
        this.renderDispatcher();
      } catch(e) {
        this.toast('فشل: ' + e.message, 'err');
      }
    };

    // ═══ تأكيد الدفع ═══
    A.verifyPayment = async function(orderId) {
      var self = this;
      this.confirm('تأكيد الدفع؟', 'سيبدأ تجهيز الطلب', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            'payment.status': 'verified',
            'payment.verifiedBy': FB.currentUser ? FB.currentUser.uid : '',
            'payment.verifiedAt': new Date(),
            workflowStatus: 'awaiting_categories'
          });
          var order = snap.docs[0].data();
          if (order.customerId && FB.addUserNotification) {
            await FB.addUserNotification(order.customerId, {
              title: '✅ تم تأكيد الدفع',
              body: 'طلبك جاري تجهيزه الآن',
              type: 'order'
            });
          }
          self.toast('✅ تم', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      }, 'primary');
    };

    // ═══ رفض الدفع ═══
    A.rejectPayment = function(orderId) {
      var self = this;
      this.confirm('رفض الدفع؟', 'سيتم إعلام العميل', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            'payment.status': 'rejected',
            'payment.verifiedBy': FB.currentUser ? FB.currentUser.uid : '',
            'payment.verifiedAt': new Date(),
            workflowStatus: 'payment_rejected'
          });
          self.toast('تم الرفض', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      });
    };

    // ═══ تم التسليم ═══
    A.markDelivered = async function(orderId) {
      var self = this;
      this.confirm('تم التسليم؟', 'سيتم إغلاق الطلب', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            workflowStatus: 'delivered',
            status: 'completed',
            deliveredAt: new Date()
          });
          self.toast('✅ تم', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      }, 'primary');
    };

    // ═══ onSnapshot للتحديث الفوري ═══
    function setupListener() {
      if (!window.FB || !FB.db) { setTimeout(setupListener, 500); return; }
      if (A.dispatch.listener) return;
      
      try {
        A.dispatch.listener = FB.db.collection('orders')
          .orderBy('createdAt', 'desc')
          .limit(100)
          .onSnapshot(function(snap) {
            var newOrders = [];
            var hasNew = false;
            snap.forEach(function(doc) {
              var d = doc.data();
              d.id = d.id || doc.id;
              newOrders.push(d);
              if (!A.dispatch.knownOrderIds.has(d.id)) {
                hasNew = true;
              }
            });
            
            A.dispatch.orders = newOrders;
            if (window.A && A.orders) {
              A.orders = newOrders;
            }
            
            // إذا كانت اللوحة مفتوحة — أعد الرسم
            var disp = document.getElementById('sc-dispatcher');
            if (disp && disp.classList.contains('active')) {
              A.renderDispatcher();
            }
            
            // إذا وصل طلب جديد أثناء التصفح
            if (hasNew && A.dispatch.knownOrderIds.size > 0) {
              playNotifySound();
              var readyCount = newOrders.filter(function(o) { return categorize(o) === 'ready'; }).length;
              if (readyCount > 0) {
                browserNotify('🔔 طلبات جديدة', 'لديك ' + readyCount + ' طلب جاهز للإرسال');
              }
            }
            
            // حدّث known
            newOrders.forEach(function(o) { A.dispatch.knownOrderIds.add(o.id); });
          }, function(err) {
            console.warn('[DISPATCH-V2] listener error:', err.message);
          });
          
        console.log('[DISPATCH-V2] listener active');
      } catch(e) {
        console.warn('[DISPATCH-V2] setup error:', e.message);
      }
    }

    // ═══ التهيئة ═══
    function init() {
      A.dispatch.orders = A.orders || [];
      setupListener();
    }

    // ربط A.tab('dispatcher')
    if (A.tab) {
      var origTab = A.tab;
      A.tab = function(tab, el) {
        origTab.call(this, tab, el);
        if (tab === 'dispatcher') {
          // تأكد من تحميل البيانات
          if (!A.dispatch.initialized) {
            A.dispatch.initialized = true;
            A.dispatch.orders = A.orders || [];
            init();
          }
          setTimeout(function() { A.renderDispatcher(); }, 100);
        }
      };
    }

    console.log('[DISPATCH-V2] installed');
  }

  waitForA();
})();
</script>

<script id="chz-dedicated-delivery-v2">
(function(){
  'use strict';
  console.log('[DELIVERY-V2] loading...');

  window.CD = {
    tab: 'ready',
    orders: [],
    search: '',
    listener: null,
    knownIds: new Set(),
    initialized: false,
    audioCtx: null,
    lastDriver: (function() {
      try { return JSON.parse(localStorage.getItem('chizen_last_driver') || '{}'); } catch(e) { return {}; }
    })()
  };

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function categorize(o) {
    var p = o.payment || {};
    var w = o.workflowStatus || '';
    if (o.sentToCustomer === true || w === 'sent_to_customer' || o.status === 'shipped') return 'shipping';
    if (w === 'delivered' || o.status === 'completed') return 'delivered';
    if (w === 'ready_to_send') return 'ready';
    if (p.status === 'verified' && o.allCategoriesConfirmed === true) return 'ready';
    return 'not_ready';
  }

  function getTs(o) {
    if (!o.createdAt) return 0;
    return o.createdAt.seconds ? o.createdAt.seconds * 1000 : 0;
  }

  function timeAgo(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 1) return 'الآن';
    if (diff < 60) return 'منذ ' + diff + ' د';
    if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
    if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
    return new Date(ts).toLocaleDateString('ar');
  }

  function isLate(o) {
    var ts = getTs(o);
    if (!ts) return false;
    var diff = (Date.now() - ts) / 60000;
    return diff > 120; // أكثر من ساعتين
  }

  function lateDuration(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    var hours = Math.floor(diff / 60);
    var mins = diff % 60;
    return hours + 'س ' + mins + 'د';
  }

  // ═══ صوت الإشعار ═══
  function playNotifySound() {
    try {
      if (!window.CD.audioCtx) {
        window.CD.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      var ctx = window.CD.audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      
      var now = ctx.currentTime;
      // نغمة مزدوجة
      [0, 0.15].forEach(function(offset) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = offset === 0 ? 880 : 1100;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, now + offset);
        gain.gain.linearRampToValueAtTime(0.2, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.3);
        osc.start(now + offset);
        osc.stop(now + offset + 0.3);
      });
    } catch(e) { console.warn('[DELIVERY] sound error:', e.message); }
  }

  // ═══ إشعار المتصفح ═══
  function browserNotify(title, body) {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      try { new Notification(title, { body: body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>', tag: 'delivery-new' }); } catch(e) {}
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission();
    }
  }

  // ═══ CSS متعدد الأوضاع ═══

      '--dlv-bg:#07091d;--dlv-header-bg:rgba(10,8,30,0.95);--dlv-card-bg:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));' +
      '--dlv-card-border:rgba(16,185,129,0.25);--dlv-text:#fff;--dlv-text-sub:#b8c0d8;--dlv-text-muted:#6b7591;' +
      '--dlv-nav-bg:rgba(10,8,30,0.98);--dlv-input-bg:rgba(15,10,35,0.9);--dlv-input-border:rgba(168,85,247,0.4);' +
      '--dlv-divider:rgba(168,85,247,0.25);--dlv-late:#ef4444;' +
    '}' +

    '.dlv-app[data-theme="light"]{' +
      'background:linear-gradient(135deg,#f5f7fb,#eef2ff);color:#1a1a2e;' +
      '--dlv-bg:#f5f7fb;--dlv-header-bg:#ffffff;--dlv-card-bg:#ffffff;' +
      '--dlv-card-border:#e5e7eb;--dlv-text:#1a1a2e;--dlv-text-sub:#6b7280;--dlv-text-muted:#9ca3af;' +
      '--dlv-nav-bg:#ffffff;--dlv-input-bg:#f9fafb;--dlv-input-border:#e5e7eb;' +

  // ═══ بناء الهيكل ═══
  function buildShell() {
    return '' +
      '<header class="dlv-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(16,185,129,0.4);">🚚</div>' +

        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button class="dlv-theme-btn" onclick="window.__dlvToggleTheme()" id="dlv-theme-icon">🌙</button>' +
          '<button onclick="window.__dlvLogout()" style="background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;">🚪 خروج</button>' +

      '<main class="dlv-main" id="dlv-main"></main>' +

        '<button class="dlv-nav-btn active" data-tab="ready" onclick="window.__dlvSwitchTab(\'ready\',this)">' +
          '<span class="icon">✅</span><span class="label">جاهزة</span>' +
          '<span class="count" id="dlv-count-ready" style="display:none;">0</span>' +
        '</button>' +
        '<button class="dlv-nav-btn" data-tab="shipping" onclick="window.__dlvSwitchTab(\'shipping\',this)">' +
          '<span class="icon">🚚</span><span class="label">توصيل</span>' +
          '<span class="count" id="dlv-count-shipping" style="display:none;">0</span>' +
        '</button>' +
        '<button class="dlv-nav-btn" data-tab="delivered" onclick="window.__dlvSwitchTab(\'delivered\',this)">' +
          '<span class="icon">📦</span><span class="label">تم التسليم</span>' +

      '</nav>';
  }

  // ═══ إحصائيات اليوم ═══
  function buildStats() {
    var today = new Date(); today.setHours(0,0,0,0);
    var todayTs = today.getTime();
    var todayOrders = window.CD.orders.filter(function(o) {
      return getTs(o) >= todayTs;
    });
    var todayRevenue = 0;
    var todayDelivered = 0;
    todayOrders.forEach(function(o) {
      var p = o.payment || {};
      if (p.status === 'verified') {
        todayRevenue += parseFloat(o.total) || 0;
      }
      if (o.status === 'completed' || (o.workflowStatus === 'delivered')) {
        todayDelivered++;
      }
    });
    
    return '<div class="dlv-stats">' +
      '<div class="dlv-stat" style="border-color:rgba(59,130,246,0.4);">' +
        '<div class="dlv-stat-icon">📦</div>' +
        '<div class="dlv-stat-label">طلبات اليوم</div>' +
        '<div class="dlv-stat-value" style="color:#3b82f6;">' + todayOrders.length + '</div>' +
      '</div>' +
      '<div class="dlv-stat" style="border-color:rgba(236,72,153,0.4);">' +
        '<div class="dlv-stat-icon">💰</div>' +
        '<div class="dlv-stat-label">إيرادات اليوم</div>' +
        '<div class="dlv-stat-value" style="color:#ec4899;">' + todayRevenue.toFixed(0) + '</div>' +
      '</div>' +
      '<div class="dlv-stat" style="border-color:rgba(16,185,129,0.4);">' +
        '<div class="dlv-stat-icon">✅</div>' +
        '<div class="dlv-stat-label">تم التسليم</div>' +
        '<div class="dlv-stat-value" style="color:#10b981;">' + todayDelivered + '</div>' +
      '</div>' +
    '</div>';
  }

  // ═══ رسم المحتوى ═══
  function renderContent() {
    var D = window.CD;
    var main = document.getElementById('dlv-main');
    if (!main) return;
    
    // فلترة حسب التبويب
    var filtered = D.orders.filter(function(o) { return categorize(o) === D.tab; });
    
    // بحث
    if (D.search) {
      var q = D.search.toLowerCase().trim();
      filtered = filtered.filter(function(o) {
        return (o.id || '').toLowerCase().indexOf(q) > -1 ||
               (o.name || '').toLowerCase().indexOf(q) > -1 ||
               (o.phone || '').toLowerCase().indexOf(q) > -1 ||
               (o.pickup || '').toLowerCase().indexOf(q) > -1;
      });
    }
    
    // ترتيب: الطلبات المتأخرة أولاً ثم الأحدث
    filtered.sort(function(a, b) {
      var la = isLate(a), lb = isLate(b);
      if (la && !lb) return -1;
      if (!la && lb) return 1;
      return getTs(b) - getTs(a);
    });

    // عدادات
    var counts = { ready: 0, shipping: 0, delivered: 0 };
    D.orders.forEach(function(o) {
      var cat = categorize(o);
      if (counts[cat] !== undefined) counts[cat]++;
    });
    ['ready', 'shipping', 'delivered'].forEach(function(k) {
      var badge = document.getElementById('dlv-count-' + k);
      if (badge) {
        badge.textContent = counts[k];
        badge.style.display = counts[k] > 0 ? 'inline-block' : 'none';
      }
    });

    // بناء HTML
    var html = buildStats();
    
    // بحث
    html += '<div class="dlv-search-wrap">' +
      '<input type="text" class="dlv-search" placeholder="🔍 ابحث برقم / اسم / هاتف / عنوان..." value="' + esc(D.search) + '" oninput="window.__dlvSearch(this.value)">' +
      '<span class="dlv-search-icon">🔍</span>' +
    '</div>';
    
    // قائمة
    if (filtered.length === 0) {
      var emptyMsg = D.search 
        ? 'لا نتائج للبحث "' + esc(D.search) + '"'
        : (D.tab === 'ready' ? '🎉 لا طلبات جاهزة حالياً' :
           D.tab === 'shipping' ? '🚚 لا توجد توصيلات نشطة' :
           '📦 لا توجد طلبات مسلّمة');
      html += '<div class="dlv-empty">' +
        '<div style="font-size:72px;margin-bottom:16px;">' + (D.search ? '🔍' : '📭') + '</div>' +
        '<div style="font-size:15px;font-weight:800;color:var(--dlv-text);">' + emptyMsg + '</div>' +
      '</div>';
    } else {
      html += filtered.map(function(o) { return buildCard(o); }).join('');
    }
    
    main.innerHTML = html;
  }

  // ═══ بطاقة طلب ═══
  function buildCard(o) {
    var oid = o.id || '';
    var di = o.deliveryInfo || {};
    var date = timeAgo(o);
    var late = isLate(o);
    var lateBadge = late 
      ? '<span class="dlv-late-badge">⚠️ متأخر ' + lateDuration(o) + '</span>'
      : '';
    
    var actions = '';
    if (window.CD.tab === 'ready') {
      actions = '<button onclick="event.stopPropagation();window.__dlvOpenAssign(\'' + oid + '\')" style="width:100%;margin-top:10px;padding:12px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(16,185,129,0.3);">🚚 تعيين سائق</button>';
    } else if (window.CD.tab === 'shipping') {
      actions = '<div style="margin-top:10px;padding:10px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.3);border-radius:10px;font-size:11px;">' +
        '<div style="color:#10b981;font-weight:800;margin-bottom:3px;">🚚 ' + esc(di.driverName || '—') + '</div>' +
        '<div style="color:var(--dlv-text-sub);direction:ltr;text-align:right;">' + esc(di.driverPhone || '—') + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:8px;">' +
        '<button onclick="event.stopPropagation();window.__dlvMarkDelivered(\'' + oid + '\')" style="flex:1;padding:10px;background:rgba(16,185,129,0.15);border:1.5px solid #10b981;color:#10b981;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">✅ تم التسليم</button>' +
        (di.driverPhone ? '<a href="https://wa.me/' + di.driverPhone + '" target="_blank" onclick="event.stopPropagation()" style="padding:10px 14px;background:#25D366;color:#fff;border-radius:10px;font-weight:900;font-size:12px;text-decoration:none;">💬</a>' : '') +
      '</div>';
    }

    return '<div class="dlv-card' + (late ? ' is-late' : '') + '" onclick="window.__dlvOpenDetails(\'' + oid + '\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;">' +
            '<span style="font-weight:900;color:#10b981;font-size:13px;">#' + esc(oid.substring(0, 10)) + '</span>' +
            '<span style="font-size:10px;color:var(--dlv-text-muted);">' + esc(date) + '</span>' +
            lateBadge +
          '</div>' +
          '<div class="dlv-card-name" style="font-size:13px;color:var(--dlv-text);font-weight:700;">' + esc(o.name || 'عميل') + '</div>' +
          '<div style="font-size:11px;color:var(--dlv-text-muted);">📱 ' + esc(o.phone || '—') + '</div>' +
        '</div>' +
        '<div style="text-align:left;">' +
          '<div style="font-weight:900;color:#ff4d94;font-size:15px;">' + (o.total || 0) + '</div>' +
          '<div style="font-size:9px;color:var(--dlv-text-muted);">ر.س</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--dlv-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;background:var(--dlv-input-bg);border-radius:8px;">📍 ' + esc(o.pickup || 'غير محدد') + '</div>' +
      actions +
    '</div>';
  }

  // ═══ بحث ═══
  window.__dlvSearch = function(q) {
    window.CD.search = q || '';
    clearTimeout(window.__dlvSearchTimer);
    window.__dlvSearchTimer = setTimeout(renderContent, 200);
  };

  // ═══ تبديل التبويبات ═══
  window.__dlvSwitchTab = function(tab, btn) {
    window.CD.tab = tab;
    document.querySelectorAll('.dlv-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  // ═══ تبديل الثيم ═══
  window.__dlvToggleTheme = function() {
    var app = document.getElementById('delivery-mgr-app');
    if (!app) return;
    var current = app.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_dlv_theme', next); } catch(e) {}
    var icon = document.getElementById('dlv-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  // ═══ تفاصيل الطلب ═══
  window.__dlvOpenDetails = function(orderId) {

        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">' +

          '<div><label style="display:block;font-size:11px;color:var(--dlv-text-sub);margin-bottom:4px;font-weight:700;">رسوم التوصيل</label><input id="dlv-fee" type="number" value="0" placeholder="0" style="width:100%;padding:12px;border-radius:10px;font-family:inherit;font-size:13px;box-sizing:border-box;outline:none;"></div>' +
        '</div>' +
        '<div style="margin-bottom:14px;"><label style="display:block;font-size:11px;color:var(--dlv-text-sub);margin-bottom:4px;font-weight:700;">ملاحظة (اختياري)</label><textarea id="dlv-note" placeholder="اتصل قبل الوصول..." style="width:100%;padding:12px;border-radius:10px;font-family:inherit;font-size:13px;height:60px;resize:none;box-sizing:border-box;outline:none;"></textarea></div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button onclick="this.closest(&quot;.dlv-modal&quot;).classList.remove(&quot;active&quot;)" style="flex:1;padding:14px;background:var(--dlv-input-bg);border:none;color:var(--dlv-text);border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;">إلغاء</button>' +
          '<button onclick="window.__dlvAssign(&quot;' + orderId + '&quot;)" style="flex:2;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;border-radius:10px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.3);">📤 إرسال واتساب</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    
    var existing = document.querySelector('.dlv-modal');
    if (existing) existing.remove();
    var wrapper = document.createElement('div');
    wrapper.innerHTML = body;
    document.body.appendChild(wrapper.firstElementChild);
  };

  // ═══ تنفيذ الإرسال ═══
  window.__dlvAssign = async function(orderId) {
    var driverName = (document.getElementById('dlv-driver-name').value || '').trim();
    var driverPhone = (document.getElementById('dlv-driver-phone').value || '').trim();
    var region = (document.getElementById('dlv-region').value || '').trim();
    var fee = parseFloat(document.getElementById('dlv-fee').value) || 0;
    var note = (document.getElementById('dlv-note').value || '').trim();
    
    if (!driverName) return alert('أدخل اسم السائق');
    if (!driverPhone) return alert('أدخل رقم السائق');
    
    var cleanPhone = driverPhone.replace(/\D/g, '');
    if (cleanPhone.length === 9 && cleanPhone.startsWith('7')) cleanPhone = '967' + cleanPhone;
    if (cleanPhone.length === 10 && cleanPhone.startsWith('0')) cleanPhone = '967' + cleanPhone.slice(1);
    
    try {
      var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
      if (snap.empty) return alert('الطلب غير موجود');
      
      var order = snap.docs[0].data();
      await snap.docs[0].ref.update({
        sentToCustomer: true,
        workflowStatus: 'sent_to_customer',
        status: 'shipped',
        deliveryInfo: {
          driverName: driverName,
          driverPhone: cleanPhone,
          region: region,
          deliveryFee: fee,
          note: note,
          assignedAt: new Date(),
          assignedBy: FB.currentUser ? FB.currentUser.uid : ''
        }
      });
      
      localStorage.setItem('chizen_last_driver', JSON.stringify({ name: driverName, phone: cleanPhone }));
      window.CD.lastDriver = { name: driverName, phone: cleanPhone };
      
      var items = order.items || [];
      var itemsList = items.map(function(it) { return '• ' + (it.name || 'منتج') + ' × ' + (it.qty || 1); }).join('\n');
      
      var waMsg = '🚚 *طلب توصيل جديد*\n\n' +
        '*رقم الطلب:* #' + orderId.substring(0, 10) + '\n' +
        '*العميل:* ' + (order.name || '') + '\n' +
        '*الهاتف:* ' + (order.phone || '') + '\n' +
        '*العنوان:* ' + (order.pickup || '') + '\n\n' +
        '📦 *المنتجات:*\n' + itemsList + '\n\n' +
        '💰 *المجموع:* ' + (order.total || 0) + ' ر.س';
      if (fee > 0) waMsg += '\n🚗 *رسوم التوصيل:* ' + fee + ' ر.س';
      waMsg += '\n💵 *المستلم:* ' + ((order.total || 0) + fee) + ' ر.س';
      if (note) waMsg += '\n\n📝 *ملاحظة:* ' + note;
      waMsg += '\n\nشكراً 🌟';
      
      if (order.customerId && FB.addUserNotification) {
        try {
          await FB.addUserNotification(order.customerId, {
            title: '🚚 طلبك في الطريق!',
            body: 'السائق ' + driverName + ' سيصل قريباً',
            type: 'order'
          });
        } catch(e) {}
      }
      
      var modal = document.querySelector('.dlv-modal');
      if (modal) modal.remove();
      
      window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(waMsg), '_blank');
    } catch(e) {
      alert('فشل: ' + e.message);
    }
  };

  // ═══ تم التسليم ═══
  window.__dlvMarkDelivered = async function(orderId) {
    if (!confirm('تم التسليم؟')) return;
    try {
      var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
      if (snap.empty) return;
      await snap.docs[0].ref.update({
        workflowStatus: 'delivered',
        status: 'completed',
        deliveredAt: new Date()
      });
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ خروج ═══
  window.__dlvLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ onSnapshot ═══
  function setupListener() {
    if (!window.FB || !FB.db) { setTimeout(setupListener, 500); return; }
    if (window.CD.listener) return;
    
    try {
      window.CD.listener = FB.db.collection('orders')
        .orderBy('createdAt', 'desc')
        .limit(100)
        .onSnapshot(function(snap) {
          var orders = [];
          var newReadyCount = 0;
          var isFirstLoad = window.CD.knownIds.size === 0;
          
          snap.forEach(function(doc) {
            var d = doc.data();
            d.id = d.id || doc.id;
            orders.push(d);
            
            if (!window.CD.knownIds.has(d.id)) {
              window.CD.knownIds.add(d.id);
              if (!isFirstLoad && categorize(d) === 'ready') {
                newReadyCount++;
              }
            }
          });
          
          window.CD.orders = orders;
          
          // إذا اللوحة مفتوحة
          var app = document.getElementById('delivery-mgr-app');
          if (app && app.classList.contains('active')) {
            renderContent();
          }
          
          // إشعار إذا وصل طلب جديد
          if (newReadyCount > 0) {
            playNotifySound();
            browserNotify('🔔 طلب جديد جاهز', 'لديك ' + newReadyCount + ' طلب جاهز للإرسال');
          }
        }, function(err) {
          console.warn('[DELIVERY-V2] listener error:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateDeliveryUI = async function() {
    console.log('[DELIVERY-V2] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('delivery-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'delivery-mgr-app';
      app.className = 'dlv-app active';
      // استرجاع الثيم
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_dlv_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      
      // تحديث أيقونة الثيم
      var icon = document.getElementById('dlv-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    setupListener();
    
    // طلب إذن الإشعارات
    if ('Notification' in window && Notification.permission === 'default') {
      setTimeout(function() { Notification.requestPermission(); }, 3000);
    }
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__deliveryV2Hooked) return;
    A.__deliveryV2Hooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'delivery_mgr') {
        window.activateDeliveryUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[DELIVERY-V2] ready');
})();
</script>
<script id="chz-dedicated-accountant">

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getTs(o) {
    if (!o.createdAt) return 0;
    return o.createdAt.seconds ? o.createdAt.seconds * 1000 : (o.createdAt.toMillis ? o.createdAt.toMillis() : 0);
  }

  function timeAgo(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 60) return 'منذ ' + diff + ' د';
    if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
    if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
    return new Date(ts).toLocaleDateString('ar');
  }

  function getPeriodStart() {
    var now = new Date();
    var p = window.CA.period;
    if (p === 'today') { var d = new Date(now); d.setHours(0,0,0,0); return d.getTime(); }
    if (p === 'week') return Date.now() - 7*24*60*60*1000;
    if (p === 'month') return Date.now() - 30*24*60*60*1000;

  }

  // ═══ CSS ═══

      'background:var(--ca-input-bg);color:var(--ca-text);font-family:Tajawal,sans-serif;font-size:13px;box-sizing:border-box;outline:none;}' +
    '.ca-period-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--ca-input-border);background:var(--ca-input-bg);' +
      'color:var(--ca-text-sub);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}' +
    '.ca-period-btn.active{background:#f59e0b;color:#fff;border-color:#f59e0b;}' +

      'border-radius:10px;margin-bottom:6px;font-size:12px;}' +

    '.ca-row-value{color:var(--ca-text);font-weight:800;}' +
