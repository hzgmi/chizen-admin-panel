<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0515">
<title>CHIZEN Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0515;--bg2:#150826;--cd:#1F0D35;--cd2:#2A1345;--bd:#3A1F5A;--pk:#EC4899;--pl:#F472B6;--pp:#A855F7;--or:#FB923C;--bl:#38BDF8;--mn:#5EEAD4;--gn:#10B981;--rd:#EF4444;--yl:#F59E0B;--tx:#F5E6FF;--mt:#8B7AA8;--mt2:#5C4A78;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
#app{width:100%;height:100%;min-height:100vh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;}
@supports (height:100dvh){ #app{ height:100dvh; } }
.gs{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0A0515,#1F0D35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.gb{width:100%;max-width:400px;background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:32px 24px;text-align:center;margin:auto;}
.gl{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk),var(--pp));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;margin-bottom:6px;}
.gt{font-size:10px;color:var(--mt);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:30px;}
.gi{font-size:56px;margin:20px 0;}
.gtt{font-size:18px;font-weight:900;margin-bottom:10px;}
.gd{font-size:13px;color:var(--mt);line-height:1.7;margin-bottom:20px;}
.gu{font-size:11px;color:var(--mt2);margin-bottom:16px;word-break:break-all;}
.gbtn{pointer-events:auto!important;z-index:9999!important;cursor:pointer;width:100%;padding:15px;background:linear-gradient(135deg,var(--pk),var(--pp));border:none;border-radius:12px;color:#fff;font-family:'Cairo';font-size:15px;font-weight:900;cursor:pointer;margin-bottom:10px;min-height:50px;}
.gbtn.sec{background:var(--cd2);border:1px solid var(--bd);color:var(--tx);}
.gbtn.dgr{background:linear-gradient(135deg,#EF4444,#DC2626);}
.sp{width:48px;height:48px;border:4px solid rgba(236,72,153,.2);border-top-color:var(--pk);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.hd{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(135deg,var(--bg2),var(--cd));border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ht{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.hs{font-size:9px;color:var(--mt);letter-spacing:2px;margin-top:2px;}
.ha{display:flex;gap:8px;}
.hb{width:40px;height:40px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mt);}
.hb:active{border-color:var(--pk);color:var(--pk);}
.hb svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;}
.tbs{display:flex;gap:4px;padding:8px 8px 0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tbs::-webkit-scrollbar{display:none;}
.tb{padding:9px 14px;background:transparent;border:none;border-radius:10px 10px 0 0;color:var(--mt);font-family:'Cairo';font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;position:relative;min-height:40px;}
.tb.active{background:var(--cd);color:var(--tx);}
.tb.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--pk),var(--pp));}
.ct{flex:1;overflow-y:auto;padding:12px 12px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.ct::-webkit-scrollbar{display:none;}
.sc{display:none;}
.sc.active{display:block;}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;}
.cti{font-size:13px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.ctl{display:flex;align-items:center;gap:8px;min-width:0;}
.ctl::before{content:'';width:3px;height:15px;background:linear-gradient(180deg,var(--or),var(--pk));border-radius:2px;flex-shrink:0;}
.btn{padding:9px 14px;border-radius:9px;border:none;font-family:'Cairo';font-size:11px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.bp{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;}
.bs{background:linear-gradient(135deg,var(--gn),var(--mn));color:#0A0515;}
.bw{background:linear-gradient(135deg,var(--or),var(--yl));color:#0A0515;}
.bd{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;}
.bwa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;}
.bg2{background:var(--cd2);color:var(--tx);border:1px solid var(--bd);}
.bsm{padding:7px 10px;font-size:10px;min-height:32px;}
.bb{width:100%;}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px;}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.scd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;}
.sl{font-size:9px;color:var(--mt);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.sv{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:5px;}
.ss{font-size:9px;color:var(--mt2);margin-top:2px;}
.fl{margin-bottom:10px;}
.fll{font-size:10px;color:var(--mt);font-weight:700;margin-bottom:5px;display:block;letter-spacing:.5px;text-transform:uppercase;}
.fi{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font-family:'Cairo';font-size:16px;outline:none;}
.fi:focus{border-color:var(--pk);}
.fi::placeholder{color:var(--mt2);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
textarea.fi{min-height:80px;resize:vertical;line-height:1.6;}
.sel{font-family:'Cairo';}
.ipt{width:100%;height:120px;background:var(--bg2);border:1px dashed var(--bd);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-top:5px;overflow:hidden;position:relative;font-size:11px;color:var(--mt2);}
.ipt img{width:100%;height:100%;object-fit:cover;display:none;}
.ipt.hi img{display:block;}
.rw{display:flex;gap:10px;padding:11px;background:var(--cd);border:1px solid var(--bd);border-radius:11px;margin-bottom:8px;align-items:center;cursor:pointer;}
.rw:active{border-color:rgba(236,72,153,.4);}
.rt{width:48px;height:48px;border-radius:9px;overflow:hidden;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.rt img{width:100%;height:100%;object-fit:cover;}
.ri{flex:1;min-width:0;}
.rti{font-size:12px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs{font-size:10px;color:var(--mt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ra{display:flex;gap:5px;flex-shrink:0;}
.emp{text-align:center;padding:30px 20px;color:var(--mt);font-size:12px;}
.bst{display:inline-block;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:900;}
.bp2{background:rgba(245,158,11,.15);color:var(--yl);}
.bs2{background:rgba(56,189,248,.15);color:var(--bl);}
.bc2{background:rgba(16,185,129,.15);color:var(--gn);}
.bx2{background:rgba(239,68,68,.15);color:var(--rd);}
.bdg{display:inline-block;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:900;}
.bgg{background:rgba(16,185,129,.15);color:var(--gn);}
.bggr{background:rgba(139,122,168,.15);color:var(--mt);}
.bggo{background:rgba(251,146,60,.2);color:var(--or);}
.bgn{background:rgba(236,72,153,.15);color:var(--pk);}
.md{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:1;display:none;align-items:flex-end;justify-content:center;}
.md.active{display:flex;}
.ms{width:100%;max-width:900px;background:var(--cd);border-top-left-radius:22px;border-top-right-radius:22px;padding:8px 0 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.mh{width:38px;height:4px;background:var(--bd);border-radius:2px;margin:8px auto 14px;flex-shrink:0;}
.mt{padding:0 18px 14px;font-size:15px;font-weight:900;}
.mb{padding:0 18px;}
.ma{padding:14px 18px 0;display:flex;gap:8px;flex-wrap:wrap;}
.ma .btn{flex:1;min-height:46px;font-size:13px;min-width:100px;}
.cf{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:1;display:none;align-items:center;justify-content:center;padding:20px;}
.cf.active{display:flex;}
.cfb{width:100%;max-width:360px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center;}
.cft{font-size:15px;font-weight:900;margin-bottom:10px;}
.cfm{font-size:13px;color:var(--mt);line-height:1.7;margin-bottom:18px;}
.cfa{display:flex;gap:8px;}
.cfa button{flex:1;padding:14px;border:none;border-radius:10px;font-family:'Cairo';font-size:13px;font-weight:900;cursor:pointer;min-height:48px;}
.cfc{background:var(--cd2);border:1px solid var(--bd);color:var(--tx);}
.cfo{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;}
.cfo.pr{background:linear-gradient(135deg,var(--pk),var(--pp));}
.tst{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--cd2);border:1px solid var(--bd);color:var(--tx);padding:12px 18px;border-radius:11px;font-size:13px;font-weight:700;z-index:1;opacity:0;transition:all .3s;max-width:90%;text-align:center;pointer-events:none;}
.tst.show{opacity:1;transform:translateX(-50%) translateY(0);}
.tst.suc{background:linear-gradient(135deg,var(--gn),var(--mn));color:#0A0515;border:none;}
.tst.err{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;border:none;}
.ib{background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(236,72,153,.08));border:1px solid rgba(251,146,60,.3);border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--yl);font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.5;}
.ch{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.ch::-webkit-scrollbar{display:none;}
.cp{padding:8px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;white-space:nowrap;min-height:36px;display:flex;align-items:center;}
.cp.active{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;border-color:transparent;}
.sw{position:relative;margin-bottom:12px;}
.si{width:100%;padding:12px 40px 12px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:11px;color:var(--tx);font-family:'Cairo';font-size:16px;outline:none;}
.si:focus{border-color:var(--pk);}
.sic{position:absolute;top:50%;transform:translateY(-50%);right:12px;width:18px;height:18px;stroke:var(--mt);stroke-width:2;fill:none;pointer-events:none;}
.ds{background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:12px;margin-bottom:10px;}
.dt{font-size:11px;font-weight:900;color:var(--pl);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.dr{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;border-bottom:1px dashed rgba(58,31,90,.4);gap:10px;flex-wrap:wrap;}
.dr:last-child{border-bottom:none;}
.dl{color:var(--mt);}
.dv{color:var(--tx);font-weight:700;text-align:left;}
.il{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(58,31,90,.4);}
.il:last-child{border-bottom:none;}
.ii{width:44px;height:44px;border-radius:8px;background:var(--bg);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.ii img{width:100%;height:100%;object-fit:cover;}
.in{font-size:12px;font-weight:700;margin-bottom:2px;}
.im{font-size:10px;color:var(--mt);}
.ipr{font-size:12px;font-weight:900;color:var(--pl);flex-shrink:0;}
.rci{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--bg2);}
.tl{position:relative;padding-right:20px;}
.tl::before{content:'';position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--bd);}
.tli{position:relative;padding:0 0 14px 0;font-size:11px;}
.tli::before{content:'';position:absolute;right:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--bd);}
.tli.dn::before{background:var(--gn);border-color:var(--gn);}
.tli.cr::before{background:var(--pk);border-color:var(--pk);box-shadow:0 0 8px var(--pk);}
.tlt{font-weight:900;color:var(--tx);}
.tld{font-size:9px;color:var(--mt2);margin-top:2px;}
.ab{display:inline-block;padding:2px 6px;background:linear-gradient(135deg,var(--or),var(--pk));color:#fff;border-radius:6px;font-size:9px;font-weight:900;margin-right:4px;}
.ft{color:var(--yl);}
@media(max-width:480px){
.hd{padding:10px 12px;}.ht{font-size:16px;}.hb{width:38px;height:38px;}.hb svg{width:16px;height:16px;}
.tb{padding:8px 12px;font-size:10px;min-height:38px;}
.ct{padding:10px 10px 40px;}
.sg{grid-template-columns:1fr 1fr;gap:8px;}.sg3{grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sv{font-size:17px;}.sl{font-size:8px;}
.fr,.fr3{grid-template-columns:1fr!important;gap:8px;}
.cd{padding:12px;border-radius:12px;}.cti{font-size:12px;}
.rw{padding:10px;gap:8px;}.rt{width:44px;height:44px;}
.rti{font-size:11px;}.rs{font-size:9px;}
.btn{min-height:44px;font-size:12px;}.bsm{min-height:36px;font-size:11px;}
.fi,.si,textarea.fi,select.fi{font-size:16px!important;min-height:46px;}
.ms{max-height:96vh;}.mb{padding:0 14px;}.mt{padding:0 14px 12px;font-size:14px;}
.ma{padding:12px 14px 0;gap:6px;}.ma .btn{min-height:48px;font-size:13px;}
.cfb{padding:20px 18px;max-width:calc(100vw - 40px);}
.cfa button{min-height:50px;}
.dr{font-size:11px;padding:6px 0;}
.cp{padding:8px 12px;font-size:11px;min-height:38px;}
.ii{width:40px;height:40px;font-size:16px;}
.gb{padding:28px 20px;}.gl{font-size:36px;}
.ib{font-size:10px;padding:10px;}
}
@media(max-width:380px){.sg3{grid-template-columns:1fr 1fr;}.sg3>div:last-child{grid-column:span 2;}}





/* ═══ CHIZEN COMFORT DARK IDENTITY ═══ */
:root {
  --bg: #14141F !important; /* كحلي داكن جداً ومريح */
  --nav: #1C1C28 !important; /* لون البطاقات */
  --cr: #E2E2E9 !important; /* أبيض مريح للعين وليس حاد */
  --mt: #8B8B9F !important; /* رمادي للنصوص الثانوية */
  --bd: rgba(255, 255, 255, 0.07) !important; /* حدود ناعمة */
  --grad: linear-gradient(135deg, #8B5CF6, #EC4899) !important; /* بنفسجي ووردي هادئ */
  --grad2: linear-gradient(135deg, #A78BFA, #F472B6) !important;
  --pl: #A78BFA !important; /* بنفسجي فاتح */
  --pk: #F472B6 !important; /* وردي فاتح */
  --gn: #10B981 !important;
  --rd: #EF4444 !important;
}

body, #app { background: var(--bg) !important; color: var(--cr) !important; font-family: 'Tajawal', sans-serif !important; }

/* الشريط العلوي */
.hd { background: var(--nav) !important; border-bottom: 1px solid var(--bd) !important; padding: 15px 20px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; }
.ht { color: #FFF !important; font-weight: 900 !important; font-size: 20px !important; }
.hs { color: var(--mt) !important; }
.hb { background: rgba(255,255,255,0.04) !important; border: 1px solid var(--bd) !important; color: var(--pl) !important; border-radius: 10px !important; }

/* التبويبات */
.sw-tabs { background: var(--nav) !important; border-bottom: 1px solid var(--bd) !important; padding: 10px 15px !important; }
.tb { color: var(--mt) !important; font-weight: 700 !important; padding: 8px 16px !important; border-radius: 10px !important; border: none !important; }
.tb.active { background: var(--grad) !important; color: #FFF !important; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25) !important; }

/* البطاقات */
.cd, .sc { background: var(--nav) !important; border: 1px solid var(--bd) !important; border-radius: 16px !important; box-shadow: 0 8px 20px rgba(0,0,0,0.2) !important; margin-bottom: 15px; }
.cti { border-bottom: 1px solid var(--bd) !important; padding-bottom: 15px !important; margin-bottom: 15px !important; }
.ctl { color: #FFF !important; font-weight: 900 !important; font-size: 16px !important; }
.rs { color: var(--mt) !important; }
.rti { color: #FFF !important; font-weight: 700 !important; }

/* الأزرار */
.btn { font-weight: 700 !important; border-radius: 10px !important; padding: 10px 18px !important; border: none !important; }
.btn.bp { background: var(--grad) !important; color: #FFF !important; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2) !important; }
.btn.bg2 { background: rgba(255,255,255,0.05) !important; color: #FFF !important; border: 1px solid var(--bd) !important; }
.btn.bd { background: rgba(239, 68, 68, 0.15) !important; color: var(--rd) !important; }
.btn.bs { background: rgba(16, 185, 129, 0.15) !important; color: var(--gn) !important; }

/* الحقول */
.fi, .si, select, textarea { background: rgba(0,0,0,0.25) !important; border: 1px solid var(--bd) !important; color: #FFF !important; border-radius: 10px !important; padding: 12px 15px !important; font-family: 'Tajawal', sans-serif !important; width: 100%; box-sizing: border-box; }
.fi:focus, .si:focus, select:focus, textarea:focus { border-color: var(--pl) !important; outline: none !important; background: rgba(0,0,0,0.4) !important; }
.fll { color: var(--mt) !important; font-weight: 700 !important; margin-bottom: 8px !important; display: block; }

/* شاشة الدخول */
#gs { background: var(--bg) !important; }
.gl { color: #FFF !important; font-weight: 900 !important; font-size: 28px !important; background: var(--grad) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }
.gt { color: var(--mt) !important; }
.gd { color: #FFF !important; }

.gbtn.sec { background: rgba(255,255,255,0.05) !important; color: #FFF !important; border: 1px solid var(--bd) !important; }

/* النوافذ المنبثقة */
.mdl, .modal { background: var(--nav) !important; border: 1px solid var(--bd) !important; border-radius: 20px !important; box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important; }
.mtl { color: #FFF !important; font-weight: 900 !important; }

/* القوائم */
.rw { border-bottom: 1px solid var(--bd) !important; padding: 15px !important; }
.rw:hover { background: rgba(255,255,255,0.02) !important; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--pl) !important; cursor: pointer; }

</style>

if (typeof Promise.allSettled !== 'function') {
  Promise.allSettled = function (promises) {
    return Promise.all([].map.call(promises, function (p) {
      return Promise.resolve(p).then(
        function (v) { return { status: 'fulfilled', value: v }; },
        function (e) { return { status: 'rejected', reason: e }; }
      );
    }));
  };
}
window.addEventListener('error', function(e){ console.error('❌ Global Error:', e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('❌ Unhandled Rejection:', e.reason); });

  init:async function(){
    if(!window.FB || !FB.ready){
      this.gateMsg('❌', 'Firebase غير محمّل', 'تأكد من وجود firebase-config.js و firebase-service.js');
      return;
    }
    try { await FB.handleGoogleRedirect(); } catch(e) {}
    var self = this;
    if(!this._listening){
      this._listening = true;
      try {
        FB.auth.onAuthStateChanged(function(u) {
          if (u) {
            // ✅ استخدم checkAdmin للتحقق من الدور
            self.checkAdmin(u);
          } else {
            self.loginScreen();
          }
        });
      } catch(e) { console.error(e); this.loginScreen(); }
    }
  },

  loginScreen:function(){
    document.getElementById('gb').innerHTML =
      '<div class="gl">CHIZEN</div>' +

      '<div class="gi">🔐</div>' +

      '  <input id="login-email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" style="width:100%;padding:12px 15px;margin-bottom:10px;border-radius:12px;border:1.5px solid rgba(255,77,148,.4);background:rgba(20,15,45,.85);color:#fff;font-family:inherit;font-size:14px;box-sizing:border-box;">' +

      '</div>' +
      '<button class="gbtn sec" onclick="location.reload()" style="margin-top:10px;">🔄 إعادة</button>';
    
    // Enter key submits
    setTimeout(function(){
      var passInp = document.getElementById('login-pass');
      if (passInp) passInp.addEventListener('keypress', function(e){
        if (e.key === 'Enter') doLogin();
      });

  gateMsg:function(i,t,d){
    var gb=document.getElementById('gb');

  customLogin: async function(){
    var email = 'hazimchat@gmail.com';
    if(!email) return;
    var pass = 'Chizen@2026';
    if(!pass) return;
    try {
      await FB.auth.signInWithEmailAndPassword(email, pass);

      alert("خطأ: " + e.message);

  loginGoogle:async function(){
    try{
      var p=new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({prompt:'select_account'});
      // تم تعديلها للعمل على الـ APK بدون الخروج من التطبيق
      await FB.auth.signInWithPopup(p);
    }catch(e){
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
      this.toast('فشل: '+(e.message||''),'err');
    }
  },

  checkAdmin: async function(u) {
    if (!u) return;
    try {
      // 1) تحقق من legacy admin (admins collection)
      var isLegacy = false;
      try {
        var legacyDoc = await FB.db.collection('admins').doc(u.uid).get();
        isLegacy = legacyDoc.exists;
      } catch(e) { console.warn('legacy check:', e.message); }
      
      // 2) اقرأ role من users
      var role = 'customer';
      var assignedCategory = null;
      try {
        var userSnap = await FB.db.collection('users').doc(u.uid).get();
        if (userSnap.exists) {
          var ud = userSnap.data();
          role = ud.role || 'customer';
          assignedCategory = ud.assignedCategory || null;
        }
      } catch(e) { console.warn('user role check:', e.message); }
      
      // 3) الدور الفعلي
      var effRole = isLegacy ? 'super_admin' : role;
      
      // 4) منع العملاء
      if (effRole === 'customer') {
        this.toast('⛔ ليس لديك صلاحية الوصول للوحة', 'err');
        setTimeout(function(){ try { FB.auth.signOut(); } catch(e){} location.reload(); }, 1800);
        return;
      }
      
      // 5) خزّن عالمياً
      window.CURRENT_ROLE = effRole;
      window.CURRENT_CATEGORY = assignedCategory;
      window.CURRENT_UID = u.uid;
      
      // 6) اعرض اللوحة
      this.access(u);
      this.applyPermissions(effRole, assignedCategory);
      
    } catch(e) {
      console.error('checkAdmin failed:', e);
      this.toast('خطأ في التحقق: ' + e.message, 'err');
    }
  },

  applyPermissions: function(role, category) {
    if (role === 'super_admin') return; // وصول كامل — لا قيود
    
    var allowed = {};
    if (role === 'cat_manager') {
      allowed = { products: 1, orders: 1, dash: 1 };
    } else if (role === 'delivery_mgr') {
      allowed = { orders: 1, dash: 1 };
    }
    
    // إخفاء التبويبات غير المصرح بها
    document.querySelectorAll('.tb').forEach(function(btn) {
      var oc = btn.getAttribute('onclick') || '';
      var m = oc.match(/A\.tab\('([^']+)'/);
      if (m && !allowed[m[1]]) {
        btn.style.display = 'none';
      }
    });
    
    // مؤشر الدور
    var am = document.getElementById('am');
    if (am && !document.getElementById('role-indicator')) {
      var b = document.createElement('div');
      b.id = 'role-indicator';
      b.style.cssText = 'position:fixed;top:8px;right:8px;background:linear-gradient(135deg,#ff4d94,#a855f7);color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;z-index:99999;box-shadow:0 4px 12px rgba(255,77,148,0.4);';
      var catNames = {electronics:'إلكترونيات',fashion:'أزياء',home:'منزل',beauty:'جمال',kids:'أطفال',sports:'رياضة',tools:'أدوات'};
      var lbl = role === 'cat_manager' 
        ? ('📦 ' + (catNames[category] || category || 'قسم')) 
        : '📋 مندوب طلبات';
      b.textContent = lbl;
      am.appendChild(b);
    }
    
    // مؤشر إضافي في الشاشة الرئيسية
    var dash = document.getElementById('dash-c');
    if (dash) {
      var catNames2 = {electronics:'إلكترونيات',fashion:'أزياء',home:'منزل',beauty:'جمال',kids:'أطفال',sports:'رياضة',tools:'أدوات'};
      var welcome = role === 'cat_manager'
        ? '📦 مرحباً — أنت مسؤول قسم ' + (catNames2[category] || category)
        : '📋 مرحباً — أنت مندوب الطلبات';
      dash.innerHTML = '<div style="padding:15px;background:linear-gradient(135deg,rgba(255,77,148,0.15),rgba(168,85,247,0.15));border:1px solid rgba(255,77,148,0.4);border-radius:14px;margin-bottom:15px;text-align:center;font-weight:700;">' + welcome + '</div>' + (dash.innerHTML || '');
    }
  },

  loadData:async function(){
    var s=this;
    await Promise.allSettled([
      (async()=>{try{var p=await FB.getProducts();if(p)s.products=p;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var u=await FB.getAllUsers();if(u)s.users=u;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var o=await FB.getAllOrders();if(o)s.orders=o;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var c=await FB.getConfig('categories');if(c&&c.list)s.cats=c.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var p=await FB.getConfig('payments');if(p&&p.list)s.pays=p.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sp=await FB.getConfig('suppliers');if(sp&&sp.list)s.sups=sp.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sn=await FB.db.collection('admins').get();s.admins=[];sn.forEach(d=>s.admins.push({uid:d.id,data:d.data()}));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var c=await FB.getConfig('contact');if(c)localStorage.setItem('chizen_contact',JSON.stringify(c));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sh=await FB.getConfig('shipping');if(sh)localStorage.setItem('chizen_shipping',JSON.stringify(sh));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var dl=await FB.getConfig('delivery_locations');if(dl&&dl.aden){s.deliveryLocs=dl;}else{s.deliveryLocs={aden:[{district:'المعلا',areas:['الشارع الرئيسي']}],yemen:[{gov:'صنعاء',station:'مكتب باصات الشام'}]};}}catch(e){s.deliveryLocs={aden:[],yemen:[]};}})()
    ]);
    if(!s.cats.length)s.cats=[{key:'home',name:'منزلية',icon:'🏠'},{key:'beauty',name:'تجميل',icon:'💄'},{key:'school',name:'مدرسية',icon:'📚'},{key:'clothes',name:'ملابس',icon:'👕'},{key:'electronics',name:'إلكترونيات',icon:'📱'},{key:'food',name:'طعام',icon:'🍔'},{key:'games',name:'ألعاب',icon:'🎮'},{key:'more',name:'المزيد',icon:'➕'}];
    if(!s.pays.length)s.pays=[{id:'kuraimi',name:'بنك الكريمي',account:'1234-567-890',color:'#0d47a1',icon:'🏦',type:'bank'},{id:'cash',name:'دفع نقدي',account:'',color:'#EF6C00',icon:'💵',type:'cash'}];
  },

  tab:function(n,el){

    document.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));
    if(el)el.classList.add('active');
    document.getElementById('ct').scrollTop=0;
    this.currentTab=n;
    var f={dash:this.renderDash,reports:this.renderReports,products:this.renderProducts,cats:this.renderCats,pays:this.renderPays,orders:this.renderOrders,flights:this.renderFlights,push:function(){},sups:this.renderSups,balances:this.renderBalances,delivery:this.renderDelivery,users:this.renderUsers,employees:this.renderEmployees,admins:this.renderAdmins,settings:this.renderSettings,banners:this.loadBanners}[n];
    if(f)try{f.call(this);}catch(e){console.warn(e);}
  },

  loadBanners: async function() {
    var list = document.getElementById("banners-list");
    if (!list) return;
    try {
      var doc = await FB.db.collection("config").doc("banners").get();
      var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
      if (arr.length === 0) { list.innerHTML = "<p style='padding:20px;color:#888;'>لا توجد بانرات</p>"; return; }
      var out = "";
      for (var i = 0; i < arr.length; i++) {
        var b = arr[i];
        out += "<div style='padding:10px;margin-bottom:10px;border:1px solid #333;border-radius:8px;'>" +
          "<img src='" + b.img + "' style='width:100%;max-width:300px;border-radius:6px;'>" +
          "<p style='font-weight:bold;margin:8px 0 4px;'>" + b.title + "</p>" +
          "<p style='color:#888;font-size:12px;margin:0;'>" + (b.sub || "") + "</p>" +
          "<button onclick='A.deleteBanner(" + i + ")' style='background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;margin-top:8px;cursor:pointer;'>🗑️ حذف</button>" +
          "</div>";
      }
      list.innerHTML = out;
    } catch(e) { list.innerHTML = "<p style='color:red;'>خطأ: " + e.message + "</p>"; }
  },
  saveBanner: async function() {
      var img = document.getElementById("bn-img").value.trim();
      var title = document.getElementById("bn-title").value.trim();
      var sub = document.getElementById("bn-sub").value.trim();
      var btn = document.getElementById("bn-btn").value.trim() || "تسوق الآن";
      var link = document.getElementById("bn-link") ? document.getElementById("bn-link").value.trim() : "";
      var fit = document.getElementById("bn-fit") ? document.getElementById("bn-fit").value : "cover";
      var position = document.getElementById("bn-position") ? document.getElementById("bn-position").value : "center";
      
      if (!img || !title) { alert("الصورة والعنوان مطلوبان"); return; }
      
      try {
        var doc = await FB.db.collection("config").doc("banners").get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        arr.push({ 
          img: img, title: title, sub: sub, btn: btn, link: link, fit: fit, position: position,
          scale: (window._chzBannerState||{}).scale || 1,
          rotate: (window._chzBannerState||{}).rotate || 0,
          height: (window._chzBannerState||{}).height || 200,
          align: (window._chzBannerState||{}).align || "right",
          overlay: (window._chzBannerState||{}).overlay !== undefined ? window._chzBannerState.overlay : 50
        });
        await FB.db.collection("config").doc("banners").set({ list: arr }, { merge: true });
        alert("✅ تم الإضافة");
        ["bn-img", "bn-title", "bn-sub", "bn-btn", "bn-link"].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.value = "";
        });
        var preview = document.getElementById("bn-preview-img");
        var label = document.getElementById("bn-preview-label");
        if (preview) preview.src = "";
        if (label) { label.style.display = "flex"; label.textContent = "معاينة الصورة"; }
        this.loadBanners();
      } catch(e) { alert("خطأ: " + e.message); }
    },

  prevImg:function(u){
    var pr=document.getElementById('f-prev');var im=document.getElementById('f-img-el');
    if(!pr||!im)return;
    if(!u){pr.classList.remove('hi');im.src='';return;}
    im.onload=()=>pr.classList.add('hi');
    im.onerror=()=>pr.classList.remove('hi');
    im.src=u;
  },

  saveProduct:async function(id,isEdit){
    var name=document.getElementById('f-name').value.trim();
    var price=parseFloat(document.getElementById('f-price').value);
    if(!name){this.toast('أدخل الاسم','err');return;}
    if(!price||price<=0){this.toast('سعر صحيح','err');return;}
    var feats=document.getElementById('f-feats').value.split('\n').map(s=>s.trim()).filter(s=>s);
    var stockV=document.getElementById('f-stock').value;
    var data={name:name,brand:document.getElementById('f-brand').value,category:document.getElementById('f-cat').value,price:price,old:parseFloat(document.getElementById('f-old').value)||null,stock:stockV?parseInt(stockV):null,badge:document.getElementById('f-badge').value.trim(),rating:4.5,reviews:0,sold:0,img:document.getElementById('f-img').value.trim(),
         colors: document.getElementById('f-colors').value.split(',').map(s => s.trim()).filter(s => s !== ''),desc:document.getElementById('f-desc').value.trim(),features:feats,active:document.getElementById('f-active').checked,featured:document.getElementById('f-featured').checked};
    try{
      if(isEdit)await FB.updateProduct(id,data);else await FB.addProduct(data);
      this.toast(isEdit?'✓ تم':'✓ أُضيف','suc');
      this.cm();
      await this.loadData();
      this.renderProducts();this.renderDash();
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  deleteProduct:function(id){
    var self=this;var name='';
    this.products.forEach(p=>{if(String(p.id)===String(id))name=p.name;});
    this.confirm('حذف المنتج؟','"'+name+'"',async function(){
      try{await FB.deleteProduct(id);await self.loadData();self.renderProducts();self.renderDash();self.toast('تم','suc');}catch(e){self.toast('فشل','err');}
    });
  },


  

  renderCats:function(){
        if (!this.cats) this.cats = [];
        var self = this;
        CORE_CATS_ADMIN.forEach(function(c) {
            var exists = self.cats.find(function(x) { return x.key === c.key; });
            if (!exists) self.cats.push(c);
        });

    var c=document.getElementById('cat-list');if(!c)return;
    if(!this.cats.length){c.innerHTML='<div class="emp">لا أقسام</div>';return;}
    var h='';
    this.cats.forEach((cat,i)=>{var cnt=this.products.filter(p=>p.category===cat.key).length;var isProt = this.isProtectedCat(cat.key);
      var deleteBtn = isProt ? '<span style="font-size:18px;padding:5px;" title="قسم أساسي (لا يمكن حذفه)">🔒</span>' : '<button class="btn bd bsm" onclick="A.deleteCat('+i+')">🗑️</button>';
      h+='<div class="rw" onclick="A.catForm('+i+')"><div class="rt" style="font-size:22px;">'+esc(cat.icon||'📦')+'</div><div class="ri"><div class="rti">'+esc(cat.name)+(isProt?' <span style="font-size:10px;color:var(--pl);">(أساسي)</span>':'')+'</div><div class="rs">'+esc(cat.key)+' • '+cnt+' منتج</div></div><div class="ra" onclick="event.stopPropagation()">'+deleteBtn+'</div></div>';});
    c.innerHTML=h;
  },


  isProtectedCat: function(key) {
    var coreCats = ['electronics', 'beauty', 'home', 'clothes', 'school', 'food', 'games', 'kids'];
    return coreCats.indexOf(key) > -1;
  },

    this.modal(isEdit?'تعديل قسم':'قسم جديد',html,actions);

  saveCat:async function(idx){
    var key=document.getElementById('c-key').value.trim().toLowerCase().replace(/\s+/g,'_');
    var name=document.getElementById('c-name').value.trim();
    var icon=document.getElementById('c-icon').value.trim()||'📦';
    if(!key||!name){this.toast('أدخل البيانات','err');return;}
    var cat={key, name, icon};
    if(typeof idx==='number')this.cats[idx]=cat;
    else{for(var i=0;i<this.cats.length;i++)if(this.cats[i].key===key){this.toast('المعرّف مستخدم','err');return;}this.cats.push(cat);}
    try{await FB.setConfig('categories',{list:this.cats});this.cm();this.renderCats();this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  deleteCat: function(idx) {
    if (this.isProtectedCat(this.cats[idx].key)) return this.toast('هذا القسم أساسي ولا يمكن حذفه', 'err');
    var self=this;var name=this.cats[idx].name;

  saveNote:async function(id){
    var t=document.getElementById('o-note');if(!t)return;
    var note=t.value.trim();
    try{
      var snap=await FB.db.collection('orders').where('id','==',id).get();
      if(snap.empty){this.toast('الطلب غير موجود','err');return;}
      await snap.docs[0].ref.update({adminNote:note,adminNoteUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),adminNoteUpdatedBy:FB.currentUser?FB.currentUser.email:''});
      for(var i=0;i<this.orders.length;i++){if(this.orders[i].id===id){this.orders[i].adminNote=note;break;}}
      this.toast('✓ تم','suc');
      this.orderDetails(id);
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  setStatus:async function(id,status){
    try{
      var targetUid='ALL';
      this.orders.forEach(o=>{if(o.id===id)targetUid=o.userId||'ALL';});
      await FB.updateOrderStatus(id,status);
      var titles={shipped:'طلبك في الطريق 🚚',completed:'تم تسليم طلبك ✓'};
      var bodies={shipped:'طلب #'+id+' خرج من المستودع',completed:'طلب #'+id+' جاهز للاستلام'};
      try{
        if(targetUid!=='ALL'&&FB.addUserNotification)await FB.addUserNotification(targetUid,{title:titles[status],body:bodies[status],type:'order'});
        else if(FB.addNotification)await FB.addNotification({title:titles[status],body:bodies[status],type:'order'});
      }catch(e){ console.error('ERR:', e.message); }
      await this.loadData();this.renderOrders();this.renderDash();this.cm();this.toast('✓','suc');
    }catch(e){this.toast('فشل','err');}
  },

      document.querySelectorAll('.so-ch').forEach(cb=>cb.addEventListener('change',recalc));
      document.querySelectorAll('.so-qty').forEach(i=>i.addEventListener('input',recalc));

  sendSupplyOrder:async function(idx){
    var s=this.sups[idx];if(!s)return;
    var supplierProds=(s.products||[]).map(sp=>{var p=this.getProduct(sp.id);return p?{product:p,pp:sp.purchasePrice||0}:null;}).filter(x=>x);
    var items=[];
    document.querySelectorAll('.so-ch').forEach(cb=>{
      if(!cb.checked)return;
      var i=parseInt(cb.dataset.idx);
      var qty=parseInt(document.querySelector('.so-qty[data-idx="'+i+'"]').value)||0;
      if(qty>0&&supplierProds[i])items.push({name:supplierProds[i].product.name,pp:supplierProds[i].pp,qty:qty,price:supplierProds[i].product.price});
    });
    if(!items.length){this.toast('اختر منتجاً','err');return;}
    var totalQty=items.reduce((a,b)=>a+b.qty,0);
    var totalCost=items.reduce((a,b)=>a+(b.pp*b.qty),0);
    var orderId='SUP-'+Date.now().toString().slice(-8);
    this.toast('⏳ جاري الإنشاء...','suc');
    try{
      var oldBal=s.balance||0;var newBal=oldBal+totalCost;
      var hist=(s.history||[]).slice();
      hist.push({type:'order',orderId,amount:totalCost,items,date:new Date().toISOString(),balanceAfter:newBal});
      this.sups[idx]=Object.assign({},s,{balance:newBal,history:hist});
      await FB.setConfig('suppliers',{list:this.sups});
      var blob=await this.genSupplyBlob(s,items,orderId,oldBal,newBal);
      if(!blob){this.toast('فشل','err');return;}
      var msg='السلام عليكم '+s.name+' 🌟\n\n📋 سند توريد من CHIZEN\n━━━━━━━━━━━━━━━\n🆔 '+orderId+'\n📅 '+new Date().toLocaleDateString('ar-EG')+'\n💳 '+(s.paymentType==='credit'?'آجل '+(s.creditDays||30)+' يوم':'نقد')+'\n━━━━━━━━━━━━━━━\n📦 '+items.length+' صنف\n🔢 '+totalQty+' قطعة\n💰 '+totalCost.toLocaleString()+' ر.س\n━━━━━━━━━━━━━━━\n\n📎 السند مرفق — يرجى التأكيد.\n\nشكراً ❤️\nCHIZEN';
      var phone=(s.phone||'').replace(/\D/g,'');
      if(phone.length===9&&!phone.startsWith('967'))phone='967'+phone;
      var isM=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if(isM&&navigator.share&&navigator.canShare){
        var f=new File([blob],'SUP-'+orderId+'.png',{type:'image/png'});
        if(navigator.canShare({files:[f]})){try{await navigator.share({title:'سند توريد',text:msg,files:[f]});this.cm();this.renderSups();this.toast('✓','suc');return;}catch(e){if(e.name==='AbortError')return;}}
      }
      this.dlBlob(blob,'SUP-'+orderId);
      if(phone.length>=8)setTimeout(()=>window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank'),800);
      this.cm();this.renderSups();this.toast('✓ تم — الدين: '+newBal.toLocaleString(),'suc');
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  saveEmployee: async function() {

    var wa = document.getElementById('emp-wa').value.trim();

<script>
window.doLogin = async function() {
  var emailInp = document.getElementById('login-email');
  var passInp = document.getElementById('login-pass');
  var errBox = document.getElementById('login-err');
  var btn = document.getElementById('btn-do-login');
  
  var email = (emailInp ? emailInp.value : '').trim();
  var pass = (passInp ? passInp.value : '');
  
  if (!email || !pass) {
    if (errBox) errBox.textContent = '⚠️ أدخل البريد وكلمة السر';
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'جاري الدخول...'; }
  if (errBox) errBox.textContent = '';
  
  try {
    // استخدم persist المحلي لتسجيل الدخول
    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    var cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    console.log('[LOGIN] success:', cred.user.email);
    // onAuthStateChanged سيتولى الباقي (checkAdmin)
  } catch(e) {
    var msg = e.message || 'فشل الدخول';
    if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'البريد أو كلمة السر غير صحيحة';
    else if (e.code === 'auth/user-not-found') msg = 'لا يوجد حساب بهذا البريد';
    else if (e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، حاول لاحقاً';
    if (errBox) errBox.textContent = '❌ ' + msg;
    if (btn) { btn.disabled = false; btn.textContent = '🔓 تسجيل الدخول'; }
  }
};

// alias قديم للتوافق
window.forceLogin = window.doLogin;
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ptr = document.getElementById('custom-ptr');
    const header = document.querySelector('.hd');
    let startY = 0;
    let isPulling = false;

    if (!header) {
        console.warn('Header .hd not found, PTR disabled.');
        return;
    }

    // تفعيل السحب فقط من الشريط العلوي
    header.addEventListener('touchstart', function(e) {
        startY = e.touches[0].pageY;
        isPulling = true;
    }, { passive: true });

    header.addEventListener('touchmove', function(e) {
        if (!isPulling) return;
        let currentY = e.touches[0].pageY;
        let deltaY = currentY - startY;

        if (deltaY > 70) {
            ptr.style.top = '15px'; // يظهر المؤشر عند السحب لأسفل
        } else if (deltaY < 20) {
            ptr.style.top = '-80px'; // يختفي عند الرفع
        }
    }, { passive: true });

    header.addEventListener('touchend', function(e) {
        if (!isPulling) return;
        isPulling = false;

        if (ptr.style.top === '15px') {
            ptr.style.top = '-80px';
            setTimeout(function() { location.reload(); }, 300);
        }
    });
});

<script>
// ═══ Pull to Refresh for Admin ═══
(function() {
  let startY = 0, currentY = 0, pulling = false;
  const ptr = document.getElementById('admin-ptr');
  const ct = document.getElementById('ct') || window; // الحاوية الرئيسية للتمرير
  
  function getScrollTop() {
    if (ct === window) return document.body.scrollTop || document.documentElement.scrollTop;
    return ct.scrollTop;
  }

  function onStart(e) {
    if (getScrollTop() > 0) return; // فقط إذا كنا في الأعلى
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    pulling = true;
  }

  function onMove(e) {
    if (!pulling) return;
    currentY = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = currentY - startY;
    
    if (diff > 50) {
      ptr.classList.add('active');
      ptr.querySelector('svg').style.transform = 'rotate(' + (diff * 2) + 'deg)';
    }
  }

  function onEnd() {
    if (!pulling) return;
    pulling = false;
    const diff = currentY - startY;
    
    if (diff > 80) {
      // تفعيل التحديث
      ptr.classList.add('loading');
      ptr.querySelector('svg').style.transform = 'rotate(0)';
      
      // استدعاء دالة التحديث (إعادة تحميل البيانات)
      if (window.A && A.currentTab) {
        const t = A.currentTab;
        if (t === 'banners' && A.loadBanners) A.loadBanners();
        else if (t === 'dash' && A.renderDash) A.renderDash();
        else if (t === 'products' && A.renderProducts) A.renderProducts();
        else if (t === 'orders' && A.renderOrders) A.renderOrders();
        else if (A.tab) A.tab(t, document.querySelector('.tb.active'));
      } else {
        location.reload();
      }

      // إخفاء بعد ثانية
      setTimeout(() => {
        ptr.classList.remove('active');
        ptr.classList.remove('loading');
        startY = 0; currentY = 0;
      }, 1000);
    } else {
      ptr.classList.remove('active');
      ptr.querySelector('svg').style.transform = 'rotate(0)';
    }
  }

  document.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd);
})();
</script>

<script>
// ═══ إضافة معاينة + تحكم للبانرات ═══
window.enhanceBannersUI = function() {
  var sc = document.getElementById('sc-banners');

  var imgInput = sc.querySelector('#bn-img');

  wrapper.style.cssText = 'margin: 12px 0; padding: 12px; background: rgba(255,39,201,0.05); border: 1px solid rgba(255,39,201,0.2); border-radius: 12px;';
  wrapper.innerHTML = '<div style="margin-bottom: 8px; font-size: 11px; color: #ff27c9; font-weight: 800;">🖼️ معاينة الصورة والتحكم</div>' +
    '<div style="position: relative; width: 100%; height: 180px; background: linear-gradient(135deg,#1a1a2e,#000); border-radius: 10px; overflow: hidden; border: 1px solid #333;">' +
      '<img id="bn-preview-img" src="" style="width:100%;height:100%;object-fit:cover;object-position:center;display:none;">' +
      '<div id="bn-preview-label" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;font-weight:700;">📷 ضع رابط الصورة للمعاينة</div>' +
    '</div>' +
    '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">' +
      '<div>' +
        '<label style="font-size:10px;color:#b8c5ee;display:block;margin-bottom:4px;font-weight:700;">طريقة العرض</label>' +
        '<select id="bn-fit" style="width:100%;padding:8px;background:#1a1a2e;color:#fff;border:1px solid #444;border-radius:6px;font-family:inherit;font-size:12px;">' +
          '<option value="cover">🖼️ ملء (يُقص الزائد)</option>' +
          '<option value="contain">📦 احتواء (الصورة كاملة)</option>' +
          '<option value="fill">↔️ تمدد</option>' +
        '</select>' +
      '</div>' +
      '<div>' +
        '<label style="font-size:10px;color:#b8c5ee;display:block;margin-bottom:4px;font-weight:700;">الموضع</label>' +
        '<select id="bn-position" style="width:100%;padding:8px;background:#1a1a2e;color:#fff;border:1px solid #444;border-radius:6px;font-family:inherit;font-size:12px;">' +
          '<option value="center">وسط</option>' +
          '<option value="top">أعلى</option>' +
          '<option value="bottom">أسفل</option>' +
          '<option value="left">يسار</option>' +
          '<option value="right">يمين</option>' +
          '<option value="top left">أعلى يسار</option>' +
          '<option value="top right">أعلى يمين</option>' +
          '<option value="bottom left">أسفل يسار</option>' +
          '<option value="bottom right">أسفل يمين</option>' +
        '</select>' +
      '</div>' +
    '</div>';
  
  // إدراج بعد حقل الصورة
  imgInput.parentNode.insertBefore(wrapper, imgInput.nextSibling);
  
  // ═══ ربط الأحداث ═══
  var previewImg = document.getElementById('bn-preview-img');
  var label = document.getElementById('bn-preview-label');
  var fitSelect = document.getElementById('bn-fit');
  var posSelect = document.getElementById('bn-position');
  
  // معاينة عند إدخال رابط الصورة
  imgInput.addEventListener('input', function() {
    var url = this.value.trim();
    if (url) {
      previewImg.src = url;
      previewImg.style.display = 'block';
      label.style.display = 'none';
      previewImg.onerror = function() {
        previewImg.style.display = 'none';
        label.style.display = 'flex';
        label.textContent = '❌ فشل تحميل الصورة';
        label.style.color = '#ff4d6d';
      };
      previewImg.onload = function() {
        previewImg.style.display = 'block';
        label.style.display = 'none';
      };
    } else {
      previewImg.style.display = 'none';
      label.style.display = 'flex';
      label.textContent = '📷 ضع رابط الصورة للمعاينة';
      label.style.color = '#666';
    }
  });
  
  // تغيير طريقة العرض
  fitSelect.addEventListener('change', function() {
    previewImg.style.objectFit = this.value;
  });
  
  // تغيير الموضع
  posSelect.addEventListener('change', function() {
    previewImg.style.objectPosition = this.value;
  });
  
  console.log('✅ تم إضافة أدوات التحكم بالبانر');
};

// تشغيل عند فتح تبويب البانرات (إذا كان tab مُعرّف)

</script>
