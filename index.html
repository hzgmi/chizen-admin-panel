      'width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}' +
    '.ca-empty{text-align:center;padding:60px 20px;}' +
    '.ca-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}' +
    '.ca-modal.active{display:flex;}' +
    '.ca-modal-content{background:var(--ca-bg);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;color:var(--ca-text);}';
  document.head.appendChild(style);

  // ═══ الهيكل ═══
  function buildShell() {
    return '' +
      '<header class="ca-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(245,158,11,0.4);">💰</div>' +
          '<div>' +
            '<div style="font-weight:900;font-size:14px;color:var(--ca-text);">لوحة المحاسب</div>' +
            '<div style="color:#f59e0b;font-size:10px;margin-top:1px;">الإدارة المالية الشاملة</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button class="ca-theme-btn" onclick="window.__caToggleTheme()" id="ca-theme-icon">🌙</button>' +
          '<button onclick="window.__caLogout()" style="background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;">🚪 خروج</button>' +
        '</div>' +
      '</header>' +
      '<main class="ca-main" id="ca-main"></main>' +
      '<nav class="ca-nav">' +
        '<button class="ca-nav-btn active" data-tab="overview" onclick="window.__caSwitchTab(\'overview\',this)"><span class="icon">📊</span><span class="label">عامة</span></button>' +
        '<button class="ca-nav-btn" data-tab="orders" onclick="window.__caSwitchTab(\'orders\',this)"><span class="icon">🛒</span><span class="label">الطلبات</span></button>' +
        '<button class="ca-nav-btn" data-tab="bookings" onclick="window.__caSwitchTab(\'bookings\',this)"><span class="icon">✈️</span><span class="label">الحجوزات</span></button>' +
        '<button class="ca-nav-btn" data-tab="suppliers" onclick="window.__caSwitchTab(\'suppliers\',this)"><span class="icon">🏢</span><span class="label">الموردين</span></button>' +
        '<button class="ca-nav-btn" data-tab="debts" onclick="window.__caSwitchTab(\'debts\',this)"><span class="icon">💳</span><span class="label">الديون</span></button>' +
        '<button class="ca-nav-btn" data-tab="reports" onclick="window.__caSwitchTab(\'reports\',this)"><span class="icon">📈</span><span class="label">تقارير</span></button>' +
      '</nav>';
  }

  // ═══ أدوات مساعدة ═══
  function statCard(icon, label, value, color) {
    return '<div class="ca-stat" style="border-color:' + color + '40;">' +
      '<div class="ca-stat-icon">' + icon + '</div>' +
      '<div class="ca-stat-label">' + label + '</div>' +
      '<div class="ca-stat-value" style="color:' + color + ';">' + value + '</div>' +
    '</div>';
  }

  function row(label, value, color) {
    return '<div class="ca-row">' +
      '<span class="ca-row-label">' + label + '</span>' +
      '<span class="ca-row-value" style="' + (color ? 'color:' + color + ';' : '') + '">' + value + '</span>' +
    '</div>';
  }

  // ═══ حساب الإحصائيات ═══
  function calcStats() {
    var startTs = getPeriodStart();
    var orders = window.CA.orders.filter(function(o) { return getTs(o) >= startTs; });
    var bookings = window.CA.bookings.filter(function(b) { return getTs(b) >= startTs; });
    
    var stats = {
      totalSales: 0,
      confirmedSales: 0,
      pendingSales: 0,
      rejectedSales: 0,
      orderCount: 0,
      completedCount: 0,
      cancelledCount: 0,
      totalOrders: orders.length,
      bookingsRevenue: 0,
      bookingCount: bookings.length,
      confirmedBookings: 0,
      deliveryFees: 0,
      supplierDebts: 0,
      receivedDebts: 0,
      netRevenue: 0
    };
    
    orders.forEach(function(o) {
      var p = (o.payment && o.payment.status) || 'pending';
      var total = parseFloat(o.total) || 0;
      var fee = parseFloat((o.deliveryInfo && o.deliveryInfo.deliveryFee) || 0);
      
      stats.totalSales += total;
      stats.deliveryFees += fee;
      
      if (p === 'verified') stats.confirmedSales += total;
      else if (p === 'pending') stats.pendingSales += total;
      else if (p === 'rejected') stats.rejectedSales += total;
      
      if (o.status === 'completed') stats.completedCount++;
      if (o.status === 'cancelled') stats.cancelledCount++;
    });
    
    bookings.forEach(function(b) {
      var total = parseFloat((b.data && b.data.total) || b.total || 0);
      stats.bookingsRevenue += total;
      if (b.status === 'confirmed' || b.status === 'completed') stats.confirmedBookings++;
    });
    
    window.CA.balances.forEach(function(b) {
      var amt = parseFloat(b.amount) || 0;
      if (b.type === 'debt' || b.type === 'supplier' || b.status === 'unpaid') stats.supplierDebts += amt;
      if (b.type === 'payment' || b.status === 'paid') stats.receivedDebts += amt;
    });
    
    stats.netRevenue = stats.confirmedSales + stats.bookingsRevenue - stats.supplierDebts + stats.deliveryFees;
    return stats;
  }

  // ═══ بناء المحتوى ═══
  function renderContent() {
    var main = document.getElementById('ca-main');
    if (!main) return;
    
    if (window.CA.loading) {
      main.innerHTML = '<div style="text-align:center;padding:60px 20px;"><div style="font-size:48px;margin-bottom:12px;">⏳</div><div style="color:var(--ca-text-muted);">جاري التحميل...</div></div>';
      return;
    }
    
    var S = calcStats();
    var html = '';
    
    // ═══ تصفية زمنية (دائماً ظاهرة) ═══
    var periods = [
      { key: 'today', label: 'اليوم' },
      { key: 'week', label: 'الأسبوع' },
      { key: 'month', label: 'الشهر' },
      { key: 'all', label: 'الكل' }
    ];
    html += '<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;">';
    periods.forEach(function(p) {
      var active = window.CA.period === p.key;
      html += '<button class="ca-period-btn' + (active ? ' active' : '') + '" onclick="window.__caSetPeriod(&quot;' + p.key + '&quot;)">' + p.label + '</button>';
    });
    html += '</div>';
    
    // ═══ محتوى حسب التبويب ═══
    if (window.CA.tab === 'overview') {
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
        statCard('💵', 'إجمالي المبيعات', S.totalSales.toFixed(0), '#10b981') +
        statCard('✅', 'مؤكدة الدفع', S.confirmedSales.toFixed(0), '#10b981') +
        statCard('⏳', 'معلقة الدفع', S.pendingSales.toFixed(0), '#f59e0b') +
        statCard('📦', 'إجمالي الطلبات', S.totalOrders, '#3b82f6') +
      '</div>';
      
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">📊 تفاصيل المبيعات</div>' +
        row('إجمالي المبيعات (كل الطلبات)', S.totalSales.toFixed(0) + ' ر.س') +
        row('مؤكدة الدفع', S.confirmedSales.toFixed(0) + ' ر.س', '#10b981') +
        row('معلقة', S.pendingSales.toFixed(0) + ' ر.س', '#f59e0b') +
        row('مرفوضة', S.rejectedSales.toFixed(0) + ' ر.س', '#ef4444') +
        row('رسوم التوصيل المحصلة', S.deliveryFees.toFixed(0) + ' ر.س', '#a855f7') +
      '</div>';
      
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">✈️ الحجوزات</div>' +
        row('إيرادات الحجوزات', S.bookingsRevenue.toFixed(0) + ' ر.س', '#3b82f6') +
        row('عدد الحجوزات', S.bookingCount) +
        row('مؤكدة', S.confirmedBookings, '#10b981') +
      '</div>';
      
      html += '<div class="ca-card" style="' + (S.supplierDebts > 0 ? 'border-color:rgba(239,68,68,0.5);' : '') + '">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">🏢 الموردين والديون</div>' +
        row('ديون للموردين', S.supplierDebts.toFixed(0) + ' ر.س', S.supplierDebts > 0 ? '#ef4444' : '#10b981') +
        row('مدفوعات مستلمة', S.receivedDebts.toFixed(0) + ' ر.س', '#10b981') +
      '</div>';
      
      html += '<div class="ca-card" style="background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(59,130,246,0.1));border:2px solid #10b981;">' +
        '<div style="font-weight:900;color:#10b981;font-size:13px;margin-bottom:10px;">💰 صافي الإيرادات</div>' +
        '<div style="text-align:center;padding:10px 0;">' +
          '<div style="font-size:32px;font-weight:900;color:#10b981;">' + S.netRevenue.toFixed(0) + '</div>' +
          '<div style="font-size:11px;color:var(--ca-text-muted);margin-top:4px;">ر.س (المؤكدة + حجوزات + توصيل - ديون)</div>' +
        '</div>' +
      '</div>';
    }
    
    else if (window.CA.tab === 'orders') {
      // بحث
      html += '<div style="position:relative;margin-bottom:12px;">' +
        '<input class="ca-search" placeholder="🔍 بحث بالرقم / اسم / هاتف..." value="' + esc(window.CA.search) + '" oninput="window.__caSearch(this.value)">' +
        '<span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:0.6;">🔍</span>' +
      '</div>';
      
      var orders = window.CA.orders.filter(function(o) { return getTs(o) >= getPeriodStart(); });
      if (window.CA.search) {
        var q = window.CA.search.toLowerCase();
        orders = orders.filter(function(o) {
          return (o.id || '').toLowerCase().indexOf(q) > -1 ||
                 (o.name || '').toLowerCase().indexOf(q) > -1 ||
                 (o.phone || '').toLowerCase().indexOf(q) > -1;
        });
      }
      orders.sort(function(a, b) { return getTs(b) - getTs(a); });
      
      if (orders.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">📭</div><div style="color:var(--ca-text-muted);">لا توجد طلبات</div></div>';
      } else {
        html += orders.map(function(o) {
          var p = (o.payment && o.payment.status) || 'pending';
          var statusColor = p === 'verified' ? '#10b981' : (p === 'rejected' ? '#ef4444' : '#f59e0b');
          var statusText = p === 'verified' ? '✅ مؤكد' : (p === 'rejected' ? '❌ مرفوض' : '⏳ معلق');
          return '<div class="ca-card" onclick="window.__caOrderDetails(&quot;' + esc(o.id) + '&quot;)" style="cursor:pointer;">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:#f59e0b;font-size:12px;">#' + esc((o.id || '').substring(0, 10)) + '</span>' +
              '<span style="font-size:10px;color:' + statusColor + ';font-weight:800;">' + statusText + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ca-text);font-weight:700;">' + esc(o.name || 'عميل') + '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + esc(o.phone || '') + ' • ' + timeAgo(o) + '</div>' +
            '<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--ca-divider);">' +
              '<span style="font-size:11px;color:var(--ca-text-sub);">الإجمالي</span>' +
              '<span style="font-weight:900;color:#ff4d94;font-size:14px;">' + (o.total || 0) + ' ر.س</span>' +
            '</div>' +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'bookings') {
      var bookings = window.CA.bookings.filter(function(b) { return getTs(b) >= getPeriodStart(); });
      bookings.sort(function(a, b) { return getTs(b) - getTs(a); });
      
      if (bookings.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">✈️</div><div style="color:var(--ca-text-muted);">لا توجد حجوزات</div></div>';
      } else {
        bookings.forEach(function(b) {
          var d = b.data || {};
          var total = parseFloat(d.total || b.total || 0);
          var typeIcon = b.type === 'flight' ? '✈️' : (b.type === 'hotel' ? '🏨' : (b.type === 'bus' ? '🚌' : '🕋'));
          var typeName = b.type === 'flight' ? 'طيران' : (b.type === 'hotel' ? 'فندق' : (b.type === 'bus' ? 'باص' : 'حج وعمرة'));
          html += '<div class="ca-card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:#3b82f6;font-size:12px;">' + typeIcon + ' ' + typeName + '</span>' +
              '<span style="font-weight:900;color:#10b981;font-size:14px;">' + total.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ca-text);font-weight:700;">' + esc(d.name || b.userName || 'عميل') + '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + esc(d.phone || '') + ' • ' + timeAgo(b) + '</div>' +
          '</div>';
        });
      }
    }
    
    else if (window.CA.tab === 'suppliers') {
      if (window.CA.suppliers.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">🏢</div><div style="color:var(--ca-text-muted);">لا يوجد موردين مسجلين</div></div>';
      } else {
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">' +
          statCard('🏢', 'إجمالي الموردين', window.CA.suppliers.length, '#3b82f6') +
          statCard('💰', 'إجمالي الديون', S.supplierDebts.toFixed(0), '#ef4444') +
        '</div>';
        
        html += window.CA.suppliers.map(function(s) {
          var balance = parseFloat(s.balance || s.debt || 0);
          return '<div class="ca-card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:var(--ca-text);font-size:13px;">' + esc(s.name || 'مورد') + '</span>' +
              '<span style="font-weight:900;color:' + (balance > 0 ? '#ef4444' : '#10b981') + ';font-size:13px;">' + balance.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            (s.phone ? '<div style="font-size:11px;color:var(--ca-text-muted);">📱 ' + esc(s.phone) + '</div>' : '') +
            (s.company ? '<div style="font-size:11px;color:var(--ca-text-muted);">🏢 ' + esc(s.company) + '</div>' : '') +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'debts') {
      if (window.CA.balances.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">💳</div><div style="color:var(--ca-text-muted);">لا توجد ديون مسجلة</div></div>';
      } else {
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">' +
          statCard('💸', 'مدينون لنا', S.receivedDebts.toFixed(0), '#10b981') +
          statCard('📉', 'نحن مدينون', S.supplierDebts.toFixed(0), '#ef4444') +
        '</div>';
        
        html += window.CA.balances.map(function(b) {
          var amount = parseFloat(b.amount || 0);
          var isDebt = b.type === 'debt' || b.status === 'unpaid';
          return '<div class="ca-card" style="border-color:' + (isDebt ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)') + ';">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
              '<span style="font-weight:900;color:var(--ca-text);font-size:12px;">' + esc(b.name || b.supplierName || 'غير محدد') + '</span>' +
              '<span style="font-weight:900;color:' + (isDebt ? '#ef4444' : '#10b981') + ';font-size:14px;">' + amount.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + (isDebt ? '⚠️ دين مستحق' : '✅ مدفوع') + ' • ' + timeAgo(b) + '</div>' +
            (b.note ? '<div style="font-size:11px;color:var(--ca-text-muted);margin-top:4px;">📝 ' + esc(b.note) + '</div>' : '') +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'reports') {
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:14px;margin-bottom:14px;">📈 ملخص الأداء المالي</div>' +
        row('الفترة', {today: 'اليوم', week: 'آخر 7 أيام', month: 'آخر 30 يوم', all: 'الكل'}[window.CA.period] || '') +
        row('إجمالي الطلبات', S.totalOrders) +
        row('مكتملة', S.completedCount, '#10b981') +
        row('ملغية', S.cancelledCount, '#ef4444') +
        row('الحجوزات', S.bookingCount, '#3b82f6') +
        row('الدخل الإجمالي', S.confirmedSales.toFixed(0) + ' ر.س', '#10b981') +
        row('الدخل الصافي', S.netRevenue.toFixed(0) + ' ر.س', '#10b981') +
      '</div>';
      
      html += '<button onclick="window.__caExportCSV()" style="width:100%;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;border-radius:12px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 12px rgba(245,158,11,0.3);">📥 تصدير الطلبات (CSV)</button>' +
        '<button onclick="window.__caExportSummary()" style="width:100%;padding:14px;background:var(--ca-input-bg);border:1.5px solid var(--ca-input-border);color:var(--ca-text);border-radius:12px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer;">📄 تصدير ملخص مالي</button>';
    }
    
    main.innerHTML = html;
  }

  // ═══ تبديل التبويبات ═══
  window.__caSwitchTab = function(tab, btn) {
    window.CA.tab = tab;
    window.CA.search = '';
    document.querySelectorAll('.ca-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  window.__caSetPeriod = function(p) {
    window.CA.period = p;
    renderContent();
  };

  window.__caSearch = function(q) {
    window.CA.search = q || '';
    clearTimeout(window.__caSearchTimer);
    window.__caSearchTimer = setTimeout(renderContent, 200);
  };

  window.__caToggleTheme = function() {
    var app = document.getElementById('accountant-mgr-app');
    if (!app) return;
    var cur = app.getAttribute('data-theme') || 'dark';
    var next = cur === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_ca_theme', next); } catch(e) {}
    var icon = document.getElementById('ca-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  window.__caLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ تصدير CSV ═══
  window.__caExportCSV = function() {
    var orders = window.CA.orders.filter(function(o) { return getTs(o) >= getPeriodStart(); });
    var csv = 'رقم الطلب,العميل,الهاتف,الإجمالي,حالة الدفع,الحالة,التاريخ\n';
    orders.forEach(function(o) {
      var p = (o.payment && o.payment.status) || 'pending';
      var date = getTs(o) ? new Date(getTs(o)).toLocaleDateString('ar') : '';
      csv += '"' + (o.id || '') + '","' + (o.name || '') + '","' + (o.phone || '') + '",' + (o.total || 0) + ',"' + p + '","' + (o.status || '') + '","' + date + '"\n';
    });
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'chizen-orders-' + new Date().toISOString().split('T')[0] + '.csv';
    link.click();
  };

  window.__caExportSummary = function() {
    var S = calcStats();
    var text = 'ملخص مالي - ' + new Date().toLocaleString('ar') + '\n' +
      '═══════════════════════\n' +
      'الفترة: ' + {today: 'اليوم', week: 'آخر 7 أيام', month: 'آخر 30 يوم', all: 'الكل'}[window.CA.period] + '\n\n' +
      '📊 المبيعات:\n' +
      '- إجمالي: ' + S.totalSales.toFixed(0) + ' ر.س\n' +
      '- مؤكدة: ' + S.confirmedSales.toFixed(0) + ' ر.س\n' +
      '- معلقة: ' + S.pendingSales.toFixed(0) + ' ر.س\n' +
      '- مرفوضة: ' + S.rejectedSales.toFixed(0) + ' ر.س\n\n' +
      '✈️ الحجوزات: ' + S.bookingsRevenue.toFixed(0) + ' ر.س (' + S.bookingCount + ' حجز)\n\n' +
      '🚚 رسوم توصيل: ' + S.deliveryFees.toFixed(0) + ' ر.س\n\n' +
      '🏢 الديون:\n' +
      '- لنا: ' + S.receivedDebts.toFixed(0) + ' ر.س\n' +
      '- علينا: ' + S.supplierDebts.toFixed(0) + ' ر.س\n\n' +
      '💰 الصافي: ' + S.netRevenue.toFixed(0) + ' ر.س';
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'chizen-summary-' + new Date().toISOString().split('T')[0] + '.txt';
    link.click();
  };

  // ═══ تفاصيل طلب ═══
  window.__caOrderDetails = function(orderId) {
    var o = window.CA.orders.find(function(x) { return x.id === orderId; });
    if (!o) return;
    var p = o.payment || {};
    var modal = document.createElement('div');
    modal.className = 'ca-modal active';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div class="ca-modal-content">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:16px;">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:14px;">📋 تفاصيل الطلب</div>' +
        '<button onclick="this.closest(&quot;.ca-modal&quot;).remove()" style="background:var(--ca-input-bg);border:none;color:var(--ca-text);width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>' +
      '</div>' +
      row('رقم الطلب', '#' + esc(orderId)) +
      row('العميل', esc(o.name || '—')) +
      row('الهاتف', esc(o.phone || '—')) +
      row('العنوان', esc(o.pickup || '—')) +
      row('الإجمالي', (o.total || 0) + ' ر.س', '#ff4d94') +
      row('حالة الدفع', p.status === 'verified' ? '✅ مؤكد' : (p.status === 'rejected' ? '❌ مرفوض' : '⏳ معلق')) +
      row('حالة الطلب', esc(o.status || '—')) +
      (p.receiptUrl ? '<a href="' + esc(p.receiptUrl) + '" target="_blank" style="display:block;padding:10px;background:rgba(59,130,246,0.15);color:#3b82f6;border-radius:8px;text-align:center;text-decoration:none;margin-top:8px;font-weight:800;font-size:12px;">📸 عرض الإيصال</a>' : '') +
    '</div>';
    document.body.appendChild(modal);
  };

  // ═══ تحميل البيانات ═══
  async function loadAllData() {
    if (!window.FB || !FB.db) { setTimeout(loadAllData, 500); return; }
    
    try {
      // الطلبات
      var ordersSnap = await FB.db.collection('orders').orderBy('createdAt', 'desc').limit(200).get();
      window.CA.orders = [];
      ordersSnap.forEach(function(doc) {
        var d = doc.data(); d.id = d.id || doc.id;
        window.CA.orders.push(d);
      });
      
      // الحجوزات
      try {
        var bSnap = await FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(100).get();
        window.CA.bookings = [];
        bSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.bookings.push(d);
        });
      } catch(e) { window.CA.bookings = []; }
      
      // الموردين
      try {
        var sSnap = await FB.db.collection('sups').get();
        window.CA.suppliers = [];
        sSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.suppliers.push(d);
        });
      } catch(e) { window.CA.suppliers = []; }
      
      // الديون
      try {
        var balSnap = await FB.db.collection('balances').get();
        window.CA.balances = [];
        balSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.balances.push(d);
        });
      } catch(e) { window.CA.balances = []; }
      
      window.CA.loading = false;
      renderContent();
    } catch(e) {
      console.warn('[ACCOUNTANT-UI] load error:', e.message);
      window.CA.loading = false;
      renderContent();
    }
  }

  // ═══ onSnapshot للطلبات (تحديث فوري) ═══
  function setupListener() {
    if (!window.FB || !FB.db) return;
    try {
      FB.db.collection('orders').orderBy('createdAt', 'desc').limit(200)
        .onSnapshot(function(snap) {
          var orders = [];
          snap.forEach(function(doc) {
            var d = doc.data(); d.id = d.id || doc.id;
            orders.push(d);
          });
          window.CA.orders = orders;
          var app = document.getElementById('accountant-mgr-app');
          if (app && app.classList.contains('active')) renderContent();
        }, function(err) {
          console.warn('[ACCOUNTANT-UI] listener:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateAccountantUI = async function() {
    console.log('[ACCOUNTANT-UI] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('accountant-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'accountant-mgr-app';
      app.className = 'ca-app active';
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_ca_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      
      var icon = document.getElementById('ca-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    await loadAllData();
    setupListener();
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__accountantHooked) return;
    A.__accountantHooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'accountant') {
        window.activateAccountantUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[ACCOUNTANT-UI] ready');
})();
</script>

<script id="chz-bookings-mgr">
(function(){
  'use strict';
  console.log('[BOOKINGS-MGR] loading...');

  window.CB = {
    tab: 'all',
    period: 'month',
    bookings: [],
    search: '',
    loading: true,
    listener: null
  };

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getTs(b) {
    if (!b.createdAt) return 0;
    return b.createdAt.seconds ? b.createdAt.seconds * 1000 : (b.createdAt.toMillis ? b.createdAt.toMillis() : 0);
  }

  function timeAgo(b) {
    var ts = getTs(b);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 60) return 'منذ ' + diff + ' د';
    if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
    if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
    return new Date(ts).toLocaleDateString('ar');
  }

  function getPeriodStart() {
    var p = window.CB.period;
    if (p === 'today') { var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
    if (p === 'week') return Date.now() - 7*24*60*60*1000;
    if (p === 'month') return Date.now() - 30*24*60*60*1000;
    return 0;
  }

  var TYPE_INFO = {
    'flight': { icon: '✈️', name: 'طيران', color: '#3b82f6' },
    'hotel': { icon: '🏨', name: 'فندق', color: '#a855f7' },
    'bus': { icon: '🚌', name: 'باص', color: '#f59e0b' },
    'hajj': { icon: '🕋', name: 'حج وعمرة', color: '#10b981' }
  };

  // ═══ CSS ═══
  var style = document.createElement('style');
  style.id = 'bookings-mgr-css';
  style.textContent = 
    '.cb-app{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;font-family:Tajawal,sans-serif;direction:rtl;' +
      'background:radial-gradient(circle at 50% 0%,#151b3a 0%,#07091d 80%);color:#fff;' +
      '--cb-bg:#07091d;--cb-header-bg:rgba(10,8,30,0.95);--cb-card-bg:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));' +
      '--cb-card-border:rgba(59,130,246,0.25);--cb-text:#fff;--cb-text-sub:#b8c0d8;--cb-text-muted:#6b7591;' +

    '}' +
    '.cb-app.active{display:flex;}' +
    '.cb-app[data-theme="light"]{' +
      'background:linear-gradient(135deg,#f5f7fb,#eef2ff);color:#1a1a2e;' +
      '--cb-bg:#f5f7fb;--cb-header-bg:#ffffff;--cb-card-bg:#ffffff;' +
      '--cb-card-border:#e5e7eb;--cb-text:#1a1a2e;--cb-text-sub:#6b7280;--cb-text-muted:#9ca3af;' +
      '--cb-nav-bg:#ffffff;--cb-input-bg:#f9fafb;--cb-input-border:#e5e7eb;--cb-divider:#e5e7eb;' +
    '}' +
    '.cb-header{padding:12px 16px;background:var(--cb-header-bg);border-bottom:1px solid var(--cb-divider);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}' +
    '.cb-main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;background:var(--cb-bg);}' +
    '.cb-nav{display:flex;background:var(--cb-nav-bg);border-top:1px solid var(--cb-divider);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}' +
    '.cb-nav-btn{flex-shrink:0;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;' +

    '.cb-nav-btn.active{color:#3b82f6;background:linear-gradient(135deg,rgba(59,130,246,0.15),rgba(37,99,235,0.05));}' +
    '.cb-nav-btn.active::after{content:"";position:absolute;bottom:4px;left:25%;right:25%;height:3px;background:#3b82f6;border-radius:2px;}' +
    '.cb-nav-btn .icon{font-size:20px;}' +
    '.cb-nav-btn .label{font-size:9px;}' +
    '.cb-nav-btn .count{position:absolute;top:4px;right:calc(50% - 22px);background:#ef4444;color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:10px;min-width:14px;text-align:center;}' +
    '.cb-card{background:var(--cb-card-bg);border:1px solid var(--cb-card-border);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;}' +
    '.cb-card:active{transform:scale(0.98);}' +
    '.cb-stat{background:var(--cb-card-bg);border:1px solid var(--cb-card-border);border-radius:12px;padding:12px;text-align:center;}' +
    '.cb-stat-icon{font-size:20px;margin-bottom:3px;}' +
    '.cb-stat-label{font-size:10px;color:var(--cb-text-muted);margin-bottom:4px;font-weight:700;}' +
    '.cb-stat-value{font-size:16px;font-weight:900;}' +
    '.cb-search{width:100%;padding:11px 40px 11px 14px;border-radius:10px;border:1.5px solid var(--cb-input-border);' +
      'background:var(--cb-input-bg);color:var(--cb-text);font-family:Tajawal,sans-serif;font-size:13px;box-sizing:border-box;outline:none;}' +
    '.cb-period-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--cb-input-border);background:var(--cb-input-bg);' +
      'color:var(--cb-text-sub);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}' +
    '.cb-period-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6;}' +
    '.cb-theme-btn{background:var(--cb-input-bg);border:1.5px solid var(--cb-input-border);color:var(--cb-text);' +
      'width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}' +
    '.cb-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}' +
    '.cb-modal.active{display:flex;}' +
    '.cb-modal-content{background:var(--cb-bg);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;color:var(--cb-text);}' +
    '.cb-modal-content input,.cb-modal-content textarea,.cb-modal-content select{background:var(--cb-input-bg);color:var(--cb-text);border:1.5px solid var(--cb-input-border);}' +

  document.head.appendChild(style);

  // ═══ الهيكل ═══
  function buildShell() {
    return '' +
      '<header class="cb-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(59,130,246,0.4);">✈️</div>' +
          '<div>' +
            '<div style="font-weight:900;font-size:14px;color:var(--cb-text);">لوحة الحجوزات</div>' +
            '<div style="color:#3b82f6;font-size:10px;margin-top:1px;">إدارة كاملة</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button class="cb-theme-btn" onclick="window.__cbToggleTheme()" id="cb-theme-icon">🌙</button>' +
          '<button onclick="window.__cbLogout()" style="background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;">🚪 خروج</button>' +
        '</div>' +
      '</header>' +
      '<main class="cb-main" id="cb-main"></main>' +
      '<nav class="cb-nav">' +
        '<button class="cb-nav-btn active" data-tab="all" onclick="window.__cbSwitchTab(\'all\',this)"><span class="icon">📋</span><span class="label">الكل</span></button>' +
        '<button class="cb-nav-btn" data-tab="flight" onclick="window.__cbSwitchTab(\'flight\',this)"><span class="icon">✈️</span><span class="label">طيران</span><span class="count" id="cb-cnt-flight" style="display:none;">0</span></button>' +
        '<button class="cb-nav-btn" data-tab="hotel" onclick="window.__cbSwitchTab(\'hotel\',this)"><span class="icon">🏨</span><span class="label">فنادق</span><span class="count" id="cb-cnt-hotel" style="display:none;">0</span></button>' +
        '<button class="cb-nav-btn" data-tab="bus" onclick="window.__cbSwitchTab(\'bus\',this)"><span class="icon">🚌</span><span class="label">باصات</span><span class="count" id="cb-cnt-bus" style="display:none;">0</span></button>' +
        '<button class="cb-nav-btn" data-tab="hajj" onclick="window.__cbSwitchTab(\'hajj\',this)"><span class="icon">🕋</span><span class="label">حج</span><span class="count" id="cb-cnt-hajj" style="display:none;">0</span></button>' +
      '</nav>';
  }

  // ═══ إحصائيات ═══
  function buildStats() {
    var startTs = getPeriodStart();
    var bookings = window.CB.bookings.filter(function(b) { return getTs(b) >= startTs; });
    
    var pending = bookings.filter(function(b) { return (b.status || 'pending') === 'pending'; });
    var confirmed = bookings.filter(function(b) { return b.status === 'confirmed'; });
    var completed = bookings.filter(function(b) { return b.status === 'completed'; });
    var cancelled = bookings.filter(function(b) { return b.status === 'cancelled'; });
    
    var revenue = 0;
    confirmed.forEach(function(b) { revenue += parseFloat((b.data && b.data.total) || b.total || 0); });
    completed.forEach(function(b) { revenue += parseFloat((b.data && b.data.total) || b.total || 0); });
    
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">' +
      statCard('⏳', 'بانتظار التأكيد', pending.length, '#f59e0b') +
      statCard('✅', 'مؤكدة', confirmed.length, '#10b981') +
      statCard('📦', 'مكتملة', completed.length, '#3b82f6') +
      statCard('💵', 'الإيرادات', revenue.toFixed(0) + ' ر.س', '#10b981') +
    '</div>';
  }

  function statCard(icon, label, value, color) {
    return '<div class="cb-stat" style="border-color:' + color + '40;">' +
      '<div class="cb-stat-icon">' + icon + '</div>' +
      '<div class="cb-stat-label">' + label + '</div>' +
      '<div class="cb-stat-value" style="color:' + color + ';">' + value + '</div>' +
    '</div>';
  }

  // ═══ المحتوى ═══
  function renderContent() {
    var main = document.getElementById('cb-main');
    if (!main) return;
    
    if (window.CB.loading) {
      main.innerHTML = '<div style="text-align:center;padding:60px 20px;"><div style="font-size:48px;margin-bottom:12px;">⏳</div><div style="color:var(--cb-text-muted);">جاري التحميل...</div></div>';
      return;
    }
    
    var html = '';
    
    // فترات
    var periods = [
      { key: 'today', label: 'اليوم' },
      { key: 'week', label: 'الأسبوع' },
      { key: 'month', label: 'الشهر' },
      { key: 'all', label: 'الكل' }
    ];
    html += '<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;">';
    periods.forEach(function(p) {
      html += '<button class="cb-period-btn' + (window.CB.period === p.key ? ' active' : '') + '" onclick="window.__cbSetPeriod(&quot;' + p.key + '&quot;)">' + p.label + '</button>';
    });
    html += '</div>';
    
    // إحصائيات
    html += buildStats();
    
    // بحث
    html += '<div style="position:relative;margin-bottom:12px;">' +
      '<input class="cb-search" placeholder="🔍 بحث بالاسم / الهاتف / الوجهة..." value="' + esc(window.CB.search) + '" oninput="window.__cbSearch(this.value)">' +
      '<span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:0.6;">🔍</span>' +
    '</div>';
    
    // الحجوزات
    var bookings = window.CB.bookings.filter(function(b) { return getTs(b) >= getPeriodStart(); });
    
    // فلترة حسب النوع
    if (window.CB.tab !== 'all') {
      bookings = bookings.filter(function(b) { return (b.type || '') === window.CB.tab; });
    }
    
    // بحث
    if (window.CB.search) {
      var q = window.CB.search.toLowerCase();
      bookings = bookings.filter(function(b) {
        var d = b.data || {};
        return (b.userName || '').toLowerCase().indexOf(q) > -1 ||
               (b.userEmail || '').toLowerCase().indexOf(q) > -1 ||
               (d.name || '').toLowerCase().indexOf(q) > -1 ||
               (d.phone || '').toLowerCase().indexOf(q) > -1 ||
               (d.from || '').toLowerCase().indexOf(q) > -1 ||
               (d.to || '').toLowerCase().indexOf(q) > -1 ||
               (d.city || '').toLowerCase().indexOf(q) > -1;
      });
    }
    
    bookings.sort(function(a, b) { return getTs(b) - getTs(a); });
    
    // عدادات
    var counts = { flight: 0, hotel: 0, bus: 0, hajj: 0 };
    window.CB.bookings.forEach(function(b) {
      if (counts[b.type] !== undefined && (b.status || 'pending') === 'pending') counts[b.type]++;
    });
    ['flight', 'hotel', 'bus', 'hajj'].forEach(function(k) {
      var el = document.getElementById('cb-cnt-' + k);
      if (el) {
        el.textContent = counts[k];
        el.style.display = counts[k] > 0 ? 'inline-block' : 'none';
      }
    });
    
    // قائمة
    if (bookings.length === 0) {
      html += '<div style="text-align:center;padding:60px 20px;">' +
        '<div style="font-size:64px;margin-bottom:12px;">✈️</div>' +
        '<div style="color:var(--cb-text-muted);">لا توجد حجوزات</div>' +
      '</div>';
    } else {
      html += bookings.map(function(b) { return buildCard(b); }).join('');
    }
    
    main.innerHTML = html;
  }

  // ═══ بطاقة ═══
  function buildCard(b) {
    var type = b.type || 'flight';
    var t = TYPE_INFO[type] || TYPE_INFO.flight;
    var d = b.data || {};
    var status = b.status || 'pending';
    var statusColor = status === 'confirmed' ? '#10b981' : (status === 'cancelled' ? '#ef4444' : (status === 'completed' ? '#3b82f6' : '#f59e0b'));
    var statusText = { pending: '⏳ معلق', confirmed: '✅ مؤكد', completed: '📦 مكتمل', cancelled: '❌ ملغي' }[status] || status;
    var total = parseFloat(d.total || b.total || 0);
    
    var detail = '';
    if (type === 'flight') detail = (d.from || '—') + ' → ' + (d.to || '—');
    else if (type === 'hotel') detail = (d.city || '—') + ' • ' + (d.checkin || '—') + ' → ' + (d.checkout || '—');
    else if (type === 'bus') detail = (d.from || '—') + ' → ' + (d.to || '—') + ' • ' + (d.date || '—');
    else if (type === 'hajj') detail = (d.type || 'عمرة') + ' • ' + (d.date || '—');
    
    var actions = '';
    if (status === 'pending') {
      actions = '<div style="display:flex;gap:6px;margin-top:10px;">' +
        '<button onclick="event.stopPropagation();window.__cbConfirm(&quot;' + esc(b.id) + '&quot;)" style="flex:1;padding:10px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">✅ تأكيد</button>' +
        '<button onclick="event.stopPropagation();window.__cbCancel(&quot;' + esc(b.id) + '&quot;)" style="padding:10px 14px;background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">❌</button>' +
      '</div>';
    } else if (status === 'confirmed') {
      actions = '<div style="display:flex;gap:6px;margin-top:10px;">' +
        '<button onclick="event.stopPropagation();window.__cbComplete(&quot;' + esc(b.id) + '&quot;)" style="flex:1;padding:10px;background:rgba(59,130,246,0.15);border:1.5px solid #3b82f6;color:#3b82f6;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">📦 مكتمل</button>' +
        '<button onclick="event.stopPropagation();window.__cbSendWA(&quot;' + esc(b.id) + '&quot;)" style="padding:10px 14px;background:#25D366;border:none;color:#fff;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">💬</button>' +
      '</div>';
    }
    
    return '<div class="cb-card" onclick="window.__cbOpenDetails(&quot;' + esc(b.id) + '&quot;)">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">' +
          '<div style="width:44px;height:44px;border-radius:12px;background:' + t.color + '22;border:1.5px solid ' + t.color + '55;display:flex;align-items:center;justify-content:center;font-size:20px;">' + t.icon + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-weight:900;color:' + t.color + ';font-size:13px;">' + t.name + '</div>' +
            '<div style="font-size:11px;color:var(--cb-text);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(b.userName || d.name || 'عميل') + '</div>' +
            '<div style="font-size:10px;color:var(--cb-text-muted);">' + esc(detail) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="text-align:left;">' +
          '<div style="font-size:10px;color:' + statusColor + ';font-weight:900;">' + statusText + '</div>' +
          '<div style="font-weight:900;color:#ff4d94;font-size:14px;margin-top:4px;">' + total.toFixed(0) + '</div>' +
          '<div style="font-size:9px;color:var(--cb-text-muted);">ر.س</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:10px;color:var(--cb-text-muted);display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--cb-divider);">' +
        '<span>📱 ' + esc(d.phone || b.userPhone || '—') + '</span>' +
        '<span>' + timeAgo(b) + '</span>' +
      '</div>' +
      actions +
    '</div>';
  }

  // ═══ تبديل ═══
  window.__cbSwitchTab = function(tab, btn) {
    window.CB.tab = tab;
    window.CB.search = '';
    document.querySelectorAll('.cb-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  window.__cbSetPeriod = function(p) {
    window.CB.period = p;
    renderContent();
  };

  window.__cbSearch = function(q) {
    window.CB.search = q || '';
    clearTimeout(window.__cbSearchTimer);
    window.__cbSearchTimer = setTimeout(renderContent, 200);
  };

  window.__cbToggleTheme = function() {
    var app = document.getElementById('bookings-mgr-app');
    if (!app) return;
    var cur = app.getAttribute('data-theme') || 'dark';
    var next = cur === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_cb_theme', next); } catch(e) {}
    var icon = document.getElementById('cb-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  window.__cbLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ تفاصيل ═══
  window.__cbOpenDetails = function(id) {
    var b = window.CB.bookings.find(function(x) { return x.id === id; });
    if (!b) return;
    var d = b.data || {};
    var type = b.type || 'flight';
    var t = TYPE_INFO[type] || TYPE_INFO.flight;
    var status = b.status || 'pending';
    
    var detailsHtml = '';
    Object.keys(d).forEach(function(k) {
      if (k === 'total' || k === 'name' || k === 'phone') return;
      var label = {
        from: 'من', to: 'إلى', date: 'التاريخ', type: 'النوع',
        checkin: 'دخول', checkout: 'خروج', city: 'المدينة',
        hotel: 'الفندق', airline: 'الخطوط', passengers: 'المسافرون',
        guests: 'الضيوف', rooms: 'الغرف', notes: 'ملاحظات'
      }[k] || k;
      var val = d[k];
      if (typeof val === 'object') val = JSON.stringify(val);
      if (!val) return;
      detailsHtml += '<div style="display:flex;justify-content:space-between;padding:8px;background:var(--cb-input-bg);border-radius:8px;margin-bottom:4px;font-size:12px;">' +
        '<span style="color:var(--cb-text-sub);">' + esc(label) + '</span>' +
        '<span style="color:var(--cb-text);font-weight:800;">' + esc(val) + '</span>' +
      '</div>';
    });
    
    var modal = document.createElement('div');
    modal.className = 'cb-modal active';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div class="cb-modal-content">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:16px;">' +
        '<div style="font-weight:900;color:' + t.color + ';font-size:14px;">' + t.icon + ' تفاصيل الحجز</div>' +
        '<button onclick="this.closest(&quot;.cb-modal&quot;).remove()" style="background:var(--cb-input-bg);border:none;color:var(--cb-text);width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div style="background:' + t.color + '15;border:1px solid ' + t.color + '40;border-radius:10px;padding:12px;margin-bottom:14px;">' +
        '<div style="font-size:11px;color:' + t.color + ';margin-bottom:4px;">رقم الحجز</div>' +
        '<div style="font-weight:900;color:var(--cb-text);font-family:monospace;font-size:13px;">#' + esc(id) + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">' +
        '<div style="background:var(--cb-input-bg);border-radius:10px;padding:10px;">' +
          '<div style="font-size:10px;color:var(--cb-text-muted);margin-bottom:2px;">العميل</div>' +
          '<div style="font-size:12px;color:var(--cb-text);font-weight:700;">' + esc(b.userName || d.name || '—') + '</div>' +
        '</div>' +
        '<div style="background:var(--cb-input-bg);border-radius:10px;padding:10px;">' +
          '<div style="font-size:10px;color:var(--cb-text-muted);margin-bottom:2px;">الهاتف</div>' +
          '<div style="font-size:12px;color:var(--cb-text);direction:ltr;">' + esc(d.phone || b.userPhone || '—') + '</div>' +
        '</div>' +
      '</div>' +
      detailsHtml +

    if (!confirm('تأكيد هذا الحجز؟')) return;
    try {
      await FB.db.collection('bookings').doc(id).update({
        status: 'confirmed',
        confirmedAt: new Date(),
        confirmedBy: FB.currentUser ? FB.currentUser.uid : ''
      });
      var b = window.CB.bookings.find(function(x) { return x.id === id; });

        await FB.addUserNotification(b.userId, {
          title: '✅ تم تأكيد حجزك',

          type: 'booking'
        }).catch(function(){});
      }
      await loadBookings();
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ إلغاء ═══
  window.__cbCancel = async function(id) {
    var reason = prompt('سبب الإلغاء (اختياري):');

    try {
      await FB.db.collection('bookings').doc(id).update({
        status: 'cancelled',
        cancelReason: reason || '',
        cancelledAt: new Date(),
        cancelledBy: FB.currentUser ? FB.currentUser.uid : ''
      });
      await loadBookings();
    } catch(e) { alert('فشل: ' + e.message); }
  };

  window.__cbComplete = async function(id) {
    if (!confirm('تم إكمال الحجز؟')) return;

      await FB.db.collection('bookings').doc(id).update({
        status: 'completed',
        completedAt: new Date()
      });
      await loadBookings();

  window.__cbSendWA = function(id) {
    var b = window.CB.bookings.find(function(x) { return x.id === id; });

    var d = b.data || {};
    var phone = (d.phone || b.userPhone || '').replace(/\D/g, '');
    if (!phone) return alert('رقم الهاتف غير متوفر');
    if (phone.length === 9 && phone.startsWith('7')) phone = '967' + phone;
    
    var msg = '✈️ *تأكيد حجزك*\n\n' +
      'أهلاً ' + (b.userName || d.name || 'عزيزي العميل') + ',\n' +
      'تم تأكيد حجزك بنجاح ✅\n\n' +
      '📋 تفاصيل الحجز:\n';
    
    ['from', 'to', 'city', 'hotel', 'airline', 'date', 'checkin', 'checkout', 'passengers', 'guests', 'rooms'].forEach(function(k) {
      if (d[k]) {
        var label = { from: 'من', to: 'إلى', city: 'المدينة', hotel: 'الفندق', airline: 'الخطوط', date: 'التاريخ', checkin: 'دخول', checkout: 'خروج', passengers: 'المسافرون', guests: 'الضيوف', rooms: 'الغرف' }[k];
        msg += label + ': ' + d[k] + '\n';
      }
    });
    
    msg += '\n💰 الإجمالي: ' + parseFloat(d.total || b.total || 0).toFixed(0) + ' ر.س';
    msg += '\n\nشكراً لثقتك بنا 🌟';
    
    window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
  };

  // ═══ تحميل البيانات ═══
  async function loadBookings() {
    if (!window.FB || !FB.db) { setTimeout(loadBookings, 500); return; }
    try {
      var snap = await FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(200).get();
      var bookings = [];
      snap.forEach(function(doc) {
        var d = doc.data(); d.id = d.id || doc.id;
        bookings.push(d);
      });
      window.CB.bookings = bookings;
      window.CB.loading = false;
      renderContent();
    } catch(e) {
      console.warn('[BOOKINGS-MGR] load error:', e.message);
      window.CB.loading = false;
      renderContent();
    }
  }

  // ═══ onSnapshot ═══
  function setupListener() {
    if (!window.FB || !FB.db) return;
    try {
      window.CB.listener = FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(200)
        .onSnapshot(function(snap) {
          var bookings = [];
          snap.forEach(function(doc) {
            var d = doc.data(); d.id = d.id || doc.id;
            bookings.push(d);
          });
          window.CB.bookings = bookings;
          window.CB.loading = false;
          var app = document.getElementById('bookings-mgr-app');
          if (app && app.classList.contains('active')) renderContent();
        }, function(err) {
          console.warn('[BOOKINGS-MGR] listener:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateBookingsUI = async function() {
    console.log('[BOOKINGS-MGR] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('bookings-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'bookings-mgr-app';
      app.className = 'cb-app active';
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_cb_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      var icon = document.getElementById('cb-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    await loadBookings();
    setupListener();
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__bookingsHooked) return;
    A.__bookingsHooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'bookings_mgr') {
        window.activateBookingsUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[BOOKINGS-MGR] ready');
})();
</script>

  // ─── Central notify function ───
  window.notifyCustomer = async function(customerId, event, data) {
    data = data || {};
    if (!customerId) { console.warn('[notify] no customerId for', event); return; }
    
    var template = window.CHIZEN_MESSAGES[event];
    if (!template) { console.warn('[notify] unknown event:', event); return; }
    
    // Replace placeholders
    function fill(str) {
      return String(str || '').replace(/\{\{(\w+)\}\}/g, function(_, k) {
        return data[k] != null ? String(data[k]) : '';
      });
    }
    
    var title = fill(template.title);
    var body = fill(template.body);
    var deepLink = template.deepLink ? fill(template.deepLink) : null;
    
    // Check user preference (only for non-important events)
    var skipPush = false;
    if (!template.important && window.FB && FB.db) {
      try {
        var userDoc = await FB.db.collection('users').doc(customerId).get();
        if (userDoc.exists) {
          var prefs = userDoc.data().notif_prefs || {};
          if (prefs.externalDisabled === true) {
            skipPush = true;
            console.log('[notify] external disabled for', customerId.slice(-6), '- event:', event);
          }
        }
      } catch(e) { console.warn('[notify] prefs read error:', e.message); }
    }
    
    // Always save to internal notifications
    var notifPromise = FB.db.collection('notifications').add({
      userId: customerId,
      title: title,
      body: body,
      type: template.type,
      event: event,
      icon: template.icon,
      important: !!template.important,
      deepLink: deepLink,
      read: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Push only if not skipped
    var pushPromise = skipPush ? Promise.resolve(null) : FB.db.collection('push_queue').add({
      userId: customerId,
      title: title,
      body: body,
      type: template.type,
      event: event,
      important: !!template.important,
      data: { deepLink: deepLink, event: event, type: template.type },
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    await Promise.all([notifPromise, pushPromise]);
    console.log('[notify] ✓', event, '→', customerId.slice(-6), skipPush ? '(no push)' : '(push sent)');
  };

  // ─── Helper: get customerId from order/booking ───
  window.getOrderCustomerId = async function(orderId) {
    try {
      var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
      if (snap.empty) return null;
      return snap.docs[0].data().customerId;
    } catch(e) { return null; }
  };
  window.getBookingUserId = async function(bookingId) {
    try {
      var doc = await FB.db.collection('bookings').doc(bookingId).get();
      if (!doc.exists) return null;
      return doc.data().userId;
    } catch(e) { return null; }
  };

  console.log('[notify system] ✓ loaded', Object.keys(window.CHIZEN_MESSAGES).length, 'templates');

</script>


<script>
// ═══ WIRE ORDERS v1 ═══
(function(){
  function hook(){
    if (!window.A || !window.notifyCustomer) { setTimeout(hook, 500); return; }
    if (window.A._orderHooksWired) return;
    window.A._orderHooksWired = true;
    
    // Helper: read order after status change
    async function notifyOrder(orderId, event, extraData) {
      try {
        var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
        if (snap.empty) {
          var doc = await FB.db.collection('orders').doc(orderId).get();
          if (!doc.exists) return;
          var o = doc.data();
          await window.notifyCustomer(o.customerId, event, Object.assign({
            id: orderId.substring(0, 8).toUpperCase(),
            total: o.total
          }, extraData || {}));
          return;
        }
        var o = snap.docs[0].data();
        await window.notifyCustomer(o.customerId, event, Object.assign({
          id: orderId.substring(0, 8).toUpperCase(),
          total: o.total
        }, extraData || {}));
      } catch(e) { console.warn('[notify order]', e.message); }
    }
    
    // ═══ 1. verifyPayment → order.verified ═══
    var origVerify = window.A.verifyPayment;
    if (origVerify) {
      window.A.verifyPayment = async function(orderId) {
        var r = await origVerify.apply(this, arguments);
        setTimeout(function(){ notifyOrder(orderId, 'order.verified'); }, 800);
        return r;
      };
    }
    
    // ═══ 2. rejectPayment → order.payment_rejected ═══
    var origReject = window.A.rejectPayment;
    if (origReject) {
      window.A.rejectPayment = async function(orderId) {
        var r = await origReject.apply(this, arguments);
        setTimeout(function(){
          notifyOrder(orderId, 'order.payment_rejected', { reason: 'غير محدد — تواصل معنا' });
        }, 800);
        return r;
      };
    }
    
    // ═══ 3. markDelivered → order.delivered ═══
    var origDelivered = window.A.markDelivered;
    if (origDelivered) {
      window.A.markDelivered = async function(orderId) {
        var r = await origDelivered.apply(this, arguments);
        setTimeout(function(){ notifyOrder(orderId, 'order.delivered'); }, 800);
        return r;
      };
    }
    
    // ═══ 4. sendToCustomer → order.sent_to_customer ═══
    var origSend = window.A.sendToCustomer || window.A.assignDriver || window.A.dispatchOrder;
    if (origSend) {
      window.A.sendToCustomer = async function(orderId) {
        var r = await origSend.apply(this, arguments);
        setTimeout(function(){ notifyOrder(orderId, 'order.sent_to_customer'); }, 800);
        return r;
      };
    }
    
    console.log('[wire orders] ✓ hooks applied');
  }
  hook();
})();
</script>

    try {

      if (cached) {
        var parsed = JSON.parse(cached);
        if (parsed.html) {
          container.innerHTML = parsed.html;
          console.log('[dash v80] cache shown (' + Math.round((Date.now()-parsed.ts)/1000) + 's ago)');
          
          // If fresh enough, skip fetch
          if (Date.now() - parsed.ts < CACHE_TTL) {
            console.log('[dash v80] cache fresh — skip fetch');
            return;
          }
        }
      } else {
        container.innerHTML = '<div class="dash-loading"><div class="dash-loading-spinner"></div><div>جاري التحميل السريع...</div></div>';
      }
    } catch(e) {}
    
    try {

      var nowSec = Math.floor(now.getTime() / 1000);

      var monthStart = Math.floor(new Date(now.getFullYear(), now.getMonth(), 1).getTime() / 1000);

  // ═══════════════════════════════════════════════════
  renderTeam: async function() {
    var container = document.getElementById('team-content');
    if (!container) return;
    
    var CACHE_KEY = 'chizen_team_cache_v80';
    var CACHE_TTL = 10 * 60 * 1000; // 10 minutes
    
    // Cache first
    try {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        var parsed = JSON.parse(cached);
        if (parsed.html && Date.now() - parsed.ts < CACHE_TTL) {
          container.innerHTML = parsed.html;
          console.log('[team v80] cache fresh');
          return;
        }
        if (parsed.html) container.innerHTML = parsed.html;
      }
    } catch(e) {}
    
    if (!container.innerHTML || container.innerHTML.indexOf('dash-loading') > -1) {
      container.innerHTML = '<div class="dash-loading"><div class="dash-loading-spinner"></div></div>';
    }
    
    try {
      var [employeesSnap, pendingOrdersSnap] = await Promise.all([
        FB.db.collection('users').where('role', 'in', ['cat_manager', 'delivery_mgr', 'accountant', 'bookings_mgr']).limit(30).get().catch(function(){ return { docs: [] }; }),
        // Only pending orders, small limit
        FB.db.collection('orders').where('workflowStatus', '==', 'awaiting_categories').limit(50).get().catch(function(){ return { docs: [] }; })
      ]);
      
      var employees = [];
      employeesSnap.docs.forEach(function(d) {
        var u = d.data();
        u._id = d.id;
        employees.push(u);
      });
      
      var pendingOrders = [];
      pendingOrdersSnap.docs.forEach(function(d) {
        var o = d.data();
        o.id = d.id;
        o._ts = o.createdAt && o.createdAt.seconds ? o.createdAt.seconds : 0;
        pendingOrders.push(o);
      });
      
      var now = Math.floor(Date.now() / 1000);
      var catNames = {
        electronics: 'إلكترونيات', fashion: 'أزياء', clothing: 'ملابس',
        sports: 'أدوات رياضية', beauty: 'جمال وعطور', kids: 'مستلزمات أطفال',
        tools: 'أدوات منزلية', home: 'منزل وأثاث'
      };
      
      var catManagers = {};
      employees.forEach(function(e) {
        if (e.role === 'cat_manager' && e.assignedCategory) {
          catManagers[e.assignedCategory] = e;
        }
      });
      
      // Count pending per category
      var catPending = {};
      pendingOrders.forEach(function(o) {
        var cats = Object.keys(o.categories || o.categoryStatus || {});
        var hoursOld = (now - o._ts) / 3600;
        cats.forEach(function(c) {
          if (!catPending[c]) catPending[c] = { count: 0, oldest: 0 };
          catPending[c].count++;
          catPending[c].oldest = Math.max(catPending[c].oldest, hoursOld);
        });
      });
      
      var html = '<div class="team-tabs">' +
        '<button class="team-tab active" onclick="A._teamView(\'cats\',this)">📦 الأقسام</button>' +
        '<button class="team-tab" onclick="A._teamView(\'employees\',this)">👤 الموظفون</button>' +
      '</div>';
      
      html += '<div id="team-view-cats">';
      Object.keys(catNames).forEach(function(k) {
        var mgr = catManagers[k];
        var pending = catPending[k] || { count: 0, oldest: 0 };
        var status = 'green';
        var reason = '';
        
        if (!mgr) {
          status = 'red';
          reason = 'لا يوجد مدير قسم';
        } else if (pending.count > 0 && pending.oldest > 24) {
          status = 'red';
          reason = pending.count + ' طلب معلق منذ ' + Math.floor(pending.oldest/24) + ' يوم';
        } else if (pending.count > 0) {
          status = 'yellow';
          reason = pending.count + ' طلب معلق (' + Math.floor(pending.oldest) + ' ساعة)';
        }
        
        var cardClass = 'team-card' + (status === 'red' ? ' danger' : (status === 'yellow' ? ' warning' : ''));
        
        html += '<div class="' + cardClass + '">' +
          '<div class="team-card-icon">📦</div>' +
          '<div class="team-card-body">' +
            '<div class="team-card-title"><div class="status-dot ' + status + '"></div>' + catNames[k] + '</div>' +
            '<div class="team-card-meta">👤 <strong>' + (mgr ? (mgr.name || mgr.email || '—') : 'بدون مدير') + '</strong></div>' +
            (reason ? '<div class="team-card-warn ' + (status === 'red' ? 'danger' : '') + '">⚠️ ' + reason + '</div>' : '') +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      
      html += '<div id="team-view-employees" style="display:none;">';
      if (employees.length === 0) {
        html += '<div class="team-card"><div class="team-card-body"><div class="team-card-title">لا يوجد موظفون</div><div class="team-card-meta">أضف موظفين من "المزيد" → الموظفين</div></div></div>';
      } else {
        var roleLabels = { cat_manager: 'مدير قسم', delivery_mgr: 'مندوب طلبات', accountant: 'محاسب', bookings_mgr: 'مدير حجوزات' };
        employees.forEach(function(e) {
          html += '<div class="team-card">' +
            '<div class="team-card-icon">👤</div>' +
            '<div class="team-card-body">' +
              '<div class="team-card-title"><div class="status-dot green"></div>' + (e.name || e.email || '—') + '</div>' +
              '<div class="team-card-meta">🎯 ' + (roleLabels[e.role] || e.role) + (e.assignedCategory ? ' · ' + (catNames[e.assignedCategory] || e.assignedCategory) : '') + '</div>' +
            '</div>' +
          '</div>';
        });
      }
      html += '</div>';
      
      container.innerHTML = html;
      
      // Cache
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ html: html, ts: Date.now() }));
      } catch(e) {}
      
      console.log('[team v80] loaded & cached');
      
    } catch(e) {
      console.error('[team v80]', e);
      container.innerHTML = '<div class="dash-loading">⚠️ تعذر التحميل</div>';
    }
  };
  
  A._teamView = function(view, btn) {
    document.querySelectorAll('.team-tab').forEach(function(t){ t.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    var catsView = document.getElementById('team-view-cats');

    } else {
      if (catsView) catsView.style.display = 'none';
      if (empView) empView.style.display = 'block';
    }
  };

  function start() {
    tried++;
    if (tried > 40) { console.warn('[v93] gave up'); return; }
    
    var app = document.getElementById('accountant-mgr-app');
    if (!app) return setTimeout(start, 400);
    
    var navBar = app.querySelector('.ca-nav-bar');

    console.log('[v93] installing...');
    
    // 1. Add buttons (only if missing)
    var existing = {};

      existing[b.getAttribute('data-tab')] = true;
    });

      report: { icon: '📈', label: 'تقرير' }

      btn.className = 'ca-nav-btn';
      btn.setAttribute('data-tab', key);
      btn.setAttribute('onclick', 'window.__caSwitchTab(\'' + key + '\', this)');
      btn.innerHTML = '<span class="icon">' + tabDefs[key].icon + '</span><span class="label">' + tabDefs[key].label + '</span>';
      navBar.appendChild(btn);

    NEW_TABS.forEach(function(key) {
      var id = 'ca-content-' + key;
      if (document.getElementById(id)) return;
      var panel = document.createElement('div');
      panel.id = id;
      panel.className = 'v93-content';

    // 3. Patch __caSwitchTab (guarded against recursion)

          // Old tabs — call orig

          // Hide new content
          app.querySelectorAll('[id^="ca-content-"]').forEach(function(c) {
            if (NEW_TABS.indexOf(c.id.replace('ca-content-', '')) > -1) {

    function renderProducts(t) {
      var prods = window.A.products || [];
      if (!prods.length) { t.innerHTML = '<div class="v93-empty">لا منتجات</div>'; return; }
      
      var tc = 0, ts = 0, tp = 0, wc = 0;
      prods.forEach(function(p) {
        var c = Number(p.costPrice) || 0;
        var s = Number(p.price) || 0;
        ts += s;
        if (c > 0) { tc += c; tp += (s - c); wc++; }
      });
      var mg = wc > 0 && ts > 0 ? Math.round((tp / ts) * 100) : 0;
      
      var html = '<div class="v93-grid">' +
        '<div class="v93-card-kpi v93-kpi-purple"><div class="v93-l">📦 المنتجات</div><div class="v93-v">' + prods.length + '</div></div>' +
        '<div class="v93-card-kpi v93-kpi-green"><div class="v93-l">💰 الربح (' + mg + '%)</div><div class="v93-v">' + (wc > 0 ? tp.toLocaleString('ar-EG') : '—') + '</div></div>' +
        '<div class="v93-card-kpi v93-kpi-red"><div class="v93-l">💵 الجملة</div><div class="v93-v">' + (wc > 0 ? tc.toLocaleString('ar-EG') : '—') + '</div></div>' +
        '<div class="v93-card-kpi v93-kpi-purple"><div class="v93-l">💵 البيع</div><div class="v93-v">' + ts.toLocaleString('ar-EG') + '</div></div>' +
      '</div>';
      
      prods.forEach(function(p) {
        var c = Number(p.costPrice) || 0;
        var s = Number(p.price) || 0;
        var pr = s - c;
        var m = c > 0 && s > 0 ? ((pr / s) * 100).toFixed(1) : '—';
        var col = c > 0 ? (pr > 0 ? (parseFloat(m) >= 20 ? '#10b981' : '#f59e0b') : '#ef4444') : '#6b7280';
        html += '<div class="v93-row">' +
          '<div style="font-weight:800;color:#e5e7eb;margin-bottom:4px;">' + esc(p.name) + '</div>' +
          '<div style="color:#9ca3af;font-size:10px;margin-bottom:6px;">🏢 ' + esc(p.supplierName || '—') + '</div>' +
          '<div style="display:flex;justify-content:space-between;">' +
            '<span>جملة: <b style="color:#ef4444;">' + (c > 0 ? c.toLocaleString('ar-EG') : '—') + '</b> · بيع: <b style="color:#a855f7;">' + s.toLocaleString('ar-EG') + '</b></span>' +
            '<b style="color:' + col + ';">' + (c > 0 ? (pr > 0 ? '+' : '') + pr.toLocaleString('ar-EG') + ' (' + m + '%)' : '—') + '</b>' +
          '</div>' +
        '</div>';
      });
      t.innerHTML = html;
    }
    
    function renderEmployees(t) {
      if (!window.FB || !FB.db) { t.innerHTML = '<div class="v93-empty">⚠️ Firebase</div>'; return; }
      t.innerHTML = '<div class="v93-empty">⏳ تحميل...</div>';
      FB.db.collection('users').where('role', 'in', ['cat_manager', 'delivery_mgr', 'accountant', 'bookings_mgr']).limit(50).get().then(function(s) {
        var emps = [];
        s.forEach(function(d) { var u = d.data(); u._id = d.id; emps.push(u); });
        if (!emps.length) { t.innerHTML = '<div class="v93-empty">لا موظفين</div>'; return; }
        
        var lbl = { cat_manager: 'مدير قسم', delivery_mgr: 'مندوب', accountant: 'محاسب', bookings_mgr: 'مدير حجوزات' };
        var html = '<div class="v93-grid"><div class="v93-card-kpi v93-kpi-purple"><div class="v93-l">👥 الموظفون</div><div class="v93-v">' + emps.length + '</div></div></div>';
        emps.forEach(function(e) {
          html += '<div class="v93-row"><div style="font-weight:800;color:#e5e7eb;">' + esc(e.name || e.email || 'موظف') + '</div><div style="color:#9ca3af;font-size:10px;">' + (lbl[e.role] || e.role) + (e.assignedCategory ? ' · ' + e.assignedCategory : '') + '</div></div>';
        });
        t.innerHTML = html;
      }).catch(function(e) { t.innerHTML = '<div class="v93-empty">⚠️ ' + e.message + '</div>'; });
    }
    
    function renderAdvances(t) {
      if (!window.FB || !FB.db) { t.innerHTML = '<div class="v93-empty">⚠️ Firebase</div>'; return; }
      t.innerHTML = '<div class="v93-empty">⏳ تحميل...</div>';
      FB.db.collection('transactions').limit(100).get().then(function(s) {
        var tr = [];
        s.forEach(function(d) { var x = d.data(); x._id = d.id; tr.push(x); });
        if (!tr.length) { t.innerHTML = '<div class="v93-empty">لا حركات مالية</div>'; return; }
        
        var adv = 0, ded = 0, paid = 0;
        tr.forEach(function(x) {
          var a = Number(x.amount) || 0;
          if (x.type === 'advance') adv += a;
          else if (x.type === 'deduction') ded += a;
          else if (x.type === 'paid') paid += a;
        });
        
        var html = '<div class="v93-grid">' +
          '<div class="v93-card-kpi v93-kpi-yellow"><div class="v93-l">💸 تقدمات</div><div class="v93-v">' + adv.toLocaleString('ar-EG') + '</div></div>' +
          '<div class="v93-card-kpi v93-kpi-red"><div class="v93-l">📉 خصومات</div><div class="v93-v">' + ded.toLocaleString('ar-EG') + '</div></div>' +
          '<div class="v93-card-kpi v93-kpi-green"><div class="v93-l">✅ مدفوع</div><div class="v93-v">' + paid.toLocaleString('ar-EG') + '</div></div>' +
        '</div>';
        
        tr.forEach(function(x) {
          var ic = { advance: '💸', deduction: '📉', paid: '✅' }[x.type] || '📝';
          html += '<div class="v93-row"><div style="display:flex;justify-content:space-between;"><div><div style="font-weight:800;color:#e5e7eb;">' + ic + ' ' + esc(x.userName || 'موظف') + '</div><div style="color:#9ca3af;font-size:10px;">' + x.type + '</div></div><div style="text-align:left;"><div style="color:#a855f7;font-weight:900;">' + (Number(x.amount) || 0).toLocaleString('ar-EG') + '</div><div style="font-size:10px;">' + (x.status || '') + '</div></div></div></div>';
        });
        t.innerHTML = html;
      }).catch(function(e) { t.innerHTML = '<div class="v93-empty">⚠️ ' + e.message + '</div>'; });
    }
    
    function renderReport(t) {
      var orders = window.A.orders || [];
      var prods = window.A.products || [];
      var now = new Date();
      var mo = new Date(now.getFullYear(), now.getMonth(), 1).getTime() / 1000;
      var mOrd = orders.filter(function(o) {
        var ts = o.createdAt && o.createdAt.seconds ? o.createdAt.seconds : 0;
        return ts >= mo && o.status !== 'cancelled';
      });
      var rev = mOrd.reduce(function(s, o) { return s + (Number(o.total) || 0); }, 0);
      var cost = 0;
      mOrd.forEach(function(o) {
        (o.items || []).forEach(function(it) {
          var p = prods.find(function(x) { return String(x.id) === String(it.id); });
          if (p && p.costPrice > 0) cost += (Number(p.costPrice) || 0) * (Number(it.qty) || 1);
        });
      });
      var net = rev - cost;
      var col = net >= 0 ? '#10b981' : '#ef4444';
      
      t.innerHTML = '<div class="v93-grid">' +
        '<div class="v93-card-kpi v93-kpi-green"><div class="v93-l">💰 إيرادات</div><div class="v93-v">' + rev.toLocaleString('ar-EG') + '</div></div>' +
        '<div class="v93-card-kpi v93-kpi-red"><div class="v93-l">💵 التكلفة</div><div class="v93-v">' + cost.toLocaleString('ar-EG') + '</div></div>' +
        '<div class="v93-card-kpi v93-kpi-purple"><div class="v93-l">📦 طلبات</div><div class="v93-v">' + mOrd.length + '</div></div>' +
      '</div>' +
      '<div class="v93-row" style="text-align:center;padding:24px !important;">' +
        '<div style="font-size:12px;color:' + col + ';font-weight:800;margin-bottom:8px;">' + (net >= 0 ? '✅ صافي الربح' : '❌ خسارة') + '</div>' +
        '<div style="font-size:32px;font-weight:900;color:' + col + ';">' + Math.abs(net).toLocaleString('ar-EG') + ' ر.س</div>' +
      '</div>';
    }
    
    console.log('[v93] ✅ INSTALLED CLEAN');
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(start, 1500); });
  } else {
    setTimeout(start, 1500);
  }
  setTimeout(start, 4000);
})();
</script>
