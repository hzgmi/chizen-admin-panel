      'width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}' +
    '.ca-empty{text-align:center;padding:60px 20px;}' +
    '.ca-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}' +
    '.ca-modal.active{display:flex;}' +
    '.ca-modal-content{background:var(--ca-bg);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;color:var(--ca-text);}';
  document.head.appendChild(style);

  // ═══ الهيكل ═══
  function buildShell() {
    return '' +
      '<header class="ca-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(245,158,11,0.4);">💰</div>' +
          '<div>' +
            '<div style="font-weight:900;font-size:14px;color:var(--ca-text);">لوحة المحاسب</div>' +
            '<div style="color:#f59e0b;font-size:10px;margin-top:1px;">الإدارة المالية الشاملة</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button class="ca-theme-btn" onclick="window.__caToggleTheme()" id="ca-theme-icon">🌙</button>' +
          '<button onclick="window.__caLogout()" style="background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;">🚪 خروج</button>' +
        '</div>' +
      '</header>' +
      '<main class="ca-main" id="ca-main"></main>' +
      '<nav class="ca-nav">' +
        '<button class="ca-nav-btn active" data-tab="overview" onclick="window.__caSwitchTab(\'overview\',this)"><span class="icon">📊</span><span class="label">عامة</span></button>' +
        '<button class="ca-nav-btn" data-tab="orders" onclick="window.__caSwitchTab(\'orders\',this)"><span class="icon">🛒</span><span class="label">الطلبات</span></button>' +
        '<button class="ca-nav-btn" data-tab="bookings" onclick="window.__caSwitchTab(\'bookings\',this)"><span class="icon">✈️</span><span class="label">الحجوزات</span></button>' +
        '<button class="ca-nav-btn" data-tab="suppliers" onclick="window.__caSwitchTab(\'suppliers\',this)"><span class="icon">🏢</span><span class="label">الموردين</span></button>' +
        '<button class="ca-nav-btn" data-tab="debts" onclick="window.__caSwitchTab(\'debts\',this)"><span class="icon">💳</span><span class="label">الديون</span></button>' +
        '<button class="ca-nav-btn" data-tab="reports" onclick="window.__caSwitchTab(\'reports\',this)"><span class="icon">📈</span><span class="label">تقارير</span></button>' +
      '</nav>';
  }

  // ═══ أدوات مساعدة ═══
  function statCard(icon, label, value, color) {
    return '<div class="ca-stat" style="border-color:' + color + '40;">' +
      '<div class="ca-stat-icon">' + icon + '</div>' +
      '<div class="ca-stat-label">' + label + '</div>' +
      '<div class="ca-stat-value" style="color:' + color + ';">' + value + '</div>' +
    '</div>';
  }

  function row(label, value, color) {
    return '<div class="ca-row">' +
      '<span class="ca-row-label">' + label + '</span>' +
      '<span class="ca-row-value" style="' + (color ? 'color:' + color + ';' : '') + '">' + value + '</span>' +
    '</div>';
  }

  // ═══ حساب الإحصائيات ═══
  function calcStats() {
    var startTs = getPeriodStart();
    var orders = window.CA.orders.filter(function(o) { return getTs(o) >= startTs; });
    var bookings = window.CA.bookings.filter(function(b) { return getTs(b) >= startTs; });
    
    var stats = {
      totalSales: 0,
      confirmedSales: 0,
      pendingSales: 0,
      rejectedSales: 0,
      orderCount: 0,
      completedCount: 0,
      cancelledCount: 0,
      totalOrders: orders.length,
      bookingsRevenue: 0,
      bookingCount: bookings.length,
      confirmedBookings: 0,
      deliveryFees: 0,
      supplierDebts: 0,
      receivedDebts: 0,
      netRevenue: 0
    };
    
    orders.forEach(function(o) {
      var p = (o.payment && o.payment.status) || 'pending';
      var total = parseFloat(o.total) || 0;
      var fee = parseFloat((o.deliveryInfo && o.deliveryInfo.deliveryFee) || 0);
      
      stats.totalSales += total;
      stats.deliveryFees += fee;
      
      if (p === 'verified') stats.confirmedSales += total;
      else if (p === 'pending') stats.pendingSales += total;
      else if (p === 'rejected') stats.rejectedSales += total;
      
      if (o.status === 'completed') stats.completedCount++;
      if (o.status === 'cancelled') stats.cancelledCount++;
    });
    
    bookings.forEach(function(b) {
      var total = parseFloat((b.data && b.data.total) || b.total || 0);
      stats.bookingsRevenue += total;
      if (b.status === 'confirmed' || b.status === 'completed') stats.confirmedBookings++;
    });
    
    window.CA.balances.forEach(function(b) {
      var amt = parseFloat(b.amount) || 0;
      if (b.type === 'debt' || b.type === 'supplier' || b.status === 'unpaid') stats.supplierDebts += amt;
      if (b.type === 'payment' || b.status === 'paid') stats.receivedDebts += amt;
    });
    
    stats.netRevenue = stats.confirmedSales + stats.bookingsRevenue - stats.supplierDebts + stats.deliveryFees;
    return stats;
  }

  // ═══ بناء المحتوى ═══
  function renderContent() {
    var main = document.getElementById('ca-main');
    if (!main) return;
    
    if (window.CA.loading) {
      main.innerHTML = '<div style="text-align:center;padding:60px 20px;"><div style="font-size:48px;margin-bottom:12px;">⏳</div><div style="color:var(--ca-text-muted);">جاري التحميل...</div></div>';
      return;
    }
    
    var S = calcStats();
    var html = '';
    
    // ═══ تصفية زمنية (دائماً ظاهرة) ═══
    var periods = [
      { key: 'today', label: 'اليوم' },
      { key: 'week', label: 'الأسبوع' },
      { key: 'month', label: 'الشهر' },
      { key: 'all', label: 'الكل' }
    ];
    html += '<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;">';
    periods.forEach(function(p) {
      var active = window.CA.period === p.key;
      html += '<button class="ca-period-btn' + (active ? ' active' : '') + '" onclick="window.__caSetPeriod(&quot;' + p.key + '&quot;)">' + p.label + '</button>';
    });
    html += '</div>';
    
    // ═══ محتوى حسب التبويب ═══
    if (window.CA.tab === 'overview') {
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
        statCard('💵', 'إجمالي المبيعات', S.totalSales.toFixed(0), '#10b981') +
        statCard('✅', 'مؤكدة الدفع', S.confirmedSales.toFixed(0), '#10b981') +
        statCard('⏳', 'معلقة الدفع', S.pendingSales.toFixed(0), '#f59e0b') +
        statCard('📦', 'إجمالي الطلبات', S.totalOrders, '#3b82f6') +
      '</div>';
      
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">📊 تفاصيل المبيعات</div>' +
        row('إجمالي المبيعات (كل الطلبات)', S.totalSales.toFixed(0) + ' ر.س') +
        row('مؤكدة الدفع', S.confirmedSales.toFixed(0) + ' ر.س', '#10b981') +
        row('معلقة', S.pendingSales.toFixed(0) + ' ر.س', '#f59e0b') +
        row('مرفوضة', S.rejectedSales.toFixed(0) + ' ر.س', '#ef4444') +
        row('رسوم التوصيل المحصلة', S.deliveryFees.toFixed(0) + ' ر.س', '#a855f7') +
      '</div>';
      
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">✈️ الحجوزات</div>' +
        row('إيرادات الحجوزات', S.bookingsRevenue.toFixed(0) + ' ر.س', '#3b82f6') +
        row('عدد الحجوزات', S.bookingCount) +
        row('مؤكدة', S.confirmedBookings, '#10b981') +
      '</div>';
      
      html += '<div class="ca-card" style="' + (S.supplierDebts > 0 ? 'border-color:rgba(239,68,68,0.5);' : '') + '">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:13px;margin-bottom:10px;">🏢 الموردين والديون</div>' +
        row('ديون للموردين', S.supplierDebts.toFixed(0) + ' ر.س', S.supplierDebts > 0 ? '#ef4444' : '#10b981') +
        row('مدفوعات مستلمة', S.receivedDebts.toFixed(0) + ' ر.س', '#10b981') +
      '</div>';
      
      html += '<div class="ca-card" style="background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(59,130,246,0.1));border:2px solid #10b981;">' +
        '<div style="font-weight:900;color:#10b981;font-size:13px;margin-bottom:10px;">💰 صافي الإيرادات</div>' +
        '<div style="text-align:center;padding:10px 0;">' +
          '<div style="font-size:32px;font-weight:900;color:#10b981;">' + S.netRevenue.toFixed(0) + '</div>' +
          '<div style="font-size:11px;color:var(--ca-text-muted);margin-top:4px;">ر.س (المؤكدة + حجوزات + توصيل - ديون)</div>' +
        '</div>' +
      '</div>';
    }
    
    else if (window.CA.tab === 'orders') {
      // بحث
      html += '<div style="position:relative;margin-bottom:12px;">' +
        '<input class="ca-search" placeholder="🔍 بحث بالرقم / اسم / هاتف..." value="' + esc(window.CA.search) + '" oninput="window.__caSearch(this.value)">' +
        '<span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:0.6;">🔍</span>' +
      '</div>';
      
      var orders = window.CA.orders.filter(function(o) { return getTs(o) >= getPeriodStart(); });
      if (window.CA.search) {
        var q = window.CA.search.toLowerCase();
        orders = orders.filter(function(o) {
          return (o.id || '').toLowerCase().indexOf(q) > -1 ||
                 (o.name || '').toLowerCase().indexOf(q) > -1 ||
                 (o.phone || '').toLowerCase().indexOf(q) > -1;
        });
      }
      orders.sort(function(a, b) { return getTs(b) - getTs(a); });
      
      if (orders.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">📭</div><div style="color:var(--ca-text-muted);">لا توجد طلبات</div></div>';
      } else {
        html += orders.map(function(o) {
          var p = (o.payment && o.payment.status) || 'pending';
          var statusColor = p === 'verified' ? '#10b981' : (p === 'rejected' ? '#ef4444' : '#f59e0b');
          var statusText = p === 'verified' ? '✅ مؤكد' : (p === 'rejected' ? '❌ مرفوض' : '⏳ معلق');
          return '<div class="ca-card" onclick="window.__caOrderDetails(&quot;' + esc(o.id) + '&quot;)" style="cursor:pointer;">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:#f59e0b;font-size:12px;">#' + esc((o.id || '').substring(0, 10)) + '</span>' +
              '<span style="font-size:10px;color:' + statusColor + ';font-weight:800;">' + statusText + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ca-text);font-weight:700;">' + esc(o.name || 'عميل') + '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + esc(o.phone || '') + ' • ' + timeAgo(o) + '</div>' +
            '<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--ca-divider);">' +
              '<span style="font-size:11px;color:var(--ca-text-sub);">الإجمالي</span>' +
              '<span style="font-weight:900;color:#ff4d94;font-size:14px;">' + (o.total || 0) + ' ر.س</span>' +
            '</div>' +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'bookings') {
      var bookings = window.CA.bookings.filter(function(b) { return getTs(b) >= getPeriodStart(); });
      bookings.sort(function(a, b) { return getTs(b) - getTs(a); });
      
      if (bookings.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">✈️</div><div style="color:var(--ca-text-muted);">لا توجد حجوزات</div></div>';
      } else {
        bookings.forEach(function(b) {
          var d = b.data || {};
          var total = parseFloat(d.total || b.total || 0);
          var typeIcon = b.type === 'flight' ? '✈️' : (b.type === 'hotel' ? '🏨' : (b.type === 'bus' ? '🚌' : '🕋'));
          var typeName = b.type === 'flight' ? 'طيران' : (b.type === 'hotel' ? 'فندق' : (b.type === 'bus' ? 'باص' : 'حج وعمرة'));
          html += '<div class="ca-card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:#3b82f6;font-size:12px;">' + typeIcon + ' ' + typeName + '</span>' +
              '<span style="font-weight:900;color:#10b981;font-size:14px;">' + total.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ca-text);font-weight:700;">' + esc(d.name || b.userName || 'عميل') + '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + esc(d.phone || '') + ' • ' + timeAgo(b) + '</div>' +
          '</div>';
        });
      }
    }
    
    else if (window.CA.tab === 'suppliers') {
      if (window.CA.suppliers.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">🏢</div><div style="color:var(--ca-text-muted);">لا يوجد موردين مسجلين</div></div>';
      } else {
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">' +
          statCard('🏢', 'إجمالي الموردين', window.CA.suppliers.length, '#3b82f6') +
          statCard('💰', 'إجمالي الديون', S.supplierDebts.toFixed(0), '#ef4444') +
        '</div>';
        
        html += window.CA.suppliers.map(function(s) {
          var balance = parseFloat(s.balance || s.debt || 0);
          return '<div class="ca-card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-weight:900;color:var(--ca-text);font-size:13px;">' + esc(s.name || 'مورد') + '</span>' +
              '<span style="font-weight:900;color:' + (balance > 0 ? '#ef4444' : '#10b981') + ';font-size:13px;">' + balance.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            (s.phone ? '<div style="font-size:11px;color:var(--ca-text-muted);">📱 ' + esc(s.phone) + '</div>' : '') +
            (s.company ? '<div style="font-size:11px;color:var(--ca-text-muted);">🏢 ' + esc(s.company) + '</div>' : '') +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'debts') {
      if (window.CA.balances.length === 0) {
        html += '<div class="ca-empty"><div style="font-size:64px;margin-bottom:12px;">💳</div><div style="color:var(--ca-text-muted);">لا توجد ديون مسجلة</div></div>';
      } else {
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">' +
          statCard('💸', 'مدينون لنا', S.receivedDebts.toFixed(0), '#10b981') +
          statCard('📉', 'نحن مدينون', S.supplierDebts.toFixed(0), '#ef4444') +
        '</div>';
        
        html += window.CA.balances.map(function(b) {
          var amount = parseFloat(b.amount || 0);
          var isDebt = b.type === 'debt' || b.status === 'unpaid';
          return '<div class="ca-card" style="border-color:' + (isDebt ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)') + ';">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
              '<span style="font-weight:900;color:var(--ca-text);font-size:12px;">' + esc(b.name || b.supplierName || 'غير محدد') + '</span>' +
              '<span style="font-weight:900;color:' + (isDebt ? '#ef4444' : '#10b981') + ';font-size:14px;">' + amount.toFixed(0) + ' ر.س</span>' +
            '</div>' +
            '<div style="font-size:11px;color:var(--ca-text-muted);">' + (isDebt ? '⚠️ دين مستحق' : '✅ مدفوع') + ' • ' + timeAgo(b) + '</div>' +
            (b.note ? '<div style="font-size:11px;color:var(--ca-text-muted);margin-top:4px;">📝 ' + esc(b.note) + '</div>' : '') +
          '</div>';
        }).join('');
      }
    }
    
    else if (window.CA.tab === 'reports') {
      html += '<div class="ca-card">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:14px;margin-bottom:14px;">📈 ملخص الأداء المالي</div>' +
        row('الفترة', {today: 'اليوم', week: 'آخر 7 أيام', month: 'آخر 30 يوم', all: 'الكل'}[window.CA.period] || '') +
        row('إجمالي الطلبات', S.totalOrders) +
        row('مكتملة', S.completedCount, '#10b981') +
        row('ملغية', S.cancelledCount, '#ef4444') +
        row('الحجوزات', S.bookingCount, '#3b82f6') +
        row('الدخل الإجمالي', S.confirmedSales.toFixed(0) + ' ر.س', '#10b981') +
        row('الدخل الصافي', S.netRevenue.toFixed(0) + ' ر.س', '#10b981') +
      '</div>';
      
      html += '<button onclick="window.__caExportCSV()" style="width:100%;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;border-radius:12px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 12px rgba(245,158,11,0.3);">📥 تصدير الطلبات (CSV)</button>' +
        '<button onclick="window.__caExportSummary()" style="width:100%;padding:14px;background:var(--ca-input-bg);border:1.5px solid var(--ca-input-border);color:var(--ca-text);border-radius:12px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer;">📄 تصدير ملخص مالي</button>';
    }
    
    main.innerHTML = html;
  }

  // ═══ تبديل التبويبات ═══
  window.__caSwitchTab = function(tab, btn) {
    window.CA.tab = tab;
    window.CA.search = '';
    document.querySelectorAll('.ca-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  window.__caSetPeriod = function(p) {
    window.CA.period = p;
    renderContent();
  };

  window.__caSearch = function(q) {
    window.CA.search = q || '';
    clearTimeout(window.__caSearchTimer);
    window.__caSearchTimer = setTimeout(renderContent, 200);
  };

  window.__caToggleTheme = function() {
    var app = document.getElementById('accountant-mgr-app');
    if (!app) return;
    var cur = app.getAttribute('data-theme') || 'dark';
    var next = cur === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_ca_theme', next); } catch(e) {}
    var icon = document.getElementById('ca-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  window.__caLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ تصدير CSV ═══
  window.__caExportCSV = function() {
    var orders = window.CA.orders.filter(function(o) { return getTs(o) >= getPeriodStart(); });
    var csv = 'رقم الطلب,العميل,الهاتف,الإجمالي,حالة الدفع,الحالة,التاريخ\n';
    orders.forEach(function(o) {
      var p = (o.payment && o.payment.status) || 'pending';
      var date = getTs(o) ? new Date(getTs(o)).toLocaleDateString('ar') : '';
      csv += '"' + (o.id || '') + '","' + (o.name || '') + '","' + (o.phone || '') + '",' + (o.total || 0) + ',"' + p + '","' + (o.status || '') + '","' + date + '"\n';
    });
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'chizen-orders-' + new Date().toISOString().split('T')[0] + '.csv';
    link.click();
  };

  window.__caExportSummary = function() {
    var S = calcStats();
    var text = 'ملخص مالي - ' + new Date().toLocaleString('ar') + '\n' +
      '═══════════════════════\n' +
      'الفترة: ' + {today: 'اليوم', week: 'آخر 7 أيام', month: 'آخر 30 يوم', all: 'الكل'}[window.CA.period] + '\n\n' +
      '📊 المبيعات:\n' +
      '- إجمالي: ' + S.totalSales.toFixed(0) + ' ر.س\n' +
      '- مؤكدة: ' + S.confirmedSales.toFixed(0) + ' ر.س\n' +
      '- معلقة: ' + S.pendingSales.toFixed(0) + ' ر.س\n' +
      '- مرفوضة: ' + S.rejectedSales.toFixed(0) + ' ر.س\n\n' +
      '✈️ الحجوزات: ' + S.bookingsRevenue.toFixed(0) + ' ر.س (' + S.bookingCount + ' حجز)\n\n' +
      '🚚 رسوم توصيل: ' + S.deliveryFees.toFixed(0) + ' ر.س\n\n' +
      '🏢 الديون:\n' +
      '- لنا: ' + S.receivedDebts.toFixed(0) + ' ر.س\n' +
      '- علينا: ' + S.supplierDebts.toFixed(0) + ' ر.س\n\n' +
      '💰 الصافي: ' + S.netRevenue.toFixed(0) + ' ر.س';
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'chizen-summary-' + new Date().toISOString().split('T')[0] + '.txt';
    link.click();
  };

  // ═══ تفاصيل طلب ═══
  window.__caOrderDetails = function(orderId) {
    var o = window.CA.orders.find(function(x) { return x.id === orderId; });
    if (!o) return;
    var p = o.payment || {};
    var modal = document.createElement('div');
    modal.className = 'ca-modal active';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div class="ca-modal-content">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:16px;">' +
        '<div style="font-weight:900;color:#f59e0b;font-size:14px;">📋 تفاصيل الطلب</div>' +
        '<button onclick="this.closest(&quot;.ca-modal&quot;).remove()" style="background:var(--ca-input-bg);border:none;color:var(--ca-text);width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>' +
      '</div>' +
      row('رقم الطلب', '#' + esc(orderId)) +
      row('العميل', esc(o.name || '—')) +
      row('الهاتف', esc(o.phone || '—')) +
      row('العنوان', esc(o.pickup || '—')) +
      row('الإجمالي', (o.total || 0) + ' ر.س', '#ff4d94') +
      row('حالة الدفع', p.status === 'verified' ? '✅ مؤكد' : (p.status === 'rejected' ? '❌ مرفوض' : '⏳ معلق')) +
      row('حالة الطلب', esc(o.status || '—')) +
      (p.receiptUrl ? '<a href="' + esc(p.receiptUrl) + '" target="_blank" style="display:block;padding:10px;background:rgba(59,130,246,0.15);color:#3b82f6;border-radius:8px;text-align:center;text-decoration:none;margin-top:8px;font-weight:800;font-size:12px;">📸 عرض الإيصال</a>' : '') +
    '</div>';
    document.body.appendChild(modal);
  };

  // ═══ تحميل البيانات ═══
  async function loadAllData() {
    if (!window.FB || !FB.db) { setTimeout(loadAllData, 500); return; }
    
    try {
      // الطلبات
      var ordersSnap = await FB.db.collection('orders').orderBy('createdAt', 'desc').limit(200).get();
      window.CA.orders = [];
      ordersSnap.forEach(function(doc) {
        var d = doc.data(); d.id = d.id || doc.id;
        window.CA.orders.push(d);
      });
      
      // الحجوزات
      try {
        var bSnap = await FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(100).get();
        window.CA.bookings = [];
        bSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.bookings.push(d);
        });
      } catch(e) { window.CA.bookings = []; }
      
      // الموردين
      try {
        var sSnap = await FB.db.collection('sups').get();
        window.CA.suppliers = [];
        sSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.suppliers.push(d);
        });
      } catch(e) { window.CA.suppliers = []; }
      
      // الديون
      try {
        var balSnap = await FB.db.collection('balances').get();
        window.CA.balances = [];
        balSnap.forEach(function(doc) {
          var d = doc.data(); d.id = d.id || doc.id;
          window.CA.balances.push(d);
        });
      } catch(e) { window.CA.balances = []; }
      
      window.CA.loading = false;
      renderContent();
    } catch(e) {
      console.warn('[ACCOUNTANT-UI] load error:', e.message);
      window.CA.loading = false;
      renderContent();
    }
  }

  // ═══ onSnapshot للطلبات (تحديث فوري) ═══
  function setupListener() {
    if (!window.FB || !FB.db) return;
    try {
      FB.db.collection('orders').orderBy('createdAt', 'desc').limit(200)
        .onSnapshot(function(snap) {
          var orders = [];
          snap.forEach(function(doc) {
            var d = doc.data(); d.id = d.id || doc.id;
            orders.push(d);
          });
          window.CA.orders = orders;
          var app = document.getElementById('accountant-mgr-app');
          if (app && app.classList.contains('active')) renderContent();
        }, function(err) {
          console.warn('[ACCOUNTANT-UI] listener:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateAccountantUI = async function() {
    console.log('[ACCOUNTANT-UI] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('accountant-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'accountant-mgr-app';
      app.className = 'ca-app active';
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_ca_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      
      var icon = document.getElementById('ca-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    await loadAllData();
    setupListener();
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__accountantHooked) return;
    A.__accountantHooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'accountant') {
        window.activateAccountantUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[ACCOUNTANT-UI] ready');
})();
</script>
<script id="chz-login-robust">
(function(){
  'use strict';
  console.log('[LOGIN-ROBUST] installing...');

  // ═══ إصلاح doLogin بـ timeout + حالة واضحة ═══
  function enhanceDoLogin() {
    if (!window.doLogin) { setTimeout(enhanceDoLogin, 200); return; }
    if (window.doLogin.__robust) return;
    
    var orig = window.doLogin;
    window.doLogin = async function() {
      var btn = document.getElementById('btn-do-login');
      var errBox = document.getElementById('login-err');
      var email = (document.getElementById('login-email') || {}).value || '';
      var pass = (document.getElementById('login-pass') || {}).value || '';
      
      email = email.trim();
      
      if (!email || !pass) {
        if (errBox) errBox.textContent = '⚠️ أدخل البريد وكلمة السر';
        return;
      }
      
      // حالة الزر
      if (btn) {
        btn.disabled = true;
        btn.classList.add('loading');
        var span = btn.querySelector('span');
        if (span) span.textContent = 'جاري التحقق...';
      }
      if (errBox) errBox.textContent = '';
      
      var loginSuccess = false;
      var errorMsg = '';
      
      try {
        // setPersistence مع timeout
        try {
          await Promise.race([
            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL),
            new Promise(function(_, reject) { setTimeout(function() { reject(new Error('persist timeout')); }, 3000); })
          ]);
        } catch(pe) {
          console.warn('[LOGIN] persist timeout, continuing...');
        }
        
        // signIn مع timeout 20 ثانية
        if (btn) {
          var span2 = btn.querySelector('span');
          if (span2) span2.textContent = 'جاري تسجيل الدخول...';
        }
        
        var loginPromise = firebase.auth().signInWithEmailAndPassword(email, pass);
        var timeoutPromise = new Promise(function(_, reject) {
          setTimeout(function() { reject(new Error('انتهت مهلة الاتصال — تحقق من الإنترنت')); }, 20000);
        });
        
        var cred = await Promise.race([loginPromise, timeoutPromise]);
        loginSuccess = true;
        console.log('[LOGIN-ROBUST] success:', cred.user.email);
        
        // بعد نجاح Auth — انتظر ظهور اللوحة حتى 12 ثانية
        if (btn) {
          var span3 = btn.querySelector('span');
          if (span3) span3.textContent = 'جاري فتح اللوحة...';
        }
        
        // راقب ظهور #am
        var waited = 0;
        var checkDash = setInterval(function() {
          waited += 500;
          var am = document.getElementById('am');
          var isVisible = am && (am.style.display === 'flex' || am.style.display === 'block');
          
          // أو إذا اختفت شاشة الدخول
          var gs = document.getElementById('gs');
          var loginHidden = gs && gs.style.display === 'none';
          
          if (isVisible || loginHidden || waited >= 12000) {
            clearInterval(checkDash);
            if (btn) {
              btn.disabled = false;
              btn.classList.remove('loading');
              var sp = btn.querySelector('span');
              if (sp) sp.textContent = '🔓 تسجيل الدخول';
            }
          }
        }, 500);
        
        return;
        
      } catch(e) {
        errorMsg = e.message || 'فشل الدخول';
        console.error('[LOGIN-ROBUST] error:', e.code, e.message);
      }
      
      // فشل
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('loading');
        var sp = btn.querySelector('span');
        if (sp) sp.textContent = '🔓 تسجيل الدخول';
      }
      
      if (errBox) {
        var friendlyMsg = '❌ ' + errorMsg;
        if (errorMsg.indexOf('network') > -1 || errorMsg.indexOf('timeout') > -1) {
          friendlyMsg = '📡 تحقق من اتصال الإنترنت';
        } else if (errorMsg.indexOf('password') > -1 || errorMsg.indexOf('invalid') > -1) {
          friendlyMsg = '❌ البريد أو كلمة السر غير صحيحة';
        } else if (errorMsg.indexOf('user-not-found') > -1) {
          friendlyMsg = '❌ لا يوجد حساب بهذا البريد';
        } else if (errorMsg.indexOf('too-many') > -1) {
          friendlyMsg = '⏱️ محاولات كثيرة — انتظر 5 دقائق';
        }
        errBox.textContent = friendlyMsg;
      }
    };
    
    window.forceLogin = window.doLogin;
    window.doLogin.__robust = true;
    console.log('[LOGIN-ROBUST] doLogin enhanced');
  }
  
  // ═══ إصلاح checkAdmin بـ timeout ═══
  function enhanceCheckAdmin() {
    if (!window.A || !A.checkAdmin) { setTimeout(enhanceCheckAdmin, 300); return; }
    if (A.checkAdmin.__robust) return;
    
    var orig = A.checkAdmin;
    A.checkAdmin = async function(u) {
      if (!u) return;
      
      // حاول checkAdmin مع timeout 15 ثانية
      var timeout = new Promise(function(resolve) {
        setTimeout(function() {
          console.warn('[LOGIN-ROBUST] checkAdmin timeout — forcing access');
          resolve({ timeout: true });
        }, 15000);
      });
      
      var check = orig.call(this, u).then(function() { return { ok: true }; }).catch(function(e) {
        console.error('[LOGIN-ROBUST] checkAdmin error:', e);
        return { error: e };
      });
      
      var result = await Promise.race([check, timeout]);
      
      if (result.timeout || result.error) {
        // fallback: افتح اللوحة مباشرة
        console.warn('[LOGIN-ROBUST] fallback — opening dashboard directly');
        try {
          this.access(u);
          // محاولة applyPermissions بدون checkAdmin
          if (this.applyPermissions) {
            this.applyPermissions('super_admin', null);
          }
        } catch(e2) {
          console.error('[LOGIN-ROBUST] fallback access failed:', e2);
        }
      }
    };
    A.checkAdmin.__robust = true;
    console.log('[LOGIN-ROBUST] checkAdmin enhanced');
  }
  
  // ═══ تشغيل ═══
  setTimeout(function() { enhanceDoLogin(); enhanceCheckAdmin(); }, 500);
  setTimeout(function() { enhanceDoLogin(); enhanceCheckAdmin(); }, 2000);
})();
</script>

    } else if (status === 'confirmed') {
      actions = '<div style="display:flex;gap:6px;margin-top:10px;">' +
        '<button onclick="event.stopPropagation();window.__cbComplete(&quot;' + esc(b.id) + '&quot;)" style="flex:1;padding:10px;background:rgba(59,130,246,0.15);border:1.5px solid #3b82f6;color:#3b82f6;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">📦 مكتمل</button>' +
        '<button onclick="event.stopPropagation();window.__cbSendWA(&quot;' + esc(b.id) + '&quot;)" style="padding:10px 14px;background:#25D366;border:none;color:#fff;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">💬</button>' +
      '</div>';
    }
    
    return '<div class="cb-card" onclick="window.__cbOpenDetails(&quot;' + esc(b.id) + '&quot;)">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">' +
          '<div style="width:44px;height:44px;border-radius:12px;background:' + t.color + '22;border:1.5px solid ' + t.color + '55;display:flex;align-items:center;justify-content:center;font-size:20px;">' + t.icon + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-weight:900;color:' + t.color + ';font-size:13px;">' + t.name + '</div>' +
            '<div style="font-size:11px;color:var(--cb-text);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(b.userName || d.name || 'عميل') + '</div>' +
            '<div style="font-size:10px;color:var(--cb-text-muted);">' + esc(detail) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="text-align:left;">' +
          '<div style="font-size:10px;color:' + statusColor + ';font-weight:900;">' + statusText + '</div>' +
          '<div style="font-weight:900;color:#ff4d94;font-size:14px;margin-top:4px;">' + total.toFixed(0) + '</div>' +
          '<div style="font-size:9px;color:var(--cb-text-muted);">ر.س</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:10px;color:var(--cb-text-muted);display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--cb-divider);">' +
        '<span>📱 ' + esc(d.phone || b.userPhone || '—') + '</span>' +
        '<span>' + timeAgo(b) + '</span>' +
      '</div>' +
      actions +
    '</div>';
  }

  // ═══ تبديل ═══
  window.__cbSwitchTab = function(tab, btn) {
    window.CB.tab = tab;
    window.CB.search = '';
    document.querySelectorAll('.cb-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  window.__cbSetPeriod = function(p) {
    window.CB.period = p;
    renderContent();
  };

  window.__cbSearch = function(q) {
    window.CB.search = q || '';
    clearTimeout(window.__cbSearchTimer);
    window.__cbSearchTimer = setTimeout(renderContent, 200);
  };

  window.__cbToggleTheme = function() {
    var app = document.getElementById('bookings-mgr-app');
    if (!app) return;
    var cur = app.getAttribute('data-theme') || 'dark';
    var next = cur === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_cb_theme', next); } catch(e) {}
    var icon = document.getElementById('cb-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  window.__cbLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ تفاصيل ═══
  window.__cbOpenDetails = function(id) {
    var b = window.CB.bookings.find(function(x) { return x.id === id; });
    if (!b) return;
    var d = b.data || {};
    var type = b.type || 'flight';
    var t = TYPE_INFO[type] || TYPE_INFO.flight;
    var status = b.status || 'pending';
    
    var detailsHtml = '';
    Object.keys(d).forEach(function(k) {
      if (k === 'total' || k === 'name' || k === 'phone') return;
      var label = {
        from: 'من', to: 'إلى', date: 'التاريخ', type: 'النوع',
        checkin: 'دخول', checkout: 'خروج', city: 'المدينة',
        hotel: 'الفندق', airline: 'الخطوط', passengers: 'المسافرون',
        guests: 'الضيوف', rooms: 'الغرف', notes: 'ملاحظات'
      }[k] || k;
      var val = d[k];
      if (typeof val === 'object') val = JSON.stringify(val);
      if (!val) return;
      detailsHtml += '<div style="display:flex;justify-content:space-between;padding:8px;background:var(--cb-input-bg);border-radius:8px;margin-bottom:4px;font-size:12px;">' +
        '<span style="color:var(--cb-text-sub);">' + esc(label) + '</span>' +
        '<span style="color:var(--cb-text);font-weight:800;">' + esc(val) + '</span>' +
      '</div>';
    });
    
    var modal = document.createElement('div');
    modal.className = 'cb-modal active';
    modal.onclick = function(e) { if (e.target === this) this.remove(); };
    modal.innerHTML = '<div class="cb-modal-content">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:16px;">' +
        '<div style="font-weight:900;color:' + t.color + ';font-size:14px;">' + t.icon + ' تفاصيل الحجز</div>' +
        '<button onclick="this.closest(&quot;.cb-modal&quot;).remove()" style="background:var(--cb-input-bg);border:none;color:var(--cb-text);width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div style="background:' + t.color + '15;border:1px solid ' + t.color + '40;border-radius:10px;padding:12px;margin-bottom:14px;">' +
        '<div style="font-size:11px;color:' + t.color + ';margin-bottom:4px;">رقم الحجز</div>' +
        '<div style="font-weight:900;color:var(--cb-text);font-family:monospace;font-size:13px;">#' + esc(id) + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">' +
        '<div style="background:var(--cb-input-bg);border-radius:10px;padding:10px;">' +
          '<div style="font-size:10px;color:var(--cb-text-muted);margin-bottom:2px;">العميل</div>' +
          '<div style="font-size:12px;color:var(--cb-text);font-weight:700;">' + esc(b.userName || d.name || '—') + '</div>' +
        '</div>' +
        '<div style="background:var(--cb-input-bg);border-radius:10px;padding:10px;">' +
          '<div style="font-size:10px;color:var(--cb-text-muted);margin-bottom:2px;">الهاتف</div>' +
          '<div style="font-size:12px;color:var(--cb-text);direction:ltr;">' + esc(d.phone || b.userPhone || '—') + '</div>' +
        '</div>' +
      '</div>' +
      detailsHtml +
      '<div style="background:linear-gradient(135deg,rgba(236,72,153,0.1),rgba(168,85,247,0.05));border:1px solid rgba(236,72,153,0.3);border-radius:12px;padding:12px;margin-top:12px;text-align:center;">' +
        '<div style="font-size:11px;color:var(--cb-text-muted);margin-bottom:2px;">الإجمالي</div>' +
        '<div style="font-size:20px;font-weight:900;color:#ff4d94;">' + parseFloat(d.total || b.total || 0).toFixed(0) + ' ر.س</div>' +
      '</div>' +
      '<div style="margin-top:14px;display:flex;gap:8px;">' +
        '<button onclick="this.closest(&quot;.cb-modal&quot;).remove()" style="flex:1;padding:12px;background:var(--cb-input-bg);border:none;color:var(--cb-text);border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;">إغلاق</button>' +
        (d.phone ? '<a href="https://wa.me/' + String(d.phone).replace(/\D/g, '') + '" target="_blank" style="flex:1;padding:12px;background:#25D366;color:#fff;border-radius:10px;font-weight:800;text-align:center;text-decoration:none;font-family:inherit;">💬 واتساب</a>' : '') +
      '</div>' +
    '</div>';
    document.body.appendChild(modal);
  };

  // ═══ تأكيد ═══
  window.__cbConfirm = async function(id) {
    if (!confirm('تأكيد هذا الحجز؟')) return;
    try {
      await FB.db.collection('bookings').doc(id).update({
        status: 'confirmed',
        confirmedAt: new Date(),
        confirmedBy: FB.currentUser ? FB.currentUser.uid : ''
      });
      var b = window.CB.bookings.find(function(x) { return x.id === id; });
      if (b && b.userId && FB.addUserNotification) {
        await FB.addUserNotification(b.userId, {
          title: '✅ تم تأكيد حجزك',
          body: 'حجزك #' + id.substring(0, 8) + ' جاهز',
          type: 'booking'
        }).catch(function(){});
      }
      await loadBookings();
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ إلغاء ═══
  window.__cbCancel = async function(id) {
    var reason = prompt('سبب الإلغاء (اختياري):');
    if (reason === null) return;
    try {
      await FB.db.collection('bookings').doc(id).update({
        status: 'cancelled',
        cancelReason: reason || '',
        cancelledAt: new Date(),
        cancelledBy: FB.currentUser ? FB.currentUser.uid : ''
      });
      await loadBookings();
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ مكتمل ═══
  window.__cbComplete = async function(id) {
    if (!confirm('تم إكمال الحجز؟')) return;
    try {
      await FB.db.collection('bookings').doc(id).update({
        status: 'completed',
        completedAt: new Date()
      });
      await loadBookings();
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ واتساب ═══
  window.__cbSendWA = function(id) {
    var b = window.CB.bookings.find(function(x) { return x.id === id; });
    if (!b) return;
    var d = b.data || {};
    var phone = (d.phone || b.userPhone || '').replace(/\D/g, '');
    if (!phone) return alert('رقم الهاتف غير متوفر');
    if (phone.length === 9 && phone.startsWith('7')) phone = '967' + phone;
    
    var msg = '✈️ *تأكيد حجزك*\n\n' +
      'أهلاً ' + (b.userName || d.name || 'عزيزي العميل') + ',\n' +
      'تم تأكيد حجزك بنجاح ✅\n\n' +
      '📋 تفاصيل الحجز:\n';
    
    ['from', 'to', 'city', 'hotel', 'airline', 'date', 'checkin', 'checkout', 'passengers', 'guests', 'rooms'].forEach(function(k) {
      if (d[k]) {
        var label = { from: 'من', to: 'إلى', city: 'المدينة', hotel: 'الفندق', airline: 'الخطوط', date: 'التاريخ', checkin: 'دخول', checkout: 'خروج', passengers: 'المسافرون', guests: 'الضيوف', rooms: 'الغرف' }[k];
        msg += label + ': ' + d[k] + '\n';
      }
    });
    
    msg += '\n💰 الإجمالي: ' + parseFloat(d.total || b.total || 0).toFixed(0) + ' ر.س';
    msg += '\n\nشكراً لثقتك بنا 🌟';
    
    window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
  };

  // ═══ تحميل البيانات ═══
  async function loadBookings() {
    if (!window.FB || !FB.db) { setTimeout(loadBookings, 500); return; }
    try {
      var snap = await FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(200).get();
      var bookings = [];
      snap.forEach(function(doc) {
        var d = doc.data(); d.id = d.id || doc.id;
        bookings.push(d);
      });
      window.CB.bookings = bookings;
      window.CB.loading = false;
      renderContent();
    } catch(e) {
      console.warn('[BOOKINGS-MGR] load error:', e.message);
      window.CB.loading = false;
      renderContent();
    }
  }

  // ═══ onSnapshot ═══
  function setupListener() {
    if (!window.FB || !FB.db) return;
    try {
      window.CB.listener = FB.db.collection('bookings').orderBy('createdAt', 'desc').limit(200)
        .onSnapshot(function(snap) {
          var bookings = [];
          snap.forEach(function(doc) {
            var d = doc.data(); d.id = d.id || doc.id;
            bookings.push(d);
          });
          window.CB.bookings = bookings;
          window.CB.loading = false;
          var app = document.getElementById('bookings-mgr-app');
          if (app && app.classList.contains('active')) renderContent();
        }, function(err) {
          console.warn('[BOOKINGS-MGR] listener:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateBookingsUI = async function() {
    console.log('[BOOKINGS-MGR] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('bookings-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'bookings-mgr-app';
      app.className = 'cb-app active';
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_cb_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      var icon = document.getElementById('cb-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    await loadBookings();
    setupListener();
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__bookingsHooked) return;
    A.__bookingsHooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'bookings_mgr') {
        window.activateBookingsUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[BOOKINGS-MGR] ready');
})();
</script>
</body>
</html>
