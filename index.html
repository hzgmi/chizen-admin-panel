<!-- CAT_MGR_V1_PATCH -->
<style>
#cat-mgr-app{position:fixed;inset:0;z-index:99999;background:var(--bg,#fff);overflow-y:auto;padding:14px;display:none;font-family:inherit}
#cat-mgr-app *{box-sizing:border-box}
.cm-header{display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:8px;border-bottom:1px solid var(--border,#e5e5e5);position:sticky;top:0;background:var(--bg,#fff);z-index:2}
.cm-header h2{flex:1;margin:0;font-size:16px}
.cm-back{background:transparent;border:1px solid var(--border,#e5e5e5);padding:6px 12px;border-radius:10px;cursor:pointer;font-size:16px}
.cm-badge{background:#ef4444;color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;min-width:22px;text-align:center}
.cm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.cm-kpi{background:var(--card,#f7f7f7);padding:14px 10px;border-radius:12px;text-align:center}
.cm-kpi b{display:block;font-size:22px;margin-bottom:4px}
.cm-kpi small{font-size:11px;color:var(--muted,#888);display:block}
.cm-tabs{display:flex;gap:6px;margin:14px 0}
.cm-tabs button{flex:1;padding:11px 6px;border:1px solid var(--border,#e5e5e5);border-radius:10px;background:transparent;cursor:pointer;font-family:inherit;font-size:13px}
.cm-tabs button.active{background:#9B4DFF;color:#fff;border-color:#9B4DFF;font-weight:700}
.cm-empty{text-align:center;padding:50px 20px;color:var(--muted,#888);font-size:14px}
.cm-order{background:var(--card,#f7f7f7);border:1px solid var(--border,#e5e5e5);border-radius:14px;padding:14px;margin-bottom:12px}
.cm-order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;padding-bottom:10px;border-bottom:1px dashed var(--border,#e5e5e5)}
.cm-order-head b{color:#9B4DFF;font-size:15px}
.cm-order-meta{font-size:12px;color:var(--muted,#888);margin-top:2px}
.cm-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border,#eee);cursor:pointer}
.cm-item:last-child{border-bottom:none}
.cm-item input[type=checkbox]{width:22px;height:22px;accent-color:#22c55e;flex-shrink:0;cursor:pointer}
.cm-item img{width:42px;height:42px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}
.cm-item-info{flex:1;min-width:0}
.cm-item-info b{display:block;font-size:13px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-item-info span{font-size:11px;color:var(--muted,#888)}
.cm-item-price{font-size:13px;font-weight:700;color:#9B4DFF}
.cm-reason{width:100%;padding:11px;margin:10px 0;border:1px solid var(--border,#e5e5e5);border-radius:10px;background:transparent;font-family:inherit;font-size:13px;color:inherit}
.cm-order-foot{display:flex;gap:8px;margin-top:4px}
.cm-order-foot button{flex:1;padding:13px;border:none;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.cm-btn-ok{background:#22c55e;color:#fff}
.cm-btn-ok:disabled{opacity:.35;cursor:not-allowed}
.cm-btn-warn{background:#ef4444;color:#fff}
.cm-product{background:var(--card,#f7f7f7);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.cm-product img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eee;flex-shrink:0}
.cm-product-info{flex:1;min-width:0}
.cm-product-info b{font-size:14px;display:block;margin-bottom:3px}
.cm-product-info span{font-size:12px;color:var(--muted,#888)}
.cm-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 22px;border-radius:30px;z-index:100000;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>

<div id="cat-mgr-app" dir="rtl">
  <div class="cm-header">
    <button class="cm-back" onclick="catMgrApp.back()">←</button>
    <h2>مدير القسم — <span id="cm-cat-name">...</span></h2>
    <span id="cm-badge" class="cm-badge" style="display:none">0</span>
  </div>
  <div class="cm-kpis">
    <div class="cm-kpi"><b id="cm-kpi-orders">0</b><small>طلبات جديدة</small></div>
    <div class="cm-kpi"><b id="cm-kpi-products">0</b><small>منتجاتي</small></div>
    <div class="cm-kpi"><b id="cm-kpi-value">0</b><small>قيمة معلّقة</small></div>
  </div>
  <div class="cm-tabs">
    <button class="active" data-cm-tab="pending" onclick="catMgrApp.switchTab('pending')">قيد المراجعة</button>
    <button data-cm-tab="products" onclick="catMgrApp.switchTab('products')">منتجاتي</button>
  </div>
  <main id="cm-content"></main>
</div>

<script>
window.catMgrApp = (function(){
  const CAT_LABELS = {electronics:'إلكترونيات',fashion:'أزياء',clothing:'ملابس',sports:'أدوات رياضية',beauty:'جمال وعطور',kids:'مستلزمات أطفال',tools:'أدوات منزلية',home:'منزل وأثاث',cars:'سيارات',phones:'هواتف',books:'كتب',health:'صحة'};
  const state = {user:null,cat:null,activeTab:'pending',pending:[],products:[],unsub:null,initialized:false};
  const $ = id => document.getElementById(id);
  const label = c => CAT_LABELS[c] || c || '—';
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmtDate(ts){if(!ts)return '—';try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('ar-YE');}catch(e){return '—';}}
  function toast(m){const t=document.createElement('div');t.className='cm-toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

  async function init(userDoc){
    if(!userDoc||userDoc.role!=='cat_manager')return false;
    if(state.initialized)return true;
    state.user=userDoc;state.cat=userDoc.assignedCategory;
    if(!state.cat){toast('⚠️ لم يُعيَّن قسم');return false;}
    $('cm-cat-name').textContent=label(state.cat);
    $('cat-mgr-app').style.display='block';
    state.initialized=true;
    await loadProducts();subscribeOrders();return true;
  }

  function back(){toast('هذه لوحتك المخصصة');}
  function switchTab(t){state.activeTab=t;document.querySelectorAll('.cm-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.cmTab===t));render();}

  async function loadProducts(){
    try{const snap=await db.collection('products').where('category','==',state.cat).get();state.products=snap.docs.map(d=>({id:d.id,...d.data()}));$('cm-kpi-products').textContent=state.products.length;}
    catch(e){console.error('loadProducts:',e);state.products=[];}
  }

  function subscribeOrders(){
    if(state.unsub)state.unsub();
    state.unsub=db.collection('orders').where('workflowStatus','==','awaiting_categories').onSnapshot(snap=>{
      const pending=[];
      snap.forEach(d=>{const data=d.data();const c=data.categories&&data.categories[state.cat];if(c&&c.status==='pending')pending.push({id:d.id,...data});});
      state.pending=pending;updateKpis();if(state.activeTab==='pending')render();
    },err=>{console.error('subscribeOrders:',err);toast('⚠️ '+ (err.code||err.message));});
  }

  function updateKpis(){
    $('cm-kpi-orders').textContent=state.pending.length;
    const b=$('cm-badge');
    if(state.pending.length>0){b.textContent=state.pending.length;b.style.display='inline-block';}else b.style.display='none';
    let total=0;state.pending.forEach(o=>{const c=o.categories&&o.categories[state.cat];if(c&&c.subtotal)total+=Number(c.subtotal)||0;});
    $('cm-kpi-value').textContent=total.toFixed(0);
  }

  function render(){if(state.activeTab==='pending')return renderPending();if(state.activeTab==='products')return renderProducts();}

  function renderPending(){
    const w=$('cm-content');
    if(!state.pending.length){w.innerHTML='<div class="cm-empty">✨ لا توجد طلبات بانتظار المراجعة</div>';return;}
    w.innerHTML=state.pending.map(o=>{
      const catData=(o.categories&&o.categories[state.cat])||{items:[]};
      const items=catData.items||[];
      const total=items.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||1),0);
      const allChecked=items.every(i=>i._catStatus!==false);
      return '<div class="cm-order" data-order="'+esc(o.id)+'"><div class="cm-order-head"><div><b>#'+esc(String(o.id).slice(-6))+'</b><div class="cm-order-meta">'+esc(o.customerName||'عميل')+' • '+fmtDate(o.createdAt)+'</div></div><div><b>'+total.toFixed(0)+'</b> <small>ريال</small></div></div>'+
        items.map((it,idx)=>'<label class="cm-item"><input type="checkbox" data-idx="'+idx+'" '+(it._catStatus===false?'':'checked')+' onchange="catMgrApp.toggleItem(\''+esc(o.id)+'\','+idx+',this.checked)"><img src="'+esc(it.img||'')+'" alt=""><div class="cm-item-info"><b>'+esc(it.name||'—')+'</b><span>الكمية: '+(it.qty||1)+'</span></div><div class="cm-item-price">'+((Number(it.price)||0)*(Number(it.qty)||1)).toFixed(0)+'</div></label>').join('')+
        '<input class="cm-reason" type="text" id="cm-reason-'+esc(o.id)+'" placeholder="سبب الرفض (مطلوب عند الرفض فقط)">'+
        '<div class="cm-order-foot"><button class="cm-btn-ok" '+(allChecked?'':'disabled')+' onclick="catMgrApp.confirm(\''+esc(o.id)+'\')">✓ تأكيد التوفر</button><button class="cm-btn-warn" onclick="catMgrApp.reject(\''+esc(o.id)+'\')">✗ رفض</button></div></div>';
    }).join('');
  }

  function renderProducts(){
    const w=$('cm-content');
    if(!state.products.length){w.innerHTML='<div class="cm-empty">لا توجد منتجات في قسمك</div>';return;}
    w.innerHTML=state.products.map(p=>'<div class="cm-product"><img src="'+esc(p.img||'')+'" alt=""><div class="cm-product-info"><b>'+esc(p.name)+'</b><span>'+esc(p.brand||'')+' • '+(Number(p.price)||0).toFixed(0)+' ريال • مخزون: '+(p.stock||0)+'</span></div></div>').join('');
  }

  function toggleItem(orderId,idx,checked){
    const o=state.pending.find(x=>x.id===orderId);if(!o)return;
    const items=o.categories[state.cat].items;items[idx]._catStatus=checked;
    const card=document.querySelector('[data-order="'+orderId+'"]');
    if(card){const all=items.every(i=>i._catStatus!==false);const btn=card.querySelector('.cm-btn-ok');if(btn)btn.disabled=!all;}
  }

  async function confirm(orderId){
    const o=state.pending.find(x=>x.id===orderId);if(!o)return;
    try{
      await db.runTransaction(async tx=>{
        const ref=db.collection('orders').doc(orderId);const doc=await tx.get(ref);if(!doc.exists)throw new Error('MISSING_DOC');
        const data=doc.data();const categories=data.categories||{};const catObj=Object.assign({},categories[state.cat]||{});
        catObj.items=(catObj.items||[]).map(i=>({...i,_catStatus:i._catStatus!==false}));
        catObj.status='confirmed';catObj.confirmedBy=state.user.uid;catObj.confirmedByName=state.user.name||'';
        catObj.confirmedAt=firebase.firestore.FieldValue.serverTimestamp();
        const updates={};updates['categories.'+state.cat]=catObj;
        const merged=Object.assign({},categories,{[state.cat]:catObj});
        const allResolved=Object.keys(merged).every(k=>{const s=merged[k]&&merged[k].status;return s==='confirmed'||s==='rejected';});
        const anyRejected=Object.keys(merged).some(k=>merged[k]&&merged[k].status==='rejected');
        if(allResolved)updates.workflowStatus=anyRejected?'payment_rejected':'ready_to_send';
        tx.update(ref,updates);
      });
      await notifyCustomer(o.customerId,{title:'✅ تم تأكيد توفر منتجاتك',body:'طلبك #'+String(orderId).slice(-6)+' من قسم '+label(state.cat)+' جاهز',type:'order',event:'cat_confirmed',icon:'✅',deepLink:'order/'+orderId});
      await notifyRole('delivery_mgr',{title:'📦 طلب بحاجة لجدولة توصيل',body:'#'+String(orderId).slice(-6)+' — قسم '+label(state.cat)+' أكّد',type:'order',event:'cat_confirmed',icon:'📦',deepLink:'order/'+orderId});
      toast('✅ تم التأكيد');
    }catch(e){console.error('confirm:',e);toast('❌ '+(e.message||e.code||'خطأ'));}
  }

  async function reject(orderId){
    const o=state.pending.find(x=>x.id===orderId);if(!o)return;
    const el=$('cm-reason-'+orderId);const reason=el?el.value.trim():'';
    if(!reason){toast('⚠️ أدخل سبب الرفض');if(el)el.focus();return;}
    try{
      await db.runTransaction(async tx=>{
        const ref=db.collection('orders').doc(orderId);const doc=await tx.get(ref);if(!doc.exists)throw new Error('MISSING_DOC');
        const data=doc.data();const catObj=Object.assign({},(data.categories||{})[state.cat]||{});
        catObj.status='rejected';catObj.rejectReason=reason;catObj.rejectedBy=state.user.uid;catObj.rejectedByName=state.user.name||'';
        catObj.rejectedAt=firebase.firestore.FieldValue.serverTimestamp();
        const updates={};updates['categories.'+state.cat]=catObj;updates.workflowStatus='payment_rejected';
        tx.update(ref,updates);
      });
      await notifyCustomer(o.customerId,{title:'⚠️ تحديث بخصوص طلبك',body:'قسم '+label(state.cat)+': '+reason,type:'warning',event:'cat_rejected',icon:'⚠️',important:true,deepLink:'order/'+orderId});
      await notifyRole('delivery_mgr',{title:'🚫 طلب مرفوض',body:'#'+String(orderId).slice(-6)+' — '+label(state.cat)+': '+reason,type:'warning',event:'cat_rejected',icon:'🚫',important:true,deepLink:'order/'+orderId});
      toast('تم الرفض');
    }catch(e){console.error('reject:',e);toast('❌ '+(e.message||e.code||'خطأ'));}
  }

  async function notifyCustomer(userId,payload){
    if(!userId)return;
    try{await db.collection('notifications').add({userId,...payload,read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){console.warn(e);}
  }
  async function notifyRole(role,payload){
    try{const snap=await db.collection('users').where('role','==',role).get();await Promise.all(snap.docs.map(u=>notifyCustomer(u.id,payload)));}catch(e){console.warn(e);}
  }

  function hookAuth(){
    if(typeof firebase==='undefined'||!firebase.auth){return setTimeout(hookAuth,800);}
    firebase.auth().onAuthStateChanged(async user=>{
      if(!user)return;
      try{const doc=await db.collection('users').doc(user.uid).get();if(!doc.exists)return;const data=doc.data();if(data.role==='cat_manager')setTimeout(()=>init({uid:user.uid,...data}),800);}catch(e){console.warn(e);}
    });
  }
  if(document.readyState==='complete')hookAuth();else window.addEventListener('load',hookAuth);
  return {init,back,switchTab,toggleItem,confirm,reject,state};
})();
</script>

<script id="v100-main">(function(){
  var tries = 0;
  function hook(){
    tries++;
    if(tries > 200) return;
    if(!window.catMgrApp || !window.catMgrApp.state) return setTimeout(hook, 100);
    if(window.__v100Ready) return;
    window.__v100Ready = true;
    try { setup(); } catch(e){ console.error('[V100] setup:', e); }
  }
  function setup(){
    var db = firebase.firestore();
    var state = window.catMgrApp.state;
    var CATS = {electronics:'إلكترونيات',fashion:'أزياء',clothing:'ملابس',sports:'أدوات رياضية',beauty:'جمال وعطور',kids:'مستلزمات أطفال',tools:'أدوات منزلية',home:'منزل وأثاث'};
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function fmtDate(ts){ try{ var d = ts && ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('ar-YE'); } catch(e){ return '—'; } }
    function catLabel(c){ return CATS[c] || c || '—'; }

    function buildShell(){
      var app = document.getElementById('cat-mgr-app');
      if(!app) return;
      app.innerHTML = ''
        + '<div class="v100-header">'
        +   '<div class="v100-h-left">'
        +     '<div class="v100-h-cat" id="v100-cat-name">—</div>'
        +     '<div class="v100-h-user" id="v100-user-name">—</div>'
        +   '</div>'
        +   '<button class="v100-h-logout" id="v100-logout">🚪 خروج</button>'
        + '</div>'
        + '<main id="v100-content"></main>'
        + '<nav class="v100-nav">'
        +   '<button data-tab="home" class="active"><span>🏠</span><small>الرئيسية</small></button>'
        +   '<button data-tab="pending"><span>📦</span><small>طلباتي</small><i class="v100-badge" id="v100-badge" style="display:none"></i></button>'
        +   '<button data-tab="products"><span>🛍️</span><small>منتجاتي</small></button>'
        + '</nav>';
      document.getElementById('v100-logout').onclick = function(){ window.__v100Logout(); };
      var navs = document.querySelectorAll('.v100-nav button');
      for(var i = 0; i < navs.length; i++){
        navs[i].onclick = function(){ window.__v100Tab(this.getAttribute('data-tab')); };
      }
    }

    function updateBadge(){
      var b = document.getElementById('v100-badge');
      if(!b) return;
      var n = (state.pending || []).length;
      if(n > 0){ b.textContent = n; b.style.display = ''; } else { b.style.display = 'none'; }
    }

    function render(){
      var cn = document.getElementById('v100-cat-name');
      var un = document.getElementById('v100-user-name');
      if(cn) cn.textContent = '🏷️ ' + catLabel(state.cat);
      if(un) un.textContent = (state.user && state.user.name) || 'مدير القسم';
      var content = document.getElementById('v100-content');
      if(!content) return;
      var tab = state.activeTab || 'home';
      if(tab === 'home') content.innerHTML = renderHome();
      else if(tab === 'pending'){ content.innerHTML = renderPending(); attachPendingHandlers(); }
      else if(tab === 'products') content.innerHTML = renderProducts();
      else content.innerHTML = renderHome();
      updateBadge();
    }

    function renderHome(){
      var hour = new Date().getHours();
      var greet = hour < 12 ? 'صباح الخير' : (hour < 18 ? 'مساء النور' : 'مساء الخير');
      var emoji = hour < 12 ? '☀️' : (hour < 18 ? '🌤️' : '🌙');
      var pCount = (state.pending || []).length;
      var prCount = (state.products || []).length;
      var lowStock = (state.products || []).filter(function(p){ return Number(p.stock) > 0 && Number(p.stock) <= 3; }).length;
      var val = 0;
      (state.pending || []).forEach(function(o){ var c = o.categories && o.categories[state.cat]; if(c && c.subtotal) val += Number(c.subtotal) || 0; });
      var h = '';
      h += '<div class="v100-welcome">';
      h +=   '<div class="v100-w-greeting">' + emoji + ' ' + greet + '</div>';
      h +=   '<div class="v100-w-user">' + esc((state.user && state.user.name) || 'مدير القسم') + '</div>';
      h +=   '<div class="v100-w-stats">';
      h +=     '<div class="v100-w-stat"><b>' + pCount + '</b><small>طلبات</small></div>';
      h +=     '<div class="v100-w-stat"><b>' + prCount + '</b><small>منتجات</small></div>';
      h +=     '<div class="v100-w-stat"><b>' + val.toFixed(0) + '</b><small>قيمة</small></div>';
      h +=   '</div>';
      h += '</div>';
      h += '<div class="v100-section">';
      h +=   '<div class="v100-sec-title">⚡ إجراءات سريعة</div>';
      h +=   '<div class="v100-actions">';
      h +=     '<button class="v100-act" data-go="pending"><span class="v100-act-icon">📦</span><div class="v100-act-lbl">مراجعة الطلبات</div>' + (pCount > 0 ? '<div class="v100-act-count">' + pCount + '</div>' : '') + '</button>';
      h +=     '<button class="v100-act" data-go="products"><span class="v100-act-icon">🛍️</span><div class="v100-act-lbl">منتجاتي</div><div class="v100-act-count">' + prCount + '</div></button>';
      h +=     '<button class="v100-act" data-go="add"><span class="v100-act-icon">➕</span><div class="v100-act-lbl">إضافة منتج</div></button>';
      h +=     '<button class="v100-act" data-go="logout"><span class="v100-act-icon">🚪</span><div class="v100-act-lbl">خروج</div></button>';
      h +=   '</div>';
      h += '</div>';
      if(lowStock > 0) h += '<div class="v100-alert">⚠️ <b>' + lowStock + '</b> منتج بمخزون منخفض (3 أو أقل)</div>';
      setTimeout(attachHomeHandlers, 0);
      return h;
    }
    function attachHomeHandlers(){
      var acts = document.querySelectorAll('.v100-act[data-go]');
      for(var i = 0; i < acts.length; i++){
        acts[i].onclick = function(){
          var g = this.getAttribute('data-go');
          if(g === 'logout') window.__v100Logout();
          else if(g === 'add') alert('سيتم تفعيل الإضافة قريباً');
          else window.__v100Tab(g);
        };
      }
    }

    function renderPending(){
      if(!state.pending || !state.pending.length){
        return '<div class="v100-empty"><div class="v100-empty-icon">✨</div><div>لا توجد طلبات بانتظار المراجعة</div><div class="v100-empty-sub">ستظهر هنا الطلبات الجديدة تلقائياً</div></div>';
      }
      return state.pending.map(function(o){
        var c = (o.categories && o.categories[state.cat]) || { items: [] };
        var items = c.items || [];
        var total = items.reduce(function(s,i){ return s + (Number(i.price)||0)*(Number(i.qty)||1); }, 0);
        var allChecked = items.every(function(i){ return i._catStatus !== false; });
        var h = '<div class="v100-order" data-oid="' + esc(o.id) + '">';
        h +=   '<div class="v100-ord-head">';
        h +=     '<div style="min-width:0"><div class="v100-ord-id">#' + esc(String(o.id).slice(-6)) + '</div><div class="v100-ord-cust">' + esc(o.customerName || 'عميل') + ' · ' + fmtDate(o.createdAt) + '</div></div>';
        h +=     '<div class="v100-ord-total">' + total.toFixed(0) + ' <small>ر.ي</small></div>';
        h +=   '</div>';
        h +=   '<div class="v100-ord-items">';
        items.forEach(function(it, idx){
          h += '<label class="v100-item">';
          h +=   '<input type="checkbox" data-idx="' + idx + '" ' + (it._catStatus === false ? '' : 'checked') + '>';
          h +=   '<img src="' + esc(it.img||'') + '" alt="">';
          h +=   '<div class="v100-item-info"><b>' + esc(it.name||'—') + '</b><span>الكمية: ' + (it.qty||1) + '</span></div>';
          h +=   '<div class="v100-item-price">' + ((Number(it.price)||0)*(Number(it.qty)||1)).toFixed(0) + '</div>';
          h += '</label>';
        });
        h +=   '</div>';
        h +=   '<input class="v100-reason" type="text" id="v100-reason-' + esc(o.id) + '" placeholder="سبب الرفض (عند الرفض فقط)">';
        h +=   '<div class="v100-ord-foot">';
        h +=     '<button class="v100-btn-ok" ' + (allChecked ? '' : 'disabled') + '>✓ تأكيد التوفر</button>';
        h +=     '<button class="v100-btn-warn">✗ رفض</button>';
        h +=   '</div>';
        h += '</div>';
        return h;
      }).join('');
    }
    function attachPendingHandlers(){
      var wraps = document.querySelectorAll('.v100-order');
      for(var i = 0; i < wraps.length; i++){
        (function(wrap){
          var oid = wrap.getAttribute('data-oid');
          var inputs = wrap.querySelectorAll('input[type=checkbox]');
          for(var j = 0; j < inputs.length; j++){
            (function(inp){
              inp.onchange = function(){ window.__v100Toggle(oid, parseInt(inp.getAttribute('data-idx'),10), inp.checked); };
            })(inputs[j]);
          }
          var ok = wrap.querySelector('.v100-btn-ok');
          if(ok) ok.onclick = function(){ window.__v100Confirm(oid); };
          var warn = wrap.querySelector('.v100-btn-warn');
          if(warn) warn.onclick = function(){ window.__v100Reject(oid); };
        })(wraps[i]);
      }
    }

    function renderProducts(){
      if(!state.products || !state.products.length){
        return '<div class="v100-empty"><div class="v100-empty-icon">🛍️</div><div>لا توجد منتجات في قسمك</div><div class="v100-empty-sub">ستظهر هنا منتجات قسمك</div></div>';
      }
      return '<div class="v100-products-grid">' + state.products.map(function(p){
        var st = Number(p.stock) || 0;
        var cls = st === 0 ? 'out' : (st <= 3 ? 'low' : 'ok');
        var lbl = st === 0 ? 'نفذ' : (st <= 3 ? 'منخفض' : 'متوفر');
        return '<div class="v100-prod">'
          + '<img src="' + esc(p.img||'') + '" alt="">'
          + '<div class="v100-prod-info">'
          +   '<b>' + esc(p.name||'—') + '</b>'
          +   '<span>' + esc(p.brand||'') + ' · ' + ((Number(p.price)||0)).toFixed(0) + ' ر.ي</span>'
          +   '<span class="v100-stock v100-stock-' + cls + '">' + lbl + ' (' + st + ')</span>'
          + '</div></div>';
      }).join('') + '</div>';
    }

    window.__v100Tab = function(t){
      state.activeTab = t;
      var btns = document.querySelectorAll('.v100-nav button');
      for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === t);
      render();
    };

    window.__v100Toggle = function(oid, idx, checked){
      var o = state.pending.find(function(x){ return x.id === oid; });
      if(!o || !o.categories || !o.categories[state.cat] || !o.categories[state.cat].items) return;
      var items = o.categories[state.cat].items;
      if(items[idx]) items[idx]._catStatus = checked;
      var all = items.every(function(i){ return i._catStatus !== false; });
      var wrap = document.querySelector('.v100-order[data-oid="' + oid + '"]');
      if(wrap){ var btn = wrap.querySelector('.v100-btn-ok'); if(btn) btn.disabled = !all; }
    };

    window.__v100Confirm = function(oid){
      if(window.catMgrApp && typeof window.catMgrApp.confirm === 'function'){
        try { window.catMgrApp.confirm(oid); } catch(e){ console.error('[V100] confirm:', e); alert('❌ ' + (e.message||e)); }
      }
    };

    window.__v100Reject = function(oid){
      var o = state.pending.find(function(x){ return x.id === oid; });
      if(!o) return;
      var el = document.getElementById('v100-reason-' + oid);
      var reason = el ? el.value.trim() : '';
      if(!reason){ alert('⚠️ أدخل سبب الرفض أولاً'); if(el) el.focus(); return; }
      db.runTransaction(async function(tx){
        var ref = db.collection('orders').doc(oid);
        var doc = await tx.get(ref);
        if(!doc.exists) throw new Error('MISSING_DOC');
        var data = doc.data();
        var catObj = Object.assign({}, (data.categories||{})[state.cat]||{});
        catObj.status = 'rejected';
        catObj.rejectReason = reason;
        catObj.rejectedBy = state.user.uid;
        catObj.rejectedByName = state.user.name||'';
        catObj.rejectedAt = firebase.firestore.FieldValue.serverTimestamp();
        var upd = {};
        upd['categories.' + state.cat] = catObj;
        upd.workflowStatus = 'payment_rejected';
        tx.update(ref, upd);
      }).then(function(){
        var payload = { userId: o.customerId, title: '⚠️ تحديث بخصوص طلبك', body: 'قسم ' + catLabel(state.cat) + ': ' + reason, type: 'warning', event: 'cat_rejected', icon: '⚠️', important: true, read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        if(o.customerId) db.collection('notifications').add(payload).catch(function(){});
        alert('تم الرفض');
      }).catch(function(e){ console.error('[V100] reject:', e); alert('❌ ' + (e.message||e.code||'خطأ')); });
    };

    window.__v100Logout = function(){
      if(confirm('تسجيل الخروج؟')) firebase.auth().signOut().then(function(){ location.reload(); });
    };

    window.catMgrApp.init = async function(userDoc){
      if(!userDoc || userDoc.role !== 'cat_manager') return false;
      state.user = userDoc;
      state.cat = userDoc.assignedCategory;
      if(!state.cat){ alert('⚠️ لم يُعيَّن قسم لهذا المستخدم'); return false; }
      buildShell();
      document.getElementById('cat-mgr-app').style.display = 'block';
      try {
        var snap = await db.collection('products').get();
        state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
          .filter(function(p){ return p.category === state.cat || (Array.isArray(p.categories) && p.categories.indexOf(state.cat) !== -1); });
      } catch(e){ console.warn('[V100] products:', e); state.products = []; }

      if(state.unsub) state.unsub();
      state.unsub = db.collection('orders')
        .where('workflowStatus','==','awaiting_categories')
        .onSnapshot(function(snap){
          var oldMap = {};
          (state.pending || []).forEach(function(o){ oldMap[o.id] = o; });
          var pending = [];
          snap.forEach(function(d){
            var data = d.data();
            var c = data.categories && data.categories[state.cat];
            if(c && c.status === 'pending'){
              var fresh = Object.assign({id:d.id}, data);
              var old = oldMap[d.id];
              if(old && old.categories && old.categories[state.cat] && old.categories[state.cat].items){
                var oldItems = old.categories[state.cat].items;
                var newItems = fresh.categories[state.cat].items || [];
                newItems.forEach(function(ni, idx){
                  if(oldItems[idx] && typeof oldItems[idx]._catStatus === 'boolean') ni._catStatus = oldItems[idx]._catStatus;
                });
              }
              pending.push(fresh);
            }
          });
          state.pending = pending;
          updateBadge();
          if(state.activeTab === 'home' || state.activeTab === 'pending') render();
        }, function(err){ console.warn('[V100] orders:', err); });

      state.activeTab = 'home';
      var nb = document.querySelectorAll('.v100-nav button');
      for(var i = 0; i < nb.length; i++) nb[i].classList.toggle('active', nb[i].getAttribute('data-tab') === 'home');
      render();
      console.log('[V100] ready for:', state.cat);
      return true;
    };

    window.catMgrApp.switchTab = function(t){ window.__v100Tab(t); };
    console.log('[V100] installed');
  }

  if(document.readyState === 'complete') hook();
  else window.addEventListener('load', hook);
  setTimeout(hook, 0);
})();
</script>

<script id="v101-main">(function(){
  'use strict';
  var tries = 0;
  function hook(){
    tries++;
    if(tries > 200) return setTimeout(hook, 100);
    if(!window.__v100Ready) return setTimeout(hook, 100);
    if(window.__v101Ready) return;
    window.__v101Ready = true;
    try { install(); } catch(e){ console.error('[V101] install:', e); }
  }

  function install(){
    var state = window.catMgrApp.state;
    var db = firebase.firestore();
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function fmtDate(ts){ try{ var d = ts && ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('ar-YE',{month:'short',day:'numeric'}); }catch(e){ return '—'; } }
    function toast(m){ var t=document.createElement('div'); t.className='v101-toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.style.opacity='0';},2200); setTimeout(function(){if(t.parentNode)t.remove();},2600); }

    function openModal(html){ var o=document.createElement('div'); o.className='v101-modal-overlay active'; o.innerHTML='<div class="v101-modal">'+html+'</div>'; document.body.appendChild(o); o.addEventListener('click',function(e){ if(e.target===o) closeModal(o); }); return o; }
    function closeModal(o){ o.classList.remove('active'); setTimeout(function(){ if(o.parentNode) o.remove(); },280); }

    function openProductForm(product){
      var isEdit = !!(product && product.id);
      var p = product || {};
      var html = ''
        + '<div class="v101-m-head"><h3>'+(isEdit?'✏️ تعديل منتج':'➕ منتج جديد')+'</h3><button class="v101-m-close" type="button">✕</button></div>'
        + '<div class="v101-m-body">'
        +   '<label>اسم المنتج *</label><input id="v101-f-name" type="text" placeholder="مثال: عطر شانيل" value="'+esc(p.name||'')+'">'
        +   '<label>الماركة</label><input id="v101-f-brand" type="text" placeholder="شانيل" value="'+esc(p.brand||'')+'">'
        +   '<div class="v101-row">'
        +     '<div><label>السعر (ر.ي) *</label><input id="v101-f-price" type="number" min="0" step="1" value="'+(p.price||'')+'"></div>'
        +     '<div><label>سعر التكلفة</label><input id="v101-f-cost" type="number" min="0" step="1" value="'+(p.costPrice||'')+'"></div>'
        +   '</div>'
        +   '<label>المخزون</label><input id="v101-f-stock" type="number" min="0" step="1" value="'+(p.stock||0)+'">'
        +   '<label>رابط الصورة</label><input id="v101-f-img" type="url" placeholder="https://..." value="'+esc(p.img||'')+'">'
        +   '<div id="v101-f-preview" class="v101-preview"></div>'
        +   '<label>الوصف</label><textarea id="v101-f-desc" rows="2" placeholder="وصف قصير...">'+esc(p.desc||'')+'</textarea>'
        +   '<label class="v101-toggle-lbl"><input id="v101-f-active" type="checkbox" '+(p.active!==false?'checked':'')+'> إظهار في تطبيق العميل</label>'
        + '</div>'
        + '<div class="v101-m-foot">'
        +   (isEdit ? '<button class="v101-btn-del" type="button">🗑️</button>' : '')
        +   '<button class="v101-btn-cancel" type="button">إلغاء</button>'
        +   '<button class="v101-btn-save" type="button">💾 حفظ</button>'
        + '</div>';
      var overlay = openModal(html);
      var imgInp = overlay.querySelector('#v101-f-img');
      var imgPrev = overlay.querySelector('#v101-f-preview');
      function updatePreview(){ if(imgInp.value.trim()){ imgPrev.innerHTML='<img src="'+esc(imgInp.value.trim())+'" onerror="this.style.opacity=0.3">'; } else { imgPrev.innerHTML=''; } }
      imgInp.addEventListener('input', updatePreview); updatePreview();
      overlay.querySelector('.v101-m-close').onclick = function(){ closeModal(overlay); };
      overlay.querySelector('.v101-btn-cancel').onclick = function(){ closeModal(overlay); };

      overlay.querySelector('.v101-btn-save').onclick = async function(){
        var name = overlay.querySelector('#v101-f-name').value.trim();
        var brand = overlay.querySelector('#v101-f-brand').value.trim();
        var price = Number(overlay.querySelector('#v101-f-price').value) || 0;
        var costPrice = Number(overlay.querySelector('#v101-f-cost').value) || 0;
        var stock = Number(overlay.querySelector('#v101-f-stock').value) || 0;
        var img = imgInp.value.trim();
        var desc = overlay.querySelector('#v101-f-desc').value.trim();
        var active = overlay.querySelector('#v101-f-active').checked;
        if(!name){ toast('⚠️ الاسم مطلوب'); return; }
        if(price <= 0){ toast('⚠️ السعر مطلوب'); return; }
        var data = { name:name, brand:brand, category:state.cat, price:price, costPrice:costPrice, stock:stock, img:img, desc:desc, active:active, profit:price-costPrice, profitMargin: price>0 ? Math.round((price-costPrice)/price*1000)/10 : 0 };
        var saveBtn = this; saveBtn.disabled = true; saveBtn.textContent = '⏳...';
        try {
          if(isEdit){ data.updatedAt = firebase.firestore.FieldValue.serverTimestamp(); data.updatedBy = state.user.uid; await db.collection('products').doc(product.id).update(data); }
          else { data.createdAt = firebase.firestore.FieldValue.serverTimestamp(); data.createdBy = state.user.uid; data.supplierId = state.user.uid; data.supplierName = state.user.name||''; await db.collection('products').add(data); }
          closeModal(overlay); toast(isEdit?'✅ تم التحديث':'✅ تمت الإضافة'); await reloadProducts();
        } catch(e){ console.error('[V101] save:',e); saveBtn.disabled=false; saveBtn.textContent='💾 حفظ'; toast('❌ '+(e.message||e.code||'خطأ')); }
      };
      var delBtn = overlay.querySelector('.v101-btn-del');
      if(delBtn){
        delBtn.onclick = async function(){
          if(!confirm('حذف "'+p.name+'" نهائياً؟\n\nلا يمكن التراجع.')) return;
          try { await db.collection('products').doc(product.id).delete(); closeModal(overlay); toast('🗑️ تم الحذف'); await reloadProducts(); }
          catch(e){ toast('❌ '+(e.message||e.code||'خطأ')); }
        };
      }
    }

    async function reloadProducts(){
      try {
        var snap = await db.collection('products').get();
        state.products = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); })
          .filter(function(p){ return p.category===state.cat || (Array.isArray(p.categories) && p.categories.indexOf(state.cat)!==-1); });
      } catch(e){ console.warn('[V101] reload:', e); }
      window.__v100Tab(state.activeTab || 'home');
    }

    var historyState = {loaded:false, orders:[], unsub:null};
    var currentFilter = 'pending';
    function ensureHistoryLoaded(){
      if(historyState.loaded) return;
      historyState.loaded = true;
      try {
        historyState.unsub = db.collection('orders').orderBy('createdAt','desc').limit(100).onSnapshot(function(snap){
          var orders = [];
          snap.forEach(function(d){ var data=d.data(); if(data.categories && data.categories[state.cat]) orders.push(Object.assign({id:d.id},data)); });
          historyState.orders = orders;
          if(state.activeTab === 'pending') runEnhancements();
        }, function(err){
          console.warn('[V101] history onSnapshot:', err);
          db.collection('orders').limit(100).get().then(function(snap){
            var orders = [];
            snap.forEach(function(d){ var data=d.data(); if(data.categories && data.categories[state.cat]) orders.push(Object.assign({id:d.id},data)); });
            historyState.orders = orders;
            if(state.activeTab === 'pending') runEnhancements();
          }).catch(function(){});
        });
      } catch(e){ console.warn('[V101] ensureHistory:', e); }
    }

    function enhanceHome(){
      var addBtn = document.querySelector('.v100-act[data-go="add"]');
      if(addBtn && !addBtn.getAttribute('data-v101')){
        addBtn.setAttribute('data-v101','1');
        addBtn.onclick = function(e){ if(e){e.preventDefault();e.stopPropagation();} openProductForm(null); };
      }
    }

    function enhanceProducts(){
      var content = document.getElementById('v100-content');
      if(!content) return;
      if(content.querySelector('.v101-prod-toolbar')) return;
      var products = state.products || [];
      var toolbar = document.createElement('div');
      toolbar.className = 'v101-prod-toolbar';
      toolbar.innerHTML = '<input class="v101-search" type="text" placeholder="🔍 ابحث بالاسم أو الماركة"><button class="v101-add-btn" type="button" title="إضافة منتج">+</button>';
      toolbar.querySelector('.v101-add-btn').onclick = function(){ openProductForm(null); };
      toolbar.querySelector('.v101-search').oninput = function(){
        var q = this.value.toLowerCase().trim();
        content.querySelectorAll('.v100-prod').forEach(function(card, idx){
          var p = products[idx]; if(!p) return;
          var match = !q || (p.name||'').toLowerCase().indexOf(q)!==-1 || (p.brand||'').toLowerCase().indexOf(q)!==-1;
          card.style.display = match ? '' : 'none';
        });
      };
      content.insertBefore(toolbar, content.firstChild);
      content.querySelectorAll('.v100-prod').forEach(function(card, idx){
        card.style.cursor = 'pointer';
        card.onclick = function(){ var p = products[idx]; if(p) openProductForm(p); };
      });
    }

    function enhancePending(){
      var content = document.getElementById('v100-content');
      if(!content) return;
      ensureHistoryLoaded();
      var chips = content.querySelector('.v101-filter-chips');
      if(!chips){ chips = document.createElement('div'); chips.className='v101-filter-chips'; content.insertBefore(chips, content.firstChild); }
      updateChips(content); applyFilter(content);
    }

    function updateChips(content){
      var chips = content.querySelector('.v101-filter-chips');
      if(!chips) return;
      var counts = {all:0, pending:0, confirmed:0, rejected:0};
      historyState.orders.forEach(function(o){
        var c = o.categories && o.categories[state.cat]; if(!c) return;
        counts.all++; if(counts[c.status] !== undefined) counts[c.status]++;
      });
      if(!historyState.orders.length && state.pending && state.pending.length){
        counts.pending = state.pending.length; counts.all = state.pending.length;
      }
      var defs = [{key:'pending',label:'معلق'},{key:'confirmed',label:'مؤكد'},{key:'rejected',label:'مرفوض'},{key:'all',label:'الكل'}];
      chips.innerHTML = defs.map(function(c){
        var cnt = counts[c.key] || 0;
        return '<button class="v101-chip'+(currentFilter===c.key?' active':'')+'" data-filter="'+c.key+'" type="button">'+c.label+(cnt>0?' ('+cnt+')':'')+'</button>';
      }).join('');
      chips.querySelectorAll('[data-filter]').forEach(function(btn){
        btn.onclick = function(){ currentFilter = this.getAttribute('data-filter'); updateChips(content); applyFilter(content); };
      });
    }

    function applyFilter(content){
      var showPending = currentFilter === 'pending' || currentFilter === 'all';
      content.querySelectorAll('.v100-order').forEach(function(el){ el.style.display = showPending ? '' : 'none'; });
      var old = content.querySelector('.v101-history-section'); if(old) old.remove();
      var oldMsg = content.querySelector('.v101-empty-msg'); if(oldMsg) oldMsg.remove();
      if(currentFilter === 'pending') return;
      var filtered = historyState.orders.filter(function(o){
        var c = o.categories && o.categories[state.cat]; if(!c) return false;
        if(currentFilter === 'all') return c.status==='confirmed' || c.status==='rejected';
        return c.status === currentFilter;
      });
      if(!filtered.length){
        if(currentFilter === 'confirmed' || currentFilter === 'rejected'){
          var msg = document.createElement('div'); msg.className='v101-empty-msg';
          msg.textContent = currentFilter === 'confirmed' ? '✨ لم تؤكد أي طلب بعد' : '✨ لم ترفض أي طلب بعد';
          content.appendChild(msg);
        }
        return;
      }
      var section = document.createElement('div'); section.className='v101-history-section';
      section.innerHTML = filtered.map(function(o){
        var c = o.categories[state.cat]; var items = c.items || [];
        var total = items.reduce(function(s,i){ return s+(Number(i.price)||0)*(Number(i.qty)||1); },0);
        var lbl = c.status==='confirmed' ? '✅ مؤكد' : '❌ مرفوض';
        var cls = c.status==='confirmed' ? 'ok' : 'bad';
        var reason = c.rejectReason ? '<div class="v101-hist-reason">📝 '+esc(c.rejectReason)+'</div>' : '';
        return '<div class="v101-hist-order"><div class="v101-hist-head"><div class="v101-hist-id">#'+esc(String(o.id).slice(-6))+'</div><div class="v101-hist-badge v101-hist-'+cls+'">'+lbl+'</div></div><div class="v101-hist-meta">'+esc(o.customerName||'عميل')+' · '+fmtDate(o.createdAt)+' · '+total.toFixed(0)+' ر.ي</div>'+reason+'</div>';
      }).join('');
      content.appendChild(section);
    }

    function runEnhancements(){
      var tab = state.activeTab;
      if(tab === 'products') enhanceProducts();
      else if(tab === 'pending') enhancePending();
      else if(tab === 'home') enhanceHome();
    }

    var origTab = window.__v100Tab;
    if(typeof origTab === 'function'){
      window.__v100Tab = function(t){
        if(t !== 'pending') currentFilter = 'pending';
        origTab(t);
        setTimeout(runEnhancements, 60);
      };
      window.catMgrApp.switchTab = window.__v100Tab;
    }

    function trySetupObserver(){
      var contentEl = document.getElementById('v100-content');
      if(!contentEl){ setTimeout(trySetupObserver, 200); return; }
      var mo = new MutationObserver(function(){ clearTimeout(window.__v101Debounce); window.__v101Debounce = setTimeout(runEnhancements, 50); });
      mo.observe(contentEl, { childList:true });
      setTimeout(runEnhancements, 100);
      console.log('[V101] observer installed');
    }
    setTimeout(trySetupObserver, 150);
    console.log('[V101] ready');
  }
  hook();
})();
</script>

<script id="v102-main">(function(){
  'use strict';
  var tries = 0;
  function hook(){
    tries++;
    if(tries > 250) return setTimeout(hook, 100);
    if(!window.__v101Ready) return setTimeout(hook, 100);
    if(window.__v102Ready) return;
    window.__v102Ready = true;
    try { install(); } catch(e){ console.error('[V102] install:', e); }
  }

  function install(){
    var state = window.catMgrApp.state;
    var db = firebase.firestore();
    var storage = (typeof firebase.storage === 'function') ? firebase.storage() : null;
    if(!storage) console.warn('[V102] firebase.storage غير محمّل — الرفع معطّل');

    var brands = [], suppliers = [], lookupsLoaded = false;

    function extractList(doc){
      if(!doc || !doc.exists) return [];
      var d = doc.data();
      var list = d.list || d.items || d.brands || d.suppliers || d;
      if(Array.isArray(list)){
        return list.map(function(item, i){
          if(typeof item === 'string') return {id:item, name:item};
          return {id:item.id || item.key || ('item_'+i), name:item.name || item.title || item.label || String(item)};
        });
      }
      return Object.keys(list).map(function(k){
        var v = list[k];
        return {id:k, name:(typeof v === 'string') ? v : (v.name || v.title || k)};
      });
    }

    function loadLookups(){
      if(lookupsLoaded) return Promise.resolve();
      return Promise.all([
        db.collection('config').doc('brands').get().catch(function(){return null;}),
        db.collection('config').doc('suppliers').get().catch(function(){return null;})
      ]).then(function(res){
        brands = extractList(res[0]);
        suppliers = extractList(res[1]);
        lookupsLoaded = true;
        console.log('[V102] brands:', brands.length, '| suppliers:', suppliers.length);
      });
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function toast(m){ var t=document.createElement('div'); t.className='v101-toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.style.opacity='0';},2200); setTimeout(function(){if(t.parentNode)t.remove();},2600); }
    function closeModal(o){ o.classList.remove('active'); setTimeout(function(){ if(o.parentNode) o.remove(); }, 280); }

    function openProductFormV2(product){
      loadLookups().then(function(){ showForm(product); }).catch(function(e){ toast('❌ تحميل قوائم: '+e.message); });
    }

    function showForm(product){
      var isEdit = !!(product && product.id);
      var p = product || {};
      var existingImgs = Array.isArray(p.imgs) && p.imgs.length ? p.imgs.slice() : (p.img ? [p.img] : []);
      var uploadState = { uploading:false, urls: existingImgs };
      var features = Array.isArray(p.features) ? p.features.slice() : [];

      var brandOpts = brands.map(function(b){ return '<option value="'+esc(b.id)+'" '+(p.brandId===b.id || p.brand===b.name?'selected':'')+'>'+esc(b.name)+'</option>'; }).join('');
      var supplierOpts = suppliers.map(function(s){ return '<option value="'+esc(s.id)+'" '+(p.supplierId===s.id || p.supplier===s.name?'selected':'')+'>'+esc(s.name)+'</option>'; }).join('');

      var html = ''
        + '<div class="v101-m-head"><h3>'+(isEdit?'✏️ تعديل منتج':'➕ منتج جديد')+'</h3><button class="v101-m-close" type="button">✕</button></div>'
        + '<div class="v101-m-body">'
        +   '<label>اسم المنتج *</label><input id="v102-name" type="text" placeholder="مثال: عطر شانيل N°5" value="'+esc(p.name||'')+'">'
        +   '<label>الوصف</label><textarea id="v102-desc" rows="3" placeholder="وصف المنتج...">'+esc(p.desc||'')+'</textarea>'
        +   '<div class="v101-row">'
        +     '<div><label>الماركة *</label><select id="v102-brand"><option value="">— اختر —</option>'+brandOpts+'</select></div>'
        +     '<div><label>المورد *</label><select id="v102-supplier"><option value="">— اختر —</option>'+supplierOpts+'</select></div>'
        +   '</div>'
        +   '<label>المميزات <small style="color:#a78bfa;font-weight:400">(اضغط + أو Enter)</small></label>'
        +   '<div class="v102-features" id="v102-features"></div>'
        +   '<div class="v102-feature-add"><input id="v102-feature-input" type="text" placeholder="مثال: 100ml"><button type="button" id="v102-feature-btn">+</button></div>'
        +   '<div class="v101-row">'
        +     '<div><label>سعر الجملة *</label><input id="v102-cost" type="number" min="0" step="1" value="'+(p.costPrice||'')+'"></div>'
        +     '<div><label>سعر البيع *</label><input id="v102-price" type="number" min="0" step="1" value="'+(p.price||'')+'"></div>'
        +   '</div>'
        +   '<label>المخزون</label><input id="v102-stock" type="number" min="0" step="1" value="'+(p.stock||0)+'">'
        +   '<label>الصور <small style="color:#a78bfa;font-weight:400">(الأولى رئيسية · حد أقصى 5)</small></label>'
        +   '<div class="v102-imgs" id="v102-imgs"></div>'
        +   '<input type="file" id="v102-file" accept="image/*" multiple style="display:none">'
        +   '<button type="button" class="v102-upload-btn" id="v102-upload-btn">📷 رفع صور من الجهاز</button>'
        +   '<div class="v102-progress" id="v102-progress" style="display:none"><div class="v102-progress-bar"></div><span>0%</span></div>'
        +   '<label class="v101-toggle-lbl"><input id="v102-active" type="checkbox" '+(p.active!==false?'checked':'')+'> إظهار في تطبيق العميل</label>'
        + '</div>'
        + '<div class="v101-m-foot">'
        +   (isEdit ? '<button class="v101-btn-del" type="button" id="v102-del">🗑️</button>' : '')
        +   '<button class="v101-btn-cancel" type="button" id="v102-cancel">إلغاء</button>'
        +   '<button class="v101-btn-save" type="button" id="v102-save">💾 '+(isEdit?'تحديث':'نشر')+'</button>'
        + '</div>';

      var overlay = document.createElement('div');
      overlay.className='v101-modal-overlay active';
      overlay.innerHTML='<div class="v101-modal">'+html+'</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click',function(e){ if(e.target===overlay) closeModal(overlay); });
      var $ = function(id){ return overlay.querySelector('#'+id); };

      function renderFeatures(){
        var w = $('v102-features');
        w.innerHTML = features.map(function(f,i){ return '<span class="v102-chip">'+esc(f)+'<button type="button" data-i="'+i+'">×</button></span>'; }).join('');
        w.querySelectorAll('button[data-i]').forEach(function(btn){
          btn.onclick = function(){ features.splice(parseInt(this.getAttribute('data-i'),10),1); renderFeatures(); };
        });
      }
      renderFeatures();
      function addFeature(){
        var inp = $('v102-feature-input'); var v = inp.value.trim();
        if(!v) return;
        if(features.indexOf(v) !== -1){ toast('موجودة'); return; }
        features.push(v); inp.value=''; renderFeatures();
      }
      $('v102-feature-btn').onclick = addFeature;
      $('v102-feature-input').onkeydown = function(e){ if(e.key==='Enter'){ e.preventDefault(); addFeature(); } };

      function renderImgs(){
        var w = $('v102-imgs');
        w.innerHTML = uploadState.urls.map(function(url,i){
          return '<div class="v102-img-thumb" data-idx="'+i+'"><img src="'+esc(url)+'">'+(i===0?'<span class="v102-badge-primary">رئيسية</span>':'')+'<button type="button" data-i="'+i+'">×</button></div>';
        }).join('');
        
        // ميزة النقر على الصورة لجعلها رئيسية
        w.querySelectorAll('.v102-img-thumb').forEach(function(thumb){
          thumb.onclick = function(e){
            if(e.target.tagName === 'BUTTON') return; // تجاهل زر الحذف
            var idx = parseInt(this.getAttribute('data-idx'),10);
            if(idx === 0) return; // هي رئيسية بالفعل
            var selected = uploadState.urls.splice(idx, 1)[0];
            uploadState.urls.unshift(selected); // نقلها للمقدمة
            renderImgs();
          };
        });

        w.querySelectorAll('button[data-i]').forEach(function(btn){
          btn.onclick = function(e){
            e.stopPropagation(); // منع تفعيل النقر على الصورة
            uploadState.urls.splice(parseInt(this.getAttribute('data-i'),10),1); renderImgs(); 
          };
        });
      }
      renderImgs();

      $('v102-upload-btn').onclick = function(){ $('v102-file').click(); };
      $('v102-file').onchange = async function(e){
        var files = Array.prototype.slice.call(e.target.files);
        if(!files.length) return;
        var remaining = 5 - uploadState.urls.length;
        if(remaining <= 0){ toast('⚠️ حد أقصى 5 صور'); return; }
        if(files.length > remaining) files = files.slice(0, remaining);
        if(typeof window.__v102c_uploadBatch !== 'function'){ toast('❌ رافع الصور غير محمّل'); return; }
        uploadState.uploading = true;
        var progress = $('v102-progress'); progress.style.display='block';
        var bar = progress.querySelector('.v102-progress-bar');
        var lbl = progress.querySelector('span');
        bar.style.width='0%'; lbl.textContent='0%';
        try {
          await window.__v102c_uploadBatch(files, state.cat, {
            onProgress: function(pct){ bar.style.width=pct+'%'; lbl.textContent=pct+'%'; },
            onUrl: function(url){ uploadState.urls.push(url); renderImgs(); },
            onError: function(err){ toast('❌ '+(err.message||'خطأ')); }
          });
        } catch(e){ console.error('[V102c] upload:', e); toast('❌ '+(e.message||'')); }
        progress.style.display='none';
        uploadState.uploading = false;
        $('v102-file').value = '';
      };

      overlay.querySelector('.v101-m-close').onclick = function(){ closeModal(overlay); };
      $('v102-cancel').onclick = function(){ closeModal(overlay); };

      $('v102-save').onclick = async function(){
        if(uploadState.uploading){ toast('⏳ انتظر رفع الصور'); return; }
        var name = $('v102-name').value.trim();
        var desc = $('v102-desc').value.trim();
        var brandId = $('v102-brand').value;
        var supplierId = $('v102-supplier').value;
        var costPrice = Number($('v102-cost').value) || 0;
        var price = Number($('v102-price').value) || 0;
        var stock = Number($('v102-stock').value) || 0;
        var active = $('v102-active').checked;
        var imgs = uploadState.urls.slice();
        if(!name){ toast('⚠️ الاسم مطلوب'); return; }
        if(!brandId){ toast('⚠️ اختر الماركة'); return; }
        if(!supplierId){ toast('⚠️ اختر المورد'); return; }
        if(costPrice <= 0){ toast('⚠️ سعر الجملة مطلوب'); return; }
        if(price <= 0){ toast('⚠️ سعر البيع مطلوب'); return; }
        if(!imgs.length){ toast('⚠️ صورة واحدة على الأقل'); return; }
        var brandObj = brands.filter(function(b){ return b.id===brandId; })[0];
        var supplierObj = suppliers.filter(function(s){ return s.id===supplierId; })[0];
        var data = {
          name: name, desc: desc,
          brand: brandObj ? brandObj.name : '', brandId: brandId,
          supplier: supplierObj ? supplierObj.name : '', supplierName: supplierObj ? supplierObj.name : '', supplierId: supplierId,
          costPrice: costPrice, price: price,
          stock: stock,
          img: imgs[0] || '', imgs: imgs,
          features: features,
          active: active,
          category: state.cat
        };
        var btn = this; btn.disabled = true; btn.textContent = '⏳...';
        try {
          if(isEdit){
            data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
            data.updatedBy = state.user.uid;
            await db.collection('products').doc(product.id).update(data);
            toast('✅ تم التحديث');
          } else {
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            data.createdBy = state.user.uid;
            await db.collection('products').add(data);
            toast('✅ تم النشر');
          }
          closeModal(overlay);
          try {
            var snap = await db.collection('products').get();
            state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
              .filter(function(pp){ return pp.category===state.cat || (Array.isArray(pp.categories) && pp.categories.indexOf(state.cat)!==-1); });
          } catch(e){}
          if(typeof window.__v100Tab === 'function') window.__v100Tab(state.activeTab || 'products');
        } catch(e){
          console.error('[V102] save:', e);
          btn.disabled = false; btn.textContent = '💾 '+(isEdit?'تحديث':'نشر');
          toast('❌ '+(e.message||e.code||'خطأ'));
        }
      };

      var delBtn = $('v102-del');
      if(delBtn){
        delBtn.onclick = async function(){
          if(!confirm('حذف "'+p.name+'" نهائياً؟')) return;
          try {
            await db.collection('products').doc(product.id).delete();
            closeModal(overlay); toast('🗑️ تم الحذف');
            var snap = await db.collection('products').get();
            state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
              .filter(function(pp){ return pp.category===state.cat || (Array.isArray(pp.categories) && pp.categories.indexOf(state.cat)!==-1); });
            if(typeof window.__v100Tab === 'function') window.__v100Tab(state.activeTab || 'products');
          } catch(e){ toast('❌ '+(e.message||e.code||'')); }
        };
      }
    }

    // Capture clicks BEFORE v101 sees them
    document.addEventListener('click', function(e){
      if(!e.target || !e.target.closest) return;
      var addBtn = e.target.closest('.v100-act[data-go="add"], .v101-add-btn');
      if(addBtn){
        e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
        openProductFormV2(null);
        return;
      }
      var prodCard = e.target.closest('.v100-prod');
      if(prodCard){
        var content = document.getElementById('v100-content');
        if(!content) return;
        var cards = Array.prototype.slice.call(content.querySelectorAll('.v100-prod'));
        var idx = cards.indexOf(prodCard);
        if(idx >= 0 && state.products && state.products[idx]){
          e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
          openProductFormV2(state.products[idx]);
        }
      }
    }, true);

    loadLookups();
    console.log('[V102] ready | storage:', !!storage);
  }
  hook();
})();
</script>

<script id="v200-worker-upload">
(function(){
  var tries = 0;
  function hook(){
    tries++;
    if(tries > 300) return setTimeout(hook, 100);
    if(!window.__v102cReady) return setTimeout(hook, 100); // ننتظر حتى يتم تحميل النموذج
    if(window.__v200Ready) return;
    window.__v200Ready = true;

    var WORKER_URL = "https://chizen-uploader.hazimchat.workers.dev";

    function compressImage(file, maxDim, quality) {
      return new Promise(function(resolve, reject){
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function(){
          URL.revokeObjectURL(url);
          var w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob){
            if(!blob) return reject(new Error('compress failed'));
            resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('load failed')); };
        img.src = url;
      });
    }

    async function uploadToWorker(file) {
      var compressed = await compressImage(file, 1200, 0.82);
      var res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg' },
        body: compressed
      });
      if(!res.ok) throw new Error('فشل الرفع: ' + res.status);
      var data = await res.json();
      if(!data.url) throw new Error('لم يتم إرجاع رابط');
      return data.url;
    }

    // استبدال دالة الرفع القديمة (التي تطلب توكن) بالدالة الجديدة
    window.__v102c_uploadBatch = async function(files, category, callbacks){
      callbacks = callbacks || {};
      var onProgress = callbacks.onProgress || function(){};
      var onUrl = callbacks.onUrl || function(){};
      var onError = callbacks.onError || function(e){ console.error(e); };
      var total = files.length, success = 0;
      for(var i=0; i<total; i++){
        try {
          var url = await uploadToWorker(files[i]);
          onUrl(url); success++;
          onProgress(Math.round((i+1)/total*100));
        } catch(e){ onError(e); }
      }
      if(success === 0 && total > 0) throw new Error('فشل رفع الصور');
    };
    
    // منع ظهور مودال التوكن القديم نهائياً
    window.__v102b_showTokenModal = function(){ return Promise.resolve("worker-handled"); };

    console.log('[V200] Cloudflare Worker upload active. No tokens needed.');
  }
  hook();
})();
</script>

<script id="v201-js">
(function(){
  var tries = 0;
  function hook(){
    tries++;
    if(tries > 300) return setTimeout(hook, 100);
    if(!window.catMgrApp || !window.catMgrApp.state) return setTimeout(hook, 100);
    if(window.__v201Ready) return;
    window.__v201Ready = true;
    
    var state = window.catMgrApp.state;

    function buildShell(){
      var app = document.getElementById('cat-mgr-app');
      if(!app) return;
      app.innerHTML = ''
        + '<div class="v100-header">'
        +   '<div class="v100-h-left">'
        +     '<div class="v100-h-cat" id="v100-cat-name">—</div>'
        +     '<div class="v100-h-user" id="v100-user-name">—</div>'
        +   '</div>'
        +   '<button class="v100-h-logout" id="v100-logout">🚪 خروج</button>'
        + '</div>'
        + '<main id="v100-content"></main>'

        +   '<button data-tab="pending"><span>📦</span><small>طلباتي</small><i class="v100-badge" id="v100-badge" style="display:none"></i></button>'
        +   '<button data-tab="products"><span>🛍️</span><small>منتجاتي</small></button>'
        + '</nav>';
      document.getElementById('v100-logout').onclick = function(){ firebase.auth().signOut().then(function(){ location.reload(); }); };
      var navs = document.querySelectorAll('.v100-nav button');
      for(var i = 0; i < navs.length; i++){
        navs[i].onclick = function(){ window.__v100Tab(this.getAttribute('data-tab')); };
      }
    }

    function updateBadge(){
      var b = document.getElementById('v100-badge');
      if(!b) return;
      var n = (state.pending || []).length;
      if(n > 0){ b.textContent = n; b.style.display = ''; } else { b.style.display = 'none'; }
    }

    function render(){
      var cn = document.getElementById('v100-cat-name');
      var un = document.getElementById('v100-user-name');
      if(cn) cn.textContent = '🏷️ ' + (state.cat || 'قسمي');
      if(un) un.textContent = (state.user && state.user.name) || 'مدير القسم';
      var content = document.getElementById('v100-content');
      if(!content) return;
      var tab = state.activeTab || 'home';
      if(tab === 'home') content.innerHTML = renderHome();
      else if(tab === 'pending'){ content.innerHTML = renderPending(); attachPendingHandlers(); }
      else if(tab === 'products') content.innerHTML = renderProducts();
      updateBadge();
    }

    function renderHome(){
      var hour = new Date().getHours();
      var greet = hour < 12 ? 'صباح الخير' : (hour < 18 ? 'مساء النور' : 'مساء الخير');
      var emoji = hour < 12 ? '☀️' : (hour < 18 ? '🌤️' : '🌙');
      var pCount = (state.pending || []).length;
      var prCount = (state.products || []).length;
      var lowStock = (state.products || []).filter(function(p){ return Number(p.stock) > 0 && Number(p.stock) <= 3; }).length;
      var val = 0;
      (state.pending || []).forEach(function(o){ var c = o.categories && o.categories[state.cat]; if(c && c.subtotal) val += Number(c.subtotal) || 0; });
      var h = '';
      h += '<div class="v100-welcome">';
      h +=   '<div class="v100-w-greeting">' + emoji + ' ' + greet + '</div>';
      h +=   '<div class="v100-w-user">' + ((state.user && state.user.name) || 'مدير القسم') + '</div>';
      h +=   '<div class="v100-w-stats">';
      h +=     '<div class="v100-w-stat"><b>' + pCount + '</b><small>طلبات</small></div>';
      h +=     '<div class="v100-w-stat"><b>' + prCount + '</b><small>منتجات</small></div>';
      h +=     '<div class="v100-w-stat"><b>' + val.toFixed(0) + '</b><small>قيمة</small></div>';
      h +=   '</div>';
      h += '</div>';
      h += '<div class="v100-section">';
      h +=   '<div class="v100-sec-title">⚡ إجراءات سريعة</div>';
      h +=   '<div class="v100-actions">';
      h +=     '<button class="v100-act" data-go="pending"><span class="v100-act-icon">📦</span><div class="v100-act-lbl">مراجعة الطلبات</div>' + (pCount > 0 ? '<div class="v100-act-count">' + pCount + '</div>' : '') + '</button>';
      h +=     '<button class="v100-act" data-go="products"><span class="v100-act-icon">🛍️</span><div class="v100-act-lbl">منتجاتي</div><div class="v100-act-count">' + prCount + '</div></button>';
      h +=     '<button class="v100-act" data-go="add"><span class="v100-act-icon">➕</span><div class="v100-act-lbl">إضافة منتج</div></button>';
      h +=     '<button class="v100-act" data-go="logout"><span class="v100-act-icon">🚪</span><div class="v100-act-lbl">خروج</div></button>';
      h +=   '</div>';
      h += '</div>';
      if(lowStock > 0) h += '<div class="v100-alert">⚠️ <b>' + lowStock + '</b> منتج بمخزون منخفض (3 أو أقل)</div>';
      setTimeout(attachHomeHandlers, 0);
      return h;
    }
    
    function attachHomeHandlers(){
      var acts = document.querySelectorAll('.v100-act[data-go]');
      for(var i = 0; i < acts.length; i++){
        acts[i].onclick = function(){
          var g = this.getAttribute('data-go');
          if(g === 'logout') firebase.auth().signOut().then(function(){ location.reload(); });
          else if(g === 'add') {
             if(window.__v102cOpenForm) window.__v102cOpenForm();
             else if(window.__v102OpenForm) window.__v102OpenForm();
             else alert('نموذج الإضافة غير محمل');
          }
          else window.__v100Tab(g);
        };
      }
    }

    function renderPending(){
      if(!state.pending || !state.pending.length){
        return '<div class="v100-empty"><div class="v100-empty-icon">✨</div><div>لا توجد طلبات بانتظار المراجعة</div><div class="v100-empty-sub">ستظهر هنا الطلبات الجديدة تلقائياً</div></div>';
      }
      return state.pending.map(function(o){
        var c = (o.categories && o.categories[state.cat]) || { items: [] };
        var items = c.items || [];
        var total = items.reduce(function(s,i){ return s + (Number(i.price)||0)*(Number(i.qty)||1); }, 0);
        var allChecked = items.every(function(i){ return i._catStatus !== false; });
        var h = '<div class="v100-order" data-oid="' + o.id + '">';
        h +=   '<div class="v100-ord-head">';
        h +=     '<div style="min-width:0"><div class="v100-ord-id">#' + String(o.id).slice(-6) + '</div><div class="v100-ord-cust">' + (o.customerName || 'عميل') + ' · ' + (o.createdAt ? new Date(o.createdAt.toDate()).toLocaleDateString('ar-YE') : '—') + '</div></div>';
        h +=     '<div class="v100-ord-total">' + total.toFixed(0) + ' <small>ر.ي</small></div>';
        h +=   '</div>';
        h +=   '<div class="v100-ord-items">';
        items.forEach(function(it, idx){
          h += '<label class="v100-item">';
          h +=   '<input type="checkbox" data-idx="' + idx + '" ' + (it._catStatus === false ? '' : 'checked') + '>';
          h +=   '<img src="' + (it.img||'') + '" alt="">';
          h +=   '<div class="v100-item-info"><b>' + (it.name||'—') + '</b><span>الكمية: ' + (it.qty||1) + '</span></div>';
          h +=   '<div class="v100-item-price">' + ((Number(it.price)||0)*(Number(it.qty)||1)).toFixed(0) + '</div>';
          h += '</label>';
        });
        h +=   '</div>';
        h +=   '<input class="v100-reason" type="text" id="v100-reason-' + o.id + '" placeholder="سبب الرفض (عند الرفض فقط)">';
        h +=   '<div class="v100-ord-foot">';
        h +=     '<button class="v100-btn-ok" ' + (allChecked ? '' : 'disabled') + '>✓ تأكيد التوفر</button>';
        h +=     '<button class="v100-btn-warn">✗ رفض</button>';
        h +=   '</div>';
        h += '</div>';
        return h;
      }).join('');
    }
    
    function attachPendingHandlers(){
      var wraps = document.querySelectorAll('.v100-order');
      for(var i = 0; i < wraps.length; i++){
        (function(wrap){
          var oid = wrap.getAttribute('data-oid');
          var inputs = wrap.querySelectorAll('input[type=checkbox]');
          for(var j = 0; j < inputs.length; j++){
            (function(inp){
              inp.onchange = function(){ 
                 var o = state.pending.find(x => x.id === oid);
                 if(o) {
                     o.categories[state.cat].items[parseInt(inp.getAttribute('data-idx'),10)]._catStatus = inp.checked;
                     var all = o.categories[state.cat].items.every(x => x._catStatus !== false);
                     var btn = wrap.querySelector('.v100-btn-ok');
                     if(btn) btn.disabled = !all;
                 }
              };
            })(inputs[j]);
          }
          var ok = wrap.querySelector('.v100-btn-ok');
          if(ok) ok.onclick = function(){ if(window.catMgrApp.confirm) window.catMgrApp.confirm(oid); };
          var warn = wrap.querySelector('.v100-btn-warn');
          if(warn) warn.onclick = function(){ if(window.catMgrApp.reject) window.catMgrApp.reject(oid); };
        })(wraps[i]);
      }
    }

    function renderProducts(){
      if(!state.products || !state.products.length){
        return '<div class="v100-empty"><div class="v100-empty-icon">🛍️</div><div>لا توجد منتجات في قسمك</div><div class="v100-empty-sub">ستظهر هنا منتجات قسمك</div></div>';
      }
      return '<div class="v100-products-grid">' + state.products.map(function(p){
        var st = Number(p.stock) || 0;
        var cls = st === 0 ? 'out' : (st <= 3 ? 'low' : 'ok');
        var lbl = st === 0 ? 'نفذ' : (st <= 3 ? 'منخفض' : 'متوفر');
        return '<div class="v100-prod">'
          + '<img src="' + (p.img||'') + '" alt="">'
          + '<div class="v100-prod-info">'
          +   '<b>' + (p.name||'—') + '</b>'
          +   '<span>' + (p.brand||'') + ' · ' + ((Number(p.price)||0)).toFixed(0) + ' ر.ي</span>'
          +   '<span class="v100-stock v100-stock-' + cls + '">' + lbl + ' (' + st + ')</span>'
          + '</div></div>';
      }).join('') + '</div>';
    }

    window.__v100Tab = function(t){
      state.activeTab = t;
      var btns = document.querySelectorAll('.v100-nav button');
      for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === t);
      render();
    };

    window.catMgrApp.init = async function(userDoc){
      if(!userDoc || userDoc.role !== 'cat_manager') return false;
      state.user = userDoc;
      state.cat = userDoc.assignedCategory;
      if(!state.cat){ alert('⚠️ لم يُعيَّن قسم لهذا المستخدم'); return false; }
      
      buildShell();
      document.getElementById('cat-mgr-app').style.display = 'block';
      document.getElementById('am').style.display = 'none'; // إخفاء القديمة

      var db = firebase.firestore();
      try {
        var snap = await db.collection('products').get();
        state.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
          .filter(function(p){ return p.category === state.cat || (Array.isArray(p.categories) && p.categories.indexOf(state.cat) !== -1); });
      } catch(e){ state.products = []; }

      if(state.unsub) state.unsub();
      state.unsub = db.collection('orders')
        .where('workflowStatus','==','awaiting_categories')
        .onSnapshot(function(snap){
          var pending = [];
          snap.forEach(function(d){
            var data = d.data();
            var c = data.categories && data.categories[state.cat];
            if(c && c.status === 'pending') pending.push(Object.assign({id:d.id}, data));
          });
          state.pending = pending;
          updateBadge();
          if(state.activeTab === 'home' || state.activeTab === 'pending') render();
        }, function(err){ console.warn(err); });

      state.activeTab = 'home';
      render();
      return true;
    };
    
    console.log('[V201] Beautiful UI restored.');
  }
  hook();
})();
</script>



<script id="v203-perpetual">
(function(){
  var WORKER_URL = "https://chizen-uploader.hazimchat.workers.dev";
  
  function compressImage(file, maxDim, quality) {
    return new Promise(function(resolve, reject){
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('compress')); }, 'image/jpeg', quality);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  
  async function uploadToWorker(file) {
    var blob = await compressImage(file, 1200, 0.82);
    var res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
    if(!res.ok) throw new Error('فشل الرفع: ' + res.status);
    var data = await res.json();
    if(!data.url) throw new Error('لا رابط');
    return data.url;
  }
  
  // نسخة الرفع عبر Cloudflare
  var workerUpload = async function(files, category, callbacks){
    callbacks = callbacks || {};
    var onProgress = callbacks.onProgress || function(){};
    var onUrl = callbacks.onUrl || function(){};
    var onError = callbacks.onError || function(e){ console.error(e); };
    var total = files.length, success = 0;
    for(var i=0; i<total; i++){
      try {
        var url = await uploadToWorker(files[i]);
        onUrl(url); success++;
        onProgress(Math.round((i+1)/total*100));
      } catch(e){ onError(e); }
    }
    if(success === 0 && total > 0) throw new Error('فشل رفع الصور');
  };
  
  // زر التأكيد المُصلح
  var fixedConfirm = async function(orderId){

        catObj.confirmedAt = firebase.firestore.FieldValue.serverTimestamp();
        var updates = {};
        updates['categories.' + state.cat] = catObj;
        var merged = Object.assign({}, data.categories || {});
        merged[state.cat] = catObj;
        var allResolved = Object.keys(merged).every(function(k){ var s = merged[k] && merged[k].status; return s === 'confirmed' || s === 'rejected'; });
        var anyRejected = Object.keys(merged).some(function(k){ return merged[k] && merged[k].status === 'rejected'; });
        if(allResolved) updates.workflowStatus = anyRejected ? 'payment_rejected' : 'ready_to_send';
        tx.update(ref, updates);
      });
      if(o.customerId){
        db.collection('notifications').add({
          userId: o.customerId, title: '✅ تم تأكيد توفر منتجاتك', body: 'طلبك #' + String(orderId).slice(-6) + ' جاهز',

    } catch(e) {

        if(window.__v100Tab) window.__v100Tab(state.activeTab || 'pending');

  // زر الرفض المُصلح
  var fixedReject = async function(orderId){

    var db = firebase.firestore();
    try {
      await db.runTransaction(async function(tx){

  setInterval(function(){

    var db = firebase.firestore();

    firebase.auth().onAuthStateChanged(function(u){
      if (!u) { cachedRole = null; return; }
      db.collection('users').doc(u.uid).get().then(function(d){
        cachedRole = d.exists ? (d.data().role || 'customer') : 'customer';
      }).catch(function(){});
    });

    db.collection = function(name){
      var ref = origCollection(name);
      if (name === 'products' && !ref.__v210) {
        ref.__v210 = true;
        var origAdd = ref.add.bind(ref);
        ref.add = function(data){
          if (data && data.name && !data.status) {
            var u = firebase.auth().currentUser;
            if (cachedRole === 'super_admin') {
              // السوبر أدمن ينشر مباشرة
              data.status = 'live';
              data.active = true;
              data.reviewedBy = { uid: u.uid, name: u.displayName || u.email || '', at: firebase.firestore.FieldValue.serverTimestamp() };
            } else {
              // مدير القسم → بانتظار المراجعة
              data.status = 'pending_review';
              data.active = false;
              data.submittedBy = {
                uid: u.uid, name: u.displayName || u.email || '',
                at: firebase.firestore.FieldValue.serverTimestamp()
              };

                origCollection('users').where('role','==','super_admin').get().then(function(snap){

                    origCollection('notifications').add({
                      userId: d.id,

                  });
                }).catch(function(){});

})();

<script id="v211-js">
(function(){
  var tries = 0;
  function hook(){

    if(window.__v211Ready) return;
    window.__v211Ready = true;

    var db = firebase.firestore();
    var overlay, fab, badge, unsub;

    function build(){
      var user = firebase.auth().currentUser;
      if (!user) { setTimeout(build, 500); return; }
      db.collection('admins').doc(user.uid).get().then(function(adm){
        if (adm.exists) return doBuild();
        db.collection('users').doc(user.uid).get().then(function(u){
          if (u.exists && u.data().role === 'super_admin') doBuild();
        });
      }).catch(function(){ setTimeout(build, 500); });
    }

    function doBuild(){
      fab = document.createElement('div');
      fab.id = 'v211-fab';
      fab.innerHTML = '📋 <span>مراجعة المنتجات</span> <span id="v211-count" style="background:#ef4444;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;display:none">0</span>';
      document.body.appendChild(fab);
      badge = document.getElementById('v211-count');

      overlay = document.createElement('div');
      overlay.id = 'v211-overlay';
      overlay.innerHTML =
        '<div style="position:sticky;top:0;background:rgba(10,8,37,0.98);padding:16px;border-bottom:1px solid rgba(155,77,255,0.3);display:flex;align-items:center;justify-content:space-between;z-index:10">' +
          '<h2 style="margin:0;color:#fff;font-size:17px">📋 مراجعة المنتجات</h2>' +

        '</div><div id="v211-list" style="padding:16px"></div>';
      document.body.appendChild(overlay);

      document.getElementById('v211-close').onclick = function(){ overlay.classList.remove('show'); };
      fab.onclick = function(){ overlay.classList.add('show'); };

      unsub = db.collection('products').where('status','==','pending_review').onSnapshot(function(snap){
        var n = snap.size;
        if (n > 0) { fab.classList.add('show'); badge.style.display = 'inline-block'; badge.textContent = n; }
        else { fab.classList.remove('show'); }
        renderList(snap.docs);
      }, function(err){ console.warn('[V211]', err); });
    }

    function renderList(docs){
      var list = document.getElementById('v211-list');
      if (!list) return;
      if (docs.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#a78bfa"><div style="font-size:48px;margin-bottom:12px">✨</div><div>لا توجد منتجات بانتظار المراجعة</div></div>';

        html += '<button onclick="window.__v211Reject(\''+id+'\')" style="flex:1;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit">✗ رفض</button>';
        html += '</div>';

      });

    window.__v211Approve = function(pid){

        db.collection('products').doc(pid).update({
