<!-- ═══ Admin Force Fresh v78 ═══ -->
<script id="chz-admin-force-fresh">
(function(){
  'use strict';
  var VERSION = 'admin-v78-2026-10-27';
  var STORED = 'chizen_admin_v';
  
  // 1. Unregister ALL service workers immediately
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) {
        console.log('[admin] unregistering SW:', r.scope);
        r.unregister();
      });
    });
  }
  
  // 2. Clear all caches
  if ('caches' in window) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) {
        console.log('[admin] clearing cache:', k);
        caches.delete(k);
      });
    });
  }
  
  // 3. Force reload if version changed (but only once)
  var prevVersion = null;
  try { prevVersion = localStorage.getItem(STORED); } catch(e){}
  
  if (prevVersion && prevVersion !== VERSION) {
    console.log('[admin] version changed:', prevVersion, '→', VERSION);
    try { localStorage.setItem(STORED, VERSION); } catch(e){}
    var reloaded = sessionStorage.getItem('chz_admin_reloaded');
    if (!reloaded) {
      sessionStorage.setItem('chz_admin_reloaded', '1');
      setTimeout(function() {
        window.location.replace(window.location.pathname + '?v=' + Date.now());
      }, 100);
      return;
    }
  }
  
  try { localStorage.setItem(STORED, VERSION); } catch(e){}
  
  // 4. Add cache-buster to all API calls
  var origFetch = window.fetch;
  if (origFetch) {
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.indexOf('http') === 0) {
        try {
          var u = new URL(url);
          if (u.hostname.indexOf('firebase') > -1 || u.hostname.indexOf('googleapis') > -1) {
            return origFetch.call(this, url, opts);
          }
        } catch(e){}
      }
      return origFetch.call(this, url, opts);
    };
  }
  
  console.log('[admin v78] force fresh active');
})();
</script>

/* ═══ CHIZEN COMFORT DARK IDENTITY ═══ */
:root {
  --bg: #14141F !important; /* كحلي داكن جداً ومريح */
  --nav: #1C1C28 !important; /* لون البطاقات */
  --cr: #E2E2E9 !important; /* أبيض مريح للعين وليس حاد */
  --mt: #8B8B9F !important; /* رمادي للنصوص الثانوية */
  --bd: rgba(255, 255, 255, 0.07) !important; /* حدود ناعمة */
  --grad: linear-gradient(135deg, #8B5CF6, #EC4899) !important; /* بنفسجي ووردي هادئ */
  --grad2: linear-gradient(135deg, #A78BFA, #F472B6) !important;
  --pl: #A78BFA !important; /* بنفسجي فاتح */
  --pk: #F472B6 !important; /* وردي فاتح */
  --gn: #10B981 !important;
  --rd: #EF4444 !important;
}

body, #app { background: var(--bg) !important; color: var(--cr) !important; font-family: 'Tajawal', sans-serif !important; }

/* الشريط العلوي */
.hd { background: var(--nav) !important; border-bottom: 1px solid var(--bd) !important; padding: 15px 20px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; }

.hs { color: var(--mt) !important; }
.hb { background: rgba(255,255,255,0.04) !important; border: 1px solid var(--bd) !important; color: var(--pl) !important; border-radius: 10px !important; }

.sw-tabs { background: var(--nav) !important; border-bottom: 1px solid var(--bd) !important; padding: 10px 15px !important; }
.tb { color: var(--mt) !important; font-weight: 700 !important; padding: 8px 16px !important; border-radius: 10px !important; border: none !important; }

.cd, .sc { background: var(--nav) !important; border: 1px solid var(--bd) !important; border-radius: 16px !important; box-shadow: 0 8px 20px rgba(0,0,0,0.2) !important; margin-bottom: 15px; }

  loginGoogle:async function(){
    try{
      var p=new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({prompt:'select_account'});
      // تم تعديلها للعمل على الـ APK بدون الخروج من التطبيق
      await FB.auth.signInWithPopup(p);
    }catch(e){
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
      this.toast('فشل: '+(e.message||''),'err');
    }
  },

  checkAdmin: async function(u) {
    if (!u) return;
    try {
      // 1) تحقق من legacy admin (admins collection)
      var isLegacy = false;
      try {
        var legacyDoc = await FB.db.collection('admins').doc(u.uid).get();
        isLegacy = legacyDoc.exists;
      } catch(e) { console.warn('legacy check:', e.message); }
      
      // 2) اقرأ role من users
      var role = 'customer';
      var assignedCategory = null;
      try {
        var userSnap = await FB.db.collection('users').doc(u.uid).get();
        if (userSnap.exists) {
          var ud = userSnap.data();
          role = ud.role || 'customer';
          assignedCategory = ud.assignedCategory || null;
        }
      } catch(e) { console.warn('user role check:', e.message); }
      
      // 3) الدور الفعلي
      var effRole = isLegacy ? 'super_admin' : role;
      
      // 4) منع العملاء
      if (effRole === 'customer') {
        this.toast('⛔ ليس لديك صلاحية الوصول للوحة', 'err');
        setTimeout(function(){ try { FB.auth.signOut(); } catch(e){} location.reload(); }, 1800);
        return;
      }
      
      // 5) خزّن عالمياً
      window.CURRENT_ROLE = effRole;
      window.CURRENT_CATEGORY = assignedCategory;
      window.CURRENT_UID = u.uid;
      
      // 6) اعرض اللوحة
      this.access(u);
      this.applyPermissions(effRole, assignedCategory);
      
    } catch(e) {
      console.error('checkAdmin failed:', e);
      this.toast('خطأ في التحقق: ' + e.message, 'err');
    }
  },

  applyPermissions: function(role, category) {
    if (role === 'super_admin') return; // وصول كامل — لا قيود
    
    var allowed = {};
    if (role === 'cat_manager') {
      allowed = { products: 1, orders: 1, dash: 1 };
    } else if (role === 'delivery_mgr') {
      allowed = { orders: 1, dash: 1 };
    }
    
    // إخفاء التبويبات غير المصرح بها
    document.querySelectorAll('.tb').forEach(function(btn) {
      var oc = btn.getAttribute('onclick') || '';
      var m = oc.match(/A\.tab\('([^']+)'/);
      if (m && !allowed[m[1]]) {
        btn.style.display = 'none';
      }
    });
    
    // مؤشر الدور
    var am = document.getElementById('am');
    if (am && !document.getElementById('role-indicator')) {
      var b = document.createElement('div');
      b.id = 'role-indicator';
      b.style.cssText = 'position:fixed;top:8px;right:8px;background:linear-gradient(135deg,#ff4d94,#a855f7);color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;z-index:99999;box-shadow:0 4px 12px rgba(255,77,148,0.4);';
      var catNames = {electronics:'إلكترونيات',fashion:'أزياء',home:'منزل',beauty:'جمال',kids:'أطفال',sports:'رياضة',tools:'أدوات'};
      var lbl = role === 'cat_manager' 
        ? ('📦 ' + (catNames[category] || category || 'قسم')) 
        : '📋 مندوب طلبات';
      b.textContent = lbl;
      am.appendChild(b);
    }
    
    // مؤشر إضافي في الشاشة الرئيسية
    var dash = document.getElementById('dash-c');
    if (dash) {
      var catNames2 = {electronics:'إلكترونيات',fashion:'أزياء',home:'منزل',beauty:'جمال',kids:'أطفال',sports:'رياضة',tools:'أدوات'};
      var welcome = role === 'cat_manager'
        ? '📦 مرحباً — أنت مسؤول قسم ' + (catNames2[category] || category)
        : '📋 مرحباً — أنت مندوب الطلبات';
      dash.innerHTML = '<div style="padding:15px;background:linear-gradient(135deg,rgba(255,77,148,0.15),rgba(168,85,247,0.15));border:1px solid rgba(255,77,148,0.4);border-radius:14px;margin-bottom:15px;text-align:center;font-weight:700;">' + welcome + '</div>' + (dash.innerHTML || '');
    }
  },

  loadData:async function(){
    var s=this;
    await Promise.allSettled([
      (async()=>{try{var p=await FB.getProducts();if(p)s.products=p;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var u=await FB.getAllUsers();if(u)s.users=u;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var o=await FB.getAllOrders();if(o)s.orders=o;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var c=await FB.getConfig('categories');if(c&&c.list)s.cats=c.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var p=await FB.getConfig('payments');if(p&&p.list)s.pays=p.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sp=await FB.getConfig('suppliers');if(sp&&sp.list)s.sups=sp.list;}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sn=await FB.db.collection('admins').get();s.admins=[];sn.forEach(d=>s.admins.push({uid:d.id,data:d.data()}));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var c=await FB.getConfig('contact');if(c)localStorage.setItem('chizen_contact',JSON.stringify(c));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var sh=await FB.getConfig('shipping');if(sh)localStorage.setItem('chizen_shipping',JSON.stringify(sh));}catch(e){ console.error('ERR:', e.message); }})(),
      (async()=>{try{var dl=await FB.getConfig('delivery_locations');if(dl&&dl.aden){s.deliveryLocs=dl;}else{s.deliveryLocs={aden:[{district:'المعلا',areas:['الشارع الرئيسي']}],yemen:[{gov:'صنعاء',station:'مكتب باصات الشام'}]};}}catch(e){s.deliveryLocs={aden:[],yemen:[]};}})()
    ]);
    if(!s.cats.length)s.cats=[{key:'home',name:'منزلية',icon:'🏠'},{key:'beauty',name:'تجميل',icon:'💄'},{key:'school',name:'مدرسية',icon:'📚'},{key:'clothes',name:'ملابس',icon:'👕'},{key:'electronics',name:'إلكترونيات',icon:'📱'},{key:'food',name:'طعام',icon:'🍔'},{key:'games',name:'ألعاب',icon:'🎮'},{key:'more',name:'المزيد',icon:'➕'}];
    if(!s.pays.length)s.pays=[{id:'kuraimi',name:'بنك الكريمي',account:'1234-567-890',color:'#0d47a1',icon:'🏦',type:'bank'},{id:'cash',name:'دفع نقدي',account:'',color:'#EF6C00',icon:'💵',type:'cash'}];
  },

  loadBanners: async function() {
    var list = document.getElementById("banners-list");
    if (!list) return;
    try {
      var doc = await FB.db.collection("config").doc("banners").get();
      var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
      if (arr.length === 0) { list.innerHTML = "<p style='padding:20px;color:#888;'>لا توجد بانرات</p>"; return; }
      var out = "";
      for (var i = 0; i < arr.length; i++) {
        var b = arr[i];
        out += "<div style='padding:10px;margin-bottom:10px;border:1px solid #333;border-radius:8px;'>" +
          "<img src='" + b.img + "' style='width:100%;max-width:300px;border-radius:6px;'>" +
          "<p style='font-weight:bold;margin:8px 0 4px;'>" + b.title + "</p>" +
          "<p style='color:#888;font-size:12px;margin:0;'>" + (b.sub || "") + "</p>" +
          "<button onclick='A.deleteBanner(" + i + ")' style='background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;margin-top:8px;cursor:pointer;'>🗑️ حذف</button>" +
          "</div>";
      }
      list.innerHTML = out;
    } catch(e) { list.innerHTML = "<p style='color:red;'>خطأ: " + e.message + "</p>"; }
  },
  saveBanner: async function() {
      var img = document.getElementById("bn-img").value.trim();
      var title = document.getElementById("bn-title").value.trim();
      var sub = document.getElementById("bn-sub").value.trim();
      var btn = document.getElementById("bn-btn").value.trim() || "تسوق الآن";
      var link = document.getElementById("bn-link") ? document.getElementById("bn-link").value.trim() : "";
      var fit = document.getElementById("bn-fit") ? document.getElementById("bn-fit").value : "cover";
      var position = document.getElementById("bn-position") ? document.getElementById("bn-position").value : "center";
      
      if (!img || !title) { alert("الصورة والعنوان مطلوبان"); return; }
      
      try {
        var doc = await FB.db.collection("config").doc("banners").get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        arr.push({ 
          img: img, title: title, sub: sub, btn: btn, link: link, fit: fit, position: position,
          scale: (window._chzBannerState||{}).scale || 1,
          rotate: (window._chzBannerState||{}).rotate || 0,
          height: (window._chzBannerState||{}).height || 200,
          align: (window._chzBannerState||{}).align || "right",
          overlay: (window._chzBannerState||{}).overlay !== undefined ? window._chzBannerState.overlay : 50
        });
        await FB.db.collection("config").doc("banners").set({ list: arr }, { merge: true });
        alert("✅ تم الإضافة");
        ["bn-img", "bn-title", "bn-sub", "bn-btn", "bn-link"].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.value = "";
        });
        var preview = document.getElementById("bn-preview-img");
        var label = document.getElementById("bn-preview-label");
        if (preview) preview.src = "";
        if (label) { label.style.display = "flex"; label.textContent = "معاينة الصورة"; }
        this.loadBanners();
      } catch(e) { alert("خطأ: " + e.message); }
    },

  prevImg:function(u){
    var pr=document.getElementById('f-prev');var im=document.getElementById('f-img-el');
    if(!pr||!im)return;
    if(!u){pr.classList.remove('hi');im.src='';return;}
    im.onload=()=>pr.classList.add('hi');

  saveProduct:async function(id,isEdit){
    var name=document.getElementById('f-name').value.trim();
    var price=parseFloat(document.getElementById('f-price').value);
    if(!name){this.toast('أدخل الاسم','err');return;}
    if(!price||price<=0){this.toast('سعر صحيح','err');return;}
    var imgsRaw=(document.getElementById('f-imgs').value||'').split('\n').map(s=>s.trim()).filter(s=>s);
    var mainImg=document.getElementById('f-img').value.trim();
    if(mainImg&&imgsRaw.indexOf(mainImg)===-1)imgsRaw.unshift(mainImg);
    var feats=document.getElementById('f-feats').value.split('\n').map(s=>s.trim()).filter(s=>s);
    var stockV=document.getElementById('f-stock').value;
    var data={name:name,brand:document.getElementById('f-brand').value,category:document.getElementById('f-cat').value,price:price,old:parseFloat(document.getElementById('f-old').value)||null,stock:stockV?parseInt(stockV):null,badge:document.getElementById('f-badge').value.trim(),rating:4.5,reviews:0,sold:0,img:document.getElementById('f-img').value.trim(),
         colors: document.getElementById('f-colors').value.split(',').map(s => s.trim()).filter(s => s !== ''),desc:document.getElementById('f-desc').value.trim(),imgs:imgsRaw,features:feats,active:document.getElementById('f-active').checked,featured:document.getElementById('f-featured').checked};
    try{
      if(isEdit)await FB.updateProduct(id,data);else await FB.addProduct(data);
      this.toast(isEdit?'✓ تم':'✓ أُضيف','suc');
      this.cm();
      await this.loadData();
      this.renderProducts();this.renderDash();
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  deleteProduct:function(id){
    var self=this;var name='';
    this.products.forEach(p=>{if(String(p.id)===String(id))name=p.name;});
    this.confirm('حذف المنتج؟','"'+name+'"',async function(){
      try{await FB.deleteProduct(id);await self.loadData();self.renderProducts();self.renderDash();self.toast('تم','suc');}catch(e){self.toast('فشل','err');}
    });
  },


  

  renderCats:function(){
        if (!this.cats) this.cats = [];
        var self = this;
        CORE_CATS_ADMIN.forEach(function(c) {
            var exists = self.cats.find(function(x) { return x.key === c.key; });
            if (!exists) self.cats.push(c);
        });

    var c=document.getElementById('cat-list');if(!c)return;
    if(!this.cats.length){c.innerHTML='<div class="emp">لا أقسام</div>';return;}
    var h='';
    this.cats.forEach((cat,i)=>{var cnt=this.products.filter(p=>p.category===cat.key).length;var isProt = this.isProtectedCat(cat.key);

  saveCat:async function(idx){
    var key=document.getElementById('c-key').value.trim().toLowerCase().replace(/\s+/g,'_');

    var icon=document.getElementById('c-icon').value.trim()||'📦';

    var cat={key, name, icon};

    try{await FB.setConfig('categories',{list:this.cats});this.cm();this.renderCats();this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  saveNote:async function(id){
    var t=document.getElementById('o-note');if(!t)return;
    var note=t.value.trim();
    try{
      var snap=await FB.db.collection('orders').where('id','==',id).get();
      if(snap.empty){this.toast('الطلب غير موجود','err');return;}
      await snap.docs[0].ref.update({adminNote:note,adminNoteUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),adminNoteUpdatedBy:FB.currentUser?FB.currentUser.email:''});
      for(var i=0;i<this.orders.length;i++){if(this.orders[i].id===id){this.orders[i].adminNote=note;break;}}
      this.toast('✓ تم','suc');
      this.orderDetails(id);
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  setStatus:async function(id,status){
    try{
      var targetUid='ALL';
      this.orders.forEach(o=>{if(o.id===id)targetUid=o.userId||'ALL';});
      await FB.updateOrderStatus(id,status);
      var titles={shipped:'طلبك في الطريق 🚚',completed:'تم تسليم طلبك ✓'};
      var bodies={shipped:'طلب #'+id+' خرج من المستودع',completed:'طلب #'+id+' جاهز للاستلام'};
      try{
        if(targetUid!=='ALL'&&FB.addUserNotification)await FB.addUserNotification(targetUid,{title:titles[status],body:bodies[status],type:'order'});
        else if(FB.addNotification)await FB.addNotification({title:titles[status],body:bodies[status],type:'order'});
      }catch(e){ console.error('ERR:', e.message); }
      await this.loadData();this.renderOrders();this.renderDash();this.cm();this.toast('✓','suc');
    }catch(e){this.toast('فشل','err');}
  },

  sendSupplyOrder:async function(idx){
    var s=this.sups[idx];if(!s)return;
    var supplierProds=(s.products||[]).map(sp=>{var p=this.getProduct(sp.id);return p?{product:p,pp:sp.purchasePrice||0}:null;}).filter(x=>x);
    var items=[];
    document.querySelectorAll('.so-ch').forEach(cb=>{
      if(!cb.checked)return;
      var i=parseInt(cb.dataset.idx);
      var qty=parseInt(document.querySelector('.so-qty[data-idx="'+i+'"]').value)||0;
      if(qty>0&&supplierProds[i])items.push({name:supplierProds[i].product.name,pp:supplierProds[i].pp,qty:qty,price:supplierProds[i].product.price});
    });
    if(!items.length){this.toast('اختر منتجاً','err');return;}
    var totalQty=items.reduce((a,b)=>a+b.qty,0);
    var totalCost=items.reduce((a,b)=>a+(b.pp*b.qty),0);
    var orderId='SUP-'+Date.now().toString().slice(-8);
    this.toast('⏳ جاري الإنشاء...','suc');
    try{
      var oldBal=s.balance||0;var newBal=oldBal+totalCost;
      var hist=(s.history||[]).slice();
      hist.push({type:'order',orderId,amount:totalCost,items,date:new Date().toISOString(),balanceAfter:newBal});
      this.sups[idx]=Object.assign({},s,{balance:newBal,history:hist});
      await FB.setConfig('suppliers',{list:this.sups});
      var blob=await this.genSupplyBlob(s,items,orderId,oldBal,newBal);
      if(!blob){this.toast('فشل','err');return;}
      var msg='السلام عليكم '+s.name+' 🌟\n\n📋 سند توريد من CHIZEN\n━━━━━━━━━━━━━━━\n🆔 '+orderId+'\n📅 '+new Date().toLocaleDateString('ar-EG')+'\n💳 '+(s.paymentType==='credit'?'آجل '+(s.creditDays||30)+' يوم':'نقد')+'\n━━━━━━━━━━━━━━━\n📦 '+items.length+' صنف\n🔢 '+totalQty+' قطعة\n💰 '+totalCost.toLocaleString()+' ر.س\n━━━━━━━━━━━━━━━\n\n📎 السند مرفق — يرجى التأكيد.\n\nشكراً ❤️\nCHIZEN';
      var phone=(s.phone||'').replace(/\D/g,'');
      if(phone.length===9&&!phone.startsWith('967'))phone='967'+phone;
      var isM=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if(isM&&navigator.share&&navigator.canShare){
        var f=new File([blob],'SUP-'+orderId+'.png',{type:'image/png'});
        if(navigator.canShare({files:[f]})){try{await navigator.share({title:'سند توريد',text:msg,files:[f]});this.cm();this.renderSups();this.toast('✓','suc');return;}catch(e){if(e.name==='AbortError')return;}}
      }
      this.dlBlob(blob,'SUP-'+orderId);
      if(phone.length>=8)setTimeout(()=>window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank'),800);
      this.cm();this.renderSups();this.toast('✓ تم — الدين: '+newBal.toLocaleString(),'suc');
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  userDetails:function(uid){

  saveEmployee: async function() {
    var name = document.getElementById('emp-name').value.trim();
    var email = document.getElementById('emp-email').value.trim();
    var password = document.getElementById('emp-password').value.trim();
    var wa = document.getElementById('emp-wa').value.trim();
    var role = document.getElementById('emp-role').value;
    var cat = document.getElementById('emp-cat').value;

    if (!name || !email) return this.toast('أدخل الاسم والبريد', 'err');
    if (!password || password.length < 6) return this.toast('كلمة السر 6+ أحرف', 'err');

    try {
      var cfg = firebase.app().options || firebase.apps[0].options;
      var secApp;
      try { secApp = firebase.app('admin_secondary'); }
      catch(e) { secApp = firebase.initializeApp(cfg, 'admin_secondary'); }

      var cred = await secApp.auth().createUserWithEmailAndPassword(email, password);
      var uid = cred.user.uid;
      try { await cred.user.updateProfile({ displayName: name }); } catch(e){}
      await secApp.auth().signOut();

      await FB.db.collection('users').doc(uid).set({
        name: name,
        email: email,
        whatsapp: wa,
        role: role,
        assignedCategory: role === 'cat_manager' ? cat : null,
        active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: FB.currentUser ? FB.currentUser.uid : ''
      }, { merge: true });

      this.toast('✅ تم الإنشاء. كلمة السر: ' + password, 'suc');
      document.getElementById('emp-name').value = '';
      document.getElementById('emp-email').value = '';
      document.getElementById('emp-password').value = '';
      document.getElementById('emp-wa').value = '';
      this.renderEmployees();
    } catch(e) {
      if (e.code === 'auth/email-already-in-use') return this.toast('البريد مسجل بالفعل', 'err');
      this.toast('فشل: ' + e.message, 'err');
    }

<script>
window.doLogin = async function() {
  var emailInp = document.getElementById('login-email');
  var passInp = document.getElementById('login-pass');
  var errBox = document.getElementById('login-err');
  var btn = document.getElementById('btn-do-login');
  
  var email = (emailInp ? emailInp.value : '').trim();
  var pass = (passInp ? passInp.value : '');
  
  if (!email || !pass) {
    if (errBox) errBox.textContent = '⚠️ أدخل البريد وكلمة السر';
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'جاري الدخول...'; }
  if (errBox) errBox.textContent = '';
  
  try {
    // استخدم persist المحلي لتسجيل الدخول
    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    var cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    console.log('[LOGIN] success:', cred.user.email);
    // onAuthStateChanged سيتولى الباقي (checkAdmin)
  } catch(e) {
    var msg = e.message || 'فشل الدخول';
    if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'البريد أو كلمة السر غير صحيحة';
    else if (e.code === 'auth/user-not-found') msg = 'لا يوجد حساب بهذا البريد';
    else if (e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، حاول لاحقاً';

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ptr = document.getElementById('custom-ptr');
    const header = document.querySelector('.hd');
    let startY = 0;
    let isPulling = false;

    if (!header) {
        console.warn('Header .hd not found, PTR disabled.');
        return;
    }

    // تفعيل السحب فقط من الشريط العلوي
    header.addEventListener('touchstart', function(e) {
        startY = e.touches[0].pageY;
        isPulling = true;
    }, { passive: true });

    header.addEventListener('touchmove', function(e) {
        if (!isPulling) return;
        let currentY = e.touches[0].pageY;
        let deltaY = currentY - startY;

        if (deltaY > 70) {
            ptr.style.top = '15px'; // يظهر المؤشر عند السحب لأسفل
        } else if (deltaY < 20) {
            ptr.style.top = '-80px'; // يختفي عند الرفع
        }
    }, { passive: true });

    header.addEventListener('touchend', function(e) {
        if (!isPulling) return;
        isPulling = false;

        if (ptr.style.top === '15px') {
            ptr.style.top = '-80px';

<script>
// ═══ Pull to Refresh for Admin ═══
(function() {
  let startY = 0, currentY = 0, pulling = false;
  const ptr = document.getElementById('admin-ptr');
  const ct = document.getElementById('ct') || window; // الحاوية الرئيسية للتمرير
  
  function getScrollTop() {
    if (ct === window) return document.body.scrollTop || document.documentElement.scrollTop;
    return ct.scrollTop;
  }

  function onStart(e) {
    if (getScrollTop() > 0) return; // فقط إذا كنا في الأعلى
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    pulling = true;
  }

  function onMove(e) {
    if (!pulling) return;
    currentY = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = currentY - startY;
    
    if (diff > 50) {
      ptr.classList.add('active');
      ptr.querySelector('svg').style.transform = 'rotate(' + (diff * 2) + 'deg)';
    }
  }

  function onEnd() {
    if (!pulling) return;
    pulling = false;
    const diff = currentY - startY;
    
    if (diff > 80) {
      // تفعيل التحديث
      ptr.classList.add('loading');
      ptr.querySelector('svg').style.transform = 'rotate(0)';
      
      // استدعاء دالة التحديث (إعادة تحميل البيانات)
      if (window.A && A.currentTab) {
        const t = A.currentTab;
        if (t === 'banners' && A.loadBanners) A.loadBanners();
        else if (t === 'dash' && A.renderDash) A.renderDash();
        else if (t === 'products' && A.renderProducts) A.renderProducts();
        else if (t === 'orders' && A.renderOrders) A.renderOrders();
        else if (A.tab) A.tab(t, document.querySelector('.tb.active'));
      } else {
        location.reload();
      }

      // إخفاء بعد ثانية
      setTimeout(() => {
        ptr.classList.remove('active');
        ptr.classList.remove('loading');
        startY = 0; currentY = 0;
      }, 1000);
    } else {
      ptr.classList.remove('active');
      ptr.querySelector('svg').style.transform = 'rotate(0)';
    }
  }

  document.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd);
})();
</script>

      var area = window.__pickupAdminData[tab][areaIdx];
      if (!area) return;
      
      // إذا لم تُدخل إحداثيات - استخدم إحداثيات المنطقة
      if (!lat || !lng) {
        lat = area.lat + (Math.random() - 0.5) * 0.001;
        lng = area.lng + (Math.random() - 0.5) * 0.001;
      }
      
      area.points = area.points || [];
      area.points.push({ name: name, icon: icon, lat: lat, lng: lng });
      
      await this.savePickupAreas();
    };
    
    A.deletePickupPoint = async function(areaIdx, ptIdx) {
      var tab = this.currentPickupTab || 'aden';
      var area = window.__pickupAdminData[tab][areaIdx];
      if (!area || !area.points) return;
      area.points.splice(ptIdx, 1);
      await this.savePickupAreas();
    };
    
    A.savePickupAreas = async function() {
      try {
        var statusEl = document.getElementById('pickup-save-status');
        if (statusEl) statusEl.innerHTML = '⏳ جاري الحفظ...';
        
        await FB.db.collection('config').doc('pickup_areas').set({
          aden: window.__pickupAdminData.aden || [],
          yemen: window.__pickupAdminData.yemen || [],
          updatedAt: new Date()
        });
        
        this.toast('✅ تم الحفظ', 'suc');
        this.renderPickupContent();
        
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#10b981;">✅ آخر حفظ: ' + new Date().toLocaleTimeString('ar') + '</span>';
        }
      } catch(e) {
        this.toast('فشل الحفظ: ' + e.message, 'err');
      }
    };
    
    console.log('[PICKUP-ADMIN] installed');
  }
  
  waitForA();
})();
</script>

<script id="chz-simple-logout">
(function(){
  console.log('[SIMPLE-LOGOUT] installing...');
  
  window.__simpleLogout = function() {
    if (!confirm('تسجيل الخروج من حسابك؟')) return;
    try { if (window.FB && FB.logout) FB.logout(); } catch(e) {}
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    setTimeout(function() {
      window.location.replace(window.location.pathname + '?logout=' + Date.now());
    }, 300);
  };
  
  // استبدال أزرار logout في لوحة القسم
  function patchCatMgrLogout() {
    var app = document.getElementById('cat-mgr-app');
    if (!app) return;
    var buttons = app.querySelectorAll('[onclick*="A.logout"], [onclick*="APP.logout"], [onclick*="logout"]');
    buttons.forEach(function(btn) {
      var oc = btn.getAttribute('onclick') || '';
      if (oc.indexOf('__simpleLogout') > -1) return;
      btn.setAttribute('onclick', 'window.__simpleLogout()');
      console.log('[SIMPLE-LOGOUT] patched:', (btn.textContent || '').trim().substring(0, 20));
    });
  }
  
  // تشغيل عند تغيير body (لا Observer على #cat-mgr-app لأنه يُنشأ ديناميكياً)
  setTimeout(patchCatMgrLogout, 1000);
  setTimeout(patchCatMgrLogout, 3000);
  setInterval(patchCatMgrLogout, 2000);
  
  console.log('[SIMPLE-LOGOUT] ready');
})();
</script>

      try {
        var msg = document.getElementById('settings-save-msg');

        var g = function(id) { var el = document.getElementById(id); return el ? el.value : ''; };
        var gc = function(id) { var el = document.getElementById(id); return el ? el.checked : false; };
        
        var settings = {
          // 1) التواصل
          phone: g('s-phone').trim(),
          whatsapp: g('s-wa').trim(),
          email: g('s-email').trim(),
          address: g('s-address').trim(),
          workingHours: g('s-hours').trim(),
          
          // 2) الشحن
          shippingFee: parseFloat(g('s-shipfee')) || 0,
          freeShippingAbove: parseFloat(g('s-free')) || 0,
          deliveryTime: g('s-delivery-time').trim(),
          shippingEnabled: gc('s-ship-enabled'),
          
          // 3) العملة والنقاط
          currency: g('s-currency'),
          pointValue: parseFloat(g('s-points-value')) || 0.1,
          dailyBonus: parseInt(g('s-daily-bonus')) || 1,
          referralBonus: parseInt(g('s-referral-bonus')) || 10,
          minOrder: parseFloat(g('s-min-order')) || 0,
          minPointsRedeem: parseInt(g('s-min-points-redeem')) || 100,
          
          // 4) الخدمات
          servFlight: gc('s-serv-flight'),
          servHotel: gc('s-serv-hotel'),
          servBus: gc('s-serv-bus'),
          servHajj: gc('s-serv-hajj'),
          servShop: gc('s-serv-shop'),
          maintenance: gc('s-maintenance'),
          
          // 5) الهوية
          appName: g('s-app-name').trim() || 'CHIZEN',
          tagline: g('s-app-tagline').trim(),
          logoUrl: g('s-logo-url').trim(),
          welcomeMessage: g('s-slogan').trim(),
          defaultTheme: g('s-default-theme'),
          
          // 6) الإشعارات
          pushEnabled: gc('s-push-enabled'),
          waOrders: gc('s-wa-orders'),
          notifyNewOrder: gc('s-notify-new-order'),
          notifyPayment: gc('s-notify-payment'),
          notifyDelivery: gc('s-notify-delivery'),
          welcomeTitle: g('s-welcome-title').trim(),
          welcomeBody: g('s-welcome-body').trim(),
          
          // 7) الكوبونات
          couponsEnabled: gc('s-coupons-enabled'),
          welcomeCoupon: parseFloat(g('s-welcome-coupon')) || 15,
          minCouponOrder: parseFloat(g('s-min-coupon')) || 0,
          firstOrderCoupon: gc('s-first-order-coupon'),
          
          // 8) الأمان
          pinEnabled: gc('s-pin-enabled'),
          biometricEnabled: gc('s-biometric'),
          sessionTimeout: parseInt(g('s-session-timeout')) || 30,
          loginRequired: gc('s-login-required'),
          
          // 9) متقدم
          defaultDriver: g('s-default-driver').trim(),
          defaultDriverPhone: g('s-default-driver-phone').trim(),
          supportMessage: g('s-support-msg').trim(),
          appVersion: g('s-version').trim() || '1.0.0',
          
          // metadata
          updatedAt: new Date(),
          updatedBy: FB.currentUser ? FB.currentUser.uid : ''
        };
        
        await FB.db.collection('config').doc('settings').set(settings, { merge: true });
        
        // حدّث الـ cache
        this.settingsCache = settings;
        
        if (msg) msg.innerHTML = '<span style="color:#10b981;font-weight:900;">✅ تم الحفظ بنجاح - ' + new Date().toLocaleTimeString('ar') + '</span>';
        this.toast('✅ حُفظت كل الإعدادات', 'suc');
        
        console.log('[SETTINGS] saved:', Object.keys(settings).length, 'fields');

        this.toast('فشل: ' + e.message, 'err');
      }
    };

    console.log('[SETTINGS-COMPLETE] installed');
  }

  waitForA();
})();
</script>

<script id="dispatch-v2">
(function(){
  'use strict';
  console.log('[DISPATCH-V2] loading...');

  function waitForA() {
    if (!window.A) { setTimeout(waitForA, 200); return; }
    if (A.__dispatchV2Installed) return;
    A.__dispatchV2Installed = true;

    // ═══ الحالة ═══
    A.dispatch = {
      filter: 'ready',
      search: '',
      orders: [],
      listener: null,
      initialized: false,
      knownOrderIds: new Set(),
      lastDriver: (function() {
        try { return JSON.parse(localStorage.getItem('chizen_last_driver') || '{}'); } catch(e) { return {}; }
      })()
    };

    // ═══ تصنيف الطلب ═══
    function categorize(o) {
      var p = o.payment || {};
      var w = o.workflowStatus || '';
      if (o.sentToCustomer === true || w === 'sent_to_customer' || o.status === 'shipped') return 'shipping';
      if (w === 'delivered' || o.status === 'completed') return 'delivered';
      if (w === 'ready_to_send') return 'ready';
      if (p.status === 'verified' && o.allCategoriesConfirmed === true) return 'ready';
      if (p.status === 'verified' && o.allCategoriesConfirmed !== true) return 'awaiting_categories';
      if (p.status === 'rejected') return 'rejected';
      return 'awaiting_payment';
    }

    // ═══ وقت منذ ═══
    function timeAgo(o) {
      if (!o.createdAt) return '';
      var ts = o.createdAt.seconds ? o.createdAt.seconds * 1000 : (o.createdAt.toMillis ? o.createdAt.toMillis() : 0);
      if (!ts) return '';
      var diff = Math.floor((Date.now() - ts) / 60000);
      if (diff < 1) return 'الآن';
      if (diff < 60) return 'منذ ' + diff + ' د';
      if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
      if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
      return new Date(ts).toLocaleDateString('ar');
    }

    // ═══ إشعار صوتي ═══
    function playNotifySound() {
      try {
        // أنشئ نغمة بسيطة بـ Web Audio API
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // ═══ إشعار المتصفح ═══
    function browserNotify(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        try { new Notification(title, { body: body, icon: '/favicon.ico' }); } catch(e) {}
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission();
      }
    }

    A.renderDispatcher = function() {
      var ct = document.getElementById('ct');
      if (!ct) return;

      if (!document.getElementById('sc-dispatcher')) {
        var sc = document.createElement('div');
        sc.className = 'sc';
        sc.id = 'sc-dispatcher';
        ct.appendChild(sc);
      }

      document.querySelectorAll('.sc').forEach(function(x) { x.classList.remove('active'); });
      var sc = document.getElementById('sc-dispatcher');
      sc.classList.add('active');

      // Header
      var html = '<div style="padding:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
          '<div style="font-size:20px;font-weight:900;color:#a855f7;">🚚 إدارة التوصيل</div>' +
          '<button onclick="A.refreshDispatch()" style="padding:8px 14px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.4);color:#a855f7;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;">🔄 تحديث</button>' +
        '</div>' +
        buildHeader.call(this) +
        '<div id="disp-list">' + skeleton() + '</div>' +
      '</div>';

      sc.innerHTML = html;

      // ارسم القائمة
      this.renderDispatchList();
    };

    // ═══ رسم القائمة ═══
    A.renderDispatchList = function() {
      var list = document.getElementById('disp-list');
      if (!list) return;

      var D = this.dispatch;
      var orders = D.orders.filter(function(o) { return categorize(o) === D.filter; });

      // بحث
      if (D.search) {
        var q = D.search.toLowerCase();
        orders = orders.filter(function(o) {
          return (o.id || '').toLowerCase().indexOf(q) > -1 ||
                 (o.name || '').toLowerCase().indexOf(q) > -1 ||
                 (o.phone || '').toLowerCase().indexOf(q) > -1 ||
                 (o.pickup || '').toLowerCase().indexOf(q) > -1;
        });
      }

      // ترتيب
      orders.sort(function(a, b) {
        var ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
        var tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
        return tb - ta;
      });

      if (orders.length === 0) {
        var emptyMsg = D.search 
          ? 'لا توجد نتائج للبحث "' + D.search + '"'
          : 'لا توجد طلبات في هذا التصنيف';
        var emptyIcon = D.search ? '🔍' : '📭';
        list.innerHTML = '<div style="text-align:center;padding:60px 20px;background:rgba(255,255,255,0.02);border-radius:16px;">' +
          '<div style="font-size:64px;margin-bottom:16px;">' + emptyIcon + '</div>' +
          '<div style="font-size:14px;color:#888;">' + emptyMsg + '</div>' +
        '</div>';
        return;
      }

      var self = this;
      list.innerHTML = orders.map(function(o) { return buildOrderCard.call(self, o); }).join('');

      // بعد الرسم - حدّث known IDs
      orders.forEach(function(o) { D.knownOrderIds.add(o.id); });
    };

    // ═══ بحث ═══
    A.setDispatchSearch = function(q) {
      this.dispatch.search = q || '';
      clearTimeout(this.dispatch._searchTimer);
      var self = this;
      this.dispatch._searchTimer = setTimeout(function() {
        self.renderDispatchList();
      }, 200);
    };

    // ═══ فلترة ═══
    A.setDispatchFilter = function(f) {
      this.dispatch.filter = f;
      this.renderDispatcher();
    };

    // ═══ تحديث يدوي ═══
    A.refreshDispatch = async function() {
      this.toast('جاري التحديث...');

        await this.loadData();
        this.dispatch.orders = this.orders || [];
        this.renderDispatcher();
        this.toast('✅ محدّث', 'suc');

        this.toast('فشل', 'err');

    };

          '<div style="font-size:10px;color:#888;margin-bottom:2px;">📍 العنوان</div>' +
          '<div style="font-size:12px;color:#fff;">' + (order.pickup || '—') + '</div>' +
        '</div>' +
        
        '<div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:10px;margin-bottom:14px;">' +
          '<div style="font-size:10px;color:#888;margin-bottom:6px;">📦 الأقسام</div>' +
          (catKeys.length > 0 ? catKeys.map(function(k) {
            var c = cats[k];
            var status = c.status === 'confirmed' ? '✅' : (c.status === 'rejected' ? '❌' : '⏳');
            return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px;"><span style="color:#b8c0d8;">' + status + ' ' + (catNames[k] || k) + '</span><span style="color:#888;">' + (c.items || []).length + ' منتج</span></div>';

        '</div>' +
        
        (di.driverName ? 
          '<div style="background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.3);border-radius:10px;padding:10px;margin-bottom:14px;">' +
            '<div style="font-size:10px;color:#a855f7;margin-bottom:4px;">🚚 السائق</div>' +
            '<div style="font-size:12px;color:#fff;">' + di.driverName + ' • <span style="direction:ltr;display:inline-block;">' + (di.driverPhone || '') + '</span></div>' +
          '</div>' : '') +
        
        '<div style="background:linear-gradient(135deg,rgba(236,72,153,0.1),rgba(168,85,247,0.05));border:1px solid rgba(236,72,153,0.3);border-radius:12px;padding:14px;text-align:center;">' +
          '<div style="font-size:11px;color:#888;margin-bottom:4px;">الإجمالي</div>' +
          '<div style="font-size:22px;font-weight:900;color:#ff4d94;">' + (order.total || 0) + ' ر.س</div>' +
        '</div>';
      
      var actions = '<button class="btn bg2" onclick="A.cm()">إغلاق</button>';
      if (order.phone) {
        actions += '<a href="https://wa.me/' + order.phone.replace(/\D/g, '') + '" target="_blank" class="btn bg2" style="background:#25D366;color:#fff;">💬 واتساب</a>';
      }
      
      this.modal('📋 تفاصيل الطلب', body, actions);
    };

    // ═══ فتح تعيين السائق (محسّن) ═══
    A.openAssignDriver = function(orderId) {
      var order = this.dispatch.orders.find(function(o) { return o.id === orderId; });
      if (!order) return this.toast('الطلب غير موجود', 'err');
      
      var D = this.dispatch;
      var last = D.lastDriver || {};
      
      var body = 
        '<div style="background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.3);border-radius:10px;padding:12px;margin-bottom:14px;">' +
          '<div style="font-size:12px;color:#a855f7;font-weight:900;">📦 #' + orderId.substring(0, 10) + '</div>' +
          '<div style="font-size:11px;color:#fff;margin-top:4px;">' + (order.name || '—') + ' • ' + (order.phone || '—') + '</div>' +
          '<div style="font-size:11px;color:#888;margin-top:2px;">📍 ' + (order.pickup || '—') + '</div>' +
        '</div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">اسم السائق *</label>' +
          '<input class="fi" id="disp-driver-name" value="' + (last.name || '') + '" placeholder="مثال: أحمد علي" style="width:100%;"></div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">رقم واتساب *</label>' +
          '<input class="fi" id="disp-driver-phone" type="tel" value="' + (last.phone || '') + '" placeholder="967771234567" style="width:100%;direction:ltr;"></div>' +
        
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">' +
          '<div><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">المنطقة</label><input class="fi" id="disp-region" placeholder="صنعاء" style="width:100%;"></div>' +
          '<div><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">رسوم التوصيل</label><input class="fi" id="disp-fee" type="number" value="0" placeholder="0" style="width:100%;"></div>' +
        '</div>' +
        
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;">ملاحظة للسائق</label>' +
          '<textarea class="fi" id="disp-note" placeholder="اتصل قبل الوصول..." style="width:100%;height:60px;resize:none;"></textarea></div>';
      
      var actions = '<button class="btn bg2" onclick="A.cm()">إلغاء</button>' +
        '<button class="btn bp" onclick="A.assignDriverAndSend(\'' + orderId + '\')">📤 إرسال واتساب</button>';
      
      this.modal('🚚 تعيين سائق', body, actions);
    };

    // ═══ تنفيذ الإرسال ═══
    A.assignDriverAndSend = async function(orderId) {
      var driverName = (document.getElementById('disp-driver-name').value || '').trim();
      var driverPhone = (document.getElementById('disp-driver-phone').value || '').trim();
      var region = (document.getElementById('disp-region').value || '').trim();
      var fee = parseFloat(document.getElementById('disp-fee').value) || 0;
      var note = (document.getElementById('disp-note').value || '').trim();
      
      if (!driverName) return this.toast('أدخل اسم السائق', 'err');
      if (!driverPhone) return this.toast('أدخل رقم السائق', 'err');
      
      var cleanPhone = driverPhone.replace(/\D/g, '');
      if (cleanPhone.length === 9 && cleanPhone.startsWith('7')) cleanPhone = '967' + cleanPhone;
      if (cleanPhone.length === 10 && cleanPhone.startsWith('0')) cleanPhone = '967' + cleanPhone.slice(1);
      
      try {
        var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
        if (snap.empty) return this.toast('الطلب غير موجود', 'err');
        
        var order = snap.docs[0].data();
        await snap.docs[0].ref.update({
          sentToCustomer: true,
          workflowStatus: 'sent_to_customer',
          status: 'shipped',
          deliveryInfo: {
            driverName: driverName,
            driverPhone: cleanPhone,
            region: region,
            deliveryFee: fee,
            note: note,
            assignedAt: new Date(),
            assignedBy: FB.currentUser ? FB.currentUser.uid : ''
          }
        });
        
        // احفظ آخر سائق
        localStorage.setItem('chizen_last_driver', JSON.stringify({ name: driverName, phone: cleanPhone }));
        this.dispatch.lastDriver = { name: driverName, phone: cleanPhone };
        
        // رسالة WhatsApp
        var items = order.items || [];
        var itemsList = items.map(function(it) { return '• ' + (it.name || 'منتج') + ' × ' + (it.qty || 1); }).join('\n');
        
        var waMsg = '🚚 *طلب توصيل جديد*' + '\n\n' +
          '*رقم الطلب:* #' + orderId.substring(0, 10) + '\n' +
          '*العميل:* ' + (order.name || '') + '\n' +
          '*الهاتف:* ' + (order.phone || '') + '\n' +
          '*العنوان:* ' + (order.pickup || '') + '\n\n' +
          '📦 *المنتجات:*\n' + itemsList + '\n\n' +
          '💰 *المجموع:* ' + (order.total || 0) + ' ر.س';
        if (fee > 0) waMsg += '\n🚗 *رسوم التوصيل:* ' + fee + ' ر.س';
        waMsg += '\n💵 *المستلم:* ' + ((order.total || 0) + fee) + ' ر.س';
        if (note) waMsg += '\n\n📝 *ملاحظة:* ' + note;
        waMsg += '\n\nشكراً 🌟';
        
        // إشعار للعميل
        if (order.customerId && FB.addUserNotification) {
          await FB.addUserNotification(order.customerId, {
            title: '🚚 طلبك في الطريق!',
            body: 'السائق ' + driverName + ' سيصل قريباً',
            type: 'order'
          });
        }
        
        this.cm();
        this.toast('✅ تم الإرسال', 'suc');
        window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(waMsg), '_blank');
        await this.loadData();
        this.dispatch.orders = this.orders || [];
        this.renderDispatcher();
      } catch(e) {
        this.toast('فشل: ' + e.message, 'err');
      }
    };

    // ═══ تأكيد الدفع ═══
    A.verifyPayment = async function(orderId) {
      var self = this;
      this.confirm('تأكيد الدفع؟', 'سيبدأ تجهيز الطلب', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            'payment.status': 'verified',
            'payment.verifiedBy': FB.currentUser ? FB.currentUser.uid : '',
            'payment.verifiedAt': new Date(),
            workflowStatus: 'awaiting_categories'
          });
          var order = snap.docs[0].data();
          if (order.customerId && FB.addUserNotification) {
            await FB.addUserNotification(order.customerId, {
              title: '✅ تم تأكيد الدفع',
              body: 'طلبك جاري تجهيزه الآن',
              type: 'order'
            });
          }
          self.toast('✅ تم', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      }, 'primary');
    };

    // ═══ رفض الدفع ═══
    A.rejectPayment = function(orderId) {
      var self = this;
      this.confirm('رفض الدفع؟', 'سيتم إعلام العميل', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            'payment.status': 'rejected',
            'payment.verifiedBy': FB.currentUser ? FB.currentUser.uid : '',
            'payment.verifiedAt': new Date(),
            workflowStatus: 'payment_rejected'
          });
          self.toast('تم الرفض', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      });
    };

    // ═══ تم التسليم ═══
    A.markDelivered = async function(orderId) {
      var self = this;
      this.confirm('تم التسليم؟', 'سيتم إغلاق الطلب', async function() {
        try {
          var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
          if (snap.empty) return;
          await snap.docs[0].ref.update({
            workflowStatus: 'delivered',
            status: 'completed',
            deliveredAt: new Date()
          });
          self.toast('✅ تم', 'suc');
          await self.loadData();
          self.dispatch.orders = self.orders || [];
          self.renderDispatcher();
        } catch(e) { self.toast('فشل', 'err'); }
      }, 'primary');
    };

    // ═══ onSnapshot للتحديث الفوري ═══
    function setupListener() {
      if (!window.FB || !FB.db) { setTimeout(setupListener, 500); return; }
      if (A.dispatch.listener) return;
      
      try {
        A.dispatch.listener = FB.db.collection('orders')
          .orderBy('createdAt', 'desc')
          .limit(100)
          .onSnapshot(function(snap) {
            var newOrders = [];
            var hasNew = false;
            snap.forEach(function(doc) {
              var d = doc.data();
              d.id = d.id || doc.id;
              newOrders.push(d);
              if (!A.dispatch.knownOrderIds.has(d.id)) {
                hasNew = true;
              }
            });
            
            A.dispatch.orders = newOrders;
            if (window.A && A.orders) {
              A.orders = newOrders;
            }
            
            // إذا كانت اللوحة مفتوحة — أعد الرسم
            var disp = document.getElementById('sc-dispatcher');
            if (disp && disp.classList.contains('active')) {
              A.renderDispatcher();
            }
            
            // إذا وصل طلب جديد أثناء التصفح
            if (hasNew && A.dispatch.knownOrderIds.size > 0) {
              playNotifySound();
              var readyCount = newOrders.filter(function(o) { return categorize(o) === 'ready'; }).length;
              if (readyCount > 0) {
                browserNotify('🔔 طلبات جديدة', 'لديك ' + readyCount + ' طلب جاهز للإرسال');
              }
            }
            
            // حدّث known
            newOrders.forEach(function(o) { A.dispatch.knownOrderIds.add(o.id); });
          }, function(err) {
            console.warn('[DISPATCH-V2] listener error:', err.message);
          });
          
        console.log('[DISPATCH-V2] listener active');
      } catch(e) {
        console.warn('[DISPATCH-V2] setup error:', e.message);
      }
    }

    // ═══ التهيئة ═══
    function init() {
      A.dispatch.orders = A.orders || [];
      setupListener();
    }

    // ربط A.tab('dispatcher')
    if (A.tab) {
      var origTab = A.tab;
      A.tab = function(tab, el) {
        origTab.call(this, tab, el);
        if (tab === 'dispatcher') {
          // تأكد من تحميل البيانات
          if (!A.dispatch.initialized) {
            A.dispatch.initialized = true;
            A.dispatch.orders = A.orders || [];
            init();
          }
          setTimeout(function() { A.renderDispatcher(); }, 100);
        }
      };
    }

    console.log('[DISPATCH-V2] installed');
  }

  waitForA();
})();
</script>

<script id="chz-dedicated-delivery-v2">
(function(){
  'use strict';
  console.log('[DELIVERY-V2] loading...');

  window.CD = {
    tab: 'ready',
    orders: [],
    search: '',
    listener: null,
    knownIds: new Set(),
    initialized: false,
    audioCtx: null,
    lastDriver: (function() {
      try { return JSON.parse(localStorage.getItem('chizen_last_driver') || '{}'); } catch(e) { return {}; }
    })()
  };

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function categorize(o) {
    var p = o.payment || {};
    var w = o.workflowStatus || '';
    if (o.sentToCustomer === true || w === 'sent_to_customer' || o.status === 'shipped') return 'shipping';
    if (w === 'delivered' || o.status === 'completed') return 'delivered';
    if (w === 'ready_to_send') return 'ready';
    if (p.status === 'verified' && o.allCategoriesConfirmed === true) return 'ready';
    return 'not_ready';
  }

  function getTs(o) {
    if (!o.createdAt) return 0;
    return o.createdAt.seconds ? o.createdAt.seconds * 1000 : 0;
  }

  function timeAgo(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 1) return 'الآن';
    if (diff < 60) return 'منذ ' + diff + ' د';
    if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
    if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
    return new Date(ts).toLocaleDateString('ar');
  }

  function isLate(o) {
    var ts = getTs(o);
    if (!ts) return false;
    var diff = (Date.now() - ts) / 60000;
    return diff > 120; // أكثر من ساعتين
  }

  function lateDuration(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    var hours = Math.floor(diff / 60);
    var mins = diff % 60;
    return hours + 'س ' + mins + 'د';
  }

  // ═══ صوت الإشعار ═══
  function playNotifySound() {
    try {
      if (!window.CD.audioCtx) {
        window.CD.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      var ctx = window.CD.audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      
      var now = ctx.currentTime;
      // نغمة مزدوجة
      [0, 0.15].forEach(function(offset) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = offset === 0 ? 880 : 1100;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, now + offset);
        gain.gain.linearRampToValueAtTime(0.2, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.3);
        osc.start(now + offset);
        osc.stop(now + offset + 0.3);
      });
    } catch(e) { console.warn('[DELIVERY] sound error:', e.message); }
  }

  // ═══ إشعار المتصفح ═══
  function browserNotify(title, body) {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      try { new Notification(title, { body: body, icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>', tag: 'delivery-new' }); } catch(e) {}
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission();
    }
  }

  // ═══ CSS متعدد الأوضاع ═══

      '--dlv-bg:#07091d;--dlv-header-bg:rgba(10,8,30,0.95);--dlv-card-bg:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));' +
      '--dlv-card-border:rgba(16,185,129,0.25);--dlv-text:#fff;--dlv-text-sub:#b8c0d8;--dlv-text-muted:#6b7591;' +
      '--dlv-nav-bg:rgba(10,8,30,0.98);--dlv-input-bg:rgba(15,10,35,0.9);--dlv-input-border:rgba(168,85,247,0.4);' +
      '--dlv-divider:rgba(168,85,247,0.25);--dlv-late:#ef4444;' +

    // Card

  // ═══ بناء الهيكل ═══
  function buildShell() {
    return '' +
      '<header class="dlv-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +

          '<button class="dlv-theme-btn" onclick="window.__dlvToggleTheme()" id="dlv-theme-icon">🌙</button>' +
          '<button onclick="window.__dlvLogout()" style="background:rgba(239,68,68,0.15);border:1.5px solid #ef4444;color:#ef4444;padding:8px 12px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;">🚪 خروج</button>' +

      '<main class="dlv-main" id="dlv-main"></main>' +

        '<button class="dlv-nav-btn active" data-tab="ready" onclick="window.__dlvSwitchTab(\'ready\',this)">' +
          '<span class="icon">✅</span><span class="label">جاهزة</span>' +
          '<span class="count" id="dlv-count-ready" style="display:none;">0</span>' +
        '</button>' +
        '<button class="dlv-nav-btn" data-tab="shipping" onclick="window.__dlvSwitchTab(\'shipping\',this)">' +
          '<span class="icon">🚚</span><span class="label">توصيل</span>' +
          '<span class="count" id="dlv-count-shipping" style="display:none;">0</span>' +
        '</button>' +
        '<button class="dlv-nav-btn" data-tab="delivered" onclick="window.__dlvSwitchTab(\'delivered\',this)">' +
          '<span class="icon">📦</span><span class="label">تم التسليم</span>' +

  // ═══ إحصائيات اليوم ═══
  function buildStats() {
    var today = new Date(); today.setHours(0,0,0,0);
    var todayTs = today.getTime();
    var todayOrders = window.CD.orders.filter(function(o) {
      return getTs(o) >= todayTs;
    });
    var todayRevenue = 0;
    var todayDelivered = 0;
    todayOrders.forEach(function(o) {
      var p = o.payment || {};
      if (p.status === 'verified') {
        todayRevenue += parseFloat(o.total) || 0;
      }
      if (o.status === 'completed' || (o.workflowStatus === 'delivered')) {
        todayDelivered++;
      }
    });
    
    return '<div class="dlv-stats">' +
      '<div class="dlv-stat" style="border-color:rgba(59,130,246,0.4);">' +
        '<div class="dlv-stat-icon">📦</div>' +
        '<div class="dlv-stat-label">طلبات اليوم</div>' +
        '<div class="dlv-stat-value" style="color:#3b82f6;">' + todayOrders.length + '</div>' +
      '</div>' +
      '<div class="dlv-stat" style="border-color:rgba(236,72,153,0.4);">' +
        '<div class="dlv-stat-icon">💰</div>' +
        '<div class="dlv-stat-label">إيرادات اليوم</div>' +
        '<div class="dlv-stat-value" style="color:#ec4899;">' + todayRevenue.toFixed(0) + '</div>' +
      '</div>' +
      '<div class="dlv-stat" style="border-color:rgba(16,185,129,0.4);">' +
        '<div class="dlv-stat-icon">✅</div>' +
        '<div class="dlv-stat-label">تم التسليم</div>' +
        '<div class="dlv-stat-value" style="color:#10b981;">' + todayDelivered + '</div>' +
      '</div>' +
    '</div>';
  }

  // ═══ رسم المحتوى ═══
  function renderContent() {
    var D = window.CD;
    var main = document.getElementById('dlv-main');
    if (!main) return;
    
    // فلترة حسب التبويب
    var filtered = D.orders.filter(function(o) { return categorize(o) === D.tab; });
    
    // بحث
    if (D.search) {
      var q = D.search.toLowerCase().trim();
      filtered = filtered.filter(function(o) {
        return (o.id || '').toLowerCase().indexOf(q) > -1 ||
               (o.name || '').toLowerCase().indexOf(q) > -1 ||
               (o.phone || '').toLowerCase().indexOf(q) > -1 ||
               (o.pickup || '').toLowerCase().indexOf(q) > -1;
      });
    }
    
    // ترتيب: الطلبات المتأخرة أولاً ثم الأحدث
    filtered.sort(function(a, b) {
      var la = isLate(a), lb = isLate(b);
      if (la && !lb) return -1;
      if (!la && lb) return 1;
      return getTs(b) - getTs(a);
    });

    // عدادات
    var counts = { ready: 0, shipping: 0, delivered: 0 };
    D.orders.forEach(function(o) {
      var cat = categorize(o);
      if (counts[cat] !== undefined) counts[cat]++;
    });
    ['ready', 'shipping', 'delivered'].forEach(function(k) {
      var badge = document.getElementById('dlv-count-' + k);
      if (badge) {
        badge.textContent = counts[k];
        badge.style.display = counts[k] > 0 ? 'inline-block' : 'none';
      }
    });

    // بناء HTML
    var html = buildStats();
    
    // بحث
    html += '<div class="dlv-search-wrap">' +
      '<input type="text" class="dlv-search" placeholder="🔍 ابحث برقم / اسم / هاتف / عنوان..." value="' + esc(D.search) + '" oninput="window.__dlvSearch(this.value)">' +
      '<span class="dlv-search-icon">🔍</span>' +
    '</div>';
    
    // قائمة
    if (filtered.length === 0) {
      var emptyMsg = D.search 
        ? 'لا نتائج للبحث "' + esc(D.search) + '"'
        : (D.tab === 'ready' ? '🎉 لا طلبات جاهزة حالياً' :
           D.tab === 'shipping' ? '🚚 لا توجد توصيلات نشطة' :
           '📦 لا توجد طلبات مسلّمة');
      html += '<div class="dlv-empty">' +
        '<div style="font-size:72px;margin-bottom:16px;">' + (D.search ? '🔍' : '📭') + '</div>' +
        '<div style="font-size:15px;font-weight:800;color:var(--dlv-text);">' + emptyMsg + '</div>' +
      '</div>';
    } else {
      html += filtered.map(function(o) { return buildCard(o); }).join('');
    }
    
    main.innerHTML = html;
  }

  // ═══ بطاقة طلب ═══
  function buildCard(o) {
    var oid = o.id || '';
    var di = o.deliveryInfo || {};
    var date = timeAgo(o);
    var late = isLate(o);
    var lateBadge = late 
      ? '<span class="dlv-late-badge">⚠️ متأخر ' + lateDuration(o) + '</span>'
      : '';
    
    var actions = '';
    if (window.CD.tab === 'ready') {
      actions = '<button onclick="event.stopPropagation();window.__dlvOpenAssign(\'' + oid + '\')" style="width:100%;margin-top:10px;padding:12px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(16,185,129,0.3);">🚚 تعيين سائق</button>';
    } else if (window.CD.tab === 'shipping') {
      actions = '<div style="margin-top:10px;padding:10px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.3);border-radius:10px;font-size:11px;">' +
        '<div style="color:#10b981;font-weight:800;margin-bottom:3px;">🚚 ' + esc(di.driverName || '—') + '</div>' +
        '<div style="color:var(--dlv-text-sub);direction:ltr;text-align:right;">' + esc(di.driverPhone || '—') + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:8px;">' +
        '<button onclick="event.stopPropagation();window.__dlvMarkDelivered(\'' + oid + '\')" style="flex:1;padding:10px;background:rgba(16,185,129,0.15);border:1.5px solid #10b981;color:#10b981;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;">✅ تم التسليم</button>' +
        (di.driverPhone ? '<a href="https://wa.me/' + di.driverPhone + '" target="_blank" onclick="event.stopPropagation()" style="padding:10px 14px;background:#25D366;color:#fff;border-radius:10px;font-weight:900;font-size:12px;text-decoration:none;">💬</a>' : '') +
      '</div>';
    }

    return '<div class="dlv-card' + (late ? ' is-late' : '') + '" onclick="window.__dlvOpenDetails(\'' + oid + '\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;">' +
            '<span style="font-weight:900;color:#10b981;font-size:13px;">#' + esc(oid.substring(0, 10)) + '</span>' +
            '<span style="font-size:10px;color:var(--dlv-text-muted);">' + esc(date) + '</span>' +
            lateBadge +
          '</div>' +
          '<div class="dlv-card-name" style="font-size:13px;color:var(--dlv-text);font-weight:700;">' + esc(o.name || 'عميل') + '</div>' +
          '<div style="font-size:11px;color:var(--dlv-text-muted);">📱 ' + esc(o.phone || '—') + '</div>' +
        '</div>' +
        '<div style="text-align:left;">' +
          '<div style="font-weight:900;color:#ff4d94;font-size:15px;">' + (o.total || 0) + '</div>' +
          '<div style="font-size:9px;color:var(--dlv-text-muted);">ر.س</div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--dlv-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;background:var(--dlv-input-bg);border-radius:8px;">📍 ' + esc(o.pickup || 'غير محدد') + '</div>' +
      actions +
    '</div>';
  }

  // ═══ بحث ═══
  window.__dlvSearch = function(q) {
    window.CD.search = q || '';
    clearTimeout(window.__dlvSearchTimer);
    window.__dlvSearchTimer = setTimeout(renderContent, 200);
  };

  // ═══ تبديل التبويبات ═══
  window.__dlvSwitchTab = function(tab, btn) {
    window.CD.tab = tab;
    document.querySelectorAll('.dlv-nav-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderContent();
  };

  // ═══ تبديل الثيم ═══
  window.__dlvToggleTheme = function() {
    var app = document.getElementById('delivery-mgr-app');
    if (!app) return;
    var current = app.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    app.setAttribute('data-theme', next);
    try { localStorage.setItem('chizen_dlv_theme', next); } catch(e) {}
    var icon = document.getElementById('dlv-theme-icon');
    if (icon) icon.textContent = next === 'light' ? '☀️' : '🌙';
  };

  // ═══ تفاصيل الطلب ═══
  window.__dlvOpenDetails = function(orderId) {

        '<div style="display:flex;gap:8px;">' +
          '<button onclick="this.closest(&quot;.dlv-modal&quot;).classList.remove(&quot;active&quot;)" style="flex:1;padding:14px;background:var(--dlv-input-bg);border:none;color:var(--dlv-text);border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;">إلغاء</button>' +
          '<button onclick="window.__dlvAssign(&quot;' + orderId + '&quot;)" style="flex:2;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;border-radius:10px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,0.3);">📤 إرسال واتساب</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    
    var existing = document.querySelector('.dlv-modal');
    if (existing) existing.remove();
    var wrapper = document.createElement('div');
    wrapper.innerHTML = body;
    document.body.appendChild(wrapper.firstElementChild);
  };

  // ═══ تنفيذ الإرسال ═══
  window.__dlvAssign = async function(orderId) {
    var driverName = (document.getElementById('dlv-driver-name').value || '').trim();
    var driverPhone = (document.getElementById('dlv-driver-phone').value || '').trim();
    var region = (document.getElementById('dlv-region').value || '').trim();
    var fee = parseFloat(document.getElementById('dlv-fee').value) || 0;
    var note = (document.getElementById('dlv-note').value || '').trim();
    
    if (!driverName) return alert('أدخل اسم السائق');
    if (!driverPhone) return alert('أدخل رقم السائق');
    
    var cleanPhone = driverPhone.replace(/\D/g, '');
    if (cleanPhone.length === 9 && cleanPhone.startsWith('7')) cleanPhone = '967' + cleanPhone;
    if (cleanPhone.length === 10 && cleanPhone.startsWith('0')) cleanPhone = '967' + cleanPhone.slice(1);
    
    try {
      var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
      if (snap.empty) return alert('الطلب غير موجود');
      
      var order = snap.docs[0].data();
      await snap.docs[0].ref.update({
        sentToCustomer: true,
        workflowStatus: 'sent_to_customer',
        status: 'shipped',
        deliveryInfo: {
          driverName: driverName,
          driverPhone: cleanPhone,
          region: region,
          deliveryFee: fee,
          note: note,
          assignedAt: new Date(),
          assignedBy: FB.currentUser ? FB.currentUser.uid : ''
        }
      });
      
      localStorage.setItem('chizen_last_driver', JSON.stringify({ name: driverName, phone: cleanPhone }));
      window.CD.lastDriver = { name: driverName, phone: cleanPhone };
      
      var items = order.items || [];
      var itemsList = items.map(function(it) { return '• ' + (it.name || 'منتج') + ' × ' + (it.qty || 1); }).join('\n');
      
      var waMsg = '🚚 *طلب توصيل جديد*\n\n' +
        '*رقم الطلب:* #' + orderId.substring(0, 10) + '\n' +
        '*العميل:* ' + (order.name || '') + '\n' +
        '*الهاتف:* ' + (order.phone || '') + '\n' +
        '*العنوان:* ' + (order.pickup || '') + '\n\n' +
        '📦 *المنتجات:*\n' + itemsList + '\n\n' +
        '💰 *المجموع:* ' + (order.total || 0) + ' ر.س';
      if (fee > 0) waMsg += '\n🚗 *رسوم التوصيل:* ' + fee + ' ر.س';
      waMsg += '\n💵 *المستلم:* ' + ((order.total || 0) + fee) + ' ر.س';
      if (note) waMsg += '\n\n📝 *ملاحظة:* ' + note;
      waMsg += '\n\nشكراً 🌟';
      
      if (order.customerId && FB.addUserNotification) {
        try {
          await FB.addUserNotification(order.customerId, {
            title: '🚚 طلبك في الطريق!',
            body: 'السائق ' + driverName + ' سيصل قريباً',
            type: 'order'
          });
        } catch(e) {}
      }
      
      var modal = document.querySelector('.dlv-modal');
      if (modal) modal.remove();
      
      window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(waMsg), '_blank');
    } catch(e) {
      alert('فشل: ' + e.message);
    }
  };

  // ═══ تم التسليم ═══
  window.__dlvMarkDelivered = async function(orderId) {
    if (!confirm('تم التسليم؟')) return;
    try {
      var snap = await FB.db.collection('orders').where('id', '==', orderId).get();
      if (snap.empty) return;
      await snap.docs[0].ref.update({
        workflowStatus: 'delivered',
        status: 'completed',
        deliveredAt: new Date()
      });
    } catch(e) { alert('فشل: ' + e.message); }
  };

  // ═══ خروج ═══
  window.__dlvLogout = function() {
    if (!confirm('تسجيل الخروج؟')) return;
    try { firebase.auth().signOut(); } catch(e) {}
    try { localStorage.clear(); } catch(e) {}
    setTimeout(function() { window.location.replace(window.location.pathname + '?logout=' + Date.now()); }, 300);
  };

  // ═══ onSnapshot ═══
  function setupListener() {
    if (!window.FB || !FB.db) { setTimeout(setupListener, 500); return; }
    if (window.CD.listener) return;
    
    try {
      window.CD.listener = FB.db.collection('orders')
        .orderBy('createdAt', 'desc')
        .limit(100)
        .onSnapshot(function(snap) {
          var orders = [];
          var newReadyCount = 0;
          var isFirstLoad = window.CD.knownIds.size === 0;
          
          snap.forEach(function(doc) {
            var d = doc.data();
            d.id = d.id || doc.id;
            orders.push(d);
            
            if (!window.CD.knownIds.has(d.id)) {
              window.CD.knownIds.add(d.id);
              if (!isFirstLoad && categorize(d) === 'ready') {
                newReadyCount++;
              }
            }
          });
          
          window.CD.orders = orders;
          
          // إذا اللوحة مفتوحة
          var app = document.getElementById('delivery-mgr-app');
          if (app && app.classList.contains('active')) {
            renderContent();
          }
          
          // إشعار إذا وصل طلب جديد
          if (newReadyCount > 0) {
            playNotifySound();
            browserNotify('🔔 طلب جديد جاهز', 'لديك ' + newReadyCount + ' طلب جاهز للإرسال');
          }
        }, function(err) {
          console.warn('[DELIVERY-V2] listener error:', err.message);
        });
    } catch(e) {}
  }

  // ═══ التنشيط ═══
  window.activateDeliveryUI = async function() {
    console.log('[DELIVERY-V2] activating...');
    
    var gs = document.getElementById('gs'); if (gs) gs.style.display = 'none';
    var am = document.getElementById('am'); if (am) am.style.display = 'none';
    
    var app = document.getElementById('delivery-mgr-app');
    if (!app) {
      app = document.createElement('div');
      app.id = 'delivery-mgr-app';
      app.className = 'dlv-app active';
      // استرجاع الثيم
      var savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('chizen_dlv_theme') || 'dark'; } catch(e) {}
      app.setAttribute('data-theme', savedTheme);
      app.innerHTML = buildShell();
      document.body.appendChild(app);
      
      // تحديث أيقونة الثيم
      var icon = document.getElementById('dlv-theme-icon');
      if (icon) icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    } else {
      app.classList.add('active');
    }
    
    renderContent();
    setupListener();
    
    // طلب إذن الإشعارات
    if ('Notification' in window && Notification.permission === 'default') {
      setTimeout(function() { Notification.requestPermission(); }, 3000);
    }
  };

  // ═══ Hook applyPermissions ═══
  function hook() {
    if (!window.A || !A.applyPermissions) { setTimeout(hook, 200); return; }
    if (A.__deliveryV2Hooked) return;
    A.__deliveryV2Hooked = true;
    
    var origApply = A.applyPermissions;
    A.applyPermissions = function(role, category) {
      if (role === 'delivery_mgr') {
        window.activateDeliveryUI();
        return;
      }
      if (origApply) return origApply.call(this, role, category);
    };
  }
  hook();

  console.log('[DELIVERY-V2] ready');
})();
</script>
<script id="chz-dedicated-accountant">

  window.CA = {

  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getTs(o) {
    if (!o.createdAt) return 0;
    return o.createdAt.seconds ? o.createdAt.seconds * 1000 : (o.createdAt.toMillis ? o.createdAt.toMillis() : 0);
  }

  function timeAgo(o) {
    var ts = getTs(o);
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 60) return 'منذ ' + diff + ' د';
    if (diff < 1440) return 'منذ ' + Math.floor(diff/60) + ' س';
    if (diff < 10080) return 'منذ ' + Math.floor(diff/1440) + ' ي';
    return new Date(ts).toLocaleDateString('ar');
  }

  function getPeriodStart() {
    var now = new Date();
    var p = window.CA.period;
    if (p === 'today') { var d = new Date(now); d.setHours(0,0,0,0); return d.getTime(); }
    if (p === 'week') return Date.now() - 7*24*60*60*1000;
    if (p === 'month') return Date.now() - 30*24*60*60*1000;

    '.ca-period-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--ca-input-border);background:var(--ca-input-bg);' +
      'color:var(--ca-text-sub);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}' +

      'border-radius:10px;margin-bottom:6px;font-size:12px;}' +

    '.ca-row-value{color:var(--ca-text);font-weight:800;}' +
