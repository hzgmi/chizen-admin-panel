<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص بيانات مواقع التسليم</title>
<style>
body{font-family:system-ui;background:#0a0825;color:#fff;padding:20px;max-width:600px;margin:0 auto}
h1{color:#a855f7;font-size:18px;margin-bottom:16px}
button{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;font-weight:900;font-size:15px;cursor:pointer;margin:10px 0;font-family:inherit}
#log{background:#000;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:70vh;overflow:auto;margin-top:10px}
</style>
</head>
<body>
<h1>🔍 فحص مواقع التسليم في Firestore</h1>
<button onclick="check()">▶ فحص الآن</button>
<pre id="log">[السجل]</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();

function log(m){ var l=document.getElementById('log'); l.textContent+='\n'+m; l.scrollTop=l.scrollHeight; }

async function check(){
  log('═══════════════════════════');
  log('▶ فحص في ' + new Date().toLocaleTimeString('ar'));
  
  if (!auth.currentUser) {
    log('⚠️ سجّل الدخول أولاً (افتح dashboard.html)');
    return;
  }
  log('👤 ' + auth.currentUser.email);
  
  // 1. جرب كل الوثائق المحتملة
  var docNames = ['pickup_areas', 'pickup_locations', 'pickup_points', 'pickup', 'locations', 'delivery_points'];
  
  for (var i = 0; i < docNames.length; i++) {
    var dn = docNames[i];
    log('');
    log('📄 config/' + dn + ' ─────────────');
    try {
      var doc = await db.collection('config').doc(dn).get();
      if (doc.exists) {
        var data = doc.data();
        log('  ✅ موجود!');
        log('  🔑 المفاتيح: ' + JSON.stringify(Object.keys(data)));
        // اطبع جزء صغير
        var preview = JSON.stringify(data).substring(0, 500);
        log('  📊 عينة: ' + preview);
      } else {
        log('  ❌ غير موجود');
      }
    } catch(e) {
      log('  ⚠️ خطأ: ' + e.message);
    }
  }
  
  // 2. فحص collections منفصلة
  log('');
  log('═══════════════════════════');
  log('📚 فحص Collections منفصلة');
  
  var cols = ['pickup_areas', 'pickup_locations', 'pickup_points', 'locations'];
  for (var j = 0; j < cols.length; j++) {
    log('');
    log('📦 collection: ' + cols[j]);
    try {
      var snap = await db.collection(cols[j]).limit(5).get();
      log('  عدد الوثائق: ' + snap.size);
      snap.forEach(function(d){ 
        log('  • ' + d.id + ': ' + JSON.stringify(d.data()).substring(0, 150)); 
      });
    } catch(e) {
      log('  ⚠️ ' + e.message);
    }
  }
  
  log('');
  log('═══════════════════════════');
  log('✅ اكتمل الفحص — أرسل الصورة');
}
</script>
</body>
</html>
