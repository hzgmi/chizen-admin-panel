<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>شيزن | تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: #0f172a; background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%), radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.15), transparent 40%); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 15px; }
.login-card { background: #ffffff; width: 100%; max-width: 320px; padding: 24px 18px; border-radius: 16px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; }
.logo-container { text-align: center; margin-bottom: 16px; }
.logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #3b82f6, #10b981); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 8px; box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3); }
.logo-container h1 { color: #0f172a; font-size: 20px; font-weight: 900; margin-bottom: 2px; }
.logo-container p { color: #64748b; font-size: 11px; font-weight: 600; }
.form-group { width: 100%; margin-bottom: 12px; }
.form-group label { display: block; color: #334155; font-size: 11px; font-weight: 700; margin-bottom: 4px; padding-right: 3px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; transition: all 0.2s ease; }
.form-group input::placeholder { color: #94a3b8; font-weight: 400; font-size: 12px; }
.form-group input:focus { outline: none; border-color: #3b82f6; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
.btn-submit { width: 100%; padding: 11px; margin-top: 5px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; box-shadow: 0 5px 12px rgba(59, 130, 246, 0.3); transition: all 0.2s ease; }
.btn-submit:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 2px 6px rgba(59, 130, 246, 0.2); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg { width: 100%; padding: 10px 12px; background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 10px; display: none; text-align: center; line-height: 1.4; }
.error-msg.show { display: block; }
.success-msg { width: 100%; padding: 10px 12px; background: #d1fae5; color: #059669; border: 1px solid #a7f3d0; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 10px; display: none; text-align: center; }
.success-msg.show { display: block; }
.divider { width: 100%; display: flex; align-items: center; gap: 8px; margin: 14px 0; color: #94a3b8; font-size: 10px; font-weight: 600; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background-color: #e2e8f0; }
.forgot-password { color: #3b82f6; font-size: 11px; font-weight: 700; text-decoration: none; padding: 6px; border-radius: 6px; transition: background 0.2s; }
.forgot-password:active { background-color: #eff6ff; }
.footer-text { margin-top: 14px; color: #94a3b8; font-size: 9px; font-weight: 600; text-align: center; line-height: 1.4; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="login-card">
<div class="logo-container">
<div class="logo-icon">🏢</div>
<h1>شيزن</h1>
<p>لوحة مدير القسم</p>
</div>
<div id="errorMsg" class="error-msg"></div>
<div id="successMsg" class="success-msg"></div>
<form id="loginForm" style="width: 100%;">
<div class="form-group">
<label for="email">📧 البريد الإلكتروني</label>
<input type="email" id="email" placeholder="example@chizen.com" autocomplete="email" required>
</div>
<div class="form-group">
<label for="password">🔒 كلمة المرور</label>
<input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
</div>
<button type="submit" class="btn-submit" id="loginBtn">🔐 تسجيل الدخول</button>
</form>
<div class="divider">أو</div>
<a href="#" class="forgot-password" onclick="alert('تواصل مع الإدارة لإعادة تعيين كلمة المرور'); return false;">❓ نسيت كلمة المرور؟</a>
<div class="footer-text">شيزن © 2025 — الإصدار 5.1<br>جميع الحقوق محفوظة</div>
</div>
<script>
'use strict';
if (!firebase.apps.length) {
  if (window.FIREBASE_CONFIG) {
    firebase.initializeApp(window.FIREBASE_CONFIG);
  } else {
    document.getElementById('errorMsg').textContent = 'خطأ: FIREBASE_CONFIG غير موجود';
    document.getElementById('errorMsg').classList.add('show');
    throw new Error('FIREBASE_CONFIG not found');
  }
}
var auth = firebase.auth();
var db = firebase.firestore();
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}
function showSuccess(msg) {
  var el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}
function hideMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}
async function getUserRole(uid) {
  var result = { role: null, category: null, source: null };
  try {
    // 1) admins/{uid}
    var adoc = await db.collection('admins').doc(uid).get();
    if (adoc.exists) {
      var a = adoc.data();
      if (a.role) result.role = a.role;
      var cat = a.assignedCategory || a.category || a.cat;
      if (cat) result.category = cat;
      if (result.role || result.category) result.source = 'admins';
    }

    // 2) users/{uid}
    var udoc = await db.collection('users').doc(uid).get();
    if (udoc.exists) {
      var u = udoc.data();
      if (!result.role && u.role) result.role = u.role;
      if (!result.category) {
        var cat2 = u.assignedCategory || u.category || u.cat;
        if (cat2) result.category = cat2;
      }
      if (!result.source && (result.role || result.category)) result.source = 'users';
    }

    // 3) إذا لم يوجد role صريح، نعتبره customer
    if (!result.role) result.role = 'customer';

    return result;
  } catch (e) {
    console.warn('[getUserRole] error:', e);
    return result;
  }
}

async function getUserCategory(uid) {
  try {
    var udoc = await db.collection('users').doc(uid).get();
    if (udoc.exists) {
      var d = udoc.data();
      var cat = d.assignedCategory || d.category || d.cat;
      if (cat) return { cat: cat, source: 'users' };
    }
    var adoc = await db.collection('admins').doc(uid).get();
    if (adoc.exists) {
      var a = adoc.data();
      var cat2 = a.assignedCategory || a.category || a.cat;
      if (cat2) return { cat: cat2, source: 'admins', role: a.role };
      if (a.role === 'cat_manager') return { cat: null, source: 'admins', role: 'cat_manager' };
    }
    return { cat: null, source: null };
  } catch (e) {
    console.warn('[getUserCategory] error:', e);
    return { cat: null, source: null };
  }
}
async function isSuperAdmin(uid) {
  try {
    var adoc = await db.collection('admins').doc(uid).get();
    if (adoc.exists) {
      var role = adoc.data().role;
      if (role === 'super_admin' || role === 'superadmin') return true;
    }
    var udoc = await db.collection('users').doc(uid).get();
    if (udoc.exists && udoc.data().role === 'super_admin') return true;
    return false;
  } catch (e) {
    return false;
  }
}
async function doLogin() {
  hideMessages();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  if (!email || !password) {
    showError('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '⏳ جاري تسجيل الدخول...<span class="spinner"></span>';
  try {
    var userCred = await auth.signInWithEmailAndPassword(email, password);
    var user = userCred.user;
    console.log('[LOGIN] user:', user.email, '| uid:', user.uid);

    // ═══════════════════════════════════════════════
    // 🔒 حماية صارمة: يجب أن يكون cat_manager
    // ═══════════════════════════════════════════════

    // 1) التحقق من الدور
    var roleInfo = await getUserRole(user.uid);
    console.log('[LOGIN] role:', roleInfo);

    // 2) منع super_admin / delivery_mgr / accountant / bookings_mgr / customer
    if (roleInfo.role !== 'cat_manager') {
      await auth.signOut();
      btn.disabled = false;
      btn.textContent = '🔐 تسجيل الدخول';
      if (roleInfo.role === 'super_admin' || roleInfo.role === 'superadmin') {
        showError('❌ هذا الحساب مدير عام — استخدم لوحة الإدارة العامة');
      } else if (roleInfo.role === 'delivery_mgr') {
        showError('❌ هذا الحساب مندوب توصيل — استخدم لوحة المندوب');
      } else if (roleInfo.role === 'accountant') {
        showError('❌ هذا الحساب محاسب — استخدم لوحة المحاسب');
      } else if (roleInfo.role === 'bookings_mgr') {
        showError('❌ هذا الحساب مدير حجوزات — استخدم لوحة الحجوزات');
      } else if (roleInfo.role === 'customer' || !roleInfo.role) {
        showError('❌ هذا الحساب عميل — لا يمكن الدخول للوحة مدير القسم');
      } else {
        showError('❌ هذا الحساب ليس مدير قسم');
      }
      return;
    }

    // 3) التحقق من category
    if (!roleInfo.category) {
      await auth.signOut();
      btn.disabled = false;
      btn.textContent = '🔐 تسجيل الدخول';
      showError('❌ لم يتم تعيين قسم لحسابك. تواصل مع الإدارة.');
      return;
    }

    // 4) نجاح
    showSuccess('✅ مرحباً — القسم: ' + roleInfo.category);
    console.log('[LOGIN] ✓ cat_manager, redirecting to cat-manager-final.html');
    setTimeout(function() {
      window.location.href = 'cat-manager-final.html';
    }, 600);
  } catch (e) {
    console.error('[LOGIN] error:', e);
    var msg = e.message || 'خطأ غير معروف';
    if (msg.indexOf('user-not-found') !== -1) msg = '❌ البريد الإلكتروني غير مسجل';
    else if (msg.indexOf('wrong-password') !== -1) msg = '❌ كلمة المرور غير صحيحة';
    else if (msg.indexOf('invalid-email') !== -1) msg = '❌ البريد الإلكتروني غير صالح';
    else if (msg.indexOf('too-many-requests') !== -1) msg = '❌ محاولات كثيرة، حاول لاحقاً';
    else if (msg.indexOf('invalid-credential') !== -1) msg = '❌ بيانات الدخول غير صحيحة';
    showError(msg);
    btn.disabled = false;
    btn.textContent = '🔐 تسجيل الدخول';
  }
}
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  doLogin();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'INPUT') {
    e.preventDefault();
    doLogin();
  }
});
auth.onAuthStateChanged(async function(user) {
  if (!user) return;
  console.log('[AUTH-STATE] already logged in:', user.email);

  try {
    // تحقق صارم: يجب أن يكون cat_manager مع category
    var roleInfo = await getUserRole(user.uid);
    console.log('[AUTH-STATE] role:', roleInfo);

    if (roleInfo.role === 'cat_manager' && roleInfo.category) {
      console.log('[AUTH-STATE] ✓ cat_manager — redirecting');
      window.location.href = 'cat-manager-final.html';
    } else {
      // أي دور آخر → خروج صامت (لا توجيه)
      console.log('[AUTH-STATE] ✗ not cat_manager — staying on login');
      // لا نسجل خروج تلقائياً (المستخدم قد يريد رؤية الصفحة)
      // لكن لا نوجهه أيضاً
    }
  } catch (e) {
    console.warn('[AUTH-STATE] error:', e);
  }
});
console.log('[CAT-LOGIN-NEW] loaded');
</script>
</body>
</html>
