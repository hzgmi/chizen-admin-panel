<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHIZEN — تسجيل دخول مدير القسم</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif; }
body {
  min-height:100vh;
  background:linear-gradient(135deg,#1A2340 0%,#0f172a 50%,#2d1b4e 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
}
.login-box {
  background:rgba(26,35,64,0.9);
  backdrop-filter:blur(20px);
  border:1px solid rgba(197,160,89,0.3);
  border-radius:24px;
  padding:32px 24px;
  width:100%;
  max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.logo {
  text-align:center;
  margin-bottom:24px;
}
.logo .icon {
  font-size:56px;
  display:block;
  margin-bottom:8px;
}
.logo h1 {
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,#C5A059,#F2E3C6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:4px;
}
.logo p {
  font-size:12px;
  color:#9ca3af;
  font-weight:700;
}
.form-group {
  margin-bottom:16px;
}
.form-group label {
  display:block;
  font-size:12px;
  color:#C5A059;
  font-weight:800;
  margin-bottom:6px;
}
.form-group input {
  width:100%;
  padding:14px 16px;
  border:1.5px solid rgba(197,160,89,0.3);
  border-radius:12px;
  background:rgba(15,23,42,0.6);
  color:#F2E3C6;
  font-size:14px;
  font-family:inherit;
  transition:all 0.2s;
}
.form-group input:focus {
  outline:none;
  border-color:#C5A059;
  box-shadow:0 0 0 3px rgba(197,160,89,0.15);
}
.form-group input::placeholder {
  color:#6b7280;
}
.btn {
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,#C5A059,#9A7B4F);
  color:#1A2340;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
  margin-top:8px;
  transition:transform 0.15s;
}
.btn:active {
  transform:scale(0.98);
}
.btn:disabled {
  opacity:0.6;
  cursor:not-allowed;
}
.error {
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.4);
  color:#f87171;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  margin-bottom:12px;
  display:none;
}
.error.show {
  display:block;
}
.success {
  background:rgba(16,185,129,0.15);
  border:1px solid rgba(16,185,129,0.4);
  color:#10b981;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  margin-bottom:12px;
  display:none;
}
.success.show {
  display:block;
}
.hint {
  text-align:center;
  font-size:11px;
  color:#6b7280;
  margin-top:16px;
  line-height:1.6;
}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <span class="icon">🛒</span>
    <h1>CHIZEN</h1>
    <p>لوحة مدير القسم</p>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@mail.com" autocomplete="email">
  </div>

  <div class="form-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">🔑 تسجيل الدخول</button>

  <p class="hint">هذه الصفحة مخصصة لمديري الأقسام فقط</p>
</div>

<script>
'use strict';

// Initialize Firebase
if (!firebase.apps.length) {
  if (window.FIREBASE_CONFIG) {
    firebase.initializeApp(window.FIREBASE_CONFIG);
  } else {
    document.getElementById('errorMsg').textContent = 'خطأ: FIREBASE_CONFIG غير موجود';
    document.getElementById('errorMsg').classList.add('show');
  }
}

var auth = firebase.auth();
var db = firebase.firestore();

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}

function showSuccess(msg) {
  var el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

async function doLogin() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  
  if (!email || !password) {
    showError('❌ يرجى إدخال البريد وكلمة المرور');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '⏳ جاري تسجيل الدخول...';
  
  try {
    var userCred = await auth.signInWithEmailAndPassword(email, password);
    var user = userCred.user;
    
    // البحث عن بيانات القسم في عدة أماكن
    var cat = null;
    var userData = {};
    
    // 1. users/{uid}
    try {
      var udoc = await db.collection('users').doc(user.uid).get();
      if (udoc.exists) {
        userData = udoc.data();
        cat = userData.category || userData.cat || userData.assignedCategory || null;
      }
    } catch(e) {}
    
    // 2. admins/{uid}
    if (!cat) {
      try {
        var adoc = await db.collection('admins').doc(user.uid).get();
        if (adoc.exists) {
          var adminData = adoc.data();
          cat = adminData.category || adminData.cat || adminData.assignedCategory || null;
          if (!cat && adminData.role === 'cat_manager') {
            cat = adminData.categories ? adminData.categories[0] : 'general';
          }
        }
      } catch(e) {}
    }
    
    // 3. البحث عن طريق البريد
    if (!cat) {
      try {
        var snap = await db.collection('users').where('email','==',user.email).limit(1).get();
        if (!snap.empty) {
          var d = snap.docs[0].data();
          cat = d.category || d.cat || null;
        }
      } catch(e) {}
    }
    
    console.log('[LOGIN] user:', user.email, 'cat:', cat);
    
    if (!cat) {
      showError('❌ هذا الحساب ليس مدير قسم (لا يوجد category)');
      await auth.signOut();
      btn.disabled = false;
      btn.textContent = '🔑 تسجيل الدخول';
      return;
    }
    
    showSuccess('✅ تم تسجيل الدخول! القسم: ' + cat);
    
    // التوجيه إلى اللوحة الجديدة
    setTimeout(function() {
      window.location.href = 'cat-manager-final.html';
    }, 500);
    
  } catch(e) {
    var msg = e.message || 'خطأ غير معروف';
    if (msg.indexOf('user-not-found') !== -1) msg = '❌ البريد الإلكتروني غير مسجل';
    else if (msg.indexOf('wrong-password') !== -1) msg = '❌ كلمة المرور غير صحيحة';
    else if (msg.indexOf('invalid-email') !== -1) msg = '❌ البريد الإلكتروني غير صالح';
    else if (msg.indexOf('too-many-requests') !== -1) msg = '❌ محاولات كثيرة، حاول لاحقاً';
    
    showError(msg);
    btn.disabled = false;
    btn.textContent = '🔑 تسجيل الدخول';
  }
}

// دعم Enter
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// إذا كان المستخدم مسجل بالفعل، انتقل مباشرة
auth.onAuthStateChanged(async function(user) {
  if (user) {
    try {
      var udoc = await db.collection('users').doc(user.uid).get();
      var userData = udoc.exists ? udoc.data() : {};
      if (userData.category || userData.cat) {
        window.location.href = 'cat-manager-final.html';
      }
    } catch(e) {}
  }
});

console.log('[CAT-LOGIN-NEW] loaded');
</script>
</body>
</html>
