<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0515">
<title>CHIZEN Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0515;--bg2:#150826;--cd:#1F0D35;--cd2:#2A1345;--bd:#3A1F5A;--pk:#EC4899;--pl:#F472B6;--pp:#A855F7;--or:#FB923C;--bl:#38BDF8;--mn:#5EEAD4;--gn:#10B981;--rd:#EF4444;--yl:#F59E0B;--tx:#F5E6FF;--mt:#8B7AA8;--mt2:#5C4A78;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
#app{width:100%;height:100%;min-height:100vh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;}
@supports (height:100dvh){ #app{ height:100dvh; } }
.gs{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0A0515,#1F0D35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.gb{width:100%;max-width:400px;background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:32px 24px;text-align:center;margin:auto;}
.gl{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk),var(--pp));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;margin-bottom:6px;}
.gt{font-size:10px;color:var(--mt);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:30px;}
.gi{font-size:56px;margin:20px 0;}
.gtt{font-size:18px;font-weight:900;margin-bottom:10px;}
.gd{font-size:13px;color:var(--mt);line-height:1.7;margin-bottom:20px;}
.gu{font-size:11px;color:var(--mt2);margin-bottom:16px;word-break:break-all;}
.gbtn{width:100%;padding:15px;background:linear-gradient(135deg,var(--pk),var(--pp));border:none;border-radius:12px;color:#fff;font-family:'Cairo';font-size:15px;font-weight:900;cursor:pointer;margin-bottom:10px;min-height:50px;}
.gbtn.sec{background:var(--cd2);border:1px solid var(--bd);color:var(--tx);}
.gbtn.dgr{background:linear-gradient(135deg,#EF4444,#DC2626);}
.sp{width:48px;height:48px;border:4px solid rgba(236,72,153,.2);border-top-color:var(--pk);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.hd{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(135deg,var(--bg2),var(--cd));border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ht{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.hs{font-size:9px;color:var(--mt);letter-spacing:2px;margin-top:2px;}
.ha{display:flex;gap:8px;}
.hb{width:40px;height:40px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mt);}
.hb:active{border-color:var(--pk);color:var(--pk);}
.hb svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;}
.tbs{display:flex;gap:4px;padding:8px 8px 0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tbs::-webkit-scrollbar{display:none;}
.tb{padding:9px 14px;background:transparent;border:none;border-radius:10px 10px 0 0;color:var(--mt);font-family:'Cairo';font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;position:relative;min-height:40px;}
.tb.active{background:var(--cd);color:var(--tx);}
.tb.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--pk),var(--pp));}
.ct{flex:1;overflow-y:auto;padding:12px 12px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.ct::-webkit-scrollbar{display:none;}
.sc{display:none;}
.sc.active{display:block;}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;}
.cti{font-size:13px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.ctl{display:flex;align-items:center;gap:8px;min-width:0;}
.ctl::before{content:'';width:3px;height:15px;background:linear-gradient(180deg,var(--or),var(--pk));border-radius:2px;flex-shrink:0;}
.btn{padding:9px 14px;border-radius:9px;border:none;font-family:'Cairo';font-size:11px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.bp{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;}
.bs{background:linear-gradient(135deg,var(--gn),var(--mn));color:#0A0515;}
.bw{background:linear-gradient(135deg,var(--or),var(--yl));color:#0A0515;}
.bd{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;}
.bwa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;}
.bg2{background:var(--cd2);color:var(--tx);border:1px solid var(--bd);}
.bsm{padding:7px 10px;font-size:10px;min-height:32px;}
.bb{width:100%;}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px;}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.scd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;}
.sl{font-size:9px;color:var(--mt);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.sv{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--or),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:5px;}
.ss{font-size:9px;color:var(--mt2);margin-top:2px;}
.fl{margin-bottom:10px;}
.fll{font-size:10px;color:var(--mt);font-weight:700;margin-bottom:5px;display:block;letter-spacing:.5px;text-transform:uppercase;}
.fi{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font-family:'Cairo';font-size:16px;outline:none;}
.fi:focus{border-color:var(--pk);}
.fi::placeholder{color:var(--mt2);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
textarea.fi{min-height:80px;resize:vertical;line-height:1.6;}
.sel{font-family:'Cairo';}
.ipt{width:100%;height:120px;background:var(--bg2);border:1px dashed var(--bd);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-top:5px;overflow:hidden;position:relative;font-size:11px;color:var(--mt2);}
.ipt img{width:100%;height:100%;object-fit:cover;display:none;}
.ipt.hi img{display:block;}
.rw{display:flex;gap:10px;padding:11px;background:var(--cd);border:1px solid var(--bd);border-radius:11px;margin-bottom:8px;align-items:center;cursor:pointer;}
.rw:active{border-color:rgba(236,72,153,.4);}
.rt{width:48px;height:48px;border-radius:9px;overflow:hidden;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.rt img{width:100%;height:100%;object-fit:cover;}
.ri{flex:1;min-width:0;}
.rti{font-size:12px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs{font-size:10px;color:var(--mt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ra{display:flex;gap:5px;flex-shrink:0;}
.emp{text-align:center;padding:30px 20px;color:var(--mt);font-size:12px;}
.bst{display:inline-block;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:900;}
.bp2{background:rgba(245,158,11,.15);color:var(--yl);}
.bs2{background:rgba(56,189,248,.15);color:var(--bl);}
.bc2{background:rgba(16,185,129,.15);color:var(--gn);}
.bx2{background:rgba(239,68,68,.15);color:var(--rd);}
.bdg{display:inline-block;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:900;}
.bgg{background:rgba(16,185,129,.15);color:var(--gn);}
.bggr{background:rgba(139,122,168,.15);color:var(--mt);}
.bggo{background:rgba(251,146,60,.2);color:var(--or);}
.bgn{background:rgba(236,72,153,.15);color:var(--pk);}
.md{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.md.active{display:flex;}
.ms{width:100%;max-width:900px;background:var(--cd);border-top-left-radius:22px;border-top-right-radius:22px;padding:8px 0 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.mh{width:38px;height:4px;background:var(--bd);border-radius:2px;margin:8px auto 14px;flex-shrink:0;}
.mt{padding:0 18px 14px;font-size:15px;font-weight:900;}
.mb{padding:0 18px;}
.ma{padding:14px 18px 0;display:flex;gap:8px;flex-wrap:wrap;}
.ma .btn{flex:1;min-height:46px;font-size:13px;min-width:100px;}
.cf{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:150;display:none;align-items:center;justify-content:center;padding:20px;}
.cf.active{display:flex;}
.cfb{width:100%;max-width:360px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center;}
.cft{font-size:15px;font-weight:900;margin-bottom:10px;}
.cfm{font-size:13px;color:var(--mt);line-height:1.7;margin-bottom:18px;}
.cfa{display:flex;gap:8px;}
.cfa button{flex:1;padding:14px;border:none;border-radius:10px;font-family:'Cairo';font-size:13px;font-weight:900;cursor:pointer;min-height:48px;}
.cfc{background:var(--cd2);border:1px solid var(--bd);color:var(--tx);}
.cfo{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;}
.cfo.pr{background:linear-gradient(135deg,var(--pk),var(--pp));}
.tst{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--cd2);border:1px solid var(--bd);color:var(--tx);padding:12px 18px;border-radius:11px;font-size:13px;font-weight:700;z-index:2000;opacity:0;transition:all .3s;max-width:90%;text-align:center;pointer-events:none;}
.tst.show{opacity:1;transform:translateX(-50%) translateY(0);}
.tst.suc{background:linear-gradient(135deg,var(--gn),var(--mn));color:#0A0515;border:none;}
.tst.err{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff;border:none;}
.ib{background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(236,72,153,.08));border:1px solid rgba(251,146,60,.3);border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--yl);font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.5;}
.ch{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.ch::-webkit-scrollbar{display:none;}
.cp{padding:8px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;white-space:nowrap;min-height:36px;display:flex;align-items:center;}
.cp.active{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;border-color:transparent;}
.sw{position:relative;margin-bottom:12px;}
.si{width:100%;padding:12px 40px 12px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:11px;color:var(--tx);font-family:'Cairo';font-size:16px;outline:none;}
.si:focus{border-color:var(--pk);}
.sic{position:absolute;top:50%;transform:translateY(-50%);right:12px;width:18px;height:18px;stroke:var(--mt);stroke-width:2;fill:none;pointer-events:none;}
.ds{background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:12px;margin-bottom:10px;}
.dt{font-size:11px;font-weight:900;color:var(--pl);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.dr{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;border-bottom:1px dashed rgba(58,31,90,.4);gap:10px;flex-wrap:wrap;}
.dr:last-child{border-bottom:none;}
.dl{color:var(--mt);}
.dv{color:var(--tx);font-weight:700;text-align:left;}
.il{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(58,31,90,.4);}
.il:last-child{border-bottom:none;}
.ii{width:44px;height:44px;border-radius:8px;background:var(--bg);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.ii img{width:100%;height:100%;object-fit:cover;}
.in{font-size:12px;font-weight:700;margin-bottom:2px;}
.im{font-size:10px;color:var(--mt);}
.ipr{font-size:12px;font-weight:900;color:var(--pl);flex-shrink:0;}
.rci{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--bg2);}
.tl{position:relative;padding-right:20px;}
.tl::before{content:'';position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--bd);}
.tli{position:relative;padding:0 0 14px 0;font-size:11px;}
.tli::before{content:'';position:absolute;right:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--bd);}
.tli.dn::before{background:var(--gn);border-color:var(--gn);}
.tli.cr::before{background:var(--pk);border-color:var(--pk);box-shadow:0 0 8px var(--pk);}
.tlt{font-weight:900;color:var(--tx);}
.tld{font-size:9px;color:var(--mt2);margin-top:2px;}
.ab{display:inline-block;padding:2px 6px;background:linear-gradient(135deg,var(--or),var(--pk));color:#fff;border-radius:6px;font-size:9px;font-weight:900;margin-right:4px;}
.ft{color:var(--yl);}
@media(max-width:480px){
.hd{padding:10px 12px;}.ht{font-size:16px;}.hb{width:38px;height:38px;}.hb svg{width:16px;height:16px;}
.tb{padding:8px 12px;font-size:10px;min-height:38px;}
.ct{padding:10px 10px 40px;}
.sg{grid-template-columns:1fr 1fr;gap:8px;}.sg3{grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sv{font-size:17px;}.sl{font-size:8px;}
.fr,.fr3{grid-template-columns:1fr!important;gap:8px;}
.cd{padding:12px;border-radius:12px;}.cti{font-size:12px;}
.rw{padding:10px;gap:8px;}.rt{width:44px;height:44px;}
.rti{font-size:11px;}.rs{font-size:9px;}
.btn{min-height:44px;font-size:12px;}.bsm{min-height:36px;font-size:11px;}
.fi,.si,textarea.fi,select.fi{font-size:16px!important;min-height:46px;}
.ms{max-height:96vh;}.mb{padding:0 14px;}.mt{padding:0 14px 12px;font-size:14px;}
.ma{padding:12px 14px 0;gap:6px;}.ma .btn{min-height:48px;font-size:13px;}
.cfb{padding:20px 18px;max-width:calc(100vw - 40px);}
.cfa button{min-height:50px;}
.dr{font-size:11px;padding:6px 0;}
.cp{padding:8px 12px;font-size:11px;min-height:38px;}
.ii{width:40px;height:40px;font-size:16px;}
.gb{padding:28px 20px;}.gl{font-size:36px;}.gbtn{min-height:52px;}
.ib{font-size:10px;padding:10px;}
}
@media(max-width:380px){.sg3{grid-template-columns:1fr 1fr;}.sg3>div:last-child{grid-column:span 2;}}
</style>
</head>
<body>
<noscript><div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0A0515;color:#fff;font-family:sans-serif;text-align:center;z-index:9999;"><div><h2>⚠️ JavaScript مطلوب</h2><p>يرجى تفعيل JavaScript لعرض هذه الصفحة</p></div></div></noscript>

<div id="app">
<div class="gs" id="gs"><div class="gb" id="gb"><div class="gl">CHIZEN</div><div class="gt">Admin Panel</div><div class="sp"></div><div class="gd">جاري التحقق من الصلاحيات...</div></div></div>
<div id="am" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;">
<div class="hd"><div><div class="ht">CHIZEN</div><div class="hs">ADMIN PANEL</div></div>
<div class="ha">
<div class="hb" onclick="A.openApp()"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></div>
<div class="hb" onclick="A.logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
</div></div>
<div class="tbs">
<button class="tb active" onclick="A.tab('dash',this)">📊 الرئيسية</button>
<button class="tb" onclick="A.tab('reports',this)">📈 تقارير</button>

</div>

</div>
<div class="md" id="md" onclick="if(event.target===this)A.cm()"><div class="ms"><div class="mh"></div><div class="mt" id="mt"></div><div class="mb" id="mb"></div><div class="ma" id="ma"></div></div></div>
<div class="cf" id="cf"><div class="cfb"><div class="cft" id="cft"></div><div class="cfm" id="cfm"></div><div class="cfa"><button class="cfc" id="cfc">إلغاء</button><button class="cfo" id="cfo">تأكيد</button></div></div></div>

<script>
if (typeof Promise.allSettled !== 'function') {
  Promise.allSettled = function (promises) {
    return Promise.all([].map.call(promises, function (p) {
      return Promise.resolve(p).then(
        function (v) { return { status: 'fulfilled', value: v }; },
        function (e) { return { status: 'rejected', reason: e }; }
      );
    }));
  };
}
window.addEventListener('error', function(e){ console.error('❌ Global Error:', e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('❌ Unhandled Rejection:', e.reason); });

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});};

var A={
  products:[],orders:[],users:[],admins:[],cats:[],pays:[],sups:[],notifs:[],deliveryLocs:{aden:[],yemen:[]},
  orderFilter:'all',prodFilter:'all',currentTab:'dash',
  _checked:false,_listening:false,

  init:async function(){
    if(!window.FB || !FB.ready){
      this.gateMsg('❌', 'Firebase غير محمّل', 'تأكد من وجود firebase-config.js و firebase-service.js');
      return;
    }
    try { await FB.handleGoogleRedirect(); } catch(e) {}
    var self = this;
    if(!this._listening){
      this._listening = true;
      try {
        FB.auth.onAuthStateChanged(function(u) {
          if(self._checked) return;
          self._checked = true;
          if (u) self.checkAdmin(u);

  loadData:async function(){
    var s=this;
    await Promise.allSettled([
      (async()=>{try{var p=await FB.getProducts();if(p)s.products=p;}catch(e){}})(),
      (async()=>{try{var u=await FB.getAllUsers();if(u)s.users=u;}catch(e){}})(),
      (async()=>{try{var o=await FB.getAllOrders();if(o)s.orders=o;}catch(e){}})(),
      (async()=>{try{var c=await FB.getConfig('categories');if(c&&c.list)s.cats=c.list;}catch(e){}})(),
      (async()=>{try{var p=await FB.getConfig('payments');if(p&&p.list)s.pays=p.list;}catch(e){}})(),
      (async()=>{try{var sp=await FB.getConfig('suppliers');if(sp&&sp.list)s.sups=sp.list;}catch(e){}})(),
      (async()=>{try{var sn=await FB.db.collection('admins').get();s.admins=[];sn.forEach(d=>s.admins.push({uid:d.id,data:d.data()}));}catch(e){}})(),
      (async()=>{try{var c=await FB.getConfig('contact');if(c)localStorage.setItem('chizen_contact',JSON.stringify(c));}catch(e){}})(),
      (async()=>{try{var sh=await FB.getConfig('shipping');if(sh)localStorage.setItem('chizen_shipping',JSON.stringify(sh));}catch(e){}})(),
      (async()=>{try{var dl=await FB.getConfig('delivery_locations');if(dl&&dl.aden){s.deliveryLocs=dl;}else{s.deliveryLocs={aden:[{district:'المعلا',areas:['الشارع الرئيسي']}],yemen:[{gov:'صنعاء',station:'مكتب باصات الشام'}]};}}catch(e){s.deliveryLocs={aden:[],yemen:[]};}})()
    ]);
    if(!s.cats.length)s.cats=[{key:'home',name:'منزلية',icon:'🏠'},{key:'beauty',name:'تجميل',icon:'💄'},{key:'school',name:'مدرسية',icon:'📚'},{key:'clothes',name:'ملابس',icon:'👕'},{key:'electronics',name:'إلكترونيات',icon:'📱'},{key:'food',name:'طعام',icon:'🍔'},{key:'games',name:'ألعاب',icon:'🎮'},{key:'more',name:'المزيد',icon:'➕'}];
    if(!s.pays.length)s.pays=[{id:'kuraimi',name:'بنك الكريمي',account:'1234-567-890',color:'#0d47a1',icon:'🏦',type:'bank'},{id:'cash',name:'دفع نقدي',account:'',color:'#EF6C00',icon:'💵',type:'cash'}];
  },

  tab:function(n,el){
    document.querySelectorAll('.sc').forEach(x=>x.classList.remove('active'));
    var t=document.getElementById('sc-'+n);if(t)t.classList.add('active');
    document.querySelectorAll('.tb').forEach(x=>x.classList.remove('active'));
    if(el)el.classList.add('active');
    document.getElementById('ct').scrollTop=0;
    this.currentTab=n;
    var f={dash:this.renderDash,reports:this.renderReports,products:this.renderProducts,cats:this.renderCats,pays:this.renderPays,orders:this.renderOrders,sups:this.renderSups,balances:this.renderBalances,delivery:this.renderDelivery,users:this.renderUsers,admins:this.renderAdmins,settings:this.renderSettings}[n];
    if(f)try{f.call(this);}catch(e){console.warn(e);}
  },

  renderDash:function(){
    var sales=0,comp=0,pend=0,canc=0,cSales=0;
    this.orders.forEach(o=>{
      if(o.status!=='cancelled')sales+=o.total||0;
      if(o.status==='pending')pend++;
      else if(o.status==='completed'){comp++;cSales+=o.total||0;}
      else if(o.status==='cancelled')canc++;
    });
    var g=function(id){return document.getElementById(id);};
    if(g('d-sales'))g('d-sales').textContent=sales.toLocaleString()+' ر.س';
    if(g('d-sales-s'))g('d-sales-s').textContent=cSales.toLocaleString()+' مكتمل';
    if(g('d-orders'))g('d-orders').textContent=this.orders.length;
    if(g('d-orders-s'))g('d-orders-s').textContent=pend+' معلق';
    if(g('d-products'))g('d-products').textContent=this.products.length;
    if(g('d-products-s'))g('d-products-s').textContent=this.products.filter(p=>typeof p.stock==='number'&&p.stock<=5).length+' منخفض';
    if(g('d-users'))g('d-users').textContent=this.users.length;
    if(g('d-users-s'))g('d-users-s').textContent=this.admins.length+' مسؤول';
    if(g('d-pending'))g('d-pending').textContent=pend;
    if(g('d-completed'))g('d-completed').textContent=comp;
    if(g('d-cancelled'))g('d-cancelled').textContent=canc;
    var low=this.products.filter(p=>typeof p.stock==='number'&&p.stock<=5);
    var lc=g('low-stock');
    if(lc){
      if(low.length){lc.style.display='block';var lh='';low.forEach(p=>{lh+='<div class="rw" onclick="A.productForm(\''+esc(p.id)+'\')" style="margin-bottom:6px;"><div class="ri"><div class="rti">'+esc(p.name)+'</div><div class="rs" style="color:var(--rd);font-weight:900;">متبقي: '+p.stock+'</div></div></div>';});g('low-stock-list').innerHTML=lh;}
      else{lc.style.display='none';}
    }
    var ro=this.orders.slice().sort((a,b)=>(b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0)).slice(0,3);
    var rh='';
    if(!ro.length)rh='<div class="emp">لا توجد طلبات</div>';
    ro.forEach(o=>{rh+='<div class="rw" onclick="A.orderDetails(\''+esc(o.id)+'\')" style="margin-bottom:6px;"><div class="rt">🛒</div><div class="ri"><div class="rti">#'+esc((o.id||'').substring(0,14))+'</div><div class="rs">'+esc(o.name||'')+' • '+esc(o.total)+' ر.س</div></div><span class="bst b'+(o.status||'pending').substring(0,1)+'2">'+(o.status==='pending'?'قيد المعالجة':o.status==='shipped'?'في الطريق':o.status==='completed'?'مكتمل':'ملغي')+'</span></div>';});
    if(g('recent-orders'))g('recent-orders').innerHTML=rh;
    this.renderCreditReminders();
  },

  renderCreditReminders:function(){
    var c=document.getElementById('credit-rem');
    if(!c)return;
    var rem=[];
    this.sups.forEach(function(sup,i){
      if(sup.paymentType!=='credit'||!sup.history||(sup.balance||0)<=0)return;
      var orders=sup.history.filter(h=>h.type==='order').sort((a,b)=>new Date(a.date)-new Date(b.date));
      var pays=sup.history.filter(h=>h.type==='payment');
      var paid=pays.reduce((s,p)=>s+p.amount,0);
      var run=0,oldest=null;
      for(var k=0;k<orders.length;k++){run+=orders[k].amount;if(run>paid){oldest=orders[k];break;}}
      if(!oldest)return;
      var due=new Date(new Date(oldest.date).getTime()+(sup.creditDays||30)*86400000);
      var daysLeft=Math.ceil((due-new Date())/86400000);
      if(daysLeft<=7)rem.push({sup:sup,info:{daysLeft:daysLeft,due:due},idx:i});
    });
    if(!rem.length){c.innerHTML='';return;}
    rem.sort((a,b)=>a.info.daysLeft-b.info.daysLeft);
    var html='<div class="cd" style="border-color:rgba(239,68,68,.4);"><div class="cti"><div class="ctl" style="color:var(--rd);">⏰ تنبيهات الآجل</div></div>';
    rem.forEach(r=>{
      var color=r.info.daysLeft<0?'var(--rd)':r.info.daysLeft<=3?'var(--or)':'var(--yl)';
      var icon=r.info.daysLeft<0?'🚨':r.info.daysLeft<=3?'⚠️':'⏰';
      var text=r.info.daysLeft<0?'متأخر '+Math.abs(r.info.daysLeft)+' يوم':r.info.daysLeft===0?'اليوم':'باقي '+r.info.daysLeft+' أيام';
      html+='<div class="rw" onclick="A.balanceDetails('+r.idx+')" style="margin-bottom:6px;border-color:'+color+'40;"><div class="rt" style="background:'+color+'20;color:'+color+';">'+icon+'</div><div class="ri"><div class="rti">'+esc(r.sup.name)+'</div><div class="rs" style="color:'+color+';font-weight:900;">'+text+' · '+r.sup.balance.toLocaleString()+' ر.س</div></div></div>';
    });
    html+='</div>';
    c.innerHTML=html;
  },

  renderReports:function(){
    var days=[];
    for(var i=6;i>=0;i--){var d=new Date(Date.now()-i*86400000);days.push({date:d,total:0,label:['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'][d.getDay()]});}
    this.orders.forEach(o=>{if(o.status==='cancelled'||!o.createdAt)return;var od=new Date(o.createdAt.seconds*1000);days.forEach(d=>{if(od.toDateString()===d.date.toDateString())d.total+=o.total||0;});});
    var max=Math.max.apply(null,days.map(d=>d.total).concat([1]));
    var ch='',xh='';
    days.forEach(d=>{var pct=Math.max(4,(d.total/max)*100);ch+='<div style="flex:1;background:linear-gradient(180deg,var(--pk),var(--pp));border-radius:4px 4px 0 0;min-height:4px;height:'+pct+'%;position:relative;"><span style="position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--mt);white-space:nowrap;">'+d.total+'</span></div>';xh+='<div style="flex:1;">'+d.label+'</div>';});
    var rc=document.getElementById('rep-chart');if(rc)rc.innerHTML=ch;
    var rx=document.getElementById('rep-x');if(rx)rx.innerHTML=xh;
    var total=0,comp=0,pend=0;
    this.orders.forEach(o=>{if(o.status==='cancelled')return;total+=o.total||0;if(o.status==='completed')comp+=o.total||0;if(o.status==='pending')pend+=o.total||0;});
    var g=function(id){return document.getElementById(id);};
    if(g('r-total'))g('r-total').textContent=total.toLocaleString()+' ر.س';
    if(g('r-comp'))g('r-comp').textContent=comp.toLocaleString()+' ر.س';
    if(g('r-pend'))g('r-pend').textContent=pend.toLocaleString()+' ر.س';
    if(g('r-avg'))g('r-avg').textContent=(this.orders.length?Math.round(total/this.orders.length):0).toLocaleString()+' ر.س';
  },

  renderProducts:function(){
    var ce=document.getElementById('p-chips');
    if(!ce)return;
    var chips='<div class="cp'+(this.prodFilter==='all'?' active':'')+'" onclick="A.setProdFilter(\'all\',this)">الكل</div>';
    this.cats.forEach(c=>{chips+='<div class="cp'+(this.prodFilter===c.key?' active':'')+'" onclick="A.setProdFilter(\''+esc(c.key)+'\',this)">'+esc(c.name)+'</div>';});
    ce.innerHTML=chips;
    var q=(document.getElementById('p-search').value||'').toLowerCase().trim();
    var list=this.products.filter(p=>{
      if(this.prodFilter!=='all'&&p.category!==this.prodFilter)return false;
      if(q&&((p.name||'')+' '+(p.brand||'')).toLowerCase().indexOf(q)===-1)return false;
      return true;
    });
    var el=document.getElementById('p-list');
    if(!list.length){el.innerHTML='<div class="emp">لا توجد منتجات</div>';return;}
    var html='';
    for(var i=list.length-1;i>=0;i--){
      var p=list[i];
      var img=p.img?'<img src="'+esc(p.img)+'" loading="lazy">':'📦';
      var stock='';
      if(typeof p.stock==='number'){stock=p.stock<=0?'<span class="bdg bggr">نفذ</span>':p.stock<=5?'<span class="bdg" style="background:rgba(239,68,68,.15);color:var(--rd);">'+p.stock+'</span>':'<span class="bdg bgg">'+p.stock+'</span>';}
      var act=p.active===false?' <span class="bdg bggr">معطّل</span>':'';
      html+='<div class="rw" onclick="A.productForm(\''+esc(p.id)+'\')"><div class="rt">'+img+'</div><div class="ri"><div class="rti">'+(p.featured?'<span class="ft">⭐</span> ':'')+esc(p.name||'—')+act+'</div><div class="rs">'+esc(p.brand||'')+' • '+esc(p.price||0)+' ر.س '+stock+'</div></div><div class="ra" onclick="event.stopPropagation()"><button class="btn bg2 bsm" onclick="A.productForm(\''+esc(p.id)+'\')">✏️</button><button class="btn bd bsm" onclick="A.deleteProduct(\''+esc(p.id)+'\')">🗑️</button></div></div>';
    }
    el.innerHTML=html;

  saveProduct:async function(id,isEdit){
    var name=document.getElementById('f-name').value.trim();
    var price=parseFloat(document.getElementById('f-price').value);
    if(!name){this.toast('أدخل الاسم','err');return;}
    if(!price||price<=0){this.toast('سعر صحيح','err');return;}
    var feats=document.getElementById('f-feats').value.split('\n').map(s=>s.trim()).filter(s=>s);
    var stockV=document.getElementById('f-stock').value;
    var data={name:name,brand:document.getElementById('f-brand').value.trim(),category:document.getElementById('f-cat').value,price:price,old:parseFloat(document.getElementById('f-old').value)||null,stock:stockV?parseInt(stockV):null,badge:document.getElementById('f-badge').value.trim(),rating:4.5,reviews:0,sold:0,img:document.getElementById('f-img').value.trim(),desc:document.getElementById('f-desc').value.trim(),features:feats,active:document.getElementById('f-active').checked,featured:document.getElementById('f-featured').checked};
    try{
      if(isEdit)await FB.updateProduct(id,data);else await FB.addProduct(data);
      this.toast(isEdit?'✓ تم':'✓ أُضيف','suc');
      this.cm();
      await this.loadData();
      this.renderProducts();this.renderDash();
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  deleteProduct:function(id){
    var self=this;var name='';
    this.products.forEach(p=>{if(String(p.id)===String(id))name=p.name;});

      try{await FB.deleteProduct(id);await self.loadData();self.renderProducts();self.renderDash();self.toast('تم','suc');}catch(e){self.toast('فشل','err');}

  saveCat:async function(idx){
    var key=document.getElementById('c-key').value.trim().toLowerCase().replace(/\s+/g,'_');
    var name=document.getElementById('c-name').value.trim();
    var icon=document.getElementById('c-icon').value.trim()||'📦';

    else{for(var i=0;i<this.cats.length;i++)if(this.cats[i].key===key){this.toast('المعرّف مستخدم','err');return;}this.cats.push(cat);}
    try{await FB.setConfig('categories',{list:this.cats});this.cm();this.renderCats();this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

      var ic=0;if(o.items)o.items.forEach(it=>{ic+=it.qty;});

      '<div class="tli '+(o.status==='completed'?'cr':'')+'"><div class="tlt">مكتمل</div><div class="tld">تم التسليم</div></div>'+

  saveNote:async function(id){
    var t=document.getElementById('o-note');if(!t)return;
    var note=t.value.trim();
    try{
      var snap=await FB.db.collection('orders').where('id','==',id).get();
      if(snap.empty){this.toast('الطلب غير موجود','err');return;}
      await snap.docs[0].ref.update({adminNote:note,adminNoteUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),adminNoteUpdatedBy:FB.currentUser?FB.currentUser.email:''});
      for(var i=0;i<this.orders.length;i++){if(this.orders[i].id===id){this.orders[i].adminNote=note;break;}}
      this.toast('✓ تم','suc');
      this.orderDetails(id);
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

  setStatus:async function(id,status){
    try{
      var targetUid='ALL';
      this.orders.forEach(o=>{if(o.id===id)targetUid=o.userId||'ALL';});
      await FB.updateOrderStatus(id,status);
      var titles={shipped:'طلبك في الطريق 🚚',completed:'تم تسليم طلبك ✓'};
      var bodies={shipped:'طلب #'+id+' خرج من المستودع',completed:'طلب #'+id+' جاهز للاستلام'};
      try{
        if(targetUid!=='ALL'&&FB.addUserNotification)await FB.addUserNotification(targetUid,{title:titles[status],body:bodies[status],type:'order'});
        else if(FB.addNotification)await FB.addNotification({title:titles[status],body:bodies[status],type:'order'});
      }catch(e){}
      await this.loadData();this.renderOrders();this.renderDash();this.cm();this.toast('✓','suc');
    }catch(e){this.toast('فشل','err');}
  },

  renderDelivery: function() {

        h += '<div class="rw" onclick="A.openAdenAreas(' + i + ')"><div class="rt" style="font-size:20px;">🏘️</div><div class="ri"><div class="rti">' + esc(d.district) + '</div><div class="rs">' + d.areas.length + ' منطقة</div></div><div class="ra"><button class="btn bg2 bsm" onclick="event.stopPropagation();A.openAdenAreas(' + i + ')">✏️</button><button class="btn bd bsm" onclick="event.stopPropagation();A.deleteAdenDistrict(' + i + ')">🗑️</button></div></div>';

  supplyOrder:function(idx){
    var s=this.sups[idx];if(!s)return;
    var supplierProds=(s.products||[]).map(sp=>{var p=this.getProduct(sp.id);return p?{product:p,pp:sp.purchasePrice||0}:null;}).filter(x=>x);
    if(!supplierProds.length){this.toast('لا منتجات مسعّرة','err');return;}
    var pending=this.orders.filter(o=>o.status==='pending'||o.status==='shipped');
    var rows='';
    supplierProds.forEach((sp,i)=>{
      var p=sp.product;var ordQty=0;pending.forEach(o=>{(o.items||[]).forEach(it=>{if(String(it.id)===String(p.id))ordQty+=it.qty||0;});});
      var stock=typeof p.stock==='number'?p.stock:0;var needed=Math.max(0,ordQty-stock);var sug=Math.ceil(needed*1.2)||(ordQty>0?ordQty:5);
      var stockC=stock<=5?'var(--rd)':stock<30?'var(--yl)':'var(--gn)';
      rows+='<div style="padding:12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;"><div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;"><input type="checkbox" class="so-ch" data-idx="'+i+'" checked style="width:18px;height:18px;margin-top:3px;"><div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:900;">'+esc(p.name)+'</div><div style="font-size:10px;color:var(--mt);">شراء: '+sp.pp+' · بيع: '+p.price+'</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;font-size:10px;"><div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;"><div style="color:var(--mt);">مخزون</div><div style="font-weight:900;color:'+stockC+';">'+stock+'</div></div><div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;"><div style="color:var(--mt);">مطلوب</div><div style="font-weight:900;color:var(--pk);">'+ordQty+'</div></div><div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;"><div style="color:var(--mt);">نقص</div><div style="font-weight:900;color:'+(needed>0?'var(--rd)':'var(--gn)')+';">'+(needed>0?needed:'✓')+'</div></div><div style="text-align:center;padding:6px;background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(168,85,247,.1));border-radius:6px;"><div style="color:var(--pk);font-weight:900;">اطلب</div><input type="number" class="so-qty" data-idx="'+i+'" value="'+sug+'" min="0" style="width:100%;padding:4px;background:transparent;border:none;color:var(--pk);text-align:center;font-family:Cairo;font-size:16px;font-weight:900;outline:none;"></div></div></div>';
    });
    var bal=s.balance||0;
    var body='<div class="ib" style="flex-direction:column;align-items:flex-start;gap:4px;"><div>📦 <strong>'+esc(s.name)+'</strong> · '+supplierProds.length+' منتج</div><div style="font-size:10px;">💰 الرصيد: <strong style="color:'+(bal>0?'var(--rd)':'var(--gn)')+';">'+bal.toLocaleString()+' ر.س</strong></div><div style="font-size:10px;">📊 محسوب من '+pending.length+' طلب معلق</div></div><div style="max-height:450px;overflow-y:auto;">'+rows+'</div><div class="dr" style="padding:12px;background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(168,85,247,.08));border-radius:10px;margin-top:10px;"><span class="dl">الإجمالي</span><span class="dv" id="so-total" style="color:var(--pk);font-size:16px;">0 ر.س</span></div>';
    var actions='<button class="btn bg2" onclick="A.cm()">إلغاء</button><button class="btn bwa" onclick="A.sendSupplyOrder('+idx+')">💬 إرسال</button>';
    this.modal('سند توريد — '+esc(s.name),body,actions);
    var self=this;
    setTimeout(()=>{
      var recalc=()=>{var total=0;document.querySelectorAll('.so-ch').forEach(cb=>{if(!cb.checked)return;var i=parseInt(cb.dataset.idx);var inp=document.querySelector('.so-qty[data-idx="'+i+'"]');total+=(parseInt(inp.value)||0)*supplierProds[i].pp;});var el=document.getElementById('so-total');if(el)el.textContent=total.toLocaleString()+' ر.س';};
      document.querySelectorAll('.so-ch').forEach(cb=>cb.addEventListener('change',recalc));
      document.querySelectorAll('.so-qty').forEach(i=>i.addEventListener('input',recalc));
      recalc();
    },100);
  },

  sendSupplyOrder:async function(idx){
    var s=this.sups[idx];if(!s)return;
    var supplierProds=(s.products||[]).map(sp=>{var p=this.getProduct(sp.id);return p?{product:p,pp:sp.purchasePrice||0}:null;}).filter(x=>x);
    var items=[];
    document.querySelectorAll('.so-ch').forEach(cb=>{
      if(!cb.checked)return;
      var i=parseInt(cb.dataset.idx);
      var qty=parseInt(document.querySelector('.so-qty[data-idx="'+i+'"]').value)||0;
      if(qty>0&&supplierProds[i])items.push({name:supplierProds[i].product.name,pp:supplierProds[i].pp,qty:qty,price:supplierProds[i].product.price});
    });
    if(!items.length){this.toast('اختر منتجاً','err');return;}
    var totalQty=items.reduce((a,b)=>a+b.qty,0);
    var totalCost=items.reduce((a,b)=>a+(b.pp*b.qty),0);
    var orderId='SUP-'+Date.now().toString().slice(-8);
    this.toast('⏳ جاري الإنشاء...','suc');
    try{
      var oldBal=s.balance||0;var newBal=oldBal+totalCost;
      var hist=(s.history||[]).slice();
      hist.push({type:'order',orderId,amount:totalCost,items,date:new Date().toISOString(),balanceAfter:newBal});
      this.sups[idx]=Object.assign({},s,{balance:newBal,history:hist});
      await FB.setConfig('suppliers',{list:this.sups});
      var blob=await this.genSupplyBlob(s,items,orderId,oldBal,newBal);
      if(!blob){this.toast('فشل','err');return;}
      var msg='السلام عليكم '+s.name+' 🌟\n\n📋 سند توريد من CHIZEN\n━━━━━━━━━━━━━━━\n🆔 '+orderId+'\n📅 '+new Date().toLocaleDateString('ar-EG')+'\n💳 '+(s.paymentType==='credit'?'آجل '+(s.creditDays||30)+' يوم':'نقد')+'\n━━━━━━━━━━━━━━━\n📦 '+items.length+' صنف\n🔢 '+totalQty+' قطعة\n💰 '+totalCost.toLocaleString()+' ر.س\n━━━━━━━━━━━━━━━\n\n📎 السند مرفق — يرجى التأكيد.\n\nشكراً ❤️\nCHIZEN';
      var phone=(s.phone||'').replace(/\D/g,'');
      if(phone.length===9&&!phone.startsWith('967'))phone='967'+phone;
      var isM=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if(isM&&navigator.share&&navigator.canShare){
        var f=new File([blob],'SUP-'+orderId+'.png',{type:'image/png'});
        if(navigator.canShare({files:[f]})){try{await navigator.share({title:'سند توريد',text:msg,files:[f]});this.cm();this.renderSups();this.toast('✓','suc');return;}catch(e){if(e.name==='AbortError')return;}}
      }
      this.dlBlob(blob,'SUP-'+orderId);
      if(phone.length>=8)setTimeout(()=>window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank'),800);
      this.cm();this.renderSups();this.toast('✓ تم — الدين: '+newBal.toLocaleString(),'suc');
    }catch(e){this.toast('فشل: '+(e.message||''),'err');}
  },

      var b=s.balance||0;var ordC=(s.history||[]).filter(x=>x.type==='order').length;var payC=(s.history||[]).filter(x=>x.type==='payment').length;
      var stat=b>0?'<span class="bst bx2">مستحق '+b.toLocaleString()+'</span>':b<0?'<span class="bst bc2">دفعة '+Math.abs(b).toLocaleString()+'</span>':'<span class="bst bp2">مسدد ✓</span>';
      h+='<div class="cd" style="cursor:pointer;" onclick="A.balanceDetails('+i+')"><div class="cti"><div class="ctl">'+esc(s.name)+'</div>'+stat+'</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><div style="text-align:center;padding:10px;background:var(--bg2);border-radius:10px;"><div style="font-size:18px;font-weight:900;color:var(--pk);">'+ordC+'</div><div style="font-size:9px;color:var(--mt);">توريدات</div></div><div style="text-align:center;padding:10px;background:var(--bg2);border-radius:10px;"><div style="font-size:18px;font-weight:900;color:var(--gn);">'+payC+'</div><div style="font-size:9px;color:var(--mt);">دفعات</div></div><div style="text-align:center;padding:10px;background:var(--bg2);border-radius:10px;"><div style="font-size:18px;font-weight:900;color:var(--pp);">'+(s.products||[]).length+'</div><div style="font-size:9px;color:var(--mt);">منتجات</div></div></div></div>';
    });
    list.innerHTML=h;
  },

  balanceDetails:function(idx){
    var s=this.sups[idx];if(!s)return;
    var bal=s.balance||0;var hist=(s.history||[]).slice().reverse();
    var hh='';
    if(!hist.length)hh='<div class="emp" style="padding:20px;font-size:12px;">لا معاملات</div>';
    else hist.forEach(h=>{
      var d=new Date(h.date);var ds=d.toLocaleDateString('ar-EG')+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
      if(h.type==='order')hh+='<div class="rw" style="cursor:default;"><div class="rt" style="background:rgba(236,72,153,.15);color:var(--pk);">📋</div><div class="ri"><div class="rti">توريد '+(h.orderId||'')+'</div><div class="rs">'+(h.items||[]).length+' صنف · '+ds+'</div><div class="rs" style="color:var(--rd);font-weight:900;">+'+h.amount.toLocaleString()+' ر.س</div></div></div>';
      else hh+='<div class="rw" style="cursor:default;"><div class="rt" style="background:rgba(16,185,129,.15);color:var(--gn);">💵</div><div class="ri"><div class="rti">دفعة'+(h.notes?' — '+esc(h.notes):'')+'</div><div class="rs">'+ds+'</div><div class="rs" style="color:var(--gn);font-weight:900;">-'+h.amount.toLocaleString()+' ر.س</div></div></div>';
    });
    var balD=bal>0?'<div style="font-size:32px;font-weight:900;color:var(--rd);">'+bal.toLocaleString()+' ر.س</div><div style="font-size:12px;color:var(--mt);">مستحق</div>':bal<0?'<div style="font-size:32px;font-weight:900;color:var(--gn);">'+Math.abs(bal).toLocaleString()+' ر.س</div><div style="font-size:12px;color:var(--mt);">دفعة</div>':'<div style="font-size:32px;font-weight:900;color:var(--gn);">✓ مسدد</div>';
    var body='<div class="cd" style="text-align:center;background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(168,85,247,.08));border:1.5px solid rgba(236,72,153,.4);"><div style="font-size:12px;color:var(--mt);margin-bottom:8px;">💰 الرصيد الحالي</div>'+balD+'<button class="btn bs bb" style="margin-top:14px;" onclick="A.payForm2('+idx+')">💵 تسجيل دفعة</button></div><div class="ds"><div class="dt">📜 سجل المعاملات ('+hist.length+')</div><div style="max-height:400px;overflow-y:auto;">'+hh+'</div></div>';
    this.modal('💰 '+esc(s.name),body,'<button class="btn bg2" onclick="A.cm()">إغلاق</button>');
  },

  payForm2:function(idx){
    var s=this.sups[idx];if(!s)return;
    var bal=s.balance||0;
    var html='<div class="ib">💵 الرصيد: <strong style="color:'+(bal>0?'var(--rd)':'var(--gn)')+';">'+bal.toLocaleString()+'</strong></div><div class="fl"><label class="fll">المبلغ المدفوع</label><input class="fi" type="number" id="pay-amt" value="'+(bal>0?bal:'')+'" min="1" style="font-size:18px;text-align:center;font-weight:900;"></div><div class="fl"><label class="fll">ملاحظة</label><input class="fi" id="pay-note" placeholder="دفعة أولى نقداً..."></div><div class="dr" style="padding:10px;background:var(--bg2);border-radius:10px;"><span class="dl">الرصيد بعد</span><span class="dv" id="pay-after" style="color:var(--pk);">'+bal.toLocaleString()+'</span></div>';
    var actions='<button class="btn bg2" onclick="A.cm()">إلغاء</button><button class="btn bp" onclick="A.savePay2('+idx+')">💾 حفظ</button>';
    this.modal('💵 دفعة',html,actions);
    setTimeout(()=>{var inp=document.getElementById('pay-amt');var el=document.getElementById('pay-after');var up=()=>{var v=parseFloat(inp.value)||0;var a=bal-v;el.textContent=a.toLocaleString()+' ر.س';el.style.color=a>0?'var(--rd)':a<0?'var(--gn)':'var(--gn)';};inp.addEventListener('input',up);up();},100);
  },

  savePay2:async function(idx){
    var amt=parseFloat(document.getElementById('pay-amt').value);
    if(!amt||amt<=0){this.toast('مبلغ صحيح','err');return;}
    var note=document.getElementById('pay-note').value.trim();
    var s=this.sups[idx];var newBal=(s.balance||0)-amt;
    var hist=(s.history||[]).slice();
    hist.push({type:'payment',amount:amt,notes:note,date:new Date().toISOString(),balanceAfter:newBal});
    this.sups[idx]=Object.assign({},s,{balance:newBal,history:hist});
    try{await FB.setConfig('suppliers',{list:this.sups});this.cm();this.renderBalances();this.renderSups();this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  renderUsers:function(){
    var c=document.getElementById('u-list');if(!c)return;
    var q=(document.getElementById('u-search').value||'').toLowerCase().trim();
    var list=this.users.slice();
    if(q)list=list.filter(u=>(u.name||'').toLowerCase().indexOf(q)>-1||(u.email||'').toLowerCase().indexOf(q)>-1);
    if(!list.length){c.innerHTML='<div class="emp">لا مستخدمين</div>';return;}
    var h='';
    list.forEach(u=>{
      var init=u.name?u.name.charAt(0):(u.email?u.email.charAt(0):'?');
      var isAdm=this.admins.some(a=>a.uid===u.uid);
      var bdg=isAdm?'<span class="ab">مسؤول</span>':'';
      var pts=typeof u.loyaltyPoints==='number'?u.loyaltyPoints:0;
      h+='<div class="rw" onclick="A.userDetails(\''+esc(u.uid||u.id||'')+'\')"><div class="rt" style="background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;font-weight:900;">'+esc(init)+'</div><div class="ri"><div class="rti">'+bdg+' '+esc(u.name||'—')+'</div><div class="rs">'+esc(u.email||'')+' • 💎 '+pts+'</div></div></div>';
    });
    c.innerHTML=h;
  },

  userDetails:function(uid){
    var u=null;this.users.forEach(us=>{if(String(us.uid||us.id)===String(uid))u=us;});
    if(!u)return;
    var ords=this.orders.filter(o=>o.userId===uid);
    var total=0;ords.forEach(o=>{if(o.status!=='cancelled')total+=o.total||0;});
    var pts=typeof u.loyaltyPoints==='number'?u.loyaltyPoints:0;
    var isAdm=this.admins.some(a=>a.uid===uid);
    var ordH='';ords.slice(0,5).forEach(o=>{ordH+='<div class="dr"><span class="dl">#'+esc((o.id||'').substring(0,10))+'</span><span class="dv">'+esc(o.total)+' ر.س</span></div>';});
    if(!ordH)ordH='<div class="emp" style="font-size:11px;padding:10px;">لا طلبات</div>';
    var body='<div class="ds"><div class="dt">👤 البيانات</div><div class="dr"><span class="dl">الاسم</span><span class="dv">'+esc(u.name||'-')+'</span></div><div class="dr"><span class="dl">البريد</span><span class="dv" style="direction:ltr;">'+esc(u.email||'-')+'</span></div><div class="dr"><span class="dl">الجوال</span><span class="dv" style="direction:ltr;">'+esc(u.phone||'-')+'</span></div></div><div class="ds"><div class="dt">📊 النشاط</div><div class="dr"><span class="dl">الطلبات</span><span class="dv">'+ords.length+'</span></div><div class="dr"><span class="dl">الإنفاق</span><span class="dv" style="color:var(--pk);">'+total+' ر.س</span></div><div class="dr"><span class="dl">النقاط</span><span class="dv">💎 '+pts+'</span></div></div><div class="ds"><div class="dt">📦 آخر الطلبات</div>'+ordH+'</div>';
    var actions='<button class="btn bg2" onclick="A.cm()">إغلاق</button>'+(isAdm?'<button class="btn bd" onclick="A.removeAdmin(\''+esc(uid)+'\')">إزالة صلاحية</button>':'<button class="btn bw" onclick="A.grantAdmin(\''+esc(uid)+'\')">+ مسؤول</button>')+'<button class="btn bp" onclick="A.editPoints(\''+esc(uid)+'\','+pts+')">💎 النقاط</button>';
    this.modal('تفاصيل المستخدم',body,actions);
  },

  editPoints:async function(uid,cur){
    var v=prompt('النقاط الجديدة:',String(cur));
    if(v===null)return;
    var n=parseInt(v);if(isNaN(n)||n<0){this.toast('قيمة خاطئة','err');return;}
    try{await FB.db.collection('users').doc(uid).update({loyaltyPoints:n});await this.loadData();this.renderUsers();this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  grantAdmin:function(uid){
    var self=this;
    this.confirm('منح صلاحية مسؤول؟','سيتمكن من الدخول',async function(){
      try{
        var u=null;self.users.forEach(us=>{if(String(us.uid)===String(uid))u=us;});
        await FB.db.collection('admins').doc(uid).set({email:u?u.email:'',name:u?u.name:'',grantedAt:firebase.firestore.FieldValue.serverTimestamp(),grantedBy:FB.currentUser?FB.currentUser.uid:''});
        await self.loadData();self.renderUsers();self.renderAdmins();self.toast('✓','suc');
      }catch(e){self.toast('فشل','err');}
    },'primary');
  },

  removeAdmin:function(uid){
    var self=this;
    if(FB.currentUser&&FB.currentUser.uid===uid){this.toast('لا يمكنك إزالة نفسك','err');return;}
    this.confirm('إزالة صلاحية؟','',async function(){try{await FB.db.collection('admins').doc(uid).delete();await self.loadData();self.renderUsers();self.renderAdmins();self.toast('✓','suc');}catch(e){self.toast('فشل','err');}});
  },

  renderAdmins:function(){
    var c=document.getElementById('adm-list');if(!c)return;
    if(!this.admins.length){c.innerHTML='<div class="emp">لا مسؤولين</div>';return;}
    var h='';
    this.admins.forEach(a=>{
      var isMe=FB.currentUser&&FB.currentUser.uid===a.uid;
      var init=(a.data.name||a.data.email||'?').charAt(0);
      h+='<div class="rw"><div class="rt" style="background:linear-gradient(135deg,var(--or),var(--pk));color:#fff;font-weight:900;">'+esc(init)+'</div><div class="ri"><div class="rti">'+esc(a.data.name||'—')+(isMe?' <span class="ab">أنت</span>':'')+'</div><div class="rs">'+esc(a.data.email||'')+'</div></div>'+(isMe?'':'<div class="ra"><button class="btn bd bsm" onclick="A.removeAdmin(\''+esc(a.uid)+'\')">🗑️</button></div>')+'</div>';
    });
    c.innerHTML=h;
  },

  addAdminForm:function(){
    var opts='';this.users.forEach(u=>{if(!this.admins.some(a=>a.uid===u.uid))opts+='<option value="'+esc(u.uid||'')+'">'+esc(u.name||'')+' — '+esc(u.email||'')+'</option>';});
    if(!opts){this.toast('لا مستخدمون متاحون','err');return;}
    var html='<div class="fl"><label class="fll">اختر مستخدماً</label><select class="fi" id="ad-uid">'+opts+'</select></div><div class="ib">⚠️ سيحصل على وصول كامل</div>';
    var actions='<button class="btn bg2" onclick="A.cm()">إلغاء</button><button class="btn bp" onclick="A.saveNewAdmin()">منح</button>';
    this.modal('إضافة مسؤول',html,actions);
  },

  saveNewAdmin:function(){var uid=document.getElementById('ad-uid').value;if(!uid)return;this.cm();this.grantAdmin(uid);},

  renderSettings:function(){
    var c={};try{c=JSON.parse(localStorage.getItem('chizen_contact')||'{}');}catch(e){}
    var g=function(id){return document.getElementById(id);};
    if(g('s-phone'))g('s-phone').value=c.phone||'';
    if(g('s-wa'))g('s-wa').value=c.whatsapp||'';
    if(g('s-email'))g('s-email').value=c.email||'';
    var sh={};try{sh=JSON.parse(localStorage.getItem('chizen_shipping')||'{}');}catch(e){}
    if(g('s-shipfee'))g('s-shipfee').value=sh.fee||'';
    if(g('s-free'))g('s-free').value=sh.freeAbove||'';
  },

  saveContact:async function(){
    var data={phone:document.getElementById('s-phone').value.trim(),whatsapp:document.getElementById('s-wa').value.trim(),email:document.getElementById('s-email').value.trim()};
    try{await FB.setConfig('contact',data);localStorage.setItem('chizen_contact',JSON.stringify(data));this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  saveShipping:async function(){
    var data={fee:parseFloat(document.getElementById('s-shipfee').value)||0,freeAbove:parseFloat(document.getElementById('s-free').value)||0};
    try{await FB.setConfig('shipping',data);localStorage.setItem('chizen_shipping',JSON.stringify(data));this.toast('✓','suc');}catch(e){this.toast('فشل','err');}
  },

  exportCSV:function(){
    var rows=[['ID','Name','Phone','Pickup','Total','Status','Date']];
    this.orders.forEach(o=>{var d=o.createdAt?new Date(o.createdAt.seconds*1000).toISOString().slice(0,10):'';rows.push([o.id,o.name||'',o.phone||'',o.pickup||'',o.total||0,o.status||'',d]);});
    var csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');
    a.href=url;a.download='chizen-orders-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
    URL.revokeObjectURL(url);this.toast('✓','suc');
  },

  getProduct:function(id){for(var i=0;i<this.products.length;i++)if(String(this.products[i].id)===String(id))return this.products[i];return null;},
  modal:function(t,b,a){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('ma').innerHTML=a||'';document.getElementById('md').classList.add('active');},
  cm:function(){document.getElementById('md').classList.remove('active');},
  confirm:function(t,m,cb,type){
    var cf=document.getElementById('cf');
    document.getElementById('cft').textContent=t||'تأكيد';
    document.getElementById('cfm').textContent=m||'';
    var ok=document.getElementById('cfo');
    ok.className='cfo'+(type==='primary'?' pr':'');
    ok.textContent=type==='primary'?'موافق':'تأكيد';
    cf.classList.add('active');
    var nOk=ok.cloneNode(true);ok.parentNode.replaceChild(nOk,ok);
    var nCan=document.getElementById('cfc').cloneNode(true);document.getElementById('cfc').parentNode.replaceChild(nCan,document.getElementById('cfc'));
    nOk.addEventListener('click',()=>{cf.classList.remove('active');if(cb)cb(true);});
    nCan.addEventListener('click',()=>cf.classList.remove('active'));
  },
  toast:function(msg,type){
    var t=document.getElementById('tst');
    t.textContent=msg;t.className='tst '+(type||'');
    t.classList.add('show');
    clearTimeout(window._tt);
    window._tt=setTimeout(()=>t.classList.remove('show'),2500);
  },
  openApp:function(){window.open('../chizen.html','_blank');},
  logout:async function(){
    var self=this;
    this.confirm('تسجيل الخروج؟','',async function(){try{if(FB.ready)await FB.logout();}catch(e){}location.reload();},'danger');
  },

  exportOrdersPDF:function(){this.toast('PDF — قيد التطوير','err');},
  exportReceipt:function(){this.toast('السند — قيد التطوير','err');},
  sendReceipt:function(){this.toast('السند — قيد التطوير','err');},
  genSupplyBlob:function(){return Promise.resolve(null);},
  dlBlob:function(b,n){var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
};

document.getElementById('cf').addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{try{A.init();}catch(e){console.error(e);}});
else {try{A.init();}catch(e){console.error(e);}}
</script>
<script src="admin-fix.js"></script>
</body>
</html>/
