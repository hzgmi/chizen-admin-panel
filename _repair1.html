<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIZEN Repair mna</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;padding:14px;max-width:760px;margin:0 auto;line-height:1.5}
h1{color:#FF8A00;font-size:16px;margin:0 0 6px}
button{background:#10b981;color:#fff;border:0;padding:14px 18px;border-radius:10px;font-weight:800;font-size:14px;font-family:inherit;margin:4px 0;cursor:pointer;width:100%}
button.danger{background:#ef4444}
button:disabled{background:#374151}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff;margin:4px 0;font-family:inherit;box-sizing:border-box;font-size:13px}
#status{padding:8px;background:#1f2937;border-radius:8px;margin:8px 0;font-size:12px}
#log{background:#000;color:#0f0;padding:10px;border-radius:8px;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;min-height:100px;margin-top:8px}
.hidden{display:none!important}
.warn{color:#fbbf24}
.err{color:#f87171}
</style>
</head>
<body>
<h1>🔧 إصلاح عاجل — استعادة mna إلى cat_manager</h1>
<div id="status">جارٍ التهيئة...</div>
<div id="login" class="hidden">
<input id="em" type="email" placeholder="hazimchat@gmail.com" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="lbtn">🔐 تسجيل الدخول (super_admin فقط)</button>
</div>
<div id="act" class="hidden">
<button id="lobtn" class="danger">🚪 تسجيل خروج قسري</button>
<button id="checkbtn" style="background:#3b82f6;">🔍 فحص حالة mna الحالية</button>
<button id="repairbtn" class="danger">⚠️ إصلاح: mna → cat_manager</button>
<button id="verifybtn" style="background:#f59e0b;">✅ تحقق نهائي من كل الأدوار</button>
</div>
<pre id="log">[السجل سيظهر هنا]</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var st=document.getElementById('status'),lg=document.getElementById('login'),ac=document.getElementById('act'),logEl=document.getElementById('log');
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
var db=firebase.firestore(),auth=firebase.auth();
var MNA_UID=null, SUPER_EMAIL='hazimchat@gmail.com';
function L(m){logEl.textContent+='\n'+m;logEl.scrollTop=logEl.scrollHeight}
function clean(){logEl.textContent='[السجل سيظهر هنا]'}
async function guardSuper(){
var u=auth.currentUser;
if(!u){L('❌ لا مستخدم');return false}
if(u.email!==SUPER_EMAIL){L('🚫 الحساب الحالي: '+u.email);L('🚫 ممنوع — يجب الدخول بـ '+SUPER_EMAIL);return false}
var d=await db.collection('admins').doc(u.uid).get();
if(!d.exists||d.data().role!=='super_admin'){L('🚫 دورك في admins ليس super_admin');return false}
L('✅ أنت super_admin: '+u.email);
return true;
}
auth.onAuthStateChanged(function(u){
if(u){st.textContent='✅ مسجل: '+u.email+(u.email===SUPER_EMAIL?' (super_admin)':' ⚠️ ليس super_admin');lg.classList.add('hidden');ac.classList.remove('hidden');}
else{st.textContent='⚠️ سجل دخول super_admin';lg.classList.remove('hidden');ac.classList.add('hidden');}
});
document.getElementById('lbtn').onclick=async function(){
var em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;
if(!em||!pw){st.textContent='❌ املأ الحقول';return}
st.textContent='جارٍ الدخول...';
try{await auth.signInWithEmailAndPassword(em,pw)}catch(e){st.textContent='❌ '+e.code}
};
document.getElementById('lobtn').onclick=async function(){
if(!confirm('خروج؟'))return;
try{await firebase.auth().signOut();
try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('firebase')>-1||k.indexOf('chizen')>-1)localStorage.removeItem(k)});
if(window.indexedDB&&indexedDB.databases){var dbs=await indexedDB.databases();dbs.forEach(function(d){if(d.name&&d.name.indexOf('firebase')>-1)indexedDB.deleteDatabase(d.name)})}}catch(e){}
location.reload();}catch(e){alert(e.message)}
};
document.getElementById('checkbtn').onclick=async function(){
clean();
if(!await guardSuper())return;
L('\n── فحص حالة mna ──');
try{
var snap=await db.collection('admins').get();
for(var i=0;i<snap.docs.length;i++){
var d=snap.docs[i];var x=d.data();
if((x.email||'').indexOf('mna783130578')>-1){
MNA_UID=d.id;
L('mna UID: '+d.id);
L('  role: '+x.role);
L('  email: '+x.email);
}
}
var users=await db.collection('users').where('email','==','mna783130578@gmail.com').get();
users.forEach(function(d){
var x=d.data();
L('users['+d.id+'] role: '+x.role+'  email: '+x.email);
});
}catch(e){L('❌ '+e.code+' — '+e.message)}
};
document.getElementById('repairbtn').onclick=async function(){
clean();
if(!await guardSuper())return;
if(!confirm('سيتم إرجاع mna إلى cat_manager. متابعة؟'))return;
L('\n── إصلاح mna ──');
try{
if(!MNA_UID){
var snap=await db.collection('admins').get();
snap.forEach(function(d){if((d.data().email||'').indexOf('mna783130578')>-1)MNA_UID=d.id;});
}
if(!MNA_UID){L('❌ لم أجد mna في admins');return}
L('mna UID: '+MNA_UID);
await db.collection('admins').doc(MNA_UID).set({
role:'cat_manager',
correctedAt:firebase.firestore.FieldValue.serverTimestamp(),
correctedBy:auth.currentUser.uid,
correctedReason:'accidental super_admin escalation during phase A'
},{merge:true});
L('✅ admins['+MNA_UID+'].role = cat_manager');
await db.collection('activity_log').add({
type:'role_repair',targetEmail:'mna783130578@gmail.com',targetUid:MNA_UID,
from:'super_admin',to:'cat_manager',by:auth.currentUser.uid,at:firebase.firestore.FieldValue.serverTimestamp()
});
L('✅ activity_log سُجّل');
}catch(e){L('❌ '+e.code+' — '+e.message)}
};
document.getElementById('verifybtn').onclick=async function(){
clean();
if(!await guardSuper())return;
L('\n── التحقق النهائي ──');
try{
var snap=await db.collection('admins').get();
L('عدد مستندات admins: '+snap.size);
var sAdmins=0,sSupers=0,sCats=0,sDlv=0,others=[];
snap.forEach(function(d){var x=d.data();
if(x.role==='super_admin')sSupers++;
else if(x.role==='cat_manager')sCats++;
else if(x.role==='delivery_mgr')sDlv++;
else others.push(x.role+' ('+x.email+')');
});
L('super_admin: '+sSupers);
L('cat_manager: '+sCats);
L('delivery_mgr: '+sDlv);
if(others.length)L('⚠️ أدوار أخرى: '+others.join(', '));
var me=await db.collection('admins').doc(auth.currentUser.uid).get();
L('دورك الحالي: '+(me.exists?me.data().role:'❌ لا مستند'));
}catch(e){L('❌ '+e.code+' — '+e.message)}
L('\n── انتهى ──');
};
})();
</script>
</body>
</html>
